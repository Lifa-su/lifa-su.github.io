<!DOCTYPE html>
<html lang="zh-CN">
<head>

    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS Outline Generator - AI CSS Outline</title>
<meta name="description" content="Free CSS Outline Generator. Customize outline-width, style, color, offset with live preview and one-click copy.">
<link rel="canonical" href="https://lifa-su.com/ai-css-outline/">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#1a1a2e;color:#e0e0e0;min-height:100vh;line-height:1.6}
h1{text-align:center;padding:28px 16px 8px;font-size:1.8rem;color:#fff}
.subtitle{text-align:center;color:#888;font-size:.95rem;margin-bottom:24px}
.container{max-width:1100px;margin:0 auto;padding:0 16px 40px;display:grid;grid-template-columns:1fr 1fr;gap:24px}
@media(max-width:768px){.container{grid-template-columns:1fr}h1{font-size:1.4rem}}
.panel{background:#16213e;border-radius:12px;padding:24px;border:1px solid #0f3460}
.panel h2{font-size:1.1rem;margin-bottom:18px;color:#4fc3f7;border-bottom:1px solid #0f3460;padding-bottom:8px}
.control-group{margin-bottom:18px}
.control-group label{display:block;font-size:.9rem;color:#aaa;margin-bottom:6px}
.row{display:flex;align-items:center;gap:12px}
.row input[type=range]{flex:1;accent-color:#4fc3f7;height:6px}
.row input[type=number]{width:72px;background:#0f3460;border:1px solid #1a3a6a;color:#fff;border-radius:6px;padding:6px 8px;font-size:.9rem;text-align:center}
.row input[type=number]:focus{outline:2px solid #4fc3f7}
select{width:100%;background:#0f3460;border:1px solid #1a3a6a;color:#fff;border-radius:6px;padding:8px 12px;font-size:.95rem;cursor:pointer}
select:focus{outline:2px solid #4fc3f7}
input[type=color]{width:48px;height:36px;border:none;border-radius:6px;cursor:pointer;background:transparent}
.color-row{display:flex;align-items:center;gap:12px}
.color-hex{background:#0f3460;border:1px solid #1a3a6a;color:#fff;border-radius:6px;padding:6px 10px;font-size:.9rem;width:100px;text-align:center}
.color-hex:focus{outline:2px solid #4fc3f7}
.preview-area{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:220px}
.preview-box{width:180px;height:120px;background:#1a1a2e;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:.85rem;color:#aaa;transition:all .15s ease}
.preview-label{font-size:.8rem;color:#888;margin-top:4px;text-align:center}
.compare-row{display:flex;gap:24px;flex-wrap:wrap;justify-content:center;align-items:flex-start}
.compare-item{display:flex;flex-direction:column;align-items:center;gap:6px}
.code-block{background:#0a0e1a;border:1px solid #0f3460;border-radius:8px;padding:16px;font-family:'Fira Code',Consolas,monospace;font-size:.88rem;color:#4fc3f7;white-space:pre-wrap;word-break:break-all;position:relative;min-height:60px}
.copy-btn{position:absolute;top:8px;right:8px;background:#4fc3f7;color:#1a1a2e;border:none;border-radius:6px;padding:6px 14px;font-size:.82rem;cursor:pointer;font-weight:600;transition:background .2s}
.copy-btn:hover{background:#81d4fa}
.copy-btn.copied{background:#66bb6a}
footer{text-align:center;padding:20px;color:#555;font-size:.8rem}
</style>
</head>
<body>
<h1>&#127912; CSS Outline Generator</h1>
<p class="subtitle">Customize outline properties with live preview &amp; one-click copy</p>
<div class="container">
<div class="panel">
<h2>Settings</h2>
<div class="control-group">
<label for="oWidth">outline-width</label>
<div class="row">
<input type="range" id="oWidth" min="0" max="20" value="3" aria-label="outline width slider">
<input type="number" id="oWidthNum" min="0" max="20" value="3" aria-label="outline width value">
<span>px</span>
</div>
</div>
<div class="control-group">
<label for="oStyle">outline-style</label>
<select id="oStyle" aria-label="outline style">
<option value="solid" selected>solid</option>
<option value="dashed">dashed</option>
<option value="dotted">dotted</option>
<option value="double">double</option>
<option value="groove">groove</option>
<option value="ridge">ridge</option>
<option value="inset">inset</option>
<option value="outset">outset</option>
<option value="none">none</option>
</select>
</div>
<div class="control-group">
<label for="oColor">outline-color</label>
<div class="color-row">
<input type="color" id="oColor" value="#4fc3f7" aria-label="outline color picker">
<input type="text" class="color-hex" id="oColorHex" value="#4fc3f7" maxlength="7" aria-label="outline color hex">
</div>
</div>
<div class="control-group">
<label for="oOffset">outline-offset</label>
<div class="row">
<input type="range" id="oOffset" min="-20" max="20" value="0" aria-label="outline offset slider">
<input type="number" id="oOffsetNum" min="-20" max="20" value="0" aria-label="outline offset value">
<span>px</span>
</div>
</div>
</div>
<div class="panel">
<h2>Live Preview</h2>
<div class="preview-area">
<div id="previewBox" class="preview-box">Preview Element</div>
</div>
<h2 style="margin-top:20px">Outline vs Border</h2>
<div class="compare-row">
<div class="compare-item">
<div id="outlineBox" class="preview-box" style="width:140px;height:90px;font-size:.78rem">Outline</div>
<span class="preview-label">outline</span>
</div>
<div class="compare-item">
<div id="borderBox" class="preview-box" style="width:140px;height:90px;font-size:.78rem">Border</div>
<span class="preview-label">border (same values)</span>
</div>
</div>
</div>
<div class="panel" style="grid-column:1/-1">
<h2>Generated CSS</h2>
<div class="code-block" id="codeOutput"><button class="copy-btn" id="copyBtn" aria-label="Copy CSS code">Copy</button></div>
</div>
</div>
<footer>CSS Outline Generator &copy; 2026</footer>
<script>
(function(){
var oWidth=document.getElementById('oWidth'),oWidthNum=document.getElementById('oWidthNum'),
oStyle=document.getElementById('oStyle'),oColor=document.getElementById('oColor'),
oColorHex=document.getElementById('oColorHex'),oOffset=document.getElementById('oOffset'),
oOffsetNum=document.getElementById('oOffsetNum'),previewBox=document.getElementById('previewBox'),
outlineBox=document.getElementById('outlineBox'),borderBox=document.getElementById('borderBox'),
codeOutput=document.getElementById('codeOutput'),copyBtn=document.getElementById('copyBtn');

function sync(slider,num){slider.value=num.value}
function update(){
var w=oWidth.value+'px',s=oStyle.value,c=oColor.value,off=oOffset.value+'px';
previewBox.style.outline=w+' '+s+' '+c;
previewBox.style.outlineOffset=off;
outlineBox.style.outline=w+' '+s+' '+c;
outlineBox.style.outlineOffset=off;
outlineBox.style.border='none';
borderBox.style.outline='none';
borderBox.style.border=w+' '+s+' '+c;
var css='outline-width: '+w+';\noutline-style: '+s+';\noutline-color: '+c+';\noutline-offset: '+off+';';
var shorthand='/* shorthand */\noutline: '+w+' '+s+' '+c+';\noutline-offset: '+off+';';
codeOutput.textContent=css+'\n\n'+shorthand;
codeOutput.appendChild(copyBtn);
}
oWidth.oninput=function(){oWidthNum.value=this.value;update()};
oWidthNum.oninput=function(){oWidth.value=this.value;update()};
oStyle.onchange=update;
oColor.oninput=function(){oColorHex.value=this.value;update()};
oColorHex.oninput=function(){if(/^#[0-9a-fA-F]{6}$/.test(this.value)){oColor.value=this.value;update()}};
oOffset.oninput=function(){oOffsetNum.value=this.value;update()};
oOffsetNum.oninput=function(){oOffset.value=this.value;update()};
copyBtn.onclick=function(){
var text=codeOutput.textContent.replace('Copy','').trim();
navigator.clipboard.writeText(text).then(function(){
copyBtn.textContent='Copied!';copyBtn.classList.add('copied');
setTimeout(function(){copyBtn.textContent='Copy';copyBtn.classList.remove('copied')},1500);
});
};
update();
})();
</script>

</body>
</html>
