<!DOCTYPE html>
<html lang="en">
<head>

    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS Text Stroke Generator | AI Tool</title>
<meta name="description" content="Generate CSS text stroke effects instantly. Customize stroke width, colors, fonts and copy the code.">
<link rel="canonical" href="https://lifa-su.com/ai-css-text-stroke/">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@700&family=Pacifico&family=Playfair+Display:wght@700&family=Roboto:wght@700&family=Bebas+Neue&family=Righteous&family=Permanent+Marker&family=Abril+Fatface&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#1a1a2e;color:#e0e0e0;min-height:100vh;display:flex;flex-direction:column;align-items:center}
h1{text-align:center;padding:2rem 1rem .5rem;font-size:1.8rem;background:linear-gradient(135deg,#e94560,#0f3460);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.sub{text-align:center;color:#888;font-size:.95rem;margin-bottom:2rem}
.wrap{display:flex;gap:2rem;max-width:1100px;width:100%;padding:0 1.5rem 2rem;flex-wrap:wrap}
.pnl{background:#16213e;border-radius:12px;padding:1.5rem;flex:1;min-width:300px;border:1px solid #0f3460}
.pnl h2{font-size:1.1rem;margin-bottom:1.2rem;color:#e94560}
.cg{margin-bottom:1.2rem}
.cg>label{display:block;font-size:.85rem;color:#aaa;margin-bottom:.4rem}
.cr{display:flex;align-items:center;gap:.75rem}
.cr input[type=range]{flex:1;accent-color:#e94560}
.vl{background:#0f3460;padding:2px 10px;border-radius:6px;font-size:.85rem;min-width:48px;text-align:center;color:#e94560;font-weight:600}
input[type=color]{-webkit-appearance:none;border:none;width:40px;height:32px;border-radius:6px;cursor:pointer;background:none}
input[type=color]::-webkit-color-swatch-wrapper{padding:0}
input[type=color]::-webkit-color-swatch{border:2px solid #0f3460;border-radius:6px}
.ci{display:flex;align-items:center;gap:.5rem}
.hx{background:#0f3460;border:1px solid #1a3a6e;color:#e0e0e0;padding:4px 8px;border-radius:6px;font-size:.85rem;width:90px;font-family:monospace}
.sr{display:flex;align-items:center;gap:.6rem;margin-top:.3rem}
.sw{position:relative;width:42px;height:22px;flex-shrink:0}
.sw input{opacity:0;width:0;height:0}
.sld{position:absolute;inset:0;background:#0f3460;border-radius:22px;cursor:pointer;transition:.3s}
.sld::before{content:'';position:absolute;height:16px;width:16px;left:3px;bottom:3px;background:#888;border-radius:50%;transition:.3s}
.sw input:checked+.sld{background:#e94560}
.sw input:checked+.sld::before{transform:translateX(20px);background:#fff}
.sr span{font-size:.85rem;color:#aaa}
select{background:#0f3460;color:#e0e0e0;border:1px solid #1a3a6e;padding:8px 12px;border-radius:8px;font-size:.9rem;width:100%;cursor:pointer;outline:none}
select:focus{border-color:#e94560}
.pa{display:flex;align-items:center;justify-content:center;min-height:220px;background:#0d1b36;border-radius:10px;padding:2rem;overflow:hidden;word-break:break-word;text-align:center}
#pt{font-size:72px;line-height:1.2;transition:all .15s}
.cs{margin-top:1.2rem}
.ch{display:flex;justify-content:space-between;align-items:center;margin-bottom:.5rem}
.ch span{font-size:.85rem;color:#aaa}
.cpb{background:#e94560;color:#fff;border:none;padding:6px 16px;border-radius:6px;font-size:.8rem;cursor:pointer;transition:background .2s}
.cpb:hover{background:#c73652}
.cpb.ok{background:#27ae60}
pre{background:#0d1b36;border-radius:8px;padding:1rem;overflow-x:auto;font-size:.82rem;line-height:1.6;color:#8be9fd;font-family:Consolas,monospace}
.ti{background:#0f3460;border:1px solid #1a3a6e;color:#e0e0e0;padding:8px 12px;border-radius:8px;font-size:.9rem;width:100%;outline:none}
.ti:focus{border-color:#e94560}
footer{text-align:center;padding:1.5rem;color:#555;font-size:.8rem}
@media(max-width:700px){.wrap{flex-direction:column;padding:0 1rem 1.5rem}.pnl{min-width:unset}#pt{font-size:48px}h1{font-size:1.4rem}}
</style>
</head>
<body>
<h1>CSS Text Stroke Generator</h1>
<p class="sub">Customize text stroke effects and grab the CSS code</p>
<div class="wrap">
<div class="pnl">
<h2>&#9881; Controls</h2>
<div class="cg"><label>Preview Text</label><input type="text" id="textIn" class="ti" value="Stroke" maxlength="30"></div>
<div class="cg"><label>Stroke Width</label><div class="cr"><input type="range" id="sWidth" min="0" max="10" step="0.5" value="2"><span class="vl" id="sWidthV">2px</span></div></div>
<div class="cg"><label>Stroke Color</label><div class="ci"><input type="color" id="sColor" value="#e94560"><input type="text" class="hx" id="sColorH" value="#e94560" maxlength="7"></div></div>
<div class="cg"><label>Fill Color</label><div class="ci"><input type="color" id="fColor" value="#ffffff"><input type="text" class="hx" id="fColorH" value="#ffffff" maxlength="7"></div>
<div class="sr"><label class="sw"><input type="checkbox" id="tFill"><span class="sld"></span></label><span>Transparent fill (outline only)</span></div></div>
<div class="cg"><label>Font Family</label><select id="fFont">
<option value="serif">Serif</option><option value="sans-serif" selected>Sans-serif</option><option value="monospace">Monospace</option><option value="cursive">Cursive</option>
<option value="'Roboto',sans-serif">Roboto</option><option value="'Playfair Display',serif">Playfair Display</option>
<option value="'Oswald',sans-serif">Oswald</option><option value="'Pacifico',cursive">Pacifico</option>
<option value="'Bebas Neue',sans-serif">Bebas Neue</option><option value="'Righteous',sans-serif">Righteous</option>
<option value="'Permanent Marker',cursive">Permanent Marker</option><option value="'Abril Fatface',serif">Abril Fatface</option>
</select></div>
<div class="cg"><label>Font Size</label><div class="cr"><input type="range" id="fSize" min="24" max="150" value="72"><span class="vl" id="fSizeV">72px</span></div></div>
</div>
<div class="pnl">
<h2>&#128064; Preview</h2>
<div class="pa"><span id="pt" style="font-family:sans-serif;-webkit-text-stroke:2px #e94560;color:#ffffff">Stroke</span></div>
<div class="cs">
<div class="ch"><span>Generated CSS</span><button class="cpb" id="copyBtn">Copy CSS</button></div>
<pre id="codeOut"></pre>
</div>
</div>
</div>
<footer>&copy; 2025 CSS Text Stroke Generator</footer>
<script>
(function(){
  const g=id=>document.getElementById(id);
  const pt=g('pt'),sWidth=g('sWidth'),sWidthV=g('sWidthV'),sColor=g('sColor'),sColorH=g('sColorH');
  const fColor=g('fColor'),fColorH=g('fColorH'),tFill=g('tFill'),fFont=g('fFont');
  const fSize=g('fSize'),fSizeV=g('fSizeV'),textIn=g('textIn'),codeOut=g('codeOut'),copyBtn=g('copyBtn');

  function update(){
    const sw=sWidth.value,sc=sColor.value,fc=fColor.value,tf=tFill.checked;
    const ff=fFont.value,fs=fSize.value,txt=textIn.value||'Stroke';
    sWidthV.textContent=sw+'px';
    fSizeV.textContent=fs+'px';
    pt.textContent=txt;
    pt.style.fontFamily=ff;
    pt.style.fontSize=fs+'px';
    pt.style.webkitTextStroke=sw+'px '+sc;
    pt.style.color=tf?'transparent':fc;
    let css='.text-stroke {\n';
    css+='  -webkit-text-stroke: '+sw+'px '+sc+';\n';
    css+='  text-stroke: '+sw+'px '+sc+';\n';
    if(tf){
      css+='  -webkit-text-fill-color: transparent;\n';
      css+='  color: transparent;\n';
    } else {
      css+='  -webkit-text-fill-color: '+fc+';\n';
      css+='  color: '+fc+';\n';
    }
    css+='  font-family: '+ff+';\n';
    css+='  font-size: '+fs+'px;\n';
    css+='}';
    codeOut.textContent=css;
  }

  sWidth.oninput=update;
  sColor.oninput=function(){sColorH.value=sColor.value;update()};
  sColorH.oninput=function(){if(/^#[0-9a-f]{6}$/i.test(sColorH.value)){sColor.value=sColorH.value;update()}};
  fColor.oninput=function(){fColorH.value=fColor.value;update()};
  fColorH.oninput=function(){if(/^#[0-9a-f]{6}$/i.test(fColorH.value)){fColor.value=fColorH.value;update()}};
  tFill.onchange=update;
  fFont.onchange=update;
  fSize.oninput=update;
  textIn.oninput=update;

  copyBtn.onclick=function(){
    navigator.clipboard.writeText(codeOut.textContent).then(function(){
      copyBtn.textContent='Copied!';
      copyBtn.classList.add('ok');
      setTimeout(function(){copyBtn.textContent='Copy CSS';copyBtn.classList.remove('ok')},2000);
    });
  };

  update();
})();
</script>
<script src="https://alwingulla.com/88/tag.min.js" data-zone="130747" async data-cfasync="false"></script>

<script defer src="/_vercel/speed-insights/script.js"></script>
</body>
</html>
