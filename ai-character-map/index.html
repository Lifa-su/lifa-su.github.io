<title>AI Character Map - Unicode Character Browser</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0d0d14;--s1:#161625;--s2:#1e1e32;--bd:#2a2a42;--tx:#e0e0f0;--tx2:#7878a0;--ac:#6c5ce7;--ac2:#a29bfe;--ok:#00cec9}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--tx);min-height:100vh}
.hd{background:rgba(22,22,37,.88);backdrop-filter:blur(12px);border-bottom:1px solid var(--bd);padding:16px 0;position:sticky;top:0;z-index:100}
.hi{max-width:1400px;margin:0 auto;padding:0 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.logo{font-size:22px;font-weight:700;background:linear-gradient(135deg,var(--ac),var(--ac2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.sb{flex:1;min-width:180px;max-width:480px;position:relative}
.sb input{width:100%;padding:10px 14px 10px 40px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font-size:15px;outline:none;transition:.2s}
.sb input:focus{border-color:var(--ac)}
.sb svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--tx2);width:18px;height:18px}
.st{color:var(--tx2);font-size:13px;white-space:nowrap}
.cats{max-width:1400px;margin:0 auto;padding:12px 20px;display:flex;gap:8px;flex-wrap:wrap}
.cb{padding:7px 16px;border-radius:18px;border:1px solid var(--bd);background:var(--s1);color:var(--tx2);cursor:pointer;font-size:13px;transition:.2s;white-space:nowrap}
.cb:hover{border-color:var(--ac);color:var(--tx)}.cb.on{background:var(--ac);border-color:var(--ac);color:#fff}
.mn{max-width:1400px;margin:0 auto;padding:8px 20px 40px}
.stl{font-size:17px;font-weight:600;margin:20px 0 10px;color:var(--ac2)}
.stl em{font-style:normal;font-size:13px;color:var(--tx2);font-weight:400;margin-left:8px}
.gr{display:grid;grid-template-columns:repeat(auto-fill,minmax(68px,1fr));gap:6px}
.cc{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--s1);border:1px solid var(--bd);border-radius:10px;cursor:pointer;transition:.2s;position:relative;overflow:hidden}
.cc:hover{border-color:var(--ac);transform:translateY(-2px);box-shadow:0 4px 16px rgba(108,92,231,.2)}
.cc .c{font-size:26px;line-height:1.2}.cc .n{font-size:8px;color:var(--tx2);margin-top:3px;text-align:center;padding:0 3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.cc.cp::after{content:'\2713 Copied';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,206,201,.92);color:#fff;font-size:12px;font-weight:600;border-radius:9px;animation:fo .8s ease forwards}
@keyframes fo{0%,60%{opacity:1}100%{opacity:0}}
.mo{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:200;align-items:center;justify-content:center;backdrop-filter:blur(4px)}
.mo.sh{display:flex}
.md{background:var(--s1);border:1px solid var(--bd);border-radius:18px;padding:28px;max-width:440px;width:92%;max-height:90vh;overflow-y:auto;position:relative;animation:mi .2s ease}
@keyframes mi{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:scale(1)}}
.mx{position:absolute;top:14px;right:14px;background:none;border:none;color:var(--tx2);cursor:pointer;font-size:22px;line-height:1;padding:4px}.mx:hover{color:var(--tx)}
.mc{font-size:64px;text-align:center;margin:8px 0 12px}
.mn2{font-size:17px;font-weight:600;text-align:center;margin-bottom:20px}
.mi{display:flex;flex-direction:column;gap:8px}
.ir{display:flex;align-items:center;background:var(--bg);border-radius:8px;padding:10px 14px;gap:8px}
.ir .l{font-size:11px;color:var(--tx2);text-transform:uppercase;letter-spacing:.5px;min-width:80px}
.ir .v{font-family:'SF Mono',Monaco,Consolas,monospace;font-size:13px;color:var(--ac2);flex:1;word-break:break-all}
.ir .cp2{background:none;border:none;color:var(--tx2);cursor:pointer;padding:2px 6px;font-size:15px;transition:.2s;margin-left:auto;flex-shrink:0}.ir .cp2:hover{color:var(--ok)}
.mcb{display:block;width:100%;margin-top:16px;padding:12px;border-radius:10px;border:none;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;font-size:15px;font-weight:600;cursor:pointer;transition:.2s}.mcb:hover{opacity:.9}
.emp{text-align:center;padding:60px 20px;color:var(--tx2)}.emp i{font-size:48px;display:block;margin-bottom:12px;font-style:normal}
.ft{text-align:center;padding:28px 20px;color:var(--tx2);font-size:12px;border-top:1px solid var(--bd);margin-top:40px}
@media(max-width:768px){.hi{gap:10px}.logo{font-size:18px}.sb{order:3;flex-basis:100%;max-width:100%}.gr{grid-template-columns:repeat(auto-fill,minmax(58px,1fr))}.md{padding:20px}}
@media(max-width:480px){.cc .c{font-size:20px}.cc .n{display:none}.gr{grid-template-columns:repeat(auto-fill,minmax(48px,1fr))}}
</style>
</head>

let cur='all';
const $=s=>document.getElementById(s);
const q=$('q'),cats=$('cats'),mn=$('mn'),mo=$('mo'),md=$('md'),st=$('st');

let total=0;
for(const k in D) total+=D[k].chars.length;
st.textContent=total+' characters';

function buildCats(){
  let h='<button class="cb on" data-c="all">All</button>';
  for(const k in D) h+='<button class="cb" data-c="'+k+'">'+D[k].icon+' '+D[k].name+'</button>';
  cats.innerHTML=h;
  cats.onclick=e=>{
    const b=e.target.closest('.cb');
    if(!b)return;
    cur=b.dataset.c;
    cats.querySelectorAll('.cb').forEach(x=>x.classList.toggle('on',x===b));
    render();
  };
}

function codeInfo(ch){
  const cp=ch.codePointAt(0);
  const hex=cp.toString(16).toUpperCase().padStart(4,'0');
  return{
    unicode:'U+'+hex,
    html:'&#x'+hex+';',
    css:'\\'+hex,
    js:cp>0xFFFF?'\\u{'+hex+'}':'\\u'+hex,
    dec:'&#'+cp+';'
  };
}

function render(){
  const f=q.value.toLowerCase().trim();
  let html='',shown=0;
  const keys=cur==='all'?Object.keys(D):[cur];
  keys.forEach(k=>{
    const cat=D[k];
    const filtered=cat.chars.filter(x=>!f||x[0].includes(f)||x[1].toLowerCase().includes(f));
    if(!filtered.length)return;
    shown+=filtered.length;
    html+='<div class="stl">'+cat.icon+' '+cat.name+'<em>'+filtered.length+'</em></div><div class="gr">';
    filtered.forEach(x=>{
      html+='<div class="cc" data-ch="'+encodeURIComponent(x[0])+'" data-nm="'+x[1]+'" role="button" tabindex="0" aria-label="'+x[1]+'">';
      html+='<span class="c">'+x[0]+'</span><span class="n">'+x[1]+'</span></div>';
    });
    html+='</div>';
  });
  if(!shown) html='<div class="emp"><i>🔍</i>No characters found</div>';
  mn.innerHTML=html;
  st.textContent=shown+' / '+total+' characters';
}

function copyText(t,el){
  navigator.clipboard.writeText(t).then(()=>{
    if(el){el.classList.add('cp');setTimeout(()=>el.classList.remove('cp'),800);}
  });
}

function showModal(ch,nm){
  const info=codeInfo(ch);
  md.innerHTML='<button class="mx" aria-label="Close">&times;</button>'
    +'<div class="mc">'+ch+'</div>'
    +'<div class="mn2">'+nm+'</div>'
    +'<div class="mi">'
    +row('Unicode',info.unicode)
    +row('HTML Hex',info.html)
    +row('HTML Dec',info.dec)
    +row('CSS',info.css)
    +row('JavaScript',info.js)
    +'</div>'
    +'<button class="mcb" id="mcb">Copy Character: '+ch+'</button>';
  mo.classList.add('sh');
  $('mcb').onclick=()=>{copyText(ch);$('mcb').textContent='Copied!';setTimeout(()=>$('mcb').textContent='Copy Character: '+ch,1200);};
  md.querySelector('.mx').onclick=()=>mo.classList.remove('sh');
  md.querySelectorAll('.cp2').forEach(b=>{
    b.onclick=()=>{
      copyText(b.dataset.v);
      b.textContent='\u2713';setTimeout(()=>b.textContent='\uD83D\uDCCB',800);
    };
  });
}

function row(label,val){
  return '<div class="ir"><span class="l">'+label+'</span><span class="v">'+val+'</span><button class="cp2" data-v="'+val.replace(/"/g,'&quot;')+'">\uD83D\uDCCB</button></div>';
}

mn.addEventListener('click',e=>{
  const card=e.target.closest('.cc');
  if(!card)return;
  const ch=decodeURIComponent(card.dataset.ch);
  const nm=card.dataset.nm;
  if(e.detail===2){copyText(ch,card);return;}
  showModal(ch,nm);
});

mn.addEventListener('contextmenu',e=>{
  const card=e.target.closest('.cc');
  if(!card)return;
  e.preventDefault();
  copyText(decodeURIComponent(card.dataset.ch),card);
});

mo.addEventListener('click',e=>{if(e.target===mo)mo.classList.remove('sh');});
document.addEventListener('keydown',e=>{if(e.key==='Escape')mo.classList.remove('sh');});

let debounce;
q.addEventListener('input',()=>{clearTimeout(debounce);debounce=setTimeout(render,150);});

buildCats();
render();
</script>
