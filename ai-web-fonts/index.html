*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0f0f13;--surface:#1a1a24;--surface2:#24243a;--border:#2a2a40;--text:#e4e4ef;--text2:#9999b0;--accent:#7c6aff;--accent2:#a78bfa;--accent-bg:rgba(124,106,255,.12);--danger:#ff6b8a;--success:#4ade80;--radius:12px}
body{font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;line-height:1.6}
button{cursor:pointer;font-family:inherit}
input,select{font-family:inherit}
.container{max-width:1400px;margin:0 auto;padding:0 20px}
header{background:rgba(26,26,36,.9);border-bottom:1px solid var(--border);padding:14px 0;position:sticky;top:0;z-index:100;backdrop-filter:blur(12px)}
.header-inner{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}
.logo{font-size:1.4rem;font-weight:700}
.logo span{background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.header-actions{display:flex;gap:8px;align-items:center}
.btn{padding:8px 16px;border-radius:8px;border:1px solid var(--border);background:var(--surface2);color:var(--text);font-size:.875rem;transition:all .2s;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--accent);background:var(--accent-bg)}
.btn.active,.btn-accent{background:var(--accent);border-color:var(--accent);color:#fff}
.toolbar{padding:16px 0;display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.search-box{flex:1;min-width:200px;position:relative}
.search-box input{width:100%;padding:10px 14px 10px 40px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:.95rem;outline:none;transition:border-color .2s}
.search-box input:focus{border-color:var(--accent)}
.search-box svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--text2);width:18px;height:18px}
.filter-group{display:flex;gap:6px;flex-wrap:wrap}
.filter-btn{padding:6px 14px;border-radius:20px;border:1px solid var(--border);background:transparent;color:var(--text2);font-size:.8rem;transition:all .2s;cursor:pointer}
.filter-btn:hover{border-color:var(--accent);color:var(--text)}
.filter-btn.active{background:var(--accent);border-color:var(--accent);color:#fff}
.controls{padding:12px 0;display:flex;flex-wrap:wrap;gap:16px;align-items:center;border-bottom:1px solid var(--border);margin-bottom:16px}
.control-item{display:flex;align-items:center;gap:8px;font-size:.85rem;color:var(--text2)}
.control-item label{white-space:nowrap}
.control-item input[type=range]{width:120px;accent-color:var(--accent)}
.control-item .val{min-width:40px;text-align:right;color:var(--text);font-weight:600;font-variant-numeric:tabular-nums}
.preview-input{flex:1;min-width:200px;padding:8px 12px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:.9rem;outline:none}
.preview-input:focus{border-color:var(--accent)}
.fonts-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px;padding-bottom:80px}
.fonts-grid.list-view{grid-template-columns:1fr}
.font-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;transition:all .2s;position:relative}
.font-card:hover{border-color:var(--accent);box-shadow:0 4px 24px rgba(0,0,0,.4)}
.font-card-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px}
.font-name{font-size:1rem;font-weight:600}
.font-category{font-size:.7rem;color:var(--text2);background:var(--surface2);padding:2px 8px;border-radius:10px;margin-top:4px;display:inline-block}
.font-card-actions{display:flex;gap:4px}
.icon-btn{width:32px;height:32px;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--text2);display:flex;align-items:center;justify-content:center;transition:all .2s;cursor:pointer}
.icon-btn:hover{border-color:var(--accent);color:var(--accent)}
.icon-btn.fav-active{color:var(--danger);border-color:var(--danger)}
.icon-btn.compare-active{color:var(--success);border-color:var(--success)}
.font-preview{font-size:24px;line-height:1.4;word-break:break-word;margin:12px 0;min-height:48px;transition:font-family .3s}
.font-weights{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.weight-tag{font-size:.7rem;padding:2px 6px;border-radius:4px;background:var(--surface2);color:var(--text2)}
.code-section{margin-top:12px;display:none;background:var(--bg);border-radius:8px;padding:12px;font-size:.8rem}
.code-section.show{display:block}
.code-section pre{background:var(--surface2);padding:10px;border-radius:6px;overflow-x:auto;margin:6px 0;color:var(--accent2);font-size:.78rem;line-height:1.5;white-space:pre-wrap;word-break:break-all}
.code-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.code-tabs{display:flex;gap:6px}
.code-tab{padding:4px 10px;border-radius:6px;border:1px solid var(--border);background:transparent;color:var(--text2);font-size:.75rem;cursor:pointer}
.code-tab.active{background:var(--accent);border-color:var(--accent);color:#fff}
.copy-btn{padding:4px 10px;border-radius:6px;border:1px solid var(--border);background:var(--surface2);color:var(--text2);font-size:.75rem;cursor:pointer;transition:all .2s}
.copy-btn:hover{border-color:var(--accent);color:var(--accent)}
.compare-bar{position:fixed;bottom:0;left:0;right:0;background:rgba(26,26,36,.95);border-top:1px solid var(--border);padding:12px 20px;display:none;align-items:center;justify-content:space-between;z-index:99;backdrop-filter:blur(12px)}
.compare-bar.show{display:flex}
.compare-chips{display:flex;gap:8px;flex-wrap:wrap;flex:1}
.compare-chip{padding:4px 12px;border-radius:16px;background:var(--accent-bg);border:1px solid var(--accent);color:var(--accent2);font-size:.85rem;display:flex;align-items:center;gap:6px}
.compare-chip button{background:none;border:none;color:var(--accent2);cursor:pointer;font-size:1rem;line-height:1}
.compare-view{display:none;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;padding-bottom:80px}
.compare-view.show{display:grid}
.compare-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:24px}
.compare-card h3{font-size:1rem;margin-bottom:4px}
.compare-card .cat{font-size:.75rem;color:var(--text2);margin-bottom:12px}
.compare-card .preview{word-break:break-word;min-height:80px}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:200;display:none;align-items:center;justify-content:center}
.modal-overlay.show{display:flex}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:24px;max-width:500px;width:90%;max-height:80vh;overflow-y:auto}
.modal h2{font-size:1.2rem;margin-bottom:16px}
.stats{display:flex;gap:16px;margin-bottom:8px;font-size:.85rem;color:var(--text2)}
.no-results{text-align:center;padding:60px 20px;color:var(--text2);font-size:1.1rem}
@media(max-width:640px){.fonts-grid{grid-template-columns:1fr}.controls{gap:10px}.control-item input[type=range]{width:80px}.header-inner{flex-direction:column;align-items:stretch}.header-actions{justify-content:center}}
</style>

</div>
<div class="compare-grid" id="compareGrid"></div>
</div>
</div>

<script>

const loadedFonts = new Set();
let favorites = JSON.parse(localStorage.getItem('wf_favs') || '[]');
let compareList = [];
let currentCategory = 'all';
let showFavsOnly = false;
let viewMode = 'grid';

function loadFont(name) {
  if (loadedFonts.has(name)) return;
  loadedFonts.add(name);
  const link = document.createElement('link');
  link.rel = 'stylesheet';
  link.href = 'https://fonts.googleapis.com/css2?family=' + encodeURIComponent(name) + ':wght@100;200;300;400;500;600;700;800;900&display=swap';
  document.head.appendChild(link);
}

function getPreviewText() {
  return document.getElementById('previewText').value || 'The quick brown fox jumps over the lazy dog';
}
function getFontSize() { return document.getElementById('fontSize').value; }
function getFontWeight() { return document.getElementById('fontWeight').value; }
function getLineHeight() { return document.getElementById('lineHeight').value; }

function isFav(name) { return favorites.includes(name); }
function toggleFav(name) {
  if (isFav(name)) favorites = favorites.filter(f => f !== name);
  else favorites.push(name);
  localStorage.setItem('wf_favs', JSON.stringify(favorites));
  renderFonts();
}

function isCompare(name) { return compareList.includes(name); }
function toggleCompare(name) {
  if (isCompare(name)) compareList = compareList.filter(f => f !== name);
  else if (compareList.length < 4) compareList.push(name);
  updateCompareBar();
  renderFonts();
}

function updateCompareBar() {
  const bar = document.getElementById('compareBar');
  const chips = document.getElementById('compareChips');
  if (compareList.length > 0) {
    bar.classList.add('show');
    chips.innerHTML = compareList.map(name =>
      '<div class="compare-chip">' + name + ' <button onclick="toggleCompare(\''+name.replace(/'/g,"\\'")+'\')">&times;</button></div>'
    ).join('');
  } else {
    bar.classList.remove('show');
  }
}

function clearCompare() { compareList = []; updateCompareBar(); renderFonts(); }

function openCompare() {
  if (compareList.length < 2) return alert('Select at least 2 fonts to compare');
  const modal = document.getElementById('compareModal');
  const grid = document.getElementById('compareGrid');
  const text = getPreviewText();
  const size = getFontSize();
  const weight = getFontWeight();
  const lh = getLineHeight();
  grid.innerHTML = compareList.map(name => {
    loadFont(name);
    return '<div class="compare-card"><h4>' + name + '</h4><p style="font-family:\''+name+'\',sans-serif;font-size:'+size+'px;font-weight:'+weight+';line-height:'+lh+'">' + text + '</p></div>';
  }).join('');
  modal.classList.add('show');
}

function closeCompare() { document.getElementById('compareModal').classList.remove('show'); }

function setView(mode) {
  viewMode = mode;
  document.getElementById('fontsGrid').className = 'fonts-grid' + (mode === 'list' ? ' list-view' : '');
  document.getElementById('gridBtn').classList.toggle('active', mode === 'grid');
  document.getElementById('listBtn').classList.toggle('active', mode === 'list');
}

function setCategory(cat, el) {
  currentCategory = cat;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  filterFonts();
}

function toggleFavFilter() {
  showFavsOnly = !showFavsOnly;
  document.getElementById('favFilterBtn').classList.toggle('active', showFavsOnly);
  filterFonts();
}

function getFilteredFonts() {
  const q = document.getElementById('searchInput').value.toLowerCase();
  return FONTS.filter(f => {
    if (currentCategory !== 'all' && f.category !== currentCategory) return false;
    if (showFavsOnly && !isFav(f.name)) return false;
    if (q && !f.name.toLowerCase().includes(q)) return false;
    return true;
  });
}

function toggleCode(name) {
  const el = document.getElementById('code-' + CSS.escape(name));
  if (el) el.classList.toggle('show');
}

function showCodeTab(name, tab) {
  const section = document.getElementById('code-' + CSS.escape(name));
  if (!section) return;
  const encoded = encodeURIComponent(name).replace(/%20/g, '+');
  const weights = FONTS.find(f => f.name === name)?.weights.join(';') || '400';
  let code = '';
  if (tab === 'import') {
    code = "@import url('https://fonts.googleapis.com/css2?family=" + encoded + ":wght@" + weights + "&display=swap');";
  } else {
    code = '<link href="https://fonts.googleapis.com/css2?family=' + encoded + ':wght@' + weights + '&display=swap" rel="stylesheet">';
  }
  section.querySelector('pre').textContent = code;
  section.querySelectorAll('.code-tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
  section.dataset.currentCode = code;
}

function copyCode(name) {
  const section = document.getElementById('code-' + CSS.escape(name));
  if (!section) return;
  const code = section.dataset.currentCode || section.querySelector('pre').textContent;
  navigator.clipboard.writeText(code).then(() => {
    const btn = section.querySelector('.copy-btn');
    btn.textContent = 'Copied!';
    setTimeout(() => btn.textContent = 'Copy', 1500);
  });
}

function renderFonts() {
  const fonts = getFilteredFonts();
  const grid = document.getElementById('fontsGrid');
  const text = getPreviewText();
  const size = getFontSize();
  const weight = getFontWeight();
  const lh = getLineHeight();

  grid.innerHTML = fonts.map(f => {
    loadFont(f.name);
    const favClass = isFav(f.name) ? ' fav-active' : '';
    const cmpClass = isCompare(f.name) ? ' compare-active' : '';
    const encoded = encodeURIComponent(f.name).replace(/%20/g, '+');
    const wStr = f.weights.join(';');
    const importCode = "@import url('https://fonts.googleapis.com/css2?family=" + encoded + ":wght@" + wStr + "&display=swap');";
    const eName = CSS.escape(f.name);

    return '<div class="font-card">' +
      '<div class="font-card-header">' +
        '<div><div class="font-name">' + f.name + '</div><span class="font-category">' + f.category + '</span></div>' +
        '<div class="font-card-actions">' +
          '<button class="icon-btn' + favClass + '" onclick="toggleFav(\''+f.name.replace(/'/g,"\\'")+'\')">&#9829;</button>' +
          '<button class="icon-btn' + cmpClass + '" onclick="toggleCompare(\''+f.name.replace(/'/g,"\\'")+'\')">&#9878;</button>' +
          '<button class="icon-btn" onclick="toggleCode(\''+f.name.replace(/'/g,"\\'")+'\')">&#60;/&#62;</button>' +
        '</div>' +
      '</div>' +
      '<div class="font-preview" style="font-family:\''+f.name+'\',sans-serif;font-size:'+size+'px;font-weight:'+weight+';line-height:'+lh+'">' + text + '</div>' +
      '<div class="font-weights">' + f.weights.map(w => '<span class="weight-tag">' + w + '</span>').join('') + '</div>' +
      '<div class="code-section" id="code-' + eName + '" data-current-code="' + importCode.replace(/"/g,'&quot;') + '">' +
        '<div class="code-header">' +
          '<div class="code-tabs">' +
            '<button class="code-tab active" data-tab="import" onclick="showCodeTab(\''+f.name.replace(/'/g,"\\'")+'\',\'import\')">@import</button>' +
            '<button class="code-tab" data-tab="link" onclick="showCodeTab(\''+f.name.replace(/'/g,"\\'")+'\',\'link\')">link tag</button>' +
          '</div>' +
          '<button class="copy-btn" onclick="copyCode(\''+f.name.replace(/'/g,"\\'")+'\')">Copy</button>' +
        '</div>' +
        '<pre>' + importCode + '</pre>' +
      '</div>' +
    '</div>';
  }).join('');
}

function filterFonts() { renderFonts(); }

function updatePreviews() {
  document.getElementById('fontSizeVal').textContent = getFontSize() + 'px';
  document.getElementById('fontWeightVal').textContent = getFontWeight();
  document.getElementById('lineHeightVal').textContent = getLineHeight();
  renderFonts();
}

// Init
document.addEventListener('DOMContentLoaded', () => {
  setView('grid');
  renderFonts();
});

document.getElementById('compareModal').addEventListener('click', function(e) {
  if (e.target === this) closeCompare();
});

</script>
