<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--pri:#6366f1;--pri-dk:#4f46e5;--pri-lt:#818cf8;--bg:#0f172a;--card:#1e293b;--inp:#334155;--txt:#f1f5f9;--muted:#94a3b8;--bdr:#475569;--ok:#22c55e;--warn:#f59e0b;--err:#ef4444;--acc:#06b6d4;--r:12px}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;line-height:1.6}
.container{max-width:1200px;margin:0 auto;padding:20px}
header{text-align:center;padding:40px 0 20px}
header h1{font-size:2.2rem;background:linear-gradient(135deg,var(--pri-lt),var(--acc));-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:6px}
header p{color:var(--muted);font-size:1rem}
.api-bar{display:flex;gap:10px;align-items:center;justify-content:center;margin-top:14px;flex-wrap:wrap}
.api-bar input{background:var(--inp);border:1px solid var(--bdr);color:var(--txt);padding:8px 14px;border-radius:8px;width:340px;font-size:.9rem}
.api-bar input:focus{outline:none;border-color:var(--pri)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.dot.on{background:var(--ok)}.dot.off{background:var(--err)}
.grid{display:grid;grid-template-columns:380px 1fr;gap:24px;margin-top:24px}
@media(max-width:900px){.grid{grid-template-columns:1fr}}
.panel{background:var(--card);border-radius:var(--r);padding:24px;box-shadow:0 4px 24px rgba(0,0,0,.3)}
.panel h2{font-size:1.1rem;margin-bottom:14px;display:flex;align-items:center;gap:8px}
label{display:block;font-size:.85rem;color:var(--muted);margin:12px 0 5px}
label:first-of-type{margin-top:0}
input[type=text],input[type=email],textarea,select{width:100%;background:var(--inp);border:1px solid var(--bdr);color:var(--txt);padding:10px 14px;border-radius:8px;font-size:.95rem;transition:border-color .2s}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--pri)}
textarea{resize:vertical;min-height:70px}
select{cursor:pointer}
.btn{display:inline-flex;align-items:center;gap:6px;padding:10px 20px;border:none;border-radius:8px;font-size:.95rem;cursor:pointer;transition:all .2s;font-weight:500}
.btn-p{background:linear-gradient(135deg,var(--pri),var(--pri-dk));color:#fff}
.btn-p:hover{transform:translateY(-1px);box-shadow:0 4px 16px rgba(99,102,241,.4)}
.btn-p:disabled{opacity:.5;cursor:not-allowed;transform:none;box-shadow:none}
.btn-s{background:var(--inp);color:var(--txt);border:1px solid var(--bdr)}
.btn-s:hover{border-color:var(--pri)}
.btn-sm{padding:6px 12px;font-size:.82rem}
.btn-grp{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.tabs{display:flex;gap:4px;margin-bottom:14px;flex-wrap:wrap}
.tab{padding:7px 14px;border-radius:8px;cursor:pointer;font-size:.85rem;background:var(--inp);color:var(--muted);border:1px solid transparent;transition:all .2s}
.tab.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.tab:hover:not(.on){border-color:var(--bdr);color:var(--txt)}
.ecard{background:var(--bg);border-radius:var(--r);padding:20px;margin-bottom:14px;border:1px solid var(--bdr);position:relative}
.ecard .badge{position:absolute;top:12px;right:12px;background:var(--pri);color:#fff;padding:2px 10px;border-radius:20px;font-size:.75rem}
.ecard h3{font-size:.95rem;margin-bottom:4px;color:var(--pri-lt)}
.ecard .subj{font-size:.9rem;color:var(--acc);margin-bottom:10px;padding:8px 12px;background:rgba(6,182,212,.1);border-radius:6px;border-left:3px solid var(--acc)}
.ecard .body{white-space:pre-wrap;font-size:.88rem;line-height:1.7}
.ecard .acts{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.scores{display:flex;gap:14px;margin-top:10px;flex-wrap:wrap}
.sc{display:flex;align-items:center;gap:6px;font-size:.85rem}
.ring{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.78rem;border:3px solid}
.ring.h{border-color:var(--ok);color:var(--ok)}
.ring.m{border-color:var(--warn);color:var(--warn)}
.ring.l{border-color:var(--err);color:var(--err)}
.seqnav{display:flex;gap:4px;margin-bottom:10px}
.seqnav .sb{padding:6px 14px;border-radius:6px;cursor:pointer;font-size:.85rem;background:var(--inp);color:var(--muted);border:1px solid transparent;transition:all .2s}
.seqnav .sb.on{background:var(--acc);color:#fff}
.loading{display:flex;flex-direction:column;align-items:center;padding:60px 20px;color:var(--muted)}
.spinner{width:36px;height:36px;border:3px solid var(--inp);border-top-color:var(--pri);border-radius:50%;animation:sp .8s linear infinite;margin-bottom:14px}
@keyframes sp{to{transform:rotate(360deg)}}
.empty{text-align:center;padding:60px 20px;color:var(--muted)}
.empty .ico{font-size:3rem;margin-bottom:10px}
.toast{position:fixed;bottom:24px;right:24px;background:var(--ok);color:#fff;padding:12px 20px;border-radius:8px;font-size:.9rem;z-index:999;transform:translateY(80px);opacity:0;transition:all .3s}
.toast.show{transform:translateY(0);opacity:1}
.chk{display:flex;align-items:center;gap:8px;margin-top:8px}
.chk input[type=checkbox]{width:16px;height:16px;accent-color:var(--pri)}
.chk label{margin:0;font-size:.9rem;color:var(--txt)}
.lang-sel{display:flex;gap:6px;margin-top:6px}
.lang-sel .lb{padding:4px 12px;border-radius:6px;cursor:pointer;font-size:.82rem;background:var(--inp);color:var(--muted);border:1px solid transparent;transition:all .2s}
.lang-sel .lb.on{background:var(--acc);color:#fff}
/* Animations */
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
body{animation:fadeIn .3s ease-out}
.panel{animation:slideUp .4s ease-out both}
.grid .panel:nth-child(2){animation-delay:.1s}
header{animation:slideUp .35s ease-out}
.ecard{animation:slideUp .3s ease-out both}
/* Pro Section */
.pro-section{background:linear-gradient(135deg,rgba(99,102,241,.08),rgba(6,182,212,.1));border:1px solid rgba(99,102,241,.25);border-radius:var(--r);padding:28px;text-align:center;margin-top:24px;position:relative;overflow:hidden;animation:slideUp .5s ease-out both;animation-delay:.2s}
.pro-badge{position:absolute;top:12px;right:12px;background:linear-gradient(135deg,#f59e0b,#ef4444);color:#fff;padding:4px 14px;border-radius:20px;font-size:.75rem;font-weight:700;letter-spacing:.5px}
.pro-section h3{font-size:1.15rem;margin-bottom:14px;color:var(--txt)}
.pro-features{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-bottom:18px}
.pro-feature{padding:8px 16px;background:rgba(99,102,241,.1);border:1px solid rgba(99,102,241,.15);border-radius:8px;font-size:.85rem;color:var(--muted)}
.btn-pro{display:inline-block;padding:12px 36px;background:linear-gradient(135deg,var(--pri),var(--acc));color:#fff;border-radius:8px;font-weight:600;text-decoration:none;transition:all .3s;font-size:.95rem}
.btn-pro:hover{transform:translateY(-2px);box-shadow:0 6px 24px rgba(99,102,241,.4)}
</style>
</head>
<body>
<div class="container">
<header>
<h1>&#x2709;&#xFE0F; AI 冷启动邮件生成器</h1>
<p>输入目标信息，AI 为你生成高转化率的个性化冷邮件</p>
<div class="api-bar">
<input type="password" id="apiKey" placeholder="输入 DeepSeek API Key (sk-...)" oninput="checkKey()">
<span id="apiStatus"><span class="dot off"></span> 未连接</span>
</div>
</header>
<div class="grid">
<div class="panel">
<h2>&#x1F4DD; 邮件信息</h2>
<label>场景类型</label>
<select id="scenario">
<option value="sales">&#x1F3AF; 销售开发信</option>
<option value="partnership">&#x1F91D; 合作邀请</option>
<option value="job">&#x1F4BC; 求职</option>
<option value="investor">&#x1F4B0; 投资人联系</option>
<option value="media">&#x1F4F0; 媒体/PR</option>
</select>
<label>目标公司名称</label>
<input type="text" id="company" placeholder="如：字节跳动">
<label>目标联系人（姓名+职位）</label>
<input type="text" id="person" placeholder="如：张三，市场总监">
<label>你的身份（公司+职位+姓名）</label>
<input type="text" id="sender" placeholder="如：ABC科技 CEO 李四">
<label>你的产品/服务/核心优势</label>
<textarea id="product" placeholder="简要描述你的产品、服务或核心优势..."></textarea>
<label>补充信息（可选）</label>
<textarea id="extra" placeholder="目标公司近期动态、共同联系人、行业痛点等..."></textarea>
<label>邮件语言</label>
<div class="lang-sel">
<span class="lb on" data-v="zh" onclick="setLang(this)">中文</span>
<span class="lb" data-v="en" onclick="setLang(this)">English</span>
<span class="lb" data-v="both" onclick="setLang(this)">双语</span>
</div>
<input type="hidden" id="lang" value="zh">
<label>邮件语气</label>
<select id="tone">
<option value="professional">专业正式</option>
<option value="friendly">友好亲切</option>
<option value="direct">简洁直接</option>
<option value="creative">创意独特</option>
</select>
<div class="chk">
<input type="checkbox" id="abTest" checked>
<label for="abTest">生成 A/B 测试版本（3个版本）</label>
</div>
<div class="chk">
<input type="checkbox" id="followUp" checked>
<label for="followUp">生成跟进邮件序列（3封）</label>
</div>
<div class="btn-grp">
<button class="btn btn-p" id="genBtn" onclick="generate()">&#x1F680; 生成邮件</button>
<button class="btn btn-s" onclick="clearAll()">&#x1F5D1;&#xFE0F; 清空</button>
<button class="btn btn-s" onclick="exportAll()">&#x1F4E6; 全部导出</button>
</div>
</div>
<div class="panel">
<h2>&#x1F4EC; 生成结果</h2>
<div class="tabs" id="mainTabs">
<div class="tab on" data-t="emails" onclick="switchMain(this)">&#x1F4E7; 邮件版本</div>
<div class="tab" data-t="sequence" onclick="switchMain(this)">&#x1F4CB; 跟进序列</div>
<div class="tab" data-t="subjects" onclick="switchMain(this)">&#x1F4A1; 主题行优化</div>
</div>
<div id="output">
<div class="empty"><div class="ico">&#x2709;&#xFE0F;</div><p>填写左侧信息，点击生成按钮<br>AI 将为你创建个性化冷邮件</p></div>
</div>
</div>
</div>
</div>
<div class="toast" id="toast"></div>
<script>
let state={emails:[],sequence:[],subjects:[],currentSeq:0};
const API='https://api.deepseek.com/chat/completions';
function $(id){return document.getElementById(id)}

function checkKey(){
  const k=$('apiKey').value.trim();
  $('apiStatus').innerHTML=k.startsWith('sk-')&&k.length>10
    ?'<span class="dot on"></span> 已连接'
    :'<span class="dot off"></span> 未连接';
}

function setLang(el){
  document.querySelectorAll('.lang-sel .lb').forEach(l=>l.classList.remove('on'));
  el.classList.add('on');
  $('lang').value=el.dataset.v;
}

function toast(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2000)}
function copyText(text){navigator.clipboard.writeText(text).then(()=>toast('✅ 已复制到剪贴板')).catch(()=>toast('❌ 复制失败'))}
function switchMain(el){document.querySelectorAll('#mainTabs .tab').forEach(t=>t.classList.remove('on'));el.classList.add('on');renderOutput(el.dataset.t)}
function scoreClass(v){return v>=70?'h':v>=40?'m':'l'}
function escHtml(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

function clearAll(){
  ['company','person','sender','product','extra'].forEach(id=>$(id).value='');
  state={emails:[],sequence:[],subjects:[],currentSeq:0};
  $('output').innerHTML='<div class="empty"><div class="ico">✉️</div><p>填写左侧信息，点击生成按钮<br>AI 将为你创建个性化冷邮件</p></div>';
}

async function callAPI(prompt){
  const key=$('apiKey').value.trim();
  if(!key){toast('⚠️ 请先输入 API Key');return null}
  const res=await fetch(API,{
    method:'POST',
    headers:{'Content-Type':'application/json','Authorization':'Bearer '+key},
    body:JSON.stringify({
      model:'deepseek-chat',
      messages:[
        {role:'system',content:'你是一位专业的商务邮件撰写专家，精通冷启动邮件(cold email)的撰写技巧。请严格按照JSON格式输出，不要输出任何其他内容。'},
        {role:'user',content:prompt}
      ],
      temperature:0.8,
      max_tokens:4000
    })
  });
  if(!res.ok)throw new Error('API错误: '+res.status);
  const data=await res.json();
  const c=data.choices[0].message.content;
  const m=c.match(/```json\s*([\s\S]*?)```/);
  if(m)return JSON.parse(m[1]);
  const m2=c.match(/\{[\s\S]*\}/);
  if(m2)return JSON.parse(m2[0]);
  return JSON.parse(c);
}

function buildInfo(){
  const company=$('company').value.trim();
  const person=$('person').value.trim();
  const sender=$('sender').value.trim();
  const product=$('product').value.trim();
  const extra=$('extra').value.trim();
  return `目标公司: ${company||'未指定'}
目标联系人: ${person||'未指定'}
发件人身份: ${sender||'未指定'}
产品/服务/优势: ${product||'未指定'}
补充信息: ${extra||'无'}`;
}

function getScenarioLabel(){
  const m={sales:'销售开发信',partnership:'合作邀请',job:'求职邮件',investor:'投资人联系',media:'媒体PR'};
  return m[$('scenario').value]||$('scenario').value;
}

function getLangLabel(){
  const v=$('lang').value;
  return v==='zh'?'中文':v==='en'?'English':'中英双语';
}

function getToneLabel(){
  const m={professional:'专业正式',friendly:'友好亲切',direct:'简洁直接',creative:'创意独特'};
  return m[$('tone').value]||$('tone').value;
}

async function generate(){
  const company=$('company').value.trim();
  const person=$('person').value.trim();
  if(!company&&!person){toast('⚠️ 请至少填写公司或联系人');return}

  const btn=$('genBtn');
  btn.disabled=true;btn.textContent='⏳ 生成中...';
  $('output').innerHTML='<div class="loading"><div class="spinner"></div><p>AI 正在生成个性化邮件，请稍候...</p></div>';

  const scenario=getScenarioLabel();
  const lang=getLangLabel();
  const tone=getToneLabel();
  const info=buildInfo();
  const abCount=$('abTest').checked?3:1;
  const doFollowUp=$('followUp').checked;

  try{
    // 1. Generate email versions
    const p1=`请为以下冷邮件场景生成${abCount}个不同版本的邮件。

场景类型: ${scenario}
语言: ${lang}
语气风格: ${tone}

${info}

请严格按以下JSON格式输出:
{"emails":[{"version":"A","subject":"邮件主题","body":"邮件正文","openRate":65,"replyRate":25,"tips":"优化建议"}]}

要求:
1. 每个版本风格不同但都针对同一目标
2. openRate和replyRate为0-100的预测分数
3. 邮件要个性化、有吸引力、简洁有力
4. 包含明确的CTA(行动号召)
5. tips给出具体的优化建议`;

    const d1=await callAPI(p1);
    state.emails=d1.emails||[];

    // 2. Generate follow-up sequence (if checked)
    if(doFollowUp){
      const p2=`基于以下信息，生成3封跟进邮件序列。

场景: ${scenario} | 语言: ${lang} | 风格: ${tone}
${info}

请严格按以下JSON格式输出:
{"sequence":[{"step":1,"delay":"3天后","subject":"主题","body":"正文","tip":"策略说明"},{"step":2,"delay":"7天后","subject":"主题","body":"正文","tip":"策略说明"},{"step":3,"delay":"14天后","subject":"主题","body":"正文","tip":"策略说明"}]}

要求: 每封跟进邮件递进式推进，不要重复，越来越简短`;

      const d2=await callAPI(p2);
      state.sequence=d2.sequence||[];
    }else{
      state.sequence=[];
    }

    // 3. Generate subject line variations
    const p3=`为以下冷邮件场景生成8个不同风格的邮件主题行。

场景: ${scenario} | 语言: ${lang}
${info}

请严格按以下JSON格式输出:
{"subjects":[{"text":"主题行内容","style":"风格类型","score":75}]}

风格包括: 提问式、数据驱动、好奇心、个性化、紧迫感、价值导向、社交证明、幽默
score为0-100的预测打开率`;

    const d3=await callAPI(p3);
    state.subjects=d3.subjects||[];
    state.currentSeq=0;

    renderOutput('emails');
  }catch(e){
    $('output').innerHTML='<div class="empty"><div class="ico">❌</div><p>生成失败: '+escHtml(e.message)+'</p></div>';
  }finally{
    btn.disabled=false;btn.textContent='🚀 生成邮件';
  }
}

function renderOutput(tab){
  const o=$('output');
  if(tab==='emails')renderEmails(o);
  else if(tab==='sequence')renderSequence(o);
  else if(tab==='subjects')renderSubjects(o);
  document.querySelectorAll('#mainTabs .tab').forEach(t=>t.classList.toggle('on',t.dataset.t===tab));
}

function renderEmails(o){
  if(!state.emails.length){o.innerHTML='<div class="empty"><div class="ico">📧</div><p>暂无邮件，请先生成</p></div>';return}
  const vers=['A','B','C'];
  o.innerHTML=state.emails.map((e,i)=>`<div class="ecard">
    <span class="badge">版本 ${vers[i]||i+1}</span>
    <h3>📧 版本 ${vers[i]||i+1}</h3>
    <div class="subj">📌 ${escHtml(e.subject)}</div>
    <div class="body">${escHtml(e.body)}</div>
    <div class="scores">
      <div class="sc"><div class="ring ${scoreClass(e.openRate)}">${e.openRate}%</div><span>打开率</span></div>
      <div class="sc"><div class="ring ${scoreClass(e.replyRate)}">${e.replyRate}%</div><span>回复率</span></div>
    </div>
    ${e.tips?'<div style="margin-top:10px;padding:8px 12px;background:rgba(99,102,241,.1);border-radius:6px;font-size:.83rem;color:var(--pri-lt)">💡 '+escHtml(e.tips)+'</div>':''}
    <div class="acts">
      <button class="btn btn-s btn-sm" onclick="copyEmail(${i})">📋 复制</button>
      <button class="btn btn-s btn-sm" onclick="exportEmail(${i})">💾 导出</button>
    </div>
  </div>`).join('');
}

function renderSequence(o){
  if(!state.sequence.length){o.innerHTML='<div class="empty"><div class="ico">📋</div><p>暂无跟进序列</p></div>';return}
  let html='<div class="seqnav">'+state.sequence.map((s,i)=>
    '<div class="sb '+(i===state.currentSeq?'on':'')+'" onclick="state.currentSeq='+i+';renderOutput(\'sequence\')">第'+s.step+'封 · '+escHtml(s.delay)+'</div>'
  ).join('')+'</div>';
  const s=state.sequence[state.currentSeq];
  html+='<div class="ecard"><span class="badge">'+escHtml(s.delay)+'</span>';
  html+='<h3>📋 跟进邮件 #'+s.step+'</h3>';
  html+='<div class="subj">📌 '+escHtml(s.subject)+'</div>';
  html+='<div class="body">'+escHtml(s.body)+'</div>';
  if(s.tip)html+='<div style="margin-top:10px;padding:8px 12px;background:rgba(6,182,212,.1);border-radius:6px;font-size:.83rem;color:var(--acc)">💡 策略: '+escHtml(s.tip)+'</div>';
  html+='<div class="acts"><button class="btn btn-s btn-sm" onclick="copySeq('+state.currentSeq+')">📋 复制</button>';
  html+='<button class="btn btn-s btn-sm" onclick="exportSeq('+state.currentSeq+')">💾 导出</button></div></div>';
  o.innerHTML=html;
}

function renderSubjects(o){
  if(!state.subjects.length){o.innerHTML='<div class="empty"><div class="ico">💡</div><p>暂无主题行</p></div>';return}
  const sorted=[...state.subjects].sort((a,b)=>b.score-a.score);
  o.innerHTML='<div style="display:flex;flex-direction:column;gap:8px">'+sorted.map(s=>
    '<div class="ecard" style="margin:0;display:flex;align-items:center;gap:12px;flex-wrap:wrap">'+
    '<div class="ring '+scoreClass(s.score)+'" style="flex-shrink:0">'+s.score+'%</div>'+
    '<div style="flex:1;min-width:200px"><div style="font-size:.92rem">'+escHtml(s.text)+'</div>'+
    '<div style="font-size:.78rem;color:var(--muted);margin-top:2px">'+escHtml(s.style||'')+'</div></div>'+
    '<button class="btn btn-s btn-sm" onclick="copyText(\''+escAttr(s.text)+'\')">📋</button></div>'
  ).join('')+'</div>';
}

function escAttr(s){return String(s||'').replace(/\\/g,'\\\\').replace(/'/g,"\\'")}

function copyEmail(i){
  const e=state.emails[i];
  if(e)copyText('主题: '+e.subject+'\n\n'+e.body);
}
function exportEmail(i){
  const e=state.emails[i];
  if(e)downloadTxt('主题: '+e.subject+'\n\n'+e.body,'email_'+['A','B','C'][i]);
}
function copySeq(i){
  const s=state.sequence[i];
  if(s)copyText('主题: '+s.subject+'\n\n'+s.body);
}
function exportSeq(i){
  const s=state.sequence[i];
  if(s)downloadTxt('主题: '+s.subject+'\n\n'+s.body,'followup_'+s.step);
}

function downloadTxt(content,name){
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([content],{type:'text/plain;charset=utf-8'}));
  a.download=(name||'email')+'.txt';
  a.click();
  URL.revokeObjectURL(a.href);
  toast('✅ 已导出');
}

function exportAll(){
  if(!state.emails.length&&!state.sequence.length){toast('⚠️ 暂无内容可导出');return}
  let t='=== AI 冷启动邮件生成结果 ===\n生成时间: '+new Date().toLocaleString()+'\n\n';
  if(state.emails.length){
    t+='--- 邮件版本 ---\n\n';
    state.emails.forEach((e,i)=>{
      t+='【版本 '+['A','B','C'][i]+'】\n主题: '+e.subject+'\n打开率: '+e.openRate+'% | 回复率: '+e.replyRate+'%\n\n'+e.body+'\n\n建议: '+(e.tips||'无')+'\n\n========================================\n\n';
    });
  }
  if(state.sequence.length){
    t+='--- 跟进序列 ---\n\n';
    state.sequence.forEach(s=>{
      t+='【第'+s.step+'封 · '+s.delay+'】\n主题: '+s.subject+'\n\n'+s.body+'\n\n策略: '+(s.tip||'无')+'\n\n========================================\n\n';
    });
  }
  if(state.subjects.length){
    t+='--- 主题行优化 ---\n\n';
    state.subjects.forEach(s=>{t+='['+s.score+'%] '+s.text+' ('+( s.style||'')+')\n'});
  }
  downloadTxt(t,'cold_email_all');
}
