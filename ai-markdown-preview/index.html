<!DOCTYPE html>
<html lang="zh-CN">
<head>

    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Live Markdown preview editor with syntax highlighting. Write Markdown on the left, see rendered HTML on the right. Supports GFM tables, code blocks, and more.">
<link rel="canonical" href="https://lifa-su.com/ai-markdown-preview/">
<title>AI Markdown Preview</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#1a1a2e;--surface:#16213e;--surface2:#0f3460;--text:#e0e0e0;--text-muted:#8892b0;--accent:#e94560;--accent2:#533483;--border:#2a2a4a;--code-bg:#0d1117}
html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text)}
.app{display:flex;flex-direction:column;height:100vh}
.toolbar{display:flex;align-items:center;justify-content:space-between;padding:8px 16px;background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0}
.toolbar h1{font-size:18px;font-weight:600;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.toolbar-actions{display:flex;gap:8px}
.btn{padding:6px 14px;border:none;border-radius:6px;cursor:pointer;font-size:13px;font-weight:500;transition:all .2s}
.btn-export{background:var(--accent);color:#fff}
.btn-export:hover{background:#d63851;transform:translateY(-1px)}
.btn-clear{background:var(--surface2);color:var(--text)}
.btn-clear:hover{background:#1a4a7a}
.editor-wrap{display:flex;flex:1;overflow:hidden}
.pane{flex:1;display:flex;flex-direction:column;min-width:0}
.pane-header{padding:6px 14px;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:1px;color:var(--text-muted);background:var(--surface);border-bottom:1px solid var(--border)}
.pane+.pane{border-left:1px solid var(--border)}
#editor{flex:1;width:100%;padding:16px;border:none;outline:none;resize:none;font-family:'SF Mono',Monaco,'Fira Code',Consolas,monospace;font-size:14px;line-height:1.7;background:var(--bg);color:var(--text);tab-size:2}
#editor::placeholder{color:var(--text-muted)}
#preview{flex:1;padding:16px 24px;overflow-y:auto;background:var(--bg);line-height:1.7;font-size:15px}
#preview h1{font-size:2em;margin:.5em 0 .3em;padding-bottom:.2em;border-bottom:1px solid var(--border)}
#preview h2{font-size:1.5em;margin:.5em 0 .3em;padding-bottom:.2em;border-bottom:1px solid var(--border)}
#preview h3{font-size:1.25em;margin:.5em 0 .3em}
#preview h4{font-size:1.1em;margin:.5em 0 .3em}
#preview h5,#preview h6{font-size:1em;margin:.5em 0 .3em;color:var(--text-muted)}
#preview p{margin:.6em 0}
#preview a{color:var(--accent);text-decoration:none}
#preview a:hover{text-decoration:underline}
#preview strong{color:#fff}
#preview del{color:var(--text-muted)}
#preview blockquote{margin:.6em 0;padding:8px 16px;border-left:4px solid var(--accent);background:var(--surface);border-radius:0 6px 6px 0;color:var(--text-muted)}
#preview blockquote p{margin:.3em 0}
#preview code{font-family:'SF Mono',Monaco,'Fira Code',Consolas,monospace;font-size:.9em;padding:2px 6px;background:var(--code-bg);border-radius:4px;color:#e06c75}
#preview pre{margin:.8em 0;border-radius:8px;overflow:hidden;background:var(--code-bg);border:1px solid var(--border)}
#preview pre code{display:block;padding:16px;background:none;color:var(--text);font-size:.85em;line-height:1.6;overflow-x:auto}
#preview ul,#preview ol{margin:.6em 0;padding-left:2em}
#preview li{margin:.2em 0}
#preview table{width:100%;border-collapse:collapse;margin:.8em 0;font-size:.9em}
#preview th,#preview td{padding:8px 12px;border:1px solid var(--border);text-align:left}
#preview th{background:var(--surface);font-weight:600}
#preview tr:nth-child(even){background:rgba(255,255,255,.02)}
#preview img{max-width:100%;border-radius:6px;margin:.5em 0}
#preview hr{border:none;border-top:1px solid var(--border);margin:1.5em 0}
::-webkit-scrollbar{width:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
@media(max-width:768px){
.editor-wrap{flex-direction:column}
.pane+.pane{border-left:none;border-top:1px solid var(--border)}
.pane{flex:none;height:50%}
.toolbar h1{font-size:15px}
}
</style>
</head>
<body>
<div class="app">
<div class="toolbar">
<h1>&#10024; AI Markdown Preview</h1>
<div class="toolbar-actions">
<button class="btn btn-clear" onclick="clearEditor()">清空</button>
<button class="btn btn-export" onclick="exportHTML()">导出 HTML</button>
</div>
</div>
<div class="editor-wrap">
<div class="pane">
<div class="pane-header">编辑器</div>
<textarea id="editor" placeholder="在这里输入 Markdown..." spellcheck="false"></textarea>
</div>
<div class="pane">
<div class="pane-header">预览</div>
<div id="preview"></div>
</div>
</div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.1/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script>
const editor=document.getElementById('editor');
const preview=document.getElementById('preview');
marked.setOptions({breaks:true,gfm:true,highlight:function(code,lang){
if(lang&&hljs.getLanguage(lang))return hljs.highlight(code,{language:lang}).value;
return hljs.highlightAuto(code).value;
}});
function render(){preview.innerHTML=marked.parse(editor.value);}
editor.addEventListener('input',render);
function clearEditor(){editor.value='';render();}
function exportHTML(){
var h='<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Markdown Export</title>';
h+='<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">';
h+='<style>body{max-width:800px;margin:40px auto;padding:0 20px;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;background:#1a1a2e;color:#e0e0e0;line-height:1.7}';
h+='a{color:#e94560}pre{background:#0d1117;padding:16px;border-radius:8px;overflow-x:auto}code{font-family:SF Mono,Monaco,Consolas,monospace;font-size:.9em;background:#0d1117;padding:2px 6px;border-radius:4px;color:#e06c75}';
h+='pre code{background:none;padding:0;color:#e0e0e0}blockquote{border-left:4px solid #e94560;padding:8px 16px;margin:.6em 0;background:#16213e;color:#8892b0}';
h+='table{width:100%;border-collapse:collapse;margin:.8em 0}th,td{padding:8px 12px;border:1px solid #2a2a4a;text-align:left}th{background:#16213e}img{max-width:100%}hr{border:none;border-top:1px solid #2a2a4a;margin:1.5em 0}';
h+='</style></head><body>'+preview.innerHTML+'<script defer src="/_vercel/insights/script.js"></script>
<script defer src="/_vercel/speed-insights/script.js"></script>
</body></html>';
var b=new Blob([h],{type:'text/html'});
var a=document.createElement('a');
a.href=URL.createObjectURL(b);
a.download='markdown-export.html';
a.click();
URL.revokeObjectURL(a.href);
}
</script>
<script>
var defaultMd="# \ud83d\ude80 AI Markdown Preview\n\n\u4e00\u4e2a\u7b80\u6d01\u4f18\u96c5\u7684 Markdown \u5b9e\u65f6\u9884\u89c8\u5de5\u5177\u3002\n\n## \u529f\u80fd\u7279\u6027\n\n- \u2705 **\u5b9e\u65f6\u9884\u89c8** \u2014 \u5de6\u8fb9\u7f16\u8f91\uff0c\u53f3\u8fb9\u5373\u65f6\u6e32\u67d3\n- \u2705 *\u659c\u4f53\u6587\u672c* \u548c ~~\u5220\u9664\u7ebf~~\n- \u2705 \u4ee3\u7801\u8bed\u6cd5\u9ad8\u4eae\n- \u2705 \u5bfc\u51fa HTML \u6587\u4ef6\n- \u2705 \u6697\u8272\u4e3b\u9898\uff0c\u62a4\u773c\u8212\u9002\n\n## \u4ee3\u7801\u793a\u4f8b\n\n\u884c\u5185\u4ee3\u7801\uff1a`console.log('Hello!')`\n\n```javascript\n// JavaScript \u793a\u4f8b\nfunction fibonacci(n) {\n  if (n <= 1) return n;\n  return fibonacci(n - 1) + fibonacci(n - 2);\n}\nconsole.log(fibonacci(10)); // 55\n```\n\n```python\n# Python \u793a\u4f8b\ndef quicksort(arr):\n    if len(arr) <= 1:\n        return arr\n    pivot = arr[len(arr) // 2]\n    left = [x for x in arr if x < pivot]\n    middle = [x for x in arr if x == pivot]\n    right = [x for x in arr if x > pivot]\n    return quicksort(left) + middle + quicksort(right)\n```\n\n## \u8868\u683c\n\n| \u529f\u80fd | \u72b6\u6001 | \u8bf4\u660e |\n|------|------|------|\n| Markdown \u89e3\u6790 | \u2705 | \u4f7f\u7528 marked.js |\n| \u8bed\u6cd5\u9ad8\u4eae | \u2705 | \u4f7f\u7528 highlight.js |\n| \u5bfc\u51fa HTML | \u2705 | \u4e00\u952e\u4e0b\u8f7d |\n| \u54cd\u5e94\u5f0f | \u2705 | \u79fb\u52a8\u7aef\u53cb\u597d |\n\n## \u5f15\u7528\n\n> \u201cThe best way to predict the future is to invent it.\u201d\n> \u2014 Alan Kay\n\n## \u5217\u8868\n\n### \u6709\u5e8f\u5217\u8868\n1. \u7b2c\u4e00\u6b65\uff1a\u6253\u5f00\u7f16\u8f91\u5668\n2. \u7b2c\u4e8c\u6b65\uff1a\u8f93\u5165 Markdown\n3. \u7b2c\u4e09\u6b65\uff1a\u5b9e\u65f6\u67e5\u770b\u9884\u89c8\n\n### \u65e0\u5e8f\u5217\u8868\n- \u9879\u76ee\u4e00\n  - \u5b50\u9879\u76ee A\n  - \u5b50\u9879\u76ee B\n- \u9879\u76ee\u4e8c\n- \u9879\u76ee\u4e09\n\n## \u56fe\u7247\n\n![Placeholder](https://via.placeholder.com/600x200/1a1a2e/e94560?text=AI+Markdown+Preview)\n\n## \u6c34\u5e73\u7ebf\n\n---\n\n### \u6807\u9898\u5c42\u7ea7\u6f14\u793a\n\n# H1 \u6807\u9898\n## H2 \u6807\u9898\n### H3 \u6807\u9898\n#### H4 \u6807\u9898\n##### H5 \u6807\u9898\n###### H6 \u6807\u9898\n\n---\n\n\u2728 *\u5f00\u59cb\u7f16\u8f91\u5427\uff01\u5c06\u5de6\u4fa7\u5185\u5bb9\u66ff\u6362\u4e3a\u4f60\u81ea\u5df1\u7684 Markdown \u6587\u672c\u3002*";
editor.value=defaultMd;
render();
</script>
