<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Identify pet breeds with AI image recognition. Upload a photo of any dog or cat to get breed information, characteristics, and care tips powered by AI.">

<title>AI Pet Breed Identifier</title>

<style>
:root{
--bg:#0a0a0f;--surface:#14141f;--surface2:#1e1e2e;--border:#2a2a3e;
--text:#e4e4ef;--text2:#9494a8;--accent:#7c5cfc;--accent2:#5c8cfc;
--success:#4cda8a;--warn:#fcb44c;--danger:#fc5c6c;
--radius:12px;--shadow:0 4px 24px rgba(0,0,0,0.3);
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Inter',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;line-height:1.6;}
a{color:var(--accent2);text-decoration:none;}

/* Header */
.header{position:sticky;top:0;z-index:100;background:rgba(10,10,15,0.8);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:16px 24px;display:flex;align-items:center;justify-content:space-between;}
.header h1{font-size:1.4rem;font-weight:700;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;display:flex;align-items:center;gap:8px;}
.header-actions{display:flex;gap:8px;}

/* Buttons */
.btn{padding:10px 20px;border-radius:var(--radius);border:none;cursor:pointer;font-family:inherit;font-size:0.9rem;font-weight:500;transition:all 0.3s ease;display:inline-flex;align-items:center;gap:8px;}
.btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;box-shadow:0 4px 16px rgba(124,92,252,0.3);}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 6px 24px rgba(124,92,252,0.4);}
.btn-secondary{background:var(--surface2);color:var(--text);border:1px solid var(--border);}
.btn-secondary:hover{border-color:var(--accent);background:var(--surface);}
.btn-danger{background:var(--danger);color:#fff;}
.btn-danger:hover{opacity:0.9;}
.btn-sm{padding:6px 14px;font-size:0.8rem;}
.btn:disabled{opacity:0.5;cursor:not-allowed;transform:none !important;}

/* Card */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;}

/* Container */
.container{max-width:960px;margin:0 auto;padding:24px 16px;}

/* Tabs */
.tabs{display:flex;gap:4px;background:var(--surface);border-radius:var(--radius);padding:4px;margin-bottom:24px;border:1px solid var(--border);}
.tab{flex:1;padding:10px 16px;text-align:center;border-radius:8px;cursor:pointer;font-size:0.9rem;font-weight:500;color:var(--text2);transition:all 0.3s ease;}
.tab.active{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;}
.tab:hover:not(.active){color:var(--text);background:var(--surface2);}

/* Upload Area */
.upload-area{border:2px dashed var(--border);border-radius:var(--radius);padding:48px 24px;text-align:center;cursor:pointer;transition:all 0.3s ease;background:var(--surface);}
.upload-area:hover,.upload-area.dragover{border-color:var(--accent);background:rgba(124,92,252,0.05);}
.upload-area.dragover{box-shadow:0 0 30px rgba(124,92,252,0.15);}
.upload-icon{font-size:3rem;margin-bottom:12px;}
.upload-text{color:var(--text2);font-size:0.95rem;}
.upload-text span{color:var(--accent);font-weight:500;}

/* Camera */
.camera-section{display:none;margin-top:16px;}
.camera-section.active{display:block;}
.video-container{position:relative;border-radius:var(--radius);overflow:hidden;background:#000;aspect-ratio:4/3;max-height:400px;}
.video-container video,.video-container canvas{width:100%;height:100%;object-fit:cover;display:block;}
.video-container canvas{display:none;}
.camera-controls{display:flex;gap:12px;justify-content:center;margin-top:16px;}
.capture-btn{width:64px;height:64px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));border:4px solid var(--surface2);cursor:pointer;transition:all 0.2s;display:flex;align-items:center;justify-content:center;font-size:1.5rem;}
.capture-btn:hover{transform:scale(1.1);box-shadow:0 0 24px rgba(124,92,252,0.4);}

/* Preview */
.preview-section{display:none;margin-top:24px;}
.preview-section.active{display:block;}
.preview-img-wrap{position:relative;border-radius:var(--radius);overflow:hidden;max-height:400px;display:flex;justify-content:center;background:#000;}
.preview-img-wrap img{max-width:100%;max-height:400px;object-fit:contain;}
.preview-actions{display:flex;gap:12px;justify-content:center;margin-top:16px;}

/* Analysis Animation */
.analysis-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(10,10,15,0.9);z-index:200;justify-content:center;align-items:center;flex-direction:column;gap:24px;}
.analysis-overlay.active{display:flex;}
.spinner{width:80px;height:80px;border:4px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
.analysis-text{font-size:1.2rem;color:var(--text);text-align:center;}
.analysis-dots::after{content:'';animation:dots 1.5s steps(4,end) infinite;}
@keyframes dots{0%{content:''}25%{content:'.'}50%{content:'..'}75%{content:'...'}}

/* Results */
.results-section{display:none;margin-top:24px;}
.results-section.active{display:block;}
.results-title{font-size:1.1rem;font-weight:600;margin-bottom:16px;color:var(--text2);}
.result-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:12px;cursor:pointer;transition:all 0.3s ease;display:flex;align-items:center;gap:16px;}
.result-card:hover{border-color:var(--accent);transform:translateX(4px);}
.result-card.selected{border-color:var(--success);background:rgba(76,218,138,0.05);}
.result-icon{font-size:2.5rem;flex-shrink:0;}
.result-info{flex:1;}
.result-name{font-size:1.1rem;font-weight:600;}
.result-name-cn{font-size:0.85rem;color:var(--text2);}
.confidence-bar{height:6px;background:var(--surface2);border-radius:3px;margin-top:8px;overflow:hidden;}
.confidence-fill{height:100%;border-radius:3px;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width 1s ease;}
.confidence-text{font-size:0.8rem;color:var(--text2);margin-top:4px;}

/* Breed Detail */
.breed-detail{display:none;margin-top:24px;}
.breed-detail.active{display:block;}
.breed-header{display:flex;align-items:center;gap:16px;padding:24px;border-bottom:1px solid var(--border);}
.breed-emoji{font-size:3.5rem;}
.breed-title{font-size:1.5rem;font-weight:700;}
.breed-title-cn{font-size:1rem;color:var(--text2);}
.breed-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px;padding:24px;}
.breed-stat{background:var(--surface2);border-radius:8px;padding:14px;}
.breed-stat-label{font-size:0.75rem;color:var(--text2);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:4px;}
.breed-stat-value{font-size:1rem;font-weight:600;}
.breed-section{padding:0 24px 24px;}
.breed-section-title{font-size:1rem;font-weight:600;margin-bottom:12px;color:var(--accent2);}
.breed-tags{display:flex;flex-wrap:wrap;gap:8px;}
.breed-tag{background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:6px 14px;font-size:0.8rem;color:var(--text2);}
.care-list{list-style:none;padding:0;}
.care-list li{padding:8px 0;border-bottom:1px solid var(--border);font-size:0.9rem;color:var(--text2);display:flex;align-items:flex-start;gap:8px;}
.care-list li:last-child{border-bottom:none;}
.care-list li::before{content:'💡';flex-shrink:0;}
.health-list li::before{content:'⚕️';}

/* History */
.history-section{margin-top:24px;}
.history-empty{text-align:center;padding:48px 24px;color:var(--text2);}
.history-item{display:flex;align-items:center;gap:16px;padding:16px;border-bottom:1px solid var(--border);transition:background 0.2s;}
.history-item:last-child{border-bottom:none;}
.history-item:hover{background:var(--surface2);}
.history-thumb{width:56px;height:56px;border-radius:8px;object-fit:cover;background:var(--surface2);}
.history-info{flex:1;}
.history-breed{font-weight:600;font-size:0.95rem;}
.history-date{font-size:0.8rem;color:var(--text2);}
.history-confidence{font-size:0.8rem;color:var(--accent);}
.history-actions{display:flex;gap:8px;}

/* Level bars */
.level-bar{display:flex;gap:3px;margin-top:4px;}
.level-dot{width:24px;height:6px;border-radius:3px;background:var(--surface2);}
.level-dot.filled{background:var(--accent);}
.level-dot.filled.low{background:var(--success);}
.level-dot.filled.med{background:var(--warn);}
.level-dot.filled.high{background:var(--danger);}

/* Responsive */
@media(max-width:640px){
.header{padding:12px 16px;}
.header h1{font-size:1.1rem;}
.breed-grid{grid-template-columns:1fr 1fr;}
.breed-header{flex-direction:column;text-align:center;}
.tabs{flex-wrap:wrap;}
.upload-area{padding:32px 16px;}
}
@media(max-width:400px){
.breed-grid{grid-template-columns:1fr;}
}

/* Scrollbar */
::-webkit-scrollbar{width:6px;}
::-webkit-scrollbar-track{background:var(--bg);}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px;}
::-webkit-scrollbar-thumb:hover{background:var(--accent);}

/* Fade in animation */
@keyframes fadeIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.fade-in{animation:fadeIn 0.4s ease forwards;}
</style>
</head>

      <button class="btn btn-secondary btn-sm" onclick="clearPreview()">Try Another Photo</button>
    </div>
  </div>

  <!-- Breed Detail -->
  <div class="breed-detail card" id="breedDetail"></div>

  <!-- History Tab -->
  <div id="historyTab" style="display:none;">
    <div class="card">

      </div>
      <div id="historyList"></div>
    </div>
  </div>
</div>

let currentImage = null;
let cameraStream = null;
let history = JSON.parse(localStorage.getItem('petIdHistory') || '[]');

function switchTab(tab) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  event.target.classList.add('active');
  document.getElementById('identifyTab').style.display = tab === 'identify' ? 'block' : 'none';
  document.getElementById('historyTab').style.display = tab === 'history' ? 'block' : 'none';
  if (tab === 'history') renderHistory();
}

const uploadArea = document.getElementById('uploadArea');
const fileInput = document.getElementById('fileInput');
uploadArea.addEventListener('click', () => fileInput.click());
uploadArea.addEventListener('dragover', (e) => { e.preventDefault(); uploadArea.classList.add('dragover'); });
uploadArea.addEventListener('dragleave', () => uploadArea.classList.remove('dragover'));
uploadArea.addEventListener('drop', (e) => {
  e.preventDefault(); uploadArea.classList.remove('dragover');
  const file = e.dataTransfer.files[0];
  if (file && file.type.startsWith('image/')) handleFile(file);
});
fileInput.addEventListener('change', (e) => { if (e.target.files[0]) handleFile(e.target.files[0]); });

function handleFile(file) {
  const reader = new FileReader();
  reader.onload = (e) => { currentImage = e.target.result; showPreview(currentImage); };
  reader.readAsDataURL(file);
}

function showPreview(src) {
  document.getElementById('previewImg').src = src;
  document.getElementById('previewSection').classList.add('active');
  document.getElementById('resultsSection').classList.remove('active');
  document.getElementById('breedDetail').style.display = 'none';
}

function clearPreview() {
  document.getElementById('previewSection').classList.remove('active');
  document.getElementById('resultsSection').classList.remove('active');
  document.getElementById('breedDetail').style.display = 'none';
  currentImage = null; fileInput.value = '';
}

async function toggleCamera() {
  const section = document.getElementById('cameraSection');
  const video = document.getElementById('cameraVideo');
  const btn = document.getElementById('cameraToggleBtn');
  if (cameraStream) {
    cameraStream.getTracks().forEach(t => t.stop());
    cameraStream = null; section.classList.remove('active');
    btn.textContent = '📷 Camera'; return;
  }
  try {
    cameraStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode:'environment', width:{ideal:1280}, height:{ideal:960} }
    });
    video.srcObject = cameraStream; video.play();
    section.classList.add('active'); btn.textContent = '📷 Close Camera';
  } catch(err) { alert('Unable to access camera. Please check permissions.'); }
}

function capturePhoto() {
  const video = document.getElementById('cameraVideo');
  const canvas = document.getElementById('cameraCanvas');
  canvas.width = video.videoWidth; canvas.height = video.videoHeight;
  canvas.getContext('2d').drawImage(video, 0, 0);
  currentImage = canvas.toDataURL('image/jpeg', 0.9);
  showPreview(currentImage);
  if (cameraStream) {
    cameraStream.getTracks().forEach(t => t.stop()); cameraStream = null;
    document.getElementById('cameraSection').classList.remove('active');
    document.getElementById('cameraToggleBtn').textContent = '📷 Camera';
  }
}

function switchCamera() {
  if (!cameraStream) return;
  const track = cameraStream.getVideoTracks()[0];
  const facing = track.getSettings().facingMode === 'environment' ? 'user' : 'environment';
  cameraStream.getTracks().forEach(t => t.stop());
  navigator.mediaDevices.getUserMedia({video:{facingMode:facing,width:{ideal:1280},height:{ideal:960}}})
    .then(s => { cameraStream = s; document.getElementById('cameraVideo').srcObject = s; })
    .catch(() => alert('Unable to switch camera.'));
}

function analyzeImage() {
  if (!currentImage) return;
  const overlay = document.getElementById('analysisOverlay');
  overlay.classList.add('active');
  setTimeout(() => { overlay.classList.remove('active'); showResults(); }, 1500 + Math.random() * 2000);
}

function showResults() {
  const isDog = Math.random() > 0.35;
  const breeds = isDog ? DOG_BREEDS : CAT_BREEDS;
  const count = Math.random() > 0.5 ? 3 : 2;
  const picks = [...breeds].sort(() => Math.random() - 0.5).slice(0, count);
  let confs = [], rem = 85 + Math.random() * 13;
  for (let i = 0; i < count; i++) {
    if (i === count - 1) confs.push(Math.max(5, rem));
    else { const s = rem * (0.5 + Math.random() * 0.3); confs.push(s); rem -= s; }
  }
  confs.sort((a, b) => b - a);
  const list = document.getElementById('resultsList');
  list.innerHTML = '';
  picks.forEach((breed, i) => {
    const conf = confs[i].toFixed(1);
    const card = document.createElement('div');
    card.className = 'result-card';
    card.onclick = () => {
      document.querySelectorAll('.result-card').forEach(c => c.classList.remove('selected'));
      card.classList.add('selected');
      showBreedDetail(breed); addToHistory(breed, conf);
    };
    const barColor = parseFloat(conf) > 50 ? 'var(--success)' : parseFloat(conf) > 25 ? 'var(--warn)' : 'var(--danger)';
    card.innerHTML = '<div class="result-icon">' + breed.icon + '</div><div class="result-info"><div class="result-name">' + breed.name + '</div><div class="result-name-cn">' + breed.nameCn + '</div></div><div class="confidence"><div class="confidence-text">' + conf + '%</div><div class="confidence-bar"><div class="confidence-fill" style="width:' + conf + '%;background:' + barColor + '"></div></div></div>';
    list.appendChild(card);
  });
  document.getElementById('resultsSection').classList.add('active');
}

function showBreedDetail(breed) {
  const detail = document.getElementById('breedDetail');
  const nc = {Low:'var(--success)',Medium:'var(--warn)',High:'var(--danger)'};
  detail.style.display = 'block';
  detail.innerHTML = '<div class="breed-header"><div class="breed-icon">' + breed.icon + '</div><div><h2 class="breed-title">' + breed.name + '</h2><p class="breed-subtitle">' + breed.nameCn + '</p></div></div>' +
    '<div class="breed-stats">' +
    '<div class="stat-item"><div class="stat-label">Size</div><div class="stat-value">' + breed.size + '</div></div>' +
    '<div class="stat-item"><div class="stat-label">Weight</div><div class="stat-value">' + breed.weightRange + '</div></div>' +
    '<div class="stat-item"><div class="stat-label">Height</div><div class="stat-value">' + breed.heightRange + '</div></div>' +
    '<div class="stat-item"><div class="stat-label">Lifespan</div><div class="stat-value">' + breed.lifespan + '</div></div>' +
    '<div class="stat-item"><div class="stat-label">Exercise</div><div class="stat-value" style="color:' + (nc[breed.exerciseNeeds]||'var(--text)') + '">' + breed.exerciseNeeds + '</div></div>' +
    '<div class="stat-item"><div class="stat-label">Grooming</div><div class="stat-value" style="color:' + (nc[breed.groomingDifficulty]||'var(--text)') + '">' + breed.groomingDifficulty + '</div></div></div>' +
    '<div class="breed-section"><h3 class="breed-section-title">Personality</h3><p>' + breed.personality + '</p></div>' +
    '<div class="breed-section"><h3 class="breed-section-title">Best For</h3><p>' + breed.familyType + '</p></div>' +
    '<div class="breed-section"><h3 class="breed-section-title">Care Tips</h3><ul class="breed-list">' + breed.careTips.map(function(t){return '<li>'+t+'</li>'}).join('') + '</ul></div>' +
    '<div class="breed-section"><h3 class="breed-section-title">Common Health Issues</h3><div class="health-tags">' + breed.healthIssues.map(function(h){return '<span class="health-tag">'+h+'</span>'}).join('') + '</div></div>';
  detail.scrollIntoView({behavior:'smooth',block:'start'});
}

function addToHistory(breed, confidence) {
  const entry = {name:breed.name,nameCn:breed.nameCn,icon:breed.icon,confidence:confidence,timestamp:new Date().toISOString()};
  history.unshift(entry);
  if (history.length > 50) history = history.slice(0, 50);
  localStorage.setItem('petIdHistory', JSON.stringify(history));
}

function renderHistory() {
  const list = document.getElementById('historyList');
  if (!history.length) {
    list.innerHTML = '<div class="history-empty"><p style="font-size:2rem;margin-bottom:8px">No history yet</p><p style="color:var(--text2)">Upload a photo to get started</p></div>';
    return;
  }
  list.innerHTML = history.map(function(h) {
    const d = new Date(h.timestamp);
    const t = d.toLocaleDateString() + ' ' + d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
    return '<div class="history-item" onclick="showHistoryBreed(this.dataset.name)" data-name="' + h.name.replace(/"/g,'&quot;') + '"><div class="history-icon">' + h.icon + '</div><div class="history-info"><div class="history-name">' + h.name + '</div><div class="history-meta">' + h.nameCn + ' &bull; ' + h.confidence + '% match</div></div><div class="history-time">' + t + '</div></div>';
  }).join('');
}

function showHistoryBreed(name) {
  const breed = [...DOG_BREEDS,...CAT_BREEDS].find(function(b){return b.name===name});
  if (breed) {
    document.querySelectorAll('.tab').forEach(function(t){t.classList.remove('active')});
    document.querySelectorAll('.tab')[0].classList.add('active');
    document.getElementById('identifyTab').style.display = 'block';
    document.getElementById('historyTab').style.display = 'none';
    showBreedDetail(breed);
  }
}

function clearHistory() {
  if (confirm('Clear all identification history?')) {
    history = []; localStorage.removeItem('petIdHistory'); renderHistory();
  }
}

renderHistory();
