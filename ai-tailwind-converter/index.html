*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0f172a;--surface:#1e293b;--surface2:#334155;--border:#475569;--text:#f1f5f9;--text2:#94a3b8;--accent:#3b82f6;--accent2:#60a5fa;--green:#10b981;--red:#ef4444;--purple:#a78bfa;--yellow:#fbbf24}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column}
header{background:var(--surface);border-bottom:1px solid var(--border);padding:16px 24px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}
.logo{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:700}
.logo svg{width:32px;height:32px}
.mode-toggle{display:flex;align-items:center;gap:8px;background:var(--surface2);border-radius:8px;padding:4px}
.mode-btn{padding:8px 16px;border:none;border-radius:6px;cursor:pointer;font-size:14px;font-weight:600;color:var(--text2);background:transparent;transition:all .2s}
.mode-btn.active{background:var(--accent);color:#fff}
.main-container{display:flex;flex:1;gap:0;overflow:hidden}
.panel{flex:1;display:flex;flex-direction:column;border-right:1px solid var(--border)}
.panel:last-child{border-right:none}
.panel-header{padding:12px 16px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.panel-title{font-size:14px;font-weight:600;color:var(--text2)}
.btn{padding:6px 14px;border:none;border-radius:6px;cursor:pointer;font-size:13px;font-weight:500;transition:all .2s;display:inline-flex;align-items:center;gap:6px}
.btn-copy{background:var(--accent);color:#fff}
.btn-copy:hover{background:var(--accent2)}
.btn-clear{background:var(--surface2);color:var(--text2)}
.btn-clear:hover{background:var(--border);color:var(--text)}
.btn-copied{background:var(--green) !important}
textarea{flex:1;width:100%;padding:16px;background:var(--bg);color:var(--text);border:none;resize:none;font-family:'SF Mono',Monaco,'Cascadia Code','Fira Code',monospace;font-size:14px;line-height:1.6;outline:none}
textarea::placeholder{color:var(--surface2)}
.output-area{flex:1;padding:16px;background:var(--bg);overflow-y:auto;font-family:'SF Mono',Monaco,'Cascadia Code','Fira Code',monospace;font-size:14px;line-height:1.6;white-space:pre-wrap;word-break:break-all}
.ref-panel{width:320px;min-width:280px;background:var(--surface);border-left:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
.ref-header{padding:12px 16px;border-bottom:1px solid var(--border);font-size:14px;font-weight:600;color:var(--text2)}
.ref-search{width:100%;padding:8px 12px;background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:13px;outline:none;margin:8px 12px;width:calc(100% - 24px)}
.ref-search:focus{border-color:var(--accent)}
.ref-body{flex:1;overflow-y:auto;padding:8px 12px}
.ref-category{margin-bottom:12px}
.ref-cat-title{font-size:12px;font-weight:700;color:var(--accent2);text-transform:uppercase;letter-spacing:.5px;padding:4px 0;cursor:pointer;display:flex;align-items:center;gap:6px}
.ref-cat-title::before{content:'▸';transition:transform .2s}
.ref-cat-title.open::before{transform:rotate(90deg)}
.ref-items{display:none;padding:4px 0}
.ref-items.open{display:block}
.ref-item{display:flex;justify-content:space-between;padding:3px 6px;border-radius:4px;font-size:12px;cursor:pointer;transition:background .15s}
.ref-item:hover{background:var(--surface2)}
.ref-item .cls{color:var(--green);font-family:monospace}
.ref-item .css{color:var(--text2);font-family:monospace;font-size:11px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(100px);background:var(--green);color:#fff;padding:10px 24px;border-radius:8px;font-size:14px;font-weight:500;transition:transform .3s ease;z-index:999;pointer-events:none}
.toast.show{transform:translateX(-50%) translateY(0)}
footer{text-align:center;padding:12px;color:var(--text2);font-size:12px;border-top:1px solid var(--border);background:var(--surface)}
@media(max-width:900px){
.main-container{flex-direction:column}
.panel{border-right:none;border-bottom:1px solid var(--border);min-height:200px}
.ref-panel{width:100%;min-width:auto;max-height:300px;border-left:none;border-top:1px solid var(--border)}
}
@media(max-width:600px){
header{padding:12px 16px}
.logo{font-size:16px}
.mode-btn{padding:6px 10px;font-size:12px}
}
.highlight-prop{color:var(--purple)}
.highlight-val{color:var(--yellow)}
.highlight-class{color:var(--green)}
.highlight-comment{color:var(--text2)}

let currentMode = 'css2tw';

function setMode(mode) {
  currentMode = mode;
  document.getElementById('btnCssToTw').classList.toggle('active', mode === 'css2tw');
  document.getElementById('btnTwToCss').classList.toggle('active', mode === 'tw2css');
  document.getElementById('inputTitle').textContent = mode === 'css2tw' ? 'CSS Input' : 'Tailwind Input';
  document.getElementById('outputTitle').textContent = mode === 'css2tw' ? 'Tailwind Classes' : 'CSS Output';
  const ta = document.getElementById('inputArea');
  ta.placeholder = mode === 'css2tw'
    ? 'Paste your CSS here...\nExample:\ndisplay: flex;\npadding: 16px;\nmargin: 8px;\nbackground-color: #3b82f6;\nfont-size: 14px;\nborder-radius: 8px;'
    : 'Paste Tailwind classes here...\nExample:\nflex p-4 m-2 bg-blue-500 text-sm rounded-lg';
  ta.value = '';
  document.getElementById('outputArea').textContent = 'Converted result will appear here...';
}

function normalizeValue(v) {
  return v.replace(/\s+/g, ' ').trim().toLowerCase();
}

  const v = val.toLowerCase().trim();

  if (v.startsWith('rgb')) {
    const nums = v.match(/[\d.]+/g);
    if (nums && nums.length >= 3) {
      const hex = '#' + [nums[0],nums[1],nums[2]].map(n => {
        const h = parseInt(n).toString(16);
        return h.length === 1 ? '0'+h : h;
      }).join('');
      if (colorMap[hex]) return prefix + '-' + colorMap[hex];
    }
  }
  return null;
}

function convertSpacing(prop, val) {
  const prefixMap = {
    'padding': 'p', 'padding-top': 'pt', 'padding-right': 'pr',
    'padding-bottom': 'pb', 'padding-left': 'pl',
    'padding-inline': 'px', 'padding-block': 'py',
    'margin': 'm', 'margin-top': 'mt', 'margin-right': 'mr',
    'margin-bottom': 'mb', 'margin-left': 'ml',
    'margin-inline': 'mx', 'margin-block': 'my',
    'top': 'top', 'right': 'right', 'bottom': 'bottom', 'left': 'left',
    'inset': 'inset',
  };
  const prefix = prefixMap[prop];
  if (!prefix) return null;
  const v = val.trim();
  // Handle negative values
  const isNeg = v.startsWith('-');
  const absVal = isNeg ? v.slice(1) : v;
  if (spacingMap[absVal]) {
    const tw = spacingMap[absVal];
    return (isNeg ? '-' : '') + prefix + '-' + tw;
  }
  // Handle shorthand (e.g., padding: 8px 16px)
  if ((prop === 'padding' || prop === 'margin') && v.includes(' ')) {
    const parts = v.split(/\s+/);
    const p = prop === 'padding' ? 'p' : 'm';
    if (parts.length === 2) {
      const y = spacingMap[parts[0]], x = spacingMap[parts[1]];
      if (y && x) return p + 'y-' + y + ' ' + p + 'x-' + x;
    }
    if (parts.length === 4) {
      const t = spacingMap[parts[0]], r = spacingMap[parts[1]],
            b = spacingMap[parts[2]], l = spacingMap[parts[3]];
      const results = [];
      if (t) results.push(p + 't-' + t);
      if (r) results.push(p + 'r-' + r);
      if (b) results.push(p + 'b-' + b);
      if (l) results.push(p + 'l-' + l);
      if (results.length) return results.join(' ');
    }
  }
  return null;
}

function convertSize(prop, val) {
  const prefixMap = {
    'width': 'w', 'height': 'h', 'min-width': 'min-w', 'min-height': 'min-h',
    'max-width': 'max-w', 'max-height': 'max-h',
  };
  const prefix = prefixMap[prop];
  if (!prefix) return null;
  const v = val.trim();
  if (sizeMap[v]) return prefix + '-' + sizeMap[v];
  // Common max-width values
  if (prop === 'max-width') {
    const mwMap = {'640px':'max-w-sm','768px':'max-w-md','1024px':'max-w-lg',
      '1280px':'max-w-xl','1536px':'max-w-2xl','none':'max-w-none'};
    if (mwMap[v]) return mwMap[v];
  }
  return null;
}

function cssPropToTailwind(prop, val) {
  prop = prop.trim().toLowerCase();
  val = normalizeValue(val);
  // Direct lookup
  const key = prop + ':' + val;
  if (cssToTwMap[key]) return cssToTwMap[key];
  // Spacing
  const spacing = convertSpacing(prop, val);
  if (spacing) return spacing;
  // Size
  const size = convertSize(prop, val);
  if (size) return size;
  // Border radius
  if (prop === 'border-radius') {
    if (borderRadiusMap[val]) return borderRadiusMap[val];
  }
  // Opacity
  if (prop === 'opacity') {
    if (opacityMap[val]) return opacityMap[val];
  }
  // Colors
  if (prop === 'color') {
    const c = lookupColor(val, 'text');
    if (c) return c;
  }
  if (prop === 'background-color' || prop === 'background') {
    const c = lookupColor(val, 'bg');
    if (c) return c;
  }
  if (prop === 'border-color') {
    const c = lookupColor(val, 'border');
    if (c) return c;
  }
  // Border width
  if (prop === 'border-width' || prop === 'border') {
    const bwMap = {'0px':'border-0','1px':'border','2px':'border-2','4px':'border-4','8px':'border-8'};
    if (bwMap[val]) return bwMap[val];
  }
  // Box shadow
  if (prop === 'box-shadow') {
    if (shadowMap[val]) return shadowMap[val];
    if (val === 'none') return 'shadow-none';
  }
  // Z-index
  if (prop === 'z-index') {
    const zMap = {'0':'z-0','10':'z-10','20':'z-20','30':'z-30','40':'z-40','50':'z-50','auto':'z-auto'};
    if (zMap[val]) return zMap[val];
  }
  // Line height
  if (prop === 'line-height') {
    const lhMap = {'1':'leading-none','1.25':'leading-tight','1.375':'leading-snug',
      '1.5':'leading-normal','1.625':'leading-relaxed','2':'leading-loose'};
    if (lhMap[val]) return lhMap[val];
  }
  // Letter spacing
  if (prop === 'letter-spacing') {
    const lsMap = {'-0.05em':'tracking-tighter','-0.025em':'tracking-tight','0em':'tracking-normal',
      '0.025em':'tracking-wide','0.05em':'tracking-wider','0.1em':'tracking-widest'};
    if (lsMap[val]) return lsMap[val];
  }
  // Transition
  if (prop === 'transition-property') {
    if (val.includes('all')) return 'transition-all';
    if (val.includes('color') || val.includes('background')) return 'transition-colors';
    if (val.includes('opacity')) return 'transition-opacity';
    if (val.includes('shadow')) return 'transition-shadow';
    if (val.includes('transform')) return 'transition-transform';
    return 'transition';
  }
  if (prop === 'transition-duration') {
    const durMap = {'75ms':'duration-75','100ms':'duration-100','150ms':'duration-150',
      '200ms':'duration-200','300ms':'duration-300','500ms':'duration-500',
      '700ms':'duration-700','1000ms':'duration-1000'};
    if (durMap[val]) return durMap[val];
  }
  if (prop === 'transition-timing-function') {
    const easeMap = {'linear':'ease-linear','ease':'ease-in-out',
      'cubic-bezier(0.4, 0, 1, 1)':'ease-in','cubic-bezier(0, 0, 0.2, 1)':'ease-out',
      'cubic-bezier(0.4, 0, 0.2, 1)':'ease-in-out'};
    if (easeMap[val]) return easeMap[val];
  }
  // Object fit
  if (prop === 'object-fit') {
    return 'object-' + val;
  }
  // Object position
  if (prop === 'object-position') {
    return 'object-' + val.replace(' ', '-');
  }
  // Background size
  if (prop === 'background-size') {
    const bsMap = {'cover':'bg-cover','contain':'bg-contain','auto':'bg-auto'};
    if (bsMap[val]) return bsMap[val];
  }
  // Background position
  if (prop === 'background-position') {
    return 'bg-' + val.replace(' ', '-');
  }
  // Background repeat
  if (prop === 'background-repeat') {
    const brMap = {'repeat':'bg-repeat','no-repeat':'bg-no-repeat',
      'repeat-x':'bg-repeat-x','repeat-y':'bg-repeat-y','round':'bg-repeat-round'};
    if (brMap[val]) return brMap[val];
  }
  return null;
}

function cssToTailwind(input) {
  const lines = input.split('\n');
  const results = [];
  let currentSelector = '';
  for (const line of lines) {
    const trimmed = line.trim();
    if (!trimmed || trimmed === '}') continue;
    if (trimmed.endsWith('{')) {
      currentSelector = trimmed.replace('{','').trim();
      continue;
    }
    const match = trimmed.match(/^([a-z-]+)\s*:\s*(.+?)\s*;?$/i);
    if (match) {
      const [, prop, val] = match;
      const tw = cssPropToTailwind(prop, val);
      if (tw) {
        results.push(tw);
      } else {
        results.push('/* ' + prop + ': ' + val + ' (no match) */');
      }
    }
  }
  return results.join(' ');
}

// Build reverse map: Tailwind class -> CSS
const twToCssMap = {};
for (const [css, tw] of Object.entries(cssToTwMap)) {
  const [prop, val] = css.split(':');
  twToCssMap[tw] = prop + ': ' + val + ';';
}
// Add spacing classes
for (const [px, tw] of Object.entries(spacingMap)) {
  if (tw === 'auto' || tw === '0') continue;
  ['p','pt','pr','pb','pl','px','py','m','mt','mr','mb','ml','mx','my'].forEach(pre => {
    const propMap = {p:'padding',pt:'padding-top',pr:'padding-right',pb:'padding-bottom',
      pl:'padding-left',px:'padding-inline',py:'padding-block',
      m:'margin',mt:'margin-top',mr:'margin-right',mb:'margin-bottom',
      ml:'margin-left',mx:'margin-inline',my:'margin-block'};
    twToCssMap[pre+'-'+tw] = propMap[pre] + ': ' + px + ';';
  });
}
// Add size classes
for (const [px, tw] of Object.entries(sizeMap)) {
  ['w','h','min-w','min-h','max-w','max-h'].forEach(pre => {
    const propMap = {w:'width',h:'height','min-w':'min-width','min-h':'min-height','max-w':'max-width','max-h':'max-height'};
    twToCssMap[pre+'-'+tw] = propMap[pre] + ': ' + px + ';';
  });
}
// Add border-radius
for (const [px, tw] of Object.entries(borderRadiusMap)) {
  twToCssMap[tw] = 'border-radius: ' + px + ';';
}
// Add opacity
for (const [val, tw] of Object.entries(opacityMap)) {
  twToCssMap[tw] = 'opacity: ' + val + ';';
}
// Add color classes
for (const [hex, name] of Object.entries(colorMap)) {
  twToCssMap['text-'+name] = 'color: ' + hex + ';';
  twToCssMap['bg-'+name] = 'background-color: ' + hex + ';';
  twToCssMap['border-'+name] = 'border-color: ' + hex + ';';
}
// Add shadow
for (const [val, tw] of Object.entries(shadowMap)) {
  twToCssMap[tw] = 'box-shadow: ' + val + ';';
}

function tailwindToCss(input) {
  const classes = input.trim().split(/\s+/);
  const results = [];
  for (const cls of classes) {
    if (!cls) continue;
    if (twToCssMap[cls]) {
      results.push(twToCssMap[cls]);
    } else {
      results.push('/* ' + cls + ' (no match) */');
    }
  }
  return results.join('\n');
}

function convert() {
  const input = document.getElementById('inputArea').value;
  const output = document.getElementById('outputArea');
  if (!input.trim()) {
    output.textContent = 'Converted result will appear here...';
    return;
  }
  if (currentMode === 'css2tw') {
    output.textContent = cssToTailwind(input);
  } else {
    output.textContent = tailwindToCss(input);
  }
}

function copyOutput() {
  const text = document.getElementById('outputArea').textContent;
  if (!text || text === 'Converted result will appear here...') return;
  navigator.clipboard.writeText(text).then(() => {
    showToast('Copied to clipboard!');
    const btn = document.getElementById('copyBtn');
    btn.textContent = '\u2705 Copied!';
    btn.classList.add('btn-copied');
    setTimeout(() => { btn.textContent = '\ud83d\udccb Copy'; btn.classList.remove('btn-copied'); }, 2000);
  });
}

function clearInput() {
  document.getElementById('inputArea').value = '';
  document.getElementById('outputArea').textContent = 'Converted result will appear here...';
}

async function pasteInput() {
  try {
    const text = await navigator.clipboard.readText();
    document.getElementById('inputArea').value = text;
    convert();
  } catch(e) {
    showToast('Paste not available - type or drag text instead');
  }
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

function renderRefPanel() {
  const body = document.getElementById('refBody');
  body.innerHTML = '';
  for (const [cat, items] of Object.entries(refData)) {
    const div = document.createElement('div');
    div.className = 'ref-category';
    const title = document.createElement('div');
    title.className = 'ref-cat-title';
    title.textContent = cat;
    title.onclick = function() {
      this.classList.toggle('open');
      this.nextElementSibling.classList.toggle('open');
    };
    div.appendChild(title);
    const itemsDiv = document.createElement('div');
    itemsDiv.className = 'ref-items';
    for (const [cls, css] of Object.entries(items)) {
      const item = document.createElement('div');
      item.className = 'ref-item';
      item.innerHTML = '<span class="cls">' + cls + '</span><span class="css">' + css + '</span>';
      item.onclick = function() {
        navigator.clipboard.writeText(cls);
        showToast('Copied: ' + cls);
      };
      itemsDiv.appendChild(item);
    }
    div.appendChild(itemsDiv);
    body.appendChild(div);
  }
}

function filterRef() {
  const q = document.getElementById('refSearch').value.toLowerCase();
  const cats = document.querySelectorAll('.ref-category');
  cats.forEach(cat => {
    const items = cat.querySelectorAll('.ref-item');
    let hasVisible = false;
    items.forEach(item => {
      const text = item.textContent.toLowerCase();
      const show = !q || text.includes(q);
      item.style.display = show ? '' : 'none';
      if (show) hasVisible = true;
    });
    cat.style.display = hasVisible ? '' : 'none';
    if (q && hasVisible) {
      cat.querySelector('.ref-cat-title').classList.add('open');
      cat.querySelector('.ref-items').classList.add('open');
    }
  });
}
