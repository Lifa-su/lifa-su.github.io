<!DOCTYPE html>
<html lang="zh-CN">
<head>

    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Gradient Text Generator - CSS渐变文字效果生成器</title>
<meta name="description" content="Free online CSS gradient text generator with linear, radial, conic gradients and animations.">
<link rel="canonical" href="https://lifa-su.com/ai-gradient-text/">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#1a1a2e;--card:#16213e;--accent:#e94560;--text:#eee;--text2:#aaa;--r:14px}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:20px}
h1{text-align:center;font-size:clamp(1.5rem,4vw,2.2rem);margin:20px 0 10px;background:linear-gradient(135deg,#e94560,#533483,#0f3460);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.sub{text-align:center;color:var(--text2);margin-bottom:30px;font-size:.95rem}
.wrap{max-width:1100px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:24px}
@media(max-width:768px){.wrap{grid-template-columns:1fr}}
.card{background:var(--card);border-radius:var(--r);padding:24px;border:1px solid rgba(255,255,255,.06)}
.card h2{font-size:1.05rem;margin-bottom:16px;color:var(--accent)}
.pv{grid-column:1/-1;min-height:200px;display:flex;align-items:center;justify-content:center;overflow:hidden}
#pt{font-weight:900;text-align:center;word-break:break-word;padding:20px;line-height:1.2}
label{display:block;font-size:.85rem;color:var(--text2);margin:12px 0 6px}
label:first-child{margin-top:0}
textarea,select{width:100%;padding:10px 14px;border-radius:8px;border:1px solid rgba(255,255,255,.1);background:rgba(0,0,0,.3);color:var(--text);font-size:.95rem;outline:none}
textarea{resize:vertical;min-height:50px;font-family:inherit}
select option{background:var(--card)}
input[type=range]{width:100%;accent-color:var(--accent);height:6px;-webkit-appearance:none;background:rgba(255,255,255,.1);border-radius:3px;outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:var(--accent);cursor:pointer;border:2px solid #fff}
.rr{display:flex;align-items:center;gap:10px}
.rr input{flex:1}
.rv{min-width:42px;text-align:right;font-size:.85rem;color:var(--accent);font-weight:600}
.cl{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.ci{display:flex;align-items:center;gap:4px;background:rgba(0,0,0,.3);border-radius:8px;padding:4px 8px}
.ci input[type=color]{width:32px;height:32px;border:none;border-radius:6px;cursor:pointer;background:none;padding:0}
.ci input[type=color]::-webkit-color-swatch-wrapper{padding:2px}
.ci input[type=color]::-webkit-color-swatch{border-radius:4px;border:1px solid rgba(255,255,255,.2)}
.ci button{background:none;border:none;color:#e94560;cursor:pointer;font-size:1.1rem;padding:0 4px;opacity:.7}
.ci button:hover{opacity:1}
.btn{padding:10px 20px;border-radius:8px;border:none;cursor:pointer;font-size:.9rem;font-weight:600;transition:all .2s}
.ba{background:var(--accent);color:#fff}
.ba:hover{background:#d63851}
.bo{background:transparent;border:1px solid rgba(255,255,255,.2);color:var(--text2)}
.bo:hover{border-color:var(--accent);color:var(--accent)}
.bs{padding:6px 14px;font-size:.82rem}
.br{display:flex;gap:8px;flex-wrap:wrap}
.cb{position:relative;margin-top:12px}
.cb pre{background:rgba(0,0,0,.4);border-radius:10px;padding:16px;font-size:.8rem;line-height:1.6;overflow-x:auto;color:#7ec8e3;font-family:'SF Mono',Monaco,Consolas,monospace;white-space:pre-wrap;word-break:break-all;max-height:300px;overflow-y:auto}
.cp{position:absolute;top:8px;right:8px;background:var(--accent);color:#fff;border:none;border-radius:6px;padding:5px 12px;font-size:.78rem;cursor:pointer;opacity:.85}
.cp:hover{opacity:1}
.ps{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.ps span{padding:5px 12px;border-radius:20px;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.05);color:var(--text2);font-size:.8rem;cursor:pointer;transition:all .2s}
.ps span:hover{border-color:var(--accent);color:var(--accent)}
footer{text-align:center;color:var(--text2);font-size:.8rem;margin-top:40px;padding:20px 0}
@keyframes flowLR{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
@keyframes rainbow{0%{filter:hue-rotate(0deg)}100%{filter:hue-rotate(360deg)}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
@keyframes glow{0%,100%{text-shadow:0 0 10px rgba(233,69,96,.5)}50%{text-shadow:0 0 30px rgba(233,69,96,.8),0 0 60px rgba(83,52,131,.5)}}
</style>
</head>
<body>
<h1>&#127912; AI Gradient Text Generator</h1>
<p class="sub">CSS渐变文字效果生成器 — 实时预览，一键复制代码</p>
<div class="wrap">
  <div class="card pv"><div id="pt">Gradient Text</div></div>

  <div class="card">
    <h2>&#9999;&#65039; 文字与字体</h2>
    <label for="tx">自定义文字</label>
    <textarea id="tx" rows="2">Gradient Text</textarea>
    <label>字体大小</label>
    <div class="rr"><input type="range" id="fs" min="16" max="160" value="72"><span class="rv" id="fsv">72px</span></div>
  </div>

  <div class="card">
    <h2>&#127752; 渐变设置</h2>
    <label for="gt">渐变类型</label>
    <select id="gt">
      <option value="linear">线性渐变 (linear)</option>
      <option value="radial">径向渐变 (radial)</option>
      <option value="conic">锥形渐变 (conic)</option>
    </select>
    <label>渐变角度</label>
    <div class="rr"><input type="range" id="ga" min="0" max="360" value="135"><span class="rv" id="gav">135°</span></div>
    <label>颜色停靠点</label>
    <div class="cl" id="colors"></div>
    <div class="br">
      <button class="btn ba bs" onclick="addColor()">+ 添加颜色</button>
    </div>
    <label>预设方案</label>
    <div class="ps" id="presets"></div>
  </div>

  <div class="card">
    <h2>&#10024; 动画效果</h2>
    <label for="an">动画类型</label>
    <select id="an">
      <option value="none">无动画</option>
      <option value="flow">左右流动</option>
      <option value="rainbow">彩虹循环</option>
      <option value="blink">闪烁</option>
      <option value="pulse">脉冲</option>
      <option value="glow">发光</option>
    </select>
    <label>动画速度</label>
    <div class="rr"><input type="range" id="as" min="0.5" max="8" step="0.5" value="3"><span class="rv" id="asv">3s</span></div>
  </div>

  <div class="card" style="grid-column:1/-1">
    <h2>&#128196; CSS 代码</h2>
    <div class="cb">
      <button class="cp" onclick="copyCSS()">复制代码</button>
      <pre id="code"></pre>
    </div>
  </div>
</div>
<footer>AI Gradient Text Generator &copy; 2026 | Made with &#10084;&#65039;</footer>
<script>
const $ = id => document.getElementById(id);
let colors = ['#e94560','#533483','#0f3460'];
const presets = [
  {n:'日落',c:['#ff512f','#f09819','#ff5e62']},
  {n:'海洋',c:['#2193b0','#6dd5ed','#00b4db']},
  {n:'霓虹',c:['#ff00ff','#00ffff','#ff00ff']},
  {n:'森林',c:['#134e5e','#71b280','#2ecc71']},
  {n:'火焰',c:['#f12711','#f5af19','#e94560']},
  {n:'紫霞',c:['#7b2ff7','#c471f5','#fa71cd']},
  {n:'金属',c:['#bdc3c7','#2c3e50','#95a5a6']},
  {n:'彩虹',c:['#ff0000','#ff8800','#ffff00','#00ff00','#0088ff','#8800ff']}
];

function init(){
  renderColors();
  renderPresets();
  [$('tx'),$('fs'),$('gt'),$('ga'),$('an'),$('as')].forEach(el=>{
    el.addEventListener('input',update);
  });
  update();
}

function renderColors(){
  const box=$('colors');
  box.innerHTML='';
  colors.forEach((c,i)=>{
    const d=document.createElement('div');
    d.className='ci';
    d.innerHTML=`<input type="color" value="${c}" onchange="colors[${i}]=this.value;update()">`;
    if(colors.length>2){
      const b=document.createElement('button');
      b.textContent='\u00d7';
      b.onclick=()=>{colors.splice(i,1);renderColors();update();};
      d.appendChild(b);
    }
    box.appendChild(d);
  });
}

function addColor(){
  const hue=Math.floor(Math.random()*360);
  colors.push(`hsl(${hue},70%,55%)`);
  renderColors();update();
}

function renderPresets(){
  const box=$('presets');
  presets.forEach(p=>{
    const s=document.createElement('span');
    s.textContent=p.n;
    s.onclick=()=>{colors=[...p.c];renderColors();update();};
    box.appendChild(s);
  });
}

function getGradient(){
  const type=$('gt').value;
  const angle=$('ga').value;
  const cs=colors.join(', ');
  if(type==='linear') return `linear-gradient(${angle}deg, ${cs})`;
  if(type==='radial') return `radial-gradient(circle, ${cs})`;
  return `conic-gradient(from ${angle}deg, ${cs})`;
}

function update(){
  const el=$('pt');
  const text=$('tx').value||'Gradient Text';
  const size=$('fs').value;
  const anim=$('an').value;
  const speed=$('as').value;

  $('fsv').textContent=size+'px';
  $('gav').textContent=$('ga').value+'\u00b0';
  $('asv').textContent=speed+'s';

  el.textContent=text;
  el.style.fontSize=size+'px';
  const grad=getGradient();
  el.style.background=grad;
  el.style.webkitBackgroundClip='text';
  el.style.webkitTextFillColor='transparent';
  el.style.backgroundClip='text';
  el.style.animation='none';
  el.style.backgroundSize='auto';
  el.style.filter='none';
  el.style.textShadow='none';

  if(anim==='flow'){
    el.style.backgroundSize='200% 200%';
    el.style.animation=`flowLR ${speed}s ease infinite`;
  } else if(anim==='rainbow'){
    el.style.animation=`rainbow ${speed}s linear infinite`;
  } else if(anim==='blink'){
    el.style.animation=`blink ${speed}s ease infinite`;
  } else if(anim==='pulse'){
    el.style.animation=`pulse ${speed}s ease infinite`;
  } else if(anim==='glow'){
    el.style.webkitTextFillColor='unset';
    el.style.animation=`glow ${speed}s ease infinite`;
  }

  genCode(grad,size,anim,speed);
}

function genCode(grad,size,anim,speed){
  let css=`.gradient-text {\n  font-size: ${size}px;\n  font-weight: 900;\n  background: ${grad};\n  -webkit-background-clip: text;\n  -webkit-text-fill-color: transparent;\n  background-clip: text;\n`;
  if(anim==='flow') css+=`  background-size: 200% 200%;\n  animation: flowLR ${speed}s ease infinite;\n`;
  else if(anim==='rainbow') css+=`  animation: rainbow ${speed}s linear infinite;\n`;
  else if(anim==='blink') css+=`  animation: blink ${speed}s ease infinite;\n`;
  else if(anim==='pulse') css+=`  animation: pulse ${speed}s ease infinite;\n`;
  else if(anim==='glow'){css=css.replace('-webkit-text-fill-color: transparent;\n','');css+=`  animation: glow ${speed}s ease infinite;\n`;}
  css+=`}\n`;
  if(anim==='flow') css+=`\n@keyframes flowLR {\n  0% { background-position: 0% 50%; }\n  50% { background-position: 100% 50%; }\n  100% { background-position: 0% 50%; }\n}\n`;
  else if(anim==='rainbow') css+=`\n@keyframes rainbow {\n  0% { filter: hue-rotate(0deg); }\n  100% { filter: hue-rotate(360deg); }\n}\n`;
  else if(anim==='blink') css+=`\n@keyframes blink {\n  0%, 100% { opacity: 1; }\n  50% { opacity: 0.2; }\n}\n`;
  else if(anim==='pulse') css+=`\n@keyframes pulse {\n  0%, 100% { transform: scale(1); }\n  50% { transform: scale(1.05); }\n}\n`;
  else if(anim==='glow') css+=`\n@keyframes glow {\n  0%, 100% { text-shadow: 0 0 10px rgba(233,69,96,0.5); }\n  50% { text-shadow: 0 0 30px rgba(233,69,96,0.8), 0 0 60px rgba(83,52,131,0.5); }\n}\n`;
  $('code').textContent=css;
}

function copyCSS(){
  const code=$('code').textContent;
  navigator.clipboard.writeText(code).then(()=>{
    const b=document.querySelector('.cp');
    b.textContent='\u2705 已复制';
    setTimeout(()=>b.textContent='\u590d\u5236\u4ee3\u7801',1500);
  });
}

init();
</script>
<script src="https://alwingulla.com/88/tag.min.js" data-zone="130647" async data-cfasync="false"></script>
<script defer src="/_vercel/insights/script.js"></script>
<script defer src="/_vercel/speed-insights/script.js"></script>
</body>
</html>
