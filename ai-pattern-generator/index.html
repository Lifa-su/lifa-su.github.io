<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Pattern Generator - Create Beautiful CSS & SVG Background Patterns Online</title>
<meta name="description" content="Free online tool to generate beautiful geometric background patterns. Create stripes, grids, dots, triangles, hexagons, and checkerboard patterns with CSS and SVG code export.">
<meta name="keywords" content="pattern generator, CSS patterns, SVG patterns, background patterns, geometric patterns, web design tool">
<meta property="og:title" content="AI Pattern Generator - Create Beautiful Background Patterns">
<meta property="og:description" content="Free online tool to generate geometric background patterns with CSS and SVG code export.">
<meta property="og:type" content="website">
<link rel="canonical" href="https://lifa-su.com/ai-pattern-generator/">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#x1F537;</text></svg>">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0f0f23;--card:#1a1a2e;--card2:#222240;--bdr:#2a2a4a;--tx:#e2e8f0;--txd:#94a3b8;--ac:#00d2ff;--ac2:#3a7bd5;--r:12px}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;line-height:1.6}
.hd{text-align:center;padding:2rem 1rem 1rem;background:linear-gradient(180deg,#16163a,var(--bg))}
.hd h1{font-size:2rem;background:linear-gradient(135deg,var(--ac),var(--ac2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.hd p{color:var(--txd);font-size:.95rem}
.wrap{max-width:1400px;margin:0 auto;padding:1rem;display:grid;grid-template-columns:320px 1fr;gap:1.25rem}
@media(max-width:900px){.wrap{grid-template-columns:1fr}}
.pnl{background:var(--card);border:1px solid var(--bdr);border-radius:var(--r);padding:1.25rem;box-shadow:0 4px 24px rgba(0,0,0,.4)}
.pnl h2{font-size:1rem;margin-bottom:1rem;color:var(--ac)}
.cg{margin-bottom:1rem}
.cg label{display:block;font-size:.78rem;color:var(--txd);margin-bottom:.3rem;text-transform:uppercase;letter-spacing:.5px}
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem;margin-bottom:1rem}
.pbtn{background:var(--card2);border:2px solid var(--bdr);border-radius:8px;padding:.5rem .2rem;cursor:pointer;text-align:center;transition:all .2s;color:var(--tx);font-size:.7rem}
.pbtn:hover{border-color:var(--ac)}
.pbtn.on{border-color:var(--ac);background:rgba(0,210,255,.1)}
input[type=range]{-webkit-appearance:none;width:100%;height:6px;border-radius:3px;background:#2a2a4a;outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--ac);cursor:pointer}
.rr{display:flex;align-items:center;gap:.5rem}
.rr input[type=range]{flex:1}
.rv{font-size:.8rem;color:var(--ac);min-width:36px;text-align:right}
input[type=color]{-webkit-appearance:none;border:2px solid var(--bdr);border-radius:8px;width:44px;height:34px;cursor:pointer;background:transparent;padding:2px}
input[type=color]::-webkit-color-swatch-wrapper{padding:0}
input[type=color]::-webkit-color-swatch{border:none;border-radius:5px}
.cr{display:flex;align-items:center;gap:.5rem}
.cr input[type=text]{flex:1;background:var(--card2);border:1px solid var(--bdr);border-radius:6px;padding:.4rem .6rem;color:var(--tx);font-size:.85rem;font-family:monospace}
.prev{min-height:500px;border-radius:var(--r);overflow:hidden;position:relative;border:1px solid var(--bdr)}
.prev-in{width:100%;height:100%;min-height:500px}
.prev-lb{position:absolute;top:.75rem;right:.75rem;background:rgba(0,0,0,.6);color:var(--txd);font-size:.7rem;padding:.25rem .6rem;border-radius:20px;pointer-events:none}
.csec{margin-top:1.25rem}
.ctabs{display:flex}
.ctab{padding:.6rem 1.2rem;background:var(--card2);border:1px solid var(--bdr);cursor:pointer;color:var(--txd);font-size:.8rem;transition:all .2s;border-bottom:none}
.ctab:first-child{border-radius:8px 0 0 0}
.ctab:last-child{border-radius:0 8px 0 0}
.ctab.on{background:var(--card);color:var(--ac);border-bottom-color:var(--card)}
.cblk{position:relative;background:var(--card);border:1px solid var(--bdr);border-radius:0 8px 8px 8px;padding:1rem;max-height:250px;overflow:auto}
.cblk pre{font-family:"SF Mono",Monaco,Consolas,monospace;font-size:.78rem;color:#c9d1d9;white-space:pre-wrap;word-break:break-all;line-height:1.5}
.cpb{position:absolute;top:.6rem;right:.6rem;background:var(--ac);color:#000;border:none;border-radius:6px;padding:.35rem .75rem;font-size:.75rem;cursor:pointer;font-weight:600;transition:all .2s}
.cpb:hover{opacity:.85}
.ft{text-align:center;padding:2rem 1rem;color:var(--txd);font-size:.8rem;margin-top:2rem}
</style>
</head>
<body>
<div class="hd"><h1>&#x1F537; AI Pattern Generator</h1><p>Create beautiful geometric background patterns with live preview</p></div>
<div class="wrap">
<div class="pnl" id="controls">
<h2>&#x1F3A8; Pattern Settings</h2>
<div class="cg"><label>Pattern Type</label><div class="pgrid" id="ptypes"></div></div>
<div class="cg"><label>Foreground Color</label><div class="cr"><input type="color" id="fg" value="#00d2ff"><input type="text" id="fgt" value="#00d2ff"></div></div>
<div class="cg"><label>Background Color</label><div class="cr"><input type="color" id="bg" value="#0f0f23"><input type="text" id="bgt" value="#0f0f23"></div></div>
<div class="cg"><label>Size <span class="rv" id="sizev">30px</span></label><div class="rr"><input type="range" id="size" min="5" max="100" value="30"></div></div>
<div class="cg"><label>Spacing <span class="rv" id="gapv">10px</span></label><div class="rr"><input type="range" id="gap" min="0" max="50" value="10"></div></div>
<div class="cg"><label>Rotation <span class="rv" id="rotv">0&deg;</span></label><div class="rr"><input type="range" id="rot" min="0" max="360" value="0"></div></div>
<div class="cg"><label>Opacity <span class="rv" id="opv">100%</span></label><div class="rr"><input type="range" id="op" min="5" max="100" value="100"></div></div>
</div>
<div>
<div class="prev" id="preview"><div class="prev-in" id="previn"></div><div class="prev-lb">Live Preview</div></div>
<div class="csec">
<div class="ctabs"><div class="ctab on" data-tab="css">CSS Code</div><div class="ctab" data-tab="svg">SVG Code</div></div>
<div class="cblk" id="codeblk"><button class="cpb" id="copybtn">Copy</button><pre id="codeout"></pre></div>
</div>
</div>
</div>
<div class="ft"><p>AI Pattern Generator &mdash; Free online tool for creating beautiful background patterns</p></div>
<script src="https://alwingulla.com/88/tag.min.js" data-zone="130747" async data-cfasync="false"></script>
<script>
<script>
const P={
  stripes:{name:'Stripes',icon:'<svg viewBox="0 0 28 28"><line x1="4" y1="0" x2="4" y2="28"/><line x1="12" y1="0" x2="12" y2="28"/><line x1="20" y1="0" x2="20" y2="28"/></svg>'},
  grid:{name:'Grid',icon:'<svg viewBox="0 0 28 28"><line x1="9" y1="0" x2="9" y2="28"/><line x1="19" y1="0" x2="19" y2="28"/><line x1="0" y1="9" x2="28" y2="9"/><line x1="0" y1="19" x2="28" y2="19"/></svg>'},
  dots:{name:'Dots',icon:'<svg viewBox="0 0 28 28"><circle cx="7" cy="7" r="2.5" fill="currentColor" stroke="none"/><circle cx="21" cy="7" r="2.5" fill="currentColor" stroke="none"/><circle cx="7" cy="21" r="2.5" fill="currentColor" stroke="none"/><circle cx="21" cy="21" r="2.5" fill="currentColor" stroke="none"/></svg>'},
  triangles:{name:'Triangles',icon:'<svg viewBox="0 0 28 28"><polygon points="14,4 24,24 4,24" fill="none"/></svg>'},
  hexagons:{name:'Hexagons',icon:'<svg viewBox="0 0 28 28"><polygon points="14,2 24,8 24,20 14,26 4,20 4,8" fill="none"/></svg>'},
  checkerboard:{name:'Checker',icon:'<svg viewBox="0 0 28 28"><rect x="0" y="0" width="14" height="14" fill="currentColor" stroke="none"/><rect x="14" y="14" width="14" height="14" fill="currentColor" stroke="none"/></svg>'}
};
let cur='stripes';
const $=id=>document.getElementById(id);
const el=document.querySelectorAll.bind(document);

function init(){
  const g=$('ptypes');
  Object.keys(P).forEach(k=>{
    const b=document.createElement('div');
    b.className='pbtn'+(k===cur?' on':'');
    b.innerHTML=P[k].icon+'<span>'+P[k].name+'</span>';
    b.onclick=()=>{cur=k;document.querySelectorAll('.pbtn').forEach(x=>x.classList.remove('on'));b.classList.add('on');update()};
    g.appendChild(b);
  });
  ['fg','bg'].forEach(id=>{
    const c=$(id),t=$(id+'t');
    c.oninput=()=>{t.value=c.value;update()};
    t.oninput=()=>{if(/^#[0-9a-f]{6}$/i.test(t.value)){c.value=t.value;update()}};
  });
  ['size','gap','rot','opa'].forEach(id=>{
    const r=$(id);
    r.oninput=()=>{
      let v=r.value;
      if(id==='rot')$(id+'v').textContent=v+'\u00B0';
      else if(id==='opa')$(id+'v').textContent=(v/100).toFixed(2);
      else $(id+'v').textContent=v+'px';
      update();
    };
  });
  document.querySelectorAll('.ctab').forEach(t=>{
    t.onclick=()=>{
      document.querySelectorAll('.ctab').forEach(x=>x.classList.remove('on'));
      t.classList.add('on');
      document.querySelectorAll('.cblk').forEach(x=>x.style.display='none');
      $(t.dataset.t).style.display='block';
    };
  });
  update();
}

function hexToRgba(h,a){
  const r=parseInt(h.slice(1,3),16),g=parseInt(h.slice(3,5),16),b=parseInt(h.slice(5,7),16);
  return a<1?'rgba('+r+','+g+','+b+','+a+')':h;
}

function genCSS(){
  const fg=$('fg').value,bg=$('bg').value,s=+$('size').value,sp=+$('gap').value,rot=+$('rot').value,opa=+$('opa').value/100;
  const fc=hexToRgba(fg,opa),u=s+sp;
  let css='';
  switch(cur){
    case'stripes':
      css='background-color: '+bg+';\nbackground-image: repeating-linear-gradient(\n  '+rot+'deg,\n  '+fc+',\n  '+fc+' '+s+'px,\n  transparent '+s+'px,\n  transparent '+(u)+'px\n);';
      break;
    case'grid':
      css='background-color: '+bg+';\nbackground-image:\n  repeating-linear-gradient(\n    '+rot+'deg,\n    '+fc+' 0,\n    '+fc+' 1px,\n    transparent 1px,\n    transparent '+u+'px\n  ),\n  repeating-linear-gradient(\n    '+(rot+90)+'deg,\n    '+fc+' 0,\n    '+fc+' 1px,\n    transparent 1px,\n    transparent '+u+'px\n  );';
      break;
    case'dots':
      css='background-color: '+bg+';\nbackground-image: radial-gradient(\n  circle '+Math.round(s/2)+'px at '+Math.round(u/2)+'px '+Math.round(u/2)+'px,\n  '+fc+' '+Math.round(s/2)+'px,\n  transparent '+Math.round(s/2)+'px\n);\nbackground-size: '+u+'px '+u+'px;';
      break;
    case'triangles':
      css='background-color: '+bg+';\nbackground-image:\n  linear-gradient('+rot+'deg, '+fc+' 25%, transparent 25%),\n  linear-gradient('+(rot+180)+'deg, '+fc+' 25%, transparent 25%);\nbackground-size: '+u+'px '+u+'px;\nbackground-position: 0 0, '+Math.round(u/2)+'px 0;';
      break;
    case'hexagons':
      const h=Math.round(u*0.866);
      css='background-color: '+bg+';\nbackground-image:\n  linear-gradient('+rot+'deg, '+fc+' 25%, transparent 25%, transparent 75%, '+fc+' 75%),\n  linear-gradient('+rot+'deg, '+fc+' 25%, transparent 25%, transparent 75%, '+fc+' 75%);\nbackground-size: '+u+'px '+h+'px;\nbackground-position: 0 0, '+Math.round(u/2)+'px '+Math.round(h/2)+'px;';
      break;
    case'checkerboard':
      css='background-color: '+bg+';\nbackground-image:\n  linear-gradient(45deg, '+fc+' 25%, transparent 25%, transparent 75%, '+fc+' 75%),\n  linear-gradient(45deg, '+fc+' 25%, transparent 25%, transparent 75%, '+fc+' 75%);\nbackground-size: '+u+'px '+u+'px;\nbackground-position: 0 0, '+Math.round(u/2)+'px '+Math.round(u/2)+'px;';
      break;
  }
  return css;
}

function genSVG(){
  const fg=$('fg').value,bg=$('bg').value,s=+$('size').value,sp=+$('gap').value,rot=+$('rot').value,opa=+$('opa').value/100;
  const u=s+sp;
  let inner='';
  switch(cur){
    case'stripes':
      inner='<rect width="'+s+'" height="'+u+'" fill="'+fg+'" fill-opacity="'+opa+'"/>';
      break;
    case'grid':
      inner='<rect width="'+u+'" height="1" fill="'+fg+'" fill-opacity="'+opa+'"/><rect width="1" height="'+u+'" fill="'+fg+'" fill-opacity="'+opa+'"/>';
      break;
    case'dots':
      inner='<circle cx="'+Math.round(u/2)+'" cy="'+Math.round(u/2)+'" r="'+Math.round(s/2)+'" fill="'+fg+'" fill-opacity="'+opa+'"/>';
      break;
    case'triangles':
      const h=Math.round(u*0.866);
      inner='<polygon points="'+Math.round(u/2)+',0 '+u+','+h+' 0,'+h+'" fill="'+fg+'" fill-opacity="'+opa+'"/>';
      break;
    case'hexagons':
      const hh=Math.round(u/2),q=Math.round(u/4),tq=Math.round(3*u/4);
      inner='<polygon points="'+hh+',0 '+u+','+q+' '+u+','+tq+' '+hh+','+u+' 0,'+tq+' 0,'+q+'" fill="none" stroke="'+fg+'" stroke-opacity="'+opa+'" stroke-width="1"/>';
      break;
    case'checkerboard':
      const half=Math.round(u/2);
      inner='<rect width="'+half+'" height="'+half+'" fill="'+fg+'" fill-opacity="'+opa+'"/><rect x="'+half+'" y="'+half+'" width="'+half+'" height="'+half+'" fill="'+fg+'" fill-opacity="'+opa+'"/>';
      break;
  }
  const transform=rot?(' patternTransform="rotate('+rot+')"'):'';
  return '<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">\n  <defs>\n    <pattern id="p" width="'+u+'" height="'+u+'" patternUnits="userSpaceOnUse"'+transform+'>\n      '+inner+'\n    </pattern>\n  </defs>\n  <rect width="100%" height="100%" fill="'+bg+'"/>\n  <rect width="100%" height="100%" fill="url(#p)"/>\n</svg>';
}

function update(){
  const css=genCSS();
  const preview=$('preview');
  const lines=css.split('\n');
  const styleObj={};
  lines.forEach(l=>{
    l=l.trim().replace(/;$/,'');
    const idx=l.indexOf(':');
    if(idx>0){
      const prop=l.slice(0,idx).trim();
      const val=l.slice(idx+1).trim().replace(/,$/,'');
      if(styleObj[prop])styleObj[prop]+=', '+val;
      else styleObj[prop]=val;
    }
  });
  preview.style.cssText='width:100%;height:100%;min-height:500px;';
  const cssText=css.replace(/\n/g,'').replace(/\s+/g,' ');
  preview.setAttribute('style','width:100%;height:100%;min-height:500px;'+cssText);
  $('csscode').textContent='.pattern {\n  '+css+'\n}';
  $('svgcode').textContent=genSVG();
}

function copyCode(id){
  const text=$(id).textContent;
  navigator.clipboard.writeText(text).then(()=>{
    const btn=$(id).parentElement.querySelector('.cpb');
    btn.textContent='Copied!';
    btn.style.background='#22c55e';
    setTimeout(()=>{btn.textContent='Copy';btn.style.background='';},1500);
  });
}

init();
</script>
<script src="https://alwingulla.com/88/tag.min.js" data-zone="130747" async data-cfasync="false"></script>
<script defer src="/_vercel/insights/script.js"></script>
<script defer src="/_vercel/speed-insights/script.js"></script>
</body>
</html>
