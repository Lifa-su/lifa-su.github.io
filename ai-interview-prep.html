<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Interview Prep moved</title>
<meta name="description" content="This legacy AI Interview Prep URL now forwards to the current canonical page at /ai-interview-prep/.">
<meta name="robots" content="noindex,follow">
<link rel="canonical" href="https://lifa-su.com/ai-interview-prep/">
<meta http-equiv="refresh" content="0; url=/ai-interview-prep/">
<style>
:root{--bg:#0b1020;--card:#131a2e;--border:#2a3456;--text:#eef2ff;--muted:#aab4d6;--accent:#7c5cfc}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at top,#1b2440 0,#0b1020 58%);color:var(--text);font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
main{width:min(100%,680px);background:rgba(19,26,46,.88);border:1px solid var(--border);border-radius:20px;padding:32px;box-shadow:0 24px 80px rgba(0,0,0,.35)}
h1{margin:0 0 12px;font-size:clamp(28px,4vw,40px);line-height:1.15}
p{margin:0 0 14px;color:var(--muted)}
code{padding:2px 8px;border-radius:999px;background:rgba(124,92,252,.12);color:#dcd4ff}
.actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:24px}
.btn{display:inline-flex;align-items:center;justify-content:center;padding:12px 18px;border-radius:12px;font-weight:700;text-decoration:none;border:1px solid transparent;transition:transform .15s ease,opacity .15s ease}
.btn:hover{transform:translateY(-1px)}
.btn-primary{background:var(--accent);color:#fff}
.btn-secondary{border-color:var(--border);color:var(--text);background:transparent}
.small{font-size:14px}
</style>
<script>
(function(){
  var base = '/ai-interview-prep/';
  var suffix = window.location.search + window.location.hash;
  var target = base + suffix;
  window.__aiInterviewPrepTarget = target;
  window.location.replace(target);
})();
</script>
</head>
<body>
<main>
  <h1>AI Interview Prep moved</h1>
  <p>This legacy <code>.html</code> entry now forwards to the current canonical page at <code>/ai-interview-prep/</code>.</p>
  <p class="small">If you are not redirected automatically, use the button below.</p>
  <div class="actions">
    <a class="btn btn-primary" id="open-current" href="/ai-interview-prep/">Open current AI Interview Prep</a>
    <a class="btn btn-secondary" href="/">Back to home</a>
  </div>
</main>
<script>
(function(){
  var target = window.__aiInterviewPrepTarget || '/ai-interview-prep/';
  var link = document.getElementById('open-current');
  if(link) link.href = target;
})();
</script>
</body>
</html>
