<!DOCTYPE html>
<html lang="zh-CN">
<head>

    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Generate beautiful CSS loading animations. Choose from spinners, dots, bars, and pulse effects. Customize colors and size, then copy pure CSS loader code.">
<link rel="canonical" href="https://lifa-su.com/ai-css-loader/">
<title>AI CSS Loader - CSS加载动画生成器</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#1a1a2e;--card:#16213e;--card2:#0f3460;--accent:#e94560;--accent2:#533483;--text:#eee;--text2:#aaa;--radius:12px}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
a{color:var(--accent);text-decoration:none}
header{text-align:center;padding:30px 20px 20px;background:linear-gradient(135deg,var(--card),var(--card2))}
header h1{font-size:2rem;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
header p{color:var(--text2);margin-top:8px;font-size:0.95rem}
.container{max-width:1400px;margin:0 auto;padding:20px}
.main-layout{display:grid;grid-template-columns:1fr 320px;gap:20px;margin-bottom:20px}
.preview-section{background:var(--card);border-radius:var(--radius);padding:24px;min-height:350px;display:flex;flex-direction:column}
.preview-title{font-size:1.1rem;margin-bottom:16px;color:var(--text2)}
.preview-area{flex:1;display:flex;align-items:center;justify-content:center;background:var(--bg);border-radius:8px;min-height:250px;position:relative;overflow:hidden}
.controls-section{background:var(--card);border-radius:var(--radius);padding:24px}
.controls-section h3{font-size:1rem;margin-bottom:16px;color:var(--text2)}
.control-group{margin-bottom:18px}
.control-group label{display:block;font-size:0.85rem;color:var(--text2);margin-bottom:6px}
.control-group input[type="color"]{width:100%;height:36px;border:none;border-radius:6px;cursor:pointer;background:var(--bg)}
.control-group select,.control-group input[type="number"]{width:100%;padding:8px 12px;background:var(--bg);border:1px solid #333;border-radius:6px;color:var(--text);font-size:0.9rem}
.control-group input[type="range"]{width:100%;accent-color:var(--accent)}
.size-row{display:flex;gap:8px;align-items:center}
.size-row select{flex:1}
.size-row input[type="number"]{width:80px}
.grid-section{background:var(--card);border-radius:var(--radius);padding:24px;margin-bottom:20px}
.grid-section h3{font-size:1rem;margin-bottom:16px;color:var(--text2)}
.grid-tabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.grid-tab{padding:6px 16px;border-radius:20px;border:1px solid #333;background:transparent;color:var(--text2);cursor:pointer;font-size:0.85rem;transition:all .2s}
.grid-tab:hover,.grid-tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px}
.grid-item{background:var(--bg);border-radius:8px;padding:12px;cursor:pointer;border:2px solid transparent;transition:all .2s;display:flex;flex-direction:column;align-items:center;gap:8px}
.grid-item:hover{border-color:var(--accent2);transform:translateY(-2px)}
.grid-item.active{border-color:var(--accent);box-shadow:0 0 20px rgba(233,69,96,0.3)}
.grid-item .thumb{width:60px;height:60px;display:flex;align-items:center;justify-content:center;position:relative}
.grid-item .name{font-size:0.75rem;color:var(--text2);text-align:center}
.code-section{background:var(--card);border-radius:var(--radius);padding:24px;margin-bottom:20px}
.code-section h3{font-size:1rem;margin-bottom:16px;color:var(--text2)}
.code-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.copy-btn{padding:8px 20px;background:var(--accent);color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:0.85rem;transition:all .2s}
.copy-btn:hover{background:#c73650;transform:scale(1.05)}
.copy-btn.copied{background:#27ae60}
.code-block{background:#0d1117;border-radius:8px;padding:16px;overflow-x:auto;font-family:'Fira Code',monospace;font-size:0.82rem;line-height:1.6;color:#c9d1d9;max-height:400px;overflow-y:auto;white-space:pre-wrap;word-break:break-all}
footer{text-align:center;padding:20px;color:var(--text2);font-size:0.8rem}
@media(max-width:900px){.main-layout{grid-template-columns:1fr}.grid{grid-template-columns:repeat(auto-fill,minmax(100px,1fr))}}
@media(max-width:600px){header h1{font-size:1.5rem}.container{padding:12px}.grid{grid-template-columns:repeat(auto-fill,minmax(90px,1fr))}}

/* ===== ANIMATION KEYFRAMES ===== */

/* 1. Classic Spinner */
@keyframes l-spin{to{transform:rotate(360deg)}}

/* 2. Double Ring */
@keyframes l-double-ring{to{transform:rotate(360deg)}}
@keyframes l-double-ring-r{to{transform:rotate(-360deg)}}

/* 3. Three Dot Spin */
@keyframes l-3dot-spin{to{transform:rotate(360deg)}}

/* 4. Single Pulse */
@keyframes l-pulse{0%,100%{transform:scale(.6);opacity:.5}50%{transform:scale(1);opacity:1}}

/* 5. Multi Pulse */
@keyframes l-multi-pulse{0%,100%{transform:scale(.6);opacity:.3}50%{transform:scale(1);opacity:1}}

/* 6. Heartbeat */
@keyframes l-heartbeat{0%,100%{transform:scale(1)}10%{transform:scale(1.15)}20%{transform:scale(1)}30%{transform:scale(1.15)}40%,100%{transform:scale(1)}}

/* 7. Single Bounce */
@keyframes l-bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-100%)}}

/* 8. Three Ball Bounce */
@keyframes l-3bounce{0%,80%,100%{transform:translateY(0)}40%{transform:translateY(-100%)}}

/* 9. Elastic Ball */
@keyframes l-elastic{0%{transform:translateY(0) scaleX(1) scaleY(1)}20%{transform:translateY(-80%) scaleX(.9) scaleY(1.1)}40%{transform:translateY(-100%) scaleX(1.1) scaleY(.9)}60%{transform:translateY(0) scaleX(.95) scaleY(1.05)}70%{transform:translateY(-30%) scaleX(1) scaleY(1)}80%{transform:translateY(0) scaleX(1.05) scaleY(.95)}100%{transform:translateY(0) scaleX(1) scaleY(1)}}

/* 10. Wave Bars */
@keyframes l-wave{0%,100%{transform:scaleY(.4)}50%{transform:scaleY(1)}}

/* 11. Sine Wave */
@keyframes l-sine{0%,100%{transform:translateY(0)}50%{transform:translateY(-150%)}}

/* 12. Water Ripple */
@keyframes l-ripple{0%{transform:scale(0);opacity:1}100%{transform:scale(1);opacity:0}}

/* 13. Progress Bar */
@keyframes l-progress{0%{width:0}50%{width:100%}100%{width:0}}

/* 14. Ring Progress */
@keyframes l-ring-progress{to{stroke-dashoffset:0}}
@keyframes l-ring-rotate{to{transform:rotate(360deg)}}

/* 15. Skeleton Shimmer */
@keyframes l-shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}

/* 16. Flip Square */
@keyframes l-flip{0%{transform:perspective(200px) rotateX(0) rotateY(0)}25%{transform:perspective(200px) rotateX(180deg) rotateY(0)}50%{transform:perspective(200px) rotateX(180deg) rotateY(180deg)}75%{transform:perspective(200px) rotateX(0) rotateY(180deg)}100%{transform:perspective(200px) rotateX(0) rotateY(0)}}

/* 17. Chasing Dots */
@keyframes l-chase{0%{transform:rotate(0)}100%{transform:rotate(360deg)}}
@keyframes l-chase-dot{80%,100%{transform:rotate(360deg)}}
@keyframes l-chase-dot-before{50%{transform:scale(.4)}0%,100%{transform:scale(1)}}

/* 18. Gradient Spinner */
@keyframes l-gradient{to{transform:rotate(360deg)}}

/* 19. Pendulum */
@keyframes l-pendulum{0%{transform:rotate(-40deg)}50%{transform:rotate(40deg)}100%{transform:rotate(-40deg)}}

/* 20. DNA Helix */
@keyframes l-dna-up{0%,100%{transform:translateY(-50%) scale(.5);opacity:.5}50%{transform:translateY(50%) scale(1);opacity:1}}
@keyframes l-dna-down{0%,100%{transform:translateY(50%) scale(1);opacity:1}50%{transform:translateY(-50%) scale(.5);opacity:.5}}

/* 21. Grid Flash */
@keyframes l-grid{0%,100%{opacity:.2}50%{opacity:1}}

/* 22. Rotating Squares */
@keyframes l-rot-sq{0%{transform:rotate(0) scale(1)}25%{transform:rotate(90deg) scale(.6)}50%{transform:rotate(180deg) scale(1)}75%{transform:rotate(270deg) scale(.6)}100%{transform:rotate(360deg) scale(1)}}

/* Thumbnail animation styles */
.thumb .loader{--c1:#e94560;--c2:#533483;--sz:40px;--sp:1s}
</style>
</head>
<body>
<header>
<h1>🎨 AI CSS Loader</h1>
<p>CSS加载动画生成器 — 22种精美预设，自定义颜色/大小/速度，一键复制代码</p>
</header>
<div class="container">
<div class="main-layout">
<div class="preview-section">
<div class="preview-title">🔍 实时预览 — <span id="currentName">经典旋转</span></div>
<div class="preview-area" id="previewArea"></div>
</div>
<div class="controls-section">
<h3>⚙️ 自定义设置</h3>
<div class="control-group">
<label>主色调</label>
<input type="color" id="color1" value="#e94560">
</div>
<div class="control-group">
<label>副色调</label>
<input type="color" id="color2" value="#533483">
</div>
<div class="control-group">
<label>大小</label>
<div class="size-row">
<select id="sizePreset">
<option value="24">小 (24px)</option>
<option value="48" selected>中 (48px)</option>
<option value="72">大 (72px)</option>
<option value="custom">自定义</option>
</select>
<input type="number" id="sizeCustom" value="48" min="12" max="200" style="display:none">
</div>
</div>
<div class="control-group">
<label>速度: <span id="speedLabel">1.0s</span></label>
<input type="range" id="speed" min="0.2" max="3" step="0.1" value="1">
</div>
<div class="control-group">
<label>速度预设</label>
<select id="speedPreset">
<option value="0.5">快 (0.5s)</option>
<option value="1" selected>正常 (1s)</option>
<option value="2">慢 (2s)</option>
<option value="custom">自定义</option>
</select>
</div>
</div>
</div>
<div class="grid-section">
<h3>📦 动画预设</h3>
<div class="grid-tabs">
<button class="grid-tab active" data-cat="all">全部</button>
<button class="grid-tab" data-cat="spin">旋转</button>
<button class="grid-tab" data-cat="pulse">脉冲</button>
<button class="grid-tab" data-cat="bounce">弹跳</button>
<button class="grid-tab" data-cat="wave">波浪</button>
<button class="grid-tab" data-cat="progress">进度</button>
<button class="grid-tab" data-cat="other">其他</button>
</div>
<div class="grid" id="grid"></div>
</div>
<div class="code-section">
<div class="code-header">
<h3>📋 生成代码</h3>
<button class="copy-btn" id="copyBtn" onclick="copyCode()">复制代码</button>
</div>
<pre class="code-block" id="codeBlock"></pre>
</div>
</div>
<footer>AI CSS Loader — 纯CSS加载动画生成器 | 无需依赖，即拿即用</footer>
