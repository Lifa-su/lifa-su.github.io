<!DOCTYPE html>
<html lang="en">
<head>

    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Generate SEO meta tags for your website. Create title, description, Open Graph, and Twitter Card tags with live preview. Boost your search engine rankings.">
<link rel="canonical" href="https://lifa-su.com/ai-meta-tags/">
<title>AI Meta Tags Generator</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#1a1a2e;--sf:#16213e;--cd:#0f3460;--ac:#e94560;--a2:#533483;--tx:#eee;--t2:#aab;--bd:#2a2a4a;--ok:#00d68f;--r:10px}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;line-height:1.6}
.wrap{max-width:1200px;margin:0 auto;padding:20px}
header{text-align:center;padding:40px 20px 30px}
header h1{font-size:2.2rem;background:linear-gradient(135deg,var(--ac),var(--a2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
header p{color:var(--t2);margin-top:8px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-bottom:30px}
@media(max-width:768px){.grid,.pvs{grid-template-columns:1fr!important}}
.pnl{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);padding:24px}
.pnl h2{font-size:1.1rem;margin-bottom:16px;color:var(--ac)}
.fg{margin-bottom:14px}
.fg label{display:block;font-size:.85rem;color:var(--t2);margin-bottom:4px}
.fg input,.fg textarea,.fg select{width:100%;padding:10px 12px;background:var(--bg);border:1px solid var(--bd);border-radius:6px;color:var(--tx);font-size:.95rem}
.fg input:focus,.fg textarea:focus{outline:none;border-color:var(--ac)}
textarea{resize:vertical;min-height:70px;font-family:inherit}
.btn{padding:10px 20px;border:none;border-radius:6px;cursor:pointer;font-size:.95rem;font-weight:600;transition:all .2s}
.bp{background:linear-gradient(135deg,var(--ac),var(--a2));color:#fff}
.bp:hover{opacity:.9;transform:translateY(-1px)}
.bc{background:var(--cd);color:var(--tx);border:1px solid var(--bd)}
.bc:hover{border-color:var(--ac)}
.bc.copied{background:var(--ok);color:#fff;border-color:var(--ok)}
.acts{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.pvs{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:30px}
.pc{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);overflow:hidden}
.pc h3{padding:14px 18px;font-size:.9rem;color:var(--t2);border-bottom:1px solid var(--bd)}
.gp{padding:18px;font-family:Arial,sans-serif}
.gu{font-size:14px;color:#bbb;margin-bottom:4px}
.gt{font-size:20px;color:#8ab4f8;margin-bottom:4px;cursor:pointer}
.gt:hover{text-decoration:underline}
.gd{font-size:14px;color:#bbb;line-height:1.5}
.sp{padding:18px}
.sc{border:1px solid var(--bd);border-radius:8px;overflow:hidden;background:var(--bg)}
.ci{width:100%;height:160px;background:var(--cd);display:flex;align-items:center;justify-content:center;color:var(--t2);overflow:hidden}
.ci img{width:100%;height:100%;object-fit:cover}
.cb{padding:12px}
.cs{font-size:.75rem;color:var(--t2);text-transform:uppercase}
.ct{font-size:.95rem;font-weight:600;margin:4px 0}
.cdd{font-size:.8rem;color:var(--t2)}
.cblk{background:#0d1117;border:1px solid var(--bd);border-radius:var(--r);overflow:hidden;margin-top:30px}
.chd{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;background:rgba(255,255,255,.03);border-bottom:1px solid var(--bd)}
.chd span{font-size:.85rem;color:var(--t2)}
.cc{padding:16px;overflow-x:auto;font-size:.85rem;line-height:1.7}
.cc pre{margin:0;white-space:pre-wrap;word-break:break-all}
.ht{color:#7ee787}.ha{color:#d2a8ff}.hv{color:#a5d6ff}
footer{text-align:center;padding:40px 20px;color:var(--t2);font-size:.85rem}
</style>
</head>
<body>
<header><h1>&#127991; AI Meta Tags Generator</h1><p>Generate perfect SEO, Open Graph &amp; Twitter Card meta tags</p></header>
<div class="wrap">
<div class="grid">
<div class="pnl">
<h2>&#128221; Page Information</h2>
<div class="fg"><label>Page Title</label><input id="f1" placeholder="My Awesome Website" maxlength="70"></div>
<div class="fg"><label>Description</label><textarea id="f2" placeholder="A brief description..." maxlength="160" rows="3"></textarea></div>
<div class="fg"><label>Page URL</label><input id="f3" placeholder="https://example.com"></div>
<div class="fg"><label>Image URL</label><input id="f4" placeholder="https://example.com/img.jpg"></div>
</div>
<div class="pnl">
<h2>&#9881;&#65039; Additional Settings</h2>
<div class="fg"><label>Site Name</label><input id="f5" placeholder="My Website"></div>
<div class="fg"><label>Author</label><input id="f6" placeholder="John Doe"></div>
<div class="fg"><label>Keywords</label><input id="f7" placeholder="web, seo, tools"></div>
<div class="fg"><label>Twitter Card Type</label><select id="f8"><option value="summary_large_image">Summary Large Image</option><option value="summary">Summary</option></select></div>
<div class="acts"><button class="btn bp" onclick="gen()">&#9889; Generate</button><button class="btn bc" onclick="clr()">Clear</button></div>
</div>
</div>
<div id="out"></div>
</div>
<footer>AI Meta Tags Generator &mdash; Free Online Tool</footer>
<script>
function e(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function hl(tag,attrs){
  var s='<span class="ht">&lt;'+tag+'</span>';
  for(var k in attrs){if(attrs[k])s+=' <span class="ha">'+k+'</span>=<span class="hv">"'+e(attrs[k])+'"</span>';}
  return s+'<span class="ht">&gt;</span>';
}
function gen(){
  var t=document.getElementById('f1').value,d=document.getElementById('f2').value,
  u=document.getElementById('f3').value,img=document.getElementById('f4').value,
  sn=document.getElementById('f5').value,au=document.getElementById('f6').value,
  kw=document.getElementById('f7').value,tc=document.getElementById('f8').value;
  if(!t){alert('Please enter a page title');return;}
  var tags=[],code=[];
  tags.push({t:'charset',h:hl('meta',{charset:'UTF-8'})});
  tags.push({t:'viewport',h:hl('meta',{name:'viewport',content:'width=device-width, initial-scale=1.0'})});
  if(t){tags.push({t:'title-tag',h:'<span class="ht">&lt;title&gt;</span>'+e(t)+'<span class="ht">&lt;/title&gt;</span>'});}
  if(d)tags.push({t:'seo',h:hl('meta',{name:'description',content:d})});
  if(kw)tags.push({t:'seo',h:hl('meta',{name:'keywords',content:kw})});
  if(au)tags.push({t:'seo',h:hl('meta',{name:'author',content:au})});
  tags.push({t:'seo',h:hl('meta',{name:'robots',content:'index, follow'})});
  if(t)tags.push({t:'og',h:hl('meta',{property:'og:title',content:t})});
  tags.push({t:'og',h:hl('meta',{property:'og:type',content:'website'})});
  if(d)tags.push({t:'og',h:hl('meta',{property:'og:description',content:d})});
  if(u)tags.push({t:'og',h:hl('meta',{property:'og:url',content:u})});
  if(img)tags.push({t:'og',h:hl('meta',{property:'og:image',content:img})});
  if(sn)tags.push({t:'og',h:hl('meta',{property:'og:site_name',content:sn})});
  tags.push({t:'tw',h:hl('meta',{name:'twitter:card',content:tc})});
  if(t)tags.push({t:'tw',h:hl('meta',{name:'twitter:title',content:t})});
  if(d)tags.push({t:'tw',h:hl('meta',{name:'twitter:description',content:d})});
  if(img)tags.push({t:'tw',h:hl('meta',{name:'twitter:image',content:img})});
  if(u){tags.push({t:'canon',h:hl('link',{rel:'canonical',href:u})});}
  var plain=tags.map(function(x){return x.h.replace(/<span[^>]*>/g,'').replace(/<\/span>/g,'').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&').replace(/&quot;/g,'"');}).join('\n');
  var colored=tags.map(function(x){return x.h;}).join('\n');
  var du=u||'https://example.com';
  var imgH=img?'<img src="'+e(img)+'" onerror="this.parentNode.textContent=\'Image not found\'">':'No image set';
  var html='<div class="pvs">';
  html+='<div class="pc"><h3>&#128269; Google Search Preview</h3><div class="gp">';
  html+='<div class="gu">'+e(du)+'</div>';
  html+='<div class="gt">'+e(t||'Page Title')+'</div>';
  html+='<div class="gd">'+e(d||'No description provided')+'</div>';
  html+='</div></div>';
  html+='<div class="pc"><h3>&#128247; Social Media Preview</h3><div class="sp"><div class="sc">';
  html+='<div class="ci">'+imgH+'</div>';
  html+='<div class="cb"><div class="cs">'+e(sn||du)+'</div>';
  html+='<div class="ct">'+e(t||'Page Title')+'</div>';
  html+='<div class="cdd">'+e(d||'')+'</div>';
  html+='</div></div></div></div></div>';
  html+='<div class="cblk"><div class="chd"><span>Generated Meta Tags ('+tags.length+' tags)</span>';
  html+='<button class="btn bc" onclick="copyCode()">&#128203; Copy</button></div>';
  html+='<div class="cc"><pre id="codeOut">'+colored+'</pre></div></div>';
  document.getElementById('out').innerHTML=html;
  window._plain=plain;
}
function copyCode(){
  if(!window._plain)return;
  navigator.clipboard.writeText(window._plain).then(function(){
    var b=document.querySelector('.cblk .bc');
    b.textContent='Copied!';b.classList.add('copied');
    setTimeout(function(){b.innerHTML='&#128203; Copy';b.classList.remove('copied');},2000);
  });
}
function clr(){
  ['f1','f2','f3','f4','f5','f6','f7'].forEach(function(id){document.getElementById(id).value='';});
  document.getElementById('out').innerHTML='';
}
</script>
<script src="https://alwingulla.com/88/tag.min.js" data-zone="130747" async data-cfasync="false"></script>
<script defer src="/_vercel/insights/script.js"></script>
<script defer src="/_vercel/speed-insights/script.js"></script>
</body>
</html>
