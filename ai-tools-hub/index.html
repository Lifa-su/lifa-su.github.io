<!DOCTYPE html>
<html lang="zh-CN">
<head>

    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Browse 100+ free AI-powered developer tools. Find CSS generators, code converters, SEO tools, image editors, and productivity utilities all in one place.">
<link rel="canonical" href="https://lifa-su.com/ai-tools-hub/">
<title>Feifei's AI Tools Hub</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0a0a0f;--surface:#12121a;--card:#1a1a2e;--card-hover:#222240;
  --border:#2a2a3e;--text:#e0e0e8;--text-dim:#8888a0;--text-muted:#555568;
  --accent:#6c5ce7;--accent2:#a855f7;--accent3:#06b6d4;
  --gradient:linear-gradient(135deg,#6c5ce7,#a855f7,#06b6d4);
  --radius:16px;--radius-sm:10px;
}
html{scroll-behavior:smooth}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Noto Sans SC',sans-serif;background:var(--bg);color:var(--text);line-height:1.6;overflow-x:hidden}

/* Ambient background */
.ambient{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0;overflow:hidden}
.ambient .orb{position:absolute;border-radius:50%;filter:blur(120px);opacity:.12;animation:float 20s ease-in-out infinite}
.ambient .orb:nth-child(1){width:600px;height:600px;background:#6c5ce7;top:-200px;left:-100px;animation-delay:0s}
.ambient .orb:nth-child(2){width:500px;height:500px;background:#a855f7;top:50%;right:-150px;animation-delay:-7s}
.ambient .orb:nth-child(3){width:400px;height:400px;background:#06b6d4;bottom:-100px;left:30%;animation-delay:-14s}
@keyframes float{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(30px,-40px) scale(1.05)}66%{transform:translate(-20px,30px) scale(.95)}}

.container{max-width:1280px;margin:0 auto;padding:0 24px;position:relative;z-index:1}

/* Hero */
.hero{text-align:center;padding:80px 0 48px}
.hero-badge{display:inline-flex;align-items:center;gap:8px;padding:6px 16px;border-radius:100px;background:rgba(108,92,231,.15);border:1px solid rgba(108,92,231,.3);font-size:13px;color:var(--accent2);margin-bottom:24px;backdrop-filter:blur(10px)}
.hero-badge .dot{width:6px;height:6px;border-radius:50%;background:#22c55e;animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.hero h1{font-size:clamp(2.2rem,5vw,3.8rem);font-weight:800;letter-spacing:-.02em;background:var(--gradient);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:16px}
.hero p{font-size:clamp(1rem,2vw,1.2rem);color:var(--text-dim);max-width:600px;margin:0 auto 32px}
.stats{display:flex;justify-content:center;gap:48px;flex-wrap:wrap}
.stat{text-align:center}
.stat-num{font-size:2rem;font-weight:700;background:var(--gradient);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.stat-label{font-size:.85rem;color:var(--text-muted);margin-top:2px}

/* Search & Filter */
.toolbar{padding:32px 0 24px;display:flex;flex-direction:column;gap:16px;align-items:center}
.search-box{position:relative;width:100%;max-width:480px}
.search-box svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--text-muted);width:18px;height:18px}
.search-box input{width:100%;padding:14px 16px 14px 48px;border-radius:100px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:15px;outline:none;transition:border-color .2s,box-shadow .2s}
.search-box input::placeholder{color:var(--text-muted)}
.search-box input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(108,92,231,.15)}
.filters{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.filter-btn{padding:8px 20px;border-radius:100px;border:1px solid var(--border);background:transparent;color:var(--text-dim);font-size:14px;cursor:pointer;transition:all .25s;white-space:nowrap}
.filter-btn:hover{border-color:var(--accent);color:var(--text)}
.filter-btn.active{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 4px 15px rgba(108,92,231,.3)}

/* Grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px;padding:16px 0 80px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:28px 24px;cursor:pointer;transition:all .3s cubic-bezier(.4,0,.2,1);position:relative;overflow:hidden;text-decoration:none;color:inherit;display:flex;flex-direction:column}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:var(--gradient);opacity:0;transition:opacity .3s}
.card:hover{transform:translateY(-4px);border-color:rgba(108,92,231,.4);box-shadow:0 20px 40px rgba(0,0,0,.3);background:var(--card-hover)}
.card:hover::before{opacity:1}
.card-icon{font-size:2.2rem;margin-bottom:14px;display:block;width:fit-content}
.card-name{font-size:1.05rem;font-weight:600;margin-bottom:6px;display:flex;align-items:center;gap:8px}
.card-desc{font-size:.88rem;color:var(--text-dim);flex:1}
.card-tag{display:inline-block;margin-top:14px;padding:3px 10px;border-radius:100px;font-size:.72rem;background:rgba(108,92,231,.12);color:var(--accent2);border:1px solid rgba(108,92,231,.2)}
.card-arrow{position:absolute;top:24px;right:24px;color:var(--text-muted);opacity:0;transform:translateX(-4px);transition:all .3s}
.card:hover .card-arrow{opacity:1;transform:translateX(0)}

/* Empty state */
.empty{text-align:center;padding:80px 20px;display:none}
.empty.show{display:block}
.empty-icon{font-size:3rem;margin-bottom:16px}
.empty p{color:var(--text-muted);font-size:1rem}

/* Footer */
footer{border-top:1px solid var(--border);padding:40px 0;text-align:center;position:relative;z-index:1}
.footer-inner{display:flex;flex-direction:column;align-items:center;gap:16px}
.footer-links{display:flex;gap:20px;align-items:center}
.footer-links a{color:var(--text-dim);text-decoration:none;font-size:.9rem;display:flex;align-items:center;gap:6px;transition:color .2s}
.footer-links a:hover{color:var(--accent2)}
.footer-links a svg{width:18px;height:18px}
.footer-copy{font-size:.82rem;color:var(--text-muted)}

/* Animations */
.card{opacity:0;transform:translateY(20px);animation:fadeUp .5s ease forwards}
@keyframes fadeUp{to{opacity:1;transform:translateY(0)}}
.card:nth-child(1){animation-delay:.02s}.card:nth-child(2){animation-delay:.04s}.card:nth-child(3){animation-delay:.06s}
.card:nth-child(4){animation-delay:.08s}.card:nth-child(5){animation-delay:.1s}.card:nth-child(6){animation-delay:.12s}
.card:nth-child(7){animation-delay:.14s}.card:nth-child(8){animation-delay:.16s}.card:nth-child(9){animation-delay:.18s}

/* Responsive */
@media(max-width:768px){
  .hero{padding:60px 0 32px}
  .stats{gap:32px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
  .card{padding:22px 20px}
}
@media(max-width:480px){
  .grid{grid-template-columns:1fr}
  .filters{gap:6px}
  .filter-btn{padding:7px 14px;font-size:13px}
}
</style>
</head>
<body>

<div class="ambient">
  <div class="orb"></div><div class="orb"></div><div class="orb"></div>
</div>

<!-- Hero -->
<section class="hero">

<!-- Toolbar -->
<div class="container">

<!-- Grid -->
<div class="container">
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty">
    <div class="empty-icon">🔍</div>

</div>

<!-- Footer -->
<footer>
  <div class="container">
    <div class="footer-inner">
      <div class="footer-links">
        <a href="https://github.com/feifei" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/></svg>
          GitHub
        </a>
        <a href="mailto:feifei@example.com">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
          联系作者
        </a>
      </div>
      <div class="footer-copy">© 2025 Feifei · Built with ❤️ and AI · All tools are open source</div>
    </div>
  </div>
</footer>

<script>
const tools = [
  { name:"AI Toolbox", desc:"AI工具集合 — 多功能AI工具箱，一站式解决各种需求", icon:"🧰", cat:"business", link:"#ai-toolbox" },
  { name:"AI ID Photo", desc:"AI证件照生成 — 智能生成标准证件照，支持多种尺寸规格", icon:"📸", cat:"design", link:"#ai-id-photo" },
  { name:"AI Translator", desc:"AI翻译 — 多语言智能翻译，支持语境理解和专业术语", icon:"🌐", cat:"writing", link:"#ai-translator" },
  { name:"AI Resume", desc:"AI简历生成 — 一键生成专业简历，智能优化内容表达", icon:"📄", cat:"business", link:"#ai-resume" },
  { name:"AI Summary Extension", desc:"AI摘要 — 智能提取文章核心内容，快速获取关键信息", icon:"📋", cat:"writing", link:"#ai-summary" },
  { name:"AI Copywriter", desc:"AI文案 — 智能生成营销文案、广告语、社交媒体内容", icon:"✏️", cat:"writing", link:"#ai-copywriter" },
  { name:"QRCode Art", desc:"艺术二维码 — 将普通二维码变成精美艺术作品", icon:"🎭", cat:"design", link:"#qrcode-art" },
  { name:"SEOPilot", desc:"SEO优化 — 智能分析和优化网站SEO，提升搜索排名", icon:"🚀", cat:"business", link:"#seopilot" },
  { name:"WeeklyAI", desc:"AI周报 — 自动生成工作周报，告别周报焦虑", icon:"📊", cat:"writing", link:"#weekly-ai" },
  { name:"MeetingMind", desc:"会议纪要 — 智能整理会议内容，自动提取行动项", icon:"🎯", cat:"writing", link:"#meeting-mind" },
  { name:"MailCraft", desc:"邮件写作 — 智能撰写专业邮件，支持多种场景模板", icon:"📧", cat:"writing", link:"#mailcraft" },
  { name:"ColorMind", desc:"配色方案 — AI生成和谐配色方案，支持多种设计风格", icon:"🎨", cat:"design", link:"#colormind" },
  { name:"AI Diagram Generator", desc:"图表生成 — 用自然语言描述，自动生成流程图和架构图", icon:"📐", cat:"design", link:"#ai-diagram" },
  { name:"AI Code Reviewer", desc:"代码审查 — 智能分析代码质量，发现潜在问题和优化点", icon:"🔍", cat:"dev", link:"#ai-code-reviewer" },
  { name:"AI Logo Generator", desc:"Logo生成 — AI设计品牌Logo，多种风格一键生成", icon:"💎", cat:"design", link:"#ai-logo" },
  { name:"AI SQL Generator", desc:"SQL生成 — 用自然语言描述需求，自动生成SQL查询语句", icon:"🗃️", cat:"dev", link:"#ai-sql" },
  { name:"AI Regex Generator", desc:"正则表达式 — 用自然语言描述规则，自动生成正则表达式", icon:"🔣", cat:"dev", link:"#ai-regex" },
  { name:"AI Git Commit", desc:"Git提交信息 — 分析代码变更，自动生成规范的commit message", icon:"📝", cat:"dev", link:"#ai-git-commit" },
  { name:"AI JSON Toolkit", desc:"JSON工具箱 — 格式化、校验、转换、查询，一站式JSON处理", icon:"🔧", cat:"dev", link:"#ai-json" },
  { name:"AI CSS Generator", desc:"CSS生成 — 用自然语言描述样式，自动生成CSS代码", icon:"🎀", cat:"dev", link:"#ai-css" },
  { name:"AI README Generator", desc:"README生成 — 自动分析项目结构，生成专业的README文档", icon:"📖", cat:"dev", link:"#ai-readme" },
  { name:"AI PPT Generator", desc:"演示文稿 — 输入主题自动生成精美PPT，支持多种模板", icon:"🖥️", cat:"business", link:"#ai-ppt" },
  { name:"AI Favicon Generator", desc:"网站图标 — 一键生成多尺寸favicon，支持SVG和PNG", icon:"⭐", cat:"design", link:"#ai-favicon" },
  { name:"AI Color Palette", desc:"调色板 — 从图片或关键词提取配色，导出设计规范", icon:"🌈", cat:"design", link:"#ai-color-palette" },
  { name:"AI Invoice Generator", desc:"发票生成 — 快速创建专业发票，支持多种格式导出", icon:"🧾", cat:"business", link:"#ai-invoice" },
  { name:"AI Flashcards", desc:"闪卡记忆 — AI生成学习闪卡，科学间隔重复记忆法", icon:"🃏", cat:"writing", link:"#ai-flashcards" },
  { name:"AI Cold Email", desc:"冷启动邮件 — 智能生成高转化率的商务开发邮件", icon:"💌", cat:"business", link:"#ai-cold-email" },
  { name:"AI Slides", desc:"演示文稿 — Markdown驱动的智能幻灯片生成器", icon:"📽️", cat:"business", link:"#ai-slides" },
  { name:"AI Changelog", desc:"更新日志 — 从Git历史自动生成规范的CHANGELOG文档", icon:"📰", cat:"dev", link:"#ai-changelog" },
  { name:"AI API Docs", desc:"API文档 — 自动生成美观的API接口文档，支持OpenAPI规范", icon:"📚", cat:"dev", link:"#ai-api-docs" }
];

const catLabels = { dev:"开发工具", design:"设计工具", writing:"写作工具", business:"商业工具" };
const grid = document.getElementById('grid');
const empty = document.getElementById('empty');
const searchInput = document.getElementById('search');
let activeCat = 'all';

function renderCards(list) {
  grid.innerHTML = '';
  if (list.length === 0) {
    empty.classList.add('show');
    return;
  }
  empty.classList.remove('show');
  list.forEach((t, i) => {
    const card = document.createElement('a');
    card.href = t.link;
    card.className = 'card';
    card.style.animationDelay = `${Math.min(i * 0.03, 0.3)}s`;
    card.innerHTML = `
      <span class="card-icon">${t.icon}</span>
      <div class="card-name">${t.name}</div>
      <div class="card-desc">${t.desc}</div>
      <span class="card-tag">${catLabels[t.cat]}</span>
      <svg class="card-arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
    `;
    grid.appendChild(card);
  });
}

function filterTools() {
  const q = searchInput.value.toLowerCase().trim();
  const filtered = tools.filter(t => {
    const matchCat = activeCat === 'all' || t.cat === activeCat;
    const matchSearch = !q || t.name.toLowerCase().includes(q) || t.desc.toLowerCase().includes(q);
    return matchCat && matchSearch;
  });
  renderCards(filtered);
}

document.getElementById('filters').addEventListener('click', e => {
  const btn = e.target.closest('.filter-btn');
  if (!btn) return;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  activeCat = btn.dataset.cat;
  filterTools();
});

searchInput.addEventListener('input', filterTools);

// Init
renderCards(tools);
</script>
