<!DOCTYPE html>
<html lang="en">
<head>

    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="CSS text-decoration generator with live preview. Customize underline style, color, thickness, and offset. Create wavy, dotted, and dashed text decorations.">
<link rel="canonical" href="https://lifa-su.com/ai-css-text-decoration/">
<title>AI CSS Text Decoration Generator</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#1a1a2e;color:#e0e0e0;min-height:100vh;padding:20px}
h1{text-align:center;font-size:1.8rem;margin:20px 0 30px;color:#e94560}
.container{max-width:900px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:24px}
@media(max-width:700px){.container{grid-template-columns:1fr}}
.panel{background:#16213e;border-radius:12px;padding:24px;border:1px solid #0f3460}
.panel h2{font-size:1.1rem;margin-bottom:18px;color:#e94560}
.control-group{margin-bottom:16px}
.control-group label{display:block;font-size:.85rem;color:#a0a0b8;margin-bottom:6px}
.checkbox-group{display:flex;gap:16px;flex-wrap:wrap}
.checkbox-group label{display:flex;align-items:center;gap:6px;cursor:pointer;font-size:.9rem;color:#e0e0e0}
.checkbox-group input[type=checkbox]{accent-color:#e94560;width:16px;height:16px}
.radio-group{display:flex;gap:10px;flex-wrap:wrap}
.radio-group label{display:flex;align-items:center;gap:5px;cursor:pointer;font-size:.85rem;color:#e0e0e0;background:#0f3460;padding:6px 12px;border-radius:6px;transition:background .2s}
.radio-group label:has(input:checked){background:#e94560}
.radio-group input[type=radio]{display:none}
.slider-row{display:flex;align-items:center;gap:12px}
.slider-row input[type=range]{flex:1;accent-color:#e94560;height:6px}
.slider-val{min-width:42px;text-align:right;font-size:.85rem;color:#e94560;font-weight:600}
input[type=color]{width:50px;height:34px;border:none;border-radius:6px;cursor:pointer;background:transparent}
.color-row{display:flex;align-items:center;gap:12px}
.color-hex{font-size:.85rem;color:#a0a0b8}
.preview-box{background:#0f3460;border-radius:8px;padding:30px;min-height:120px;display:flex;align-items:center;justify-content:center;margin-bottom:18px}
#previewText{font-size:1.6rem;text-align:center;transition:all .2s;word-break:break-word}
.code-box{position:relative;background:#0a0a1a;border-radius:8px;padding:16px;font-family:'SF Mono',Monaco,Consolas,monospace;font-size:.82rem;line-height:1.6;color:#a8d8ea;white-space:pre-wrap;word-break:break-all;min-height:60px}
.copy-btn{position:absolute;top:8px;right:8px;background:#e94560;color:#fff;border:none;padding:6px 14px;border-radius:6px;cursor:pointer;font-size:.78rem;transition:background .2s}
.copy-btn:hover{background:#c73650}
.copy-btn.copied{background:#27ae60}
footer{text-align:center;margin-top:30px;font-size:.75rem;color:#555}
</style>
</head>
<body>
<h1>🎨 CSS Text Decoration Generator</h1>
<div class="container">
  <div class="panel">
    <h2>Controls</h2>
    <div class="control-group">
      <label>text-decoration-line</label>
      <div class="checkbox-group">
        <label><input type="checkbox" value="underline" checked onchange="update()"> underline</label>
        <label><input type="checkbox" value="overline" onchange="update()"> overline</label>
        <label><input type="checkbox" value="line-through" onchange="update()"> line-through</label>
      </div>
    </div>
    <div class="control-group">
      <label>text-decoration-style</label>
      <div class="radio-group">
        <label><input type="radio" name="decStyle" value="solid" checked onchange="update()"> solid</label>
        <label><input type="radio" name="decStyle" value="double" onchange="update()"> double</label>
        <label><input type="radio" name="decStyle" value="dotted" onchange="update()"> dotted</label>
        <label><input type="radio" name="decStyle" value="dashed" onchange="update()"> dashed</label>
        <label><input type="radio" name="decStyle" value="wavy" onchange="update()"> wavy</label>
      </div>
    </div>
    <div class="control-group">
      <label>text-decoration-color</label>
      <div class="color-row">
        <input type="color" id="decColor" value="#e94560" onchange="update()">
        <span class="color-hex" id="colorHex">#e94560</span>
      </div>
    </div>
    <div class="control-group">
      <label>text-decoration-thickness</label>
      <div class="slider-row">
        <input type="range" id="decThickness" min="1" max="10" value="2" oninput="update()">
        <span class="slider-val" id="thicknessVal">2px</span>
      </div>
    </div>
    <div class="control-group">
      <label>text-underline-offset</label>
      <div class="slider-row">
        <input type="range" id="decOffset" min="0" max="20" value="3" oninput="update()">
        <span class="slider-val" id="offsetVal">3px</span>
      </div>
    </div>
  </div>
  <div class="panel">
    <h2>Preview</h2>
    <div class="preview-box">
      <span id="previewText">The quick brown fox jumps over the lazy dog</span>
    </div>
    <h2>Generated CSS</h2>
    <div class="code-box">
      <button class="copy-btn" onclick="copyCSS()">Copy</button>
      <code id="codeOutput"></code>
    </div>
  </div>
</div>
<footer>AI CSS Text Decoration Generator</footer>
<script>
function update(){
  var checks=document.querySelectorAll('.checkbox-group input:checked');
  var lines=[];
  for(var i=0;i<checks.length;i++) lines.push(checks[i].value);
  var line=lines.length?lines.join(' '):'none';
  var style=document.querySelector('input[name=decStyle]:checked').value;
  var color=document.getElementById('decColor').value;
  var thickness=document.getElementById('decThickness').value;
  var offset=document.getElementById('decOffset').value;
  document.getElementById('colorHex').textContent=color;
  document.getElementById('thicknessVal').textContent=thickness+'px';
  document.getElementById('offsetVal').textContent=offset+'px';
  var el=document.getElementById('previewText');
  el.style.textDecorationLine=line;
  el.style.textDecorationStyle=style;
  el.style.textDecorationColor=color;
  el.style.textDecorationThickness=thickness+'px';
  el.style.textUnderlineOffset=offset+'px';
  var css='text-decoration-line: '+line+';\n'
    +'text-decoration-style: '+style+';\n'
    +'text-decoration-color: '+color+';\n'
    +'text-decoration-thickness: '+thickness+'px;\n'
    +'text-underline-offset: '+offset+'px;';
  document.getElementById('codeOutput').textContent=css;
}
function copyCSS(){
  var text=document.getElementById('codeOutput').textContent;
  navigator.clipboard.writeText(text).then(function(){
    var btn=document.querySelector('.copy-btn');
    btn.textContent='Copied!';
    btn.classList.add('copied');
    setTimeout(function(){btn.textContent='Copy';btn.classList.remove('copied');},1500);
  });
}
update();
</script>
<script src="https://alwingulla.com/88/tag.min.js" data-zone="130747" async data-cfasync="false"></script>
<script defer src="/_vercel/insights/script.js"></script>
<script defer src="/_vercel/speed-insights/script.js"></script>
</body>
</html>
