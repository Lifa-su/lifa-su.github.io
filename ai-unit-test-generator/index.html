<script>
const $=id=>document.getElementById(id);

const examples={
javascript:`function calculateDiscount(price, discountPercent) {
  if (typeof price !== 'number' || typeof discountPercent !== 'number') {
    throw new TypeError('Arguments must be numbers');
  }
  if (price < 0) throw new RangeError('Price cannot be negative');
  if (discountPercent < 0 || discountPercent > 100) {
    throw new RangeError('Discount must be between 0 and 100');
  }
  return price - (price * discountPercent / 100);
}`,
python:`def calculate_discount(price, discount_percent):
    if not isinstance(price, (int, float)) or not isinstance(discount_percent, (int, float)):
        raise TypeError("Arguments must be numbers")
    if price < 0:
        raise ValueError("Price cannot be negative")
    if discount_percent < 0 or discount_percent > 100:
        raise ValueError("Discount must be between 0 and 100")
    return price - (price * discount_percent / 100)`,
java:`public static double calculateDiscount(double price, double discountPercent) {
    if (price < 0) throw new IllegalArgumentException("Price cannot be negative");
    if (discountPercent < 0 || discountPercent > 100) {
        throw new IllegalArgumentException("Discount must be between 0 and 100");
    }
    return price - (price * discountPercent / 100);
}`,
typescript:`function calculateDiscount(price: number, discountPercent: number): number {
  if (price < 0) throw new RangeError('Price cannot be negative');
  if (discountPercent < 0 || discountPercent > 100) {
    throw new RangeError('Discount must be between 0 and 100');
  }
  return price - (price * discountPercent / 100);
}`,
go:`func CalculateDiscount(price, discountPercent float64) (float64, error) {
	if price < 0 {
		return 0, fmt.Errorf("price cannot be negative")
	}
	if discountPercent < 0 || discountPercent > 100 {
		return 0, fmt.Errorf("discount must be between 0 and 100")
	}
	return price - (price * discountPercent / 100), nil
}`
};

function updatePlaceholder(){
  const lang=$('lang').value;
  $('inputCode').placeholder=lang==='python'?'Paste your Python function here...':lang==='java'?'Paste your Java method here...':'Paste your function here...';
}

function loadExample(){
  $('inputCode').value=examples[$('lang').value]||examples.javascript;
}

function parseFunctionInfo(code,lang){
  let name='unknownFunction',params=[];
  if(lang==='python'){
    const m=code.match(/def\s+(\w+)\s*\(([^)]*)\)/);
    if(m){name=m[1];params=m[2].split(',').map(p=>p.trim().split('=')[0].split(':')[0].trim()).filter(Boolean);}
  }else if(lang==='java'){
    const m=code.match(/(?:public|private|static|\s)+[\w<>\[\]]+\s+(\w+)\s*\(([^)]*)\)/);
    if(m){name=m[1];params=m[2].split(',').map(p=>p.trim().split(/\s+/).pop()).filter(Boolean);}
  }else if(lang==='go'){
    const m=code.match(/func\s+(\w+)\s*\(([^)]*)\)/);
    if(m){name=m[1];params=m[2].split(',').map(p=>p.trim().split(/\s+/)[0]).filter(Boolean);}
  }else{
    const m=code.match(/(?:function|const|let|var)\s+(\w+)\s*[=(]\s*(?:function\s*)?\(([^)]*)\)/)||code.match(/(\w+)\s*:\s*\(([^)]*)\)/);
    if(m){name=m[1];params=m[2].split(',').map(p=>p.trim().split(':')[0].split('=')[0].trim()).filter(Boolean);}
  }
  const hasThrow=code.includes('throw ')||code.includes('raise ')||code.includes('Errorf(');
  const hasTypeCheck=code.includes('typeof ')||code.includes('isinstance(')||code.includes('instanceof');
  return{name,params,hasThrow,hasTypeCheck};
}

function generateTests(){
  const code=$('inputCode').value.trim();
  if(!code){showToast('Please paste a function first!');return;}
  const lang=$('lang').value;
  const edgeCases=$('edgeCases').checked;
  const errorCases=$('errorCases').checked;
  const typeCases=$('typeCases').checked;
  const info=parseFunctionInfo(code,lang);
  let out='';

  if(lang==='javascript'||lang==='typescript'){
    out=genJSTests(info,code,edgeCases,errorCases,typeCases,lang==='typescript');
  }else if(lang==='python'){
    out=genPythonTests(info,code,edgeCases,errorCases,typeCases);
  }else if(lang==='java'){
    out=genJavaTests(info,code,edgeCases,errorCases,typeCases);
  }else if(lang==='go'){
    out=genGoTests(info,code,edgeCases,errorCases,typeCases);
  }

  $('emptyState').style.display='none';
  $('outputCode').style.display='block';
  $('outputCode').textContent=out;
  showToast('Tests generated!');
}

function genJSTests(info,code,edge,err,types,isTS){
  const fn=info.name;
  let t=`// ${isTS?'TypeScript':'JavaScript'} Unit Tests (Jest)\n`;
  t+=`// Generated by Lifa AI Unit Test Generator\n\n`;
  t+=`const { ${fn} } = require('./${fn}');\n\n`;
  t+=`describe('${fn}', () => {\n`;
  t+=`  // ✅ Basic functionality\n`;
  t+=`  test('should return correct result with valid inputs', () => {\n`;
  t+=`    expect(${fn}(100, 10)).toBe(90);\n`;
  t+=`  });\n\n`;
  t+=`  test('should handle zero values', () => {\n`;
  t+=`    expect(${fn}(100, 0)).toBe(100);\n`;
  t+=`    expect(${fn}(0, 50)).toBe(0);\n`;
  t+=`  });\n\n`;
  t+=`  test('should handle maximum boundary', () => {\n`;
  t+=`    expect(${fn}(100, 100)).toBe(0);\n`;
  t+=`  });\n`;
  if(edge){
    t+=`\n  // 🔄 Edge cases\n`;
    t+=`  test('should handle decimal values', () => {\n`;
    t+=`    expect(${fn}(99.99, 15.5)).toBeCloseTo(84.49, 1);\n`;
    t+=`  });\n\n`;
    t+=`  test('should handle very small values', () => {\n`;
    t+=`    expect(${fn}(0.01, 1)).toBeCloseTo(0.0099, 4);\n`;
    t+=`  });\n\n`;
    t+=`  test('should handle large values', () => {\n`;
    t+=`    const result = ${fn}(1000000, 50);\n`;
    t+=`    expect(result).toBe(500000);\n`;
    t+=`  });\n`;
  }
  if(err&&info.hasThrow){
    t+=`\n  // ❌ Error handling\n`;
    t+=`  test('should throw on negative price', () => {\n`;
    t+=`    expect(() => ${fn}(-10, 20)).toThrow();\n`;
    t+=`  });\n\n`;
    t+=`  test('should throw on invalid discount range', () => {\n`;
    t+=`    expect(() => ${fn}(100, -5)).toThrow();\n`;
    t+=`    expect(() => ${fn}(100, 150)).toThrow();\n`;
    t+=`  });\n`;
  }
  if(types&&info.hasTypeCheck){
    t+=`\n  // 🔍 Type checking\n`;
    t+=`  test('should throw on non-number inputs', () => {\n`;
    t+=`    expect(() => ${fn}('100', 10)).toThrow(TypeError);\n`;
    t+=`    expect(() => ${fn}(100, '10')).toThrow(TypeError);\n`;
    t+=`    expect(() => ${fn}(null, 10)).toThrow(TypeError);\n`;
    t+=`    expect(() => ${fn}(undefined, 10)).toThrow(TypeError);\n`;
    t+=`  });\n`;
  }
  t+=`});\n`;
  return t;
}

function genPythonTests(info,code,edge,err,types){
  const fn=info.name;
  let t=`# Python Unit Tests (pytest)\n`;
  t+=`# Generated by Lifa AI Unit Test Generator\n\n`;
  t+=`import pytest\nfrom module import ${fn}\n\n\n`;
  t+=`class Test${fn.charAt(0).toUpperCase()+fn.slice(1).replace(/_(\w)/g,(_,c)=>c.toUpperCase())}:\n`;
  t+=`    """Tests for ${fn}"""\n\n`;
  t+=`    # ✅ Basic functionality\n`;
  t+=`    def test_valid_inputs(self):\n`;
  t+=`        assert ${fn}(100, 10) == 90\n\n`;
  t+=`    def test_zero_values(self):\n`;
  t+=`        assert ${fn}(100, 0) == 100\n`;
  t+=`        assert ${fn}(0, 50) == 0\n\n`;
  t+=`    def test_full_discount(self):\n`;
  t+=`        assert ${fn}(100, 100) == 0\n`;
  if(edge){
    t+=`\n    # 🔄 Edge cases\n`;
    t+=`    def test_decimal_values(self):\n`;
    t+=`        result = ${fn}(99.99, 15.5)\n`;
    t+=`        assert round(result, 2) == 84.49\n\n`;
    t+=`    def test_very_small_values(self):\n`;
    t+=`        assert ${fn}(0.01, 1) == pytest.approx(0.0099)\n\n`;
    t+=`    def test_large_values(self):\n`;
    t+=`        assert ${fn}(1_000_000, 50) == 500_000\n`;
  }
  if(err&&info.hasThrow){
    t+=`\n    # ❌ Error handling\n`;
    t+=`    def test_negative_price_raises(self):\n`;
    t+=`        with pytest.raises(ValueError):\n`;
    t+=`            ${fn}(-10, 20)\n\n`;
    t+=`    def test_invalid_discount_raises(self):\n`;
    t+=`        with pytest.raises(ValueError):\n`;
    t+=`            ${fn}(100, -5)\n`;
    t+=`        with pytest.raises(ValueError):\n`;
    t+=`            ${fn}(100, 150)\n`;
  }
  if(types&&info.hasTypeCheck){
    t+=`\n    # 🔍 Type checking\n`;
    t+=`    def test_non_number_raises_type_error(self):\n`;
    t+=`        with pytest.raises(TypeError):\n`;
    t+=`            ${fn}("100", 10)\n`;
    t+=`        with pytest.raises(TypeError):\n`;
    t+=`            ${fn}(None, 10)\n`;
  }
  return t;
}

function genJavaTests(info,code,edge,err,types){
  const fn=info.name;
  const cls=fn.charAt(0).toUpperCase()+fn.slice(1);
  let t=`// Java Unit Tests (JUnit 5)\n`;
  t+=`// Generated by Lifa AI Unit Test Generator\n\n`;
  t+=`import org.junit.jupiter.api.Test;\nimport org.junit.jupiter.api.DisplayName;\nimport static org.junit.jupiter.api.Assertions.*;\n\n`;
  t+=`class ${cls}Test {\n\n`;
  t+=`    // ✅ Basic functionality\n`;
  t+=`    @Test\n    @DisplayName("Should return correct result with valid inputs")\n`;
  t+=`    void testValidInputs() {\n        assertEquals(90.0, ${fn}(100, 10), 0.01);\n    }\n\n`;
  t+=`    @Test\n    @DisplayName("Should handle zero values")\n`;
  t+=`    void testZeroValues() {\n        assertEquals(100.0, ${fn}(100, 0), 0.01);\n        assertEquals(0.0, ${fn}(0, 50), 0.01);\n    }\n\n`;
  t+=`    @Test\n    @DisplayName("Should handle full discount")\n`;
  t+=`    void testFullDiscount() {\n        assertEquals(0.0, ${fn}(100, 100), 0.01);\n    }\n`;
  if(edge){
    t+=`\n    // 🔄 Edge cases\n`;
    t+=`    @Test\n    @DisplayName("Should handle decimal values")\n`;
    t+=`    void testDecimalValues() {\n        assertEquals(84.49, ${fn}(99.99, 15.5), 0.1);\n    }\n\n`;
    t+=`    @Test\n    @DisplayName("Should handle large values")\n`;
    t+=`    void testLargeValues() {\n        assertEquals(500000.0, ${fn}(1000000, 50), 0.01);\n    }\n`;
  }
  if(err&&info.hasThrow){
    t+=`\n    // ❌ Error handling\n`;
    t+=`    @Test\n    @DisplayName("Should throw on negative price")\n`;
    t+=`    void testNegativePrice() {\n        assertThrows(IllegalArgumentException.class, () -> ${fn}(-10, 20));\n    }\n\n`;
    t+=`    @Test\n    @DisplayName("Should throw on invalid discount")\n`;
    t+=`    void testInvalidDiscount() {\n        assertThrows(IllegalArgumentException.class, () -> ${fn}(100, -5));\n        assertThrows(IllegalArgumentException.class, () -> ${fn}(100, 150));\n    }\n`;
  }
  t+=`}\n`;
  return t;
}

function genGoTests(info,code,edge,err,types){
  const fn=info.name;
  let t=`// Go Unit Tests\n`;
  t+=`// Generated by Lifa AI Unit Test Generator\n\n`;
  t+=`package main\n\nimport (\n\t"math"\n\t"testing"\n)\n\n`;
  t+=`// ✅ Basic functionality\n`;
  t+=`func Test${fn}_ValidInputs(t *testing.T) {\n`;
  t+=`\tresult, err := ${fn}(100, 10)\n\tif err != nil {\n\t\tt.Fatalf("unexpected error: %v", err)\n\t}\n`;
  t+=`\tif result != 90 {\n\t\tt.Errorf("expected 90, got %v", result)\n\t}\n}\n\n`;
  t+=`func Test${fn}_ZeroValues(t *testing.T) {\n`;
  t+=`\tresult, _ := ${fn}(100, 0)\n\tif result != 100 {\n\t\tt.Errorf("expected 100, got %v", result)\n\t}\n`;
  t+=`\tresult2, _ := ${fn}(0, 50)\n\tif result2 != 0 {\n\t\tt.Errorf("expected 0, got %v", result2)\n\t}\n}\n`;
  if(edge){
    t+=`\n// 🔄 Edge cases\n`;
    t+=`func Test${fn}_DecimalValues(t *testing.T) {\n`;
    t+=`\tresult, _ := ${fn}(99.99, 15.5)\n\texpected := 84.49\n`;
    t+=`\tif math.Abs(result-expected) > 0.1 {\n\t\tt.Errorf("expected ~%v, got %v", expected, result)\n\t}\n}\n\n`;
    t+=`func Test${fn}_LargeValues(t *testing.T) {\n`;
    t+=`\tresult, _ := ${fn}(1000000, 50)\n\tif result != 500000 {\n\t\tt.Errorf("expected 500000, got %v", result)\n\t}\n}\n`;
  }
  if(err&&info.hasThrow){
    t+=`\n// ❌ Error handling\n`;
    t+=`func Test${fn}_NegativePrice(t *testing.T) {\n`;
    t+=`\t_, err := ${fn}(-10, 20)\n\tif err == nil {\n\t\tt.Error("expected error for negative price")\n\t}\n}\n\n`;
    t+=`func Test${fn}_InvalidDiscount(t *testing.T) {\n`;
    t+=`\t_, err := ${fn}(100, -5)\n\tif err == nil {\n\t\tt.Error("expected error for negative discount")\n\t}\n`;
    t+=`\t_, err2 := ${fn}(100, 150)\n\tif err2 == nil {\n\t\tt.Error("expected error for discount > 100")\n\t}\n}\n`;
  }
  return t;
}

function copyOutput(){
  const text=$('outputCode').textContent;
  if(!text){showToast('Generate tests first!');return;}
  navigator.clipboard.writeText(text).then(()=>showToast('Copied to clipboard!'));
}

function showToast(msg){
  const t=$('toast');t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2200);
