<!DOCTYPE html>
<html lang="en">
<head>

    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Convert between YAML and JSON formats instantly. Paste YAML to get JSON or vice versa. Validate syntax, format output, and handle complex nested structures.">
<link rel="canonical" href="https://lifa-su.com/ai-yaml-json/">
<title>YAML ↔ JSON Converter</title>
<script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#1a1a2e;--sf:#16213e;--sf2:#0f3460;--ac:#e94560;--ac2:#533483;--tx:#eee;--tx2:#aab;--bd:#2a2a4e;--ok:#4ecca3;--err:#e94560;--fn:'SF Mono',Consolas,'Liberation Mono',Menlo,monospace}
body{background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;min-height:100vh;display:flex;flex-direction:column}
header{text-align:center;padding:1.5rem 1rem .8rem}
header h1{font-size:1.6rem;font-weight:700;background:linear-gradient(135deg,var(--ac),var(--ac2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
header p{color:var(--tx2);font-size:.85rem;margin-top:.3rem}
.ct{flex:1;display:flex;flex-direction:column;padding:0 1rem 1rem;max-width:1400px;width:100%;margin:0 auto}
.ctrls{display:flex;align-items:center;justify-content:center;gap:.6rem;padding:.8rem 0;flex-wrap:wrap}
.btn{background:var(--sf2);color:var(--tx);border:1px solid var(--bd);padding:.5rem 1.1rem;border-radius:6px;cursor:pointer;font-size:.85rem;transition:all .2s;display:inline-flex;align-items:center;gap:.4rem}
.btn:hover{background:var(--ac2);border-color:var(--ac2)}
.btn.pri{background:var(--ac);border-color:var(--ac)}
.btn.pri:hover{background:#d63050;border-color:#d63050}
.swp{font-size:1.2rem;background:transparent;border:2px solid var(--ac);color:var(--ac);width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer;transition:all .3s}
.swp:hover{background:var(--ac);color:#fff;transform:rotate(180deg)}
.eds{display:flex;gap:1rem;flex:1;min-height:0}
.ep{flex:1;display:flex;flex-direction:column;min-width:0}
.ph{display:flex;align-items:center;justify-content:space-between;padding:.5rem .8rem;background:var(--sf);border-radius:8px 8px 0 0;border:1px solid var(--bd);border-bottom:none}
.pl{font-size:.8rem;font-weight:600;color:var(--tx2);text-transform:uppercase;letter-spacing:.05em}
.cb{background:transparent;border:1px solid var(--bd);color:var(--tx2);padding:.25rem .6rem;border-radius:4px;cursor:pointer;font-size:.75rem;transition:all .2s}
.cb:hover{border-color:var(--ok);color:var(--ok)}
.cb.ok{border-color:var(--ok);color:var(--ok);background:rgba(78,204,163,.1)}
.ew{flex:1;position:relative;border:1px solid var(--bd);border-radius:0 0 8px 8px;overflow:hidden;display:flex;min-height:300px}
textarea{width:100%;height:100%;background:var(--sf);color:transparent;caret-color:var(--tx);border:none;padding:.8rem;font-family:var(--fn);font-size:.85rem;line-height:1.6;resize:none;outline:none;tab-size:2;position:relative;z-index:1}
textarea::placeholder{color:var(--tx2);opacity:.5}
.hl{position:absolute;top:0;left:0;right:0;bottom:0;padding:.8rem;font-family:var(--fn);font-size:.85rem;line-height:1.6;white-space:pre-wrap;word-wrap:break-word;pointer-events:none;overflow:hidden;tab-size:2}
.hk{color:#e94560}.hs{color:#4ecca3}.hn{color:#f9a825}.hb{color:#ce93d8}.hu{color:#78909c}.hp{color:#64b5f6}.hc{color:#aab}.hm{color:#546e7a;font-style:italic}
.eb{background:rgba(233,69,96,.12);border:1px solid var(--err);border-radius:6px;padding:.6rem .8rem;margin-top:.5rem;font-size:.8rem;color:var(--err);display:none;word-break:break-word}
.eb.show{display:block}
footer{text-align:center;padding:1rem;color:var(--tx2);font-size:.75rem;border-top:1px solid var(--bd);margin-top:auto}
footer a{color:var(--ac);text-decoration:none}
@media(max-width:768px){.eds{flex-direction:column}.ew{min-height:200px}header h1{font-size:1.3rem}.ctrls{gap:.4rem}.btn{padding:.45rem .8rem;font-size:.8rem}}
</style>
</head>
<body>
<header>
<h1>YAML ↔ JSON Converter</h1>
<p>Fast, offline-ready conversion with syntax highlighting</p>
</header>
<div class="ct">
<div class="ctrls">
<button class="btn pri" onclick="convert('y2j')">YAML → JSON</button>
<button class="swp" onclick="swapPanels()" title="Swap">⇄</button>
<button class="btn pri" onclick="convert('j2y')">JSON → YAML</button>
<button class="btn" onclick="formatInput()">Format</button>
<button class="btn" onclick="clearAll()">Clear</button>
<button class="btn" onclick="loadSample()">Sample</button>
</div>
<div class="eds">
<div class="ep">
<div class="ph"><span class="pl" id="inL">Input</span><button class="cb" onclick="copyText('inp',this)">Copy</button></div>
<div class="ew">
<div class="hl" id="inHL"></div>
<textarea id="inp" placeholder="Paste YAML or JSON here..." spellcheck="false" oninput="doHL('inp')" onscroll="syncScroll('inp')"></textarea>
</div>
</div>
<div class="ep">
<div class="ph"><span class="pl" id="outL">Output</span><button class="cb" onclick="copyText('out',this)">Copy</button></div>
<div class="ew">
<div class="hl" id="outHL"></div>
<textarea id="out" placeholder="Converted result appears here..." spellcheck="false" readonly onscroll="syncScroll('out')"></textarea>
</div>
</div>
</div>
<div class="eb" id="errBar"></div>
</div>
<footer><p>YAML ↔ JSON Converter — <a href="https://github.com/Lifa-su/ai-yaml-json" target="_blank">GitHub</a></p></footer>
<script>
const $=id=>document.getElementById(id);
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

function hlJSON(s){
  return esc(s).replace(/"([^"\\]|\\.)*"\s*:/g,m=>'<span class="hk">'+m.slice(0,-1)+'</span><span class="hc">:</span>')
    .replace(/"([^"\\]|\\.)*"/g,'<span class="hs">$&</span>')
    .replace(/\b(-?\d+\.?\d*([eE][+-]?\d+)?)\b/g,'<span class="hn">$&</span>')
    .replace(/\b(true|false)\b/g,'<span class="hb">$&</span>')
    .replace(/\bnull\b/g,'<span class="hu">$&</span>')
    .replace(/[{}\[\]]/g,'<span class="hp">$&</span>');
}

function hlYAML(s){
  return esc(s).split('\n').map(line=>{
    if(/^\s*#/.test(line))return'<span class="hm">'+line+'</span>';
    if(/^\s*-\s/.test(line)){
      line=line.replace(/^(\s*)(-)(\s)/,'$1<span class="hk">$2</span>$3');
    }
    line=line.replace(/^(\s*)([\w][\w\s.-]*)(:)/,'$1<span class="hk">$2</span><span class="hc">$3</span>');
    line=line.replace(/'([^']*)'/g,'<span class="hs">$&</span>');
    line=line.replace(/"([^"\\]|\\.)*"/g,'<span class="hs">$&</span>');
    line=line.replace(/\b(true|false|yes|no|on|off)\b/gi,m=>'<span class="hb">'+m+'</span>');
    line=line.replace(/\bnull\b/gi,'<span class="hu">$&</span>');
    line=line.replace(/:\s+(-?\d+\.?\d*)\s*$/,':<span class="hn"> $1</span>');
    line=line.replace(/#(.*)$/,'<span class="hm">#$1</span>');
    return line;
  }).join('\n');
}

function doHL(id){
  const ta=$(id);
  const hl=$(id==='inp'?'inHL':'outHL');
  const v=ta.value;
  const isJSON=v.trimStart().startsWith('{') || v.trimStart().startsWith('[');
  hl.innerHTML=isJSON?hlJSON(v):hlYAML(v);
}

function syncScroll(id){
  const ta=$(id);
  const hl=$(id==='inp'?'inHL':'outHL');
  hl.scrollTop=ta.scrollTop;
  hl.scrollLeft=ta.scrollLeft;
}

function showErr(msg){const e=$('errBar');e.textContent=msg;e.classList.add('show')}
function hideErr(){$('errBar').classList.remove('show')}

function convert(mode){
  hideErr();
  const inp=$('inp').value.trim();
  if(!inp){showErr('Input is empty');return}
  try{
    let result;
    if(mode==='y2j'){
      const obj=jsyaml.load(inp);
      result=JSON.stringify(obj,null,2);
      $('inL').textContent='YAML';
      $('outL').textContent='JSON';
    }else{
      const obj=JSON.parse(inp);
      result=jsyaml.dump(obj,{indent:2,lineWidth:-1,noRefs:true});
      $('inL').textContent='JSON';
      $('outL').textContent='YAML';
    }
    $('out').value=result;
    $('out').removeAttribute('readonly');
    doHL('out');
  }catch(e){
    let msg=e.message||'Parse error';
    if(e.mark)msg+=` (line ${e.mark.line+1}, col ${e.mark.column+1})`;
    showErr(msg);
  }
}

function swapPanels(){
  const a=$('inp'),b=$('out');
  const tmp=a.value;a.value=b.value;b.value=tmp;
  const la=$('inL'),lb=$('outL');
  const tl=la.textContent;la.textContent=lb.textContent;lb.textContent=tl;
  doHL('inp');doHL('out');hideErr();
}

function formatInput(){
  hideErr();
  const v=$('inp').value.trim();
  if(!v)return;
  try{
    if(v.startsWith('{')||v.startsWith('[')){
      $('inp').value=JSON.stringify(JSON.parse(v),null,2);
    }else{
      $('inp').value=jsyaml.dump(jsyaml.load(v),{indent:2,lineWidth:-1,noRefs:true});
    }
    doHL('inp');
  }catch(e){showErr('Format error: '+e.message)}
}

function clearAll(){$('inp').value='';$('out').value='';doHL('inp');doHL('out');hideErr()}

function loadSample(){
  $('inp').value=`# Sample YAML Configuration
server:
  host: localhost
  port: 8080
  ssl: true

database:
  driver: postgresql
  host: db.example.com
  port: 5432
  name: myapp
  credentials:
    username: admin
    password: secret123

features:
  - name: authentication
    enabled: true
    providers:
      - google
      - github
  - name: caching
    enabled: false
    ttl: 3600

logging:
  level: info
  format: json
  outputs:
    - stdout
    - file: /var/log/app.log`;
  doHL('inp');hideErr();
  $('inL').textContent='YAML';
  $('outL').textContent='Output';
}

async function copyText(id,btn){
  const ta=$(id==='inp'?'inp':'out');
  if(!ta.value){return}
  try{
    await navigator.clipboard.writeText(ta.value);
    btn.textContent='Copied!';btn.classList.add('ok');
    setTimeout(()=>{btn.textContent='Copy';btn.classList.remove('ok')},1500);
  }catch(e){
    ta.select();document.execCommand('copy');
    btn.textContent='Copied!';btn.classList.add('ok');
    setTimeout(()=>{btn.textContent='Copy';btn.classList.remove('ok')},1500);
  }
}

// Tab key support
document.querySelectorAll('textarea').forEach(ta=>{
  ta.addEventListener('keydown',e=>{
    if(e.key==='Tab'){
      e.preventDefault();
      const s=ta.selectionStart,end=ta.selectionEnd;
      ta.value=ta.value.substring(0,s)+'  '+ta.value.substring(end);
      ta.selectionStart=ta.selectionEnd=s+2;
      doHL(ta.id);
    }
  });
});
</script>
<script async src="https://alwingulla.com/88/tag.min.js" data-zone="130647" data-cfasync="false"></script>
<script defer src="/_vercel/insights/script.js"></script>
<script defer src="/_vercel/speed-insights/script.js"></script>
</body>
</html>
