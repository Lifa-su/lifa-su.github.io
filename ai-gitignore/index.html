// State
const state={selected:new Set(),category:"All",search:""}
const CATS=["All",...[...new Set(TEMPLATES.map(t=>t.cat))]]

// DOM refs
const $tags=document.getElementById("selected-tags")
const $list=document.getElementById("template-list")
const $cats=document.getElementById("categories")
const $preview=document.getElementById("preview-content")
const $stats=document.getElementById("stats")
const $lines=document.getElementById("line-count")
const $search=document.getElementById("search")
const $custom=document.getElementById("custom-rules")
const $toast=document.getElementById("toast")

function renderCategories(){
  $cats.innerHTML=CATS.map(c=>`<button class="cat-btn${state.category===c?" active":""}" onclick="setCat('${c}')">${c}</button>`).join("")
}

function setCat(c){state.category=c;renderCategories();renderTemplates()}

function renderTemplates(){
  const q=state.search.toLowerCase()
  const filtered=TEMPLATES.filter(t=>{
    if(state.category!=="All"&&t.cat!==state.category)return false
    if(q&&!t.name.toLowerCase().includes(q))return false
    return true
  })
  if(!filtered.length){$list.innerHTML='<div class="no-results">No templates found</div>';return}
  $list.innerHTML=filtered.map(t=>{
    const sel=state.selected.has(t.name)
    return `<div class="tmpl-item${sel?" selected":""}" onclick="toggle('${t.name.replace(/'/g,"\\'")}')">
      <span class="icon">${t.icon}</span>
      <span class="name">${t.name}</span>
      <span class="check">${sel?"\u2713":""}</span>
    </div>`
  }).join("")
}

function toggle(name){
  if(state.selected.has(name))state.selected.delete(name)
  else state.selected.add(name)
  renderAll()
}

function renderTags(){
  if(!state.selected.size){$tags.innerHTML='<span class="placeholder">No templates selected</span>';return}
  $tags.innerHTML=[...state.selected].map(name=>`<span class="tag" onclick="removeTag(this,'${name.replace(/'/g,"\\'")}')">${name}<span class="remove">\u00d7</span></span>`).join("")
}

function removeTag(el,name){
  el.classList.add("removing")
  setTimeout(()=>{state.selected.delete(name);renderAll()},200)
}

function generateContent(){
  let parts=[]
  for(const name of state.selected){
    const t=TEMPLATES.find(x=>x.name===name)
    if(t)parts.push(t.rules)
  }
  const custom=$custom.value.trim()
  if(custom)parts.push("# Custom Rules\n"+custom)
  return parts.join("\n\n")
}

function renderPreview(){
  const content=generateContent()
  if(!content){
    $preview.innerHTML='<div class="preview-empty"><div class="icon">\U0001f4c4</div><p>Select templates from the left panel<br>to generate your .gitignore file</p></div>'
    $lines.textContent="0 lines"
    return
  }
  const lines=content.split("\n").length
  $preview.innerHTML=`<pre>${escapeHtml(content)}</pre>`
  $lines.textContent=lines+" line"+(lines!==1?"s":"")
}

function escapeHtml(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}

function renderAll(){
  renderCategories()
  renderTemplates()
  renderTags()
  renderPreview()
  $stats.textContent=state.selected.size+" selected"
}

function copyToClipboard(){
  const content=generateContent()
  if(!content){showToast("\u26a0\ufe0f Nothing to copy!");return}
  navigator.clipboard.writeText(content).then(()=>{showToast("\u2705 Copied to clipboard!")}).catch(()=>{
    const ta=document.createElement("textarea");ta.value=content;document.body.appendChild(ta);ta.select();document.execCommand("copy");document.body.removeChild(ta);showToast("\u2705 Copied to clipboard!")
  })
}

function downloadFile(){
  const content=generateContent()
  if(!content){showToast("\u26a0\ufe0f Nothing to download!");return}
  const blob=new Blob([content],{type:"text/plain"})
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=".gitignore";a.click();URL.revokeObjectURL(a.href)
  showToast("\U0001f4e5 Downloaded .gitignore!")
}

function clearAll(){
  state.selected.clear()
  $custom.value=""
  renderAll()
}

function showToast(msg){
  $toast.textContent=msg
  $toast.classList.add("show")
  setTimeout(()=>$toast.classList.remove("show"),2500)
}

// Events
$search.addEventListener("input",e=>{state.search=e.target.value;renderTemplates()})
$custom.addEventListener("input",renderPreview)

// Init
renderAll()
</script>
