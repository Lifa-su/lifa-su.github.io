<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Divider Generator - Free SVG Section Dividers for Web Design</title>
<meta name="description" content="Generate beautiful SVG section dividers for your website. Wave, zigzag, curve, arrow, cloud, triangle and slant styles with real-time preview and code export.">
<link rel="canonical" href="https://lifa-su.com/ai-divider-generator/">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>〰️</text></svg>">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0f0f23;color:#e2e2f0;line-height:1.6}
.hd{text-align:center;padding:2.5rem 1rem 1.5rem}
.hd h1{font-size:2.2rem;font-weight:800;background:linear-gradient(135deg,#ff6b35,#f7931e);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.hd p{color:#8888aa;margin-top:.4rem}
.wrap{max-width:1200px;margin:0 auto;padding:0 1rem 3rem;display:grid;grid-template-columns:320px 1fr;gap:1.5rem;align-items:start}
@media(max-width:860px){.wrap{grid-template-columns:1fr}}
.pnl{background:#1a1a2e;border:1px solid #2a2a4a;border-radius:12px;padding:1.5rem;position:sticky;top:1rem}
.pnl h2{font-size:1rem;margin-bottom:1rem}
.cg{margin-bottom:1.1rem}
.cg label{display:block;font-size:.82rem;color:#8888aa;margin-bottom:.35rem;font-weight:500}
.sg{display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:.4rem}
.sb{background:#222240;border:2px solid #2a2a4a;border-radius:8px;padding:.4rem .2rem;color:#e2e2f0;cursor:pointer;font-size:.72rem;text-align:center;transition:.2s}
.sb:hover{border-color:#ff6b35}
.sb.on{border-color:#ff6b35;background:rgba(255,107,53,.12)}
.sb svg{display:block;margin:0 auto .2rem;width:56px;height:20px}
.cr{display:flex;gap:.6rem}
.ci{flex:1;display:flex;align-items:center;gap:.4rem;background:#222240;border:1px solid #2a2a4a;border-radius:8px;padding:.3rem .5rem}
.ci input[type=color]{width:26px;height:26px;border:none;background:none;cursor:pointer;padding:0}
.ci input[type=color]::-webkit-color-swatch-wrapper{padding:0}
.ci input[type=color]::-webkit-color-swatch{border:1px solid #2a2a4a;border-radius:3px}
.ci span{font-size:.78rem;color:#8888aa;font-family:monospace}
.rw{display:flex;align-items:center;gap:.6rem}
.rw input[type=range]{flex:1;-webkit-appearance:none;height:5px;background:#2a2a4a;border-radius:3px;outline:none}
.rw input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;background:#ff6b35;border-radius:50%;cursor:pointer}
.rv{font-size:.85rem;color:#ff6b35;font-weight:600;min-width:36px;text-align:right}
.tr{display:flex;gap:.4rem;flex-wrap:wrap}
.tb{background:#222240;border:1px solid #2a2a4a;border-radius:8px;padding:.4rem .7rem;color:#8888aa;cursor:pointer;font-size:.78rem;transition:.2s}
.tb:hover{border-color:#ff6b35}
.tb.on{border-color:#ff6b35;color:#ff6b35;background:rgba(255,107,53,.1)}
.pa{background:#1a1a2e;border:1px solid #2a2a4a;border-radius:12px;overflow:hidden}
.ph{padding:.8rem 1.2rem;border-bottom:1px solid #2a2a4a;font-size:1rem;font-weight:600}
.ps{padding:1.5rem;text-align:center;font-size:.85rem;color:#8888aa}
.ps.t{background:#16213e}
.ps.b{background:#0f3460}
.dp{display:block;width:100%;line-height:0}
.dp svg{display:block;width:100%}
.cb{background:#1a1a2e;border:1px solid #2a2a4a;border-radius:12px;overflow:hidden;margin-top:.8rem}
.cbh{display:flex;justify-content:space-between;align-items:center;padding:.6rem 1rem;border-bottom:1px solid #2a2a4a}
.cbh span{font-size:.82rem;font-weight:600;color:#8888aa}
.cpb{background:linear-gradient(135deg,#ff6b35,#f7931e);border:none;color:#fff;padding:.3rem .7rem;border-radius:6px;cursor:pointer;font-size:.76rem;font-weight:600}
.cpb:hover{opacity:.85}
.cpb.ok{background:#22c55e}
.cc{padding:.8rem 1rem;overflow-x:auto;font-size:.76rem;line-height:1.5;color:#c8c8e0;font-family:'SF Mono',Monaco,Consolas,monospace;white-space:pre-wrap;word-break:break-all;max-height:180px;overflow-y:auto}
.ft{text-align:center;padding:2rem 1rem;color:#8888aa;font-size:.8rem;border-top:1px solid #2a2a4a;margin-top:2rem}
</style>
</head>
<body>
<div class="hd"><h1>〰️ AI Divider Generator</h1><p>Create beautiful SVG section dividers for your website</p></div>
<div class="wrap">
<div class="pnl">
<h2>⚙️ Settings</h2>
<div class="cg"><label>Style</label><div class="sg" id="sg"></div></div>
<div class="cg"><label>Colors</label>
<div class="cr">
<div class="ci"><input type="color" id="fg" value="#ff6b35"><span id="fgV">#ff6b35</span></div>
<div class="ci"><input type="color" id="bg" value="#0f0f23"><span id="bgV">#0f0f23</span></div>
</div>
</div>
<div class="cg"><label>Height: <span id="hV">100</span>px</label>
<div class="rw"><input type="range" id="ht" min="20" max="200" value="100"><div class="rv" id="hD">100</div></div>
</div>
<div class="cg"><label>Transform</label>
<div class="tr">
<button class="tb" data-t="flipH" onclick="tog(this,'flipH')">↔ Flip H</button>
<button class="tb" data-t="flipV" onclick="tog(this,'flipV')">↕ Flip V</button>
<button class="tb" data-t="rot" onclick="tog(this,'rot')">🔄 Rotate 180°</button>
</div>
</div>
</div>
<div>
<div class="pa"><div class="ph">👁️ Preview</div><div id="prev" class="pbox"></div></div>
<div class="cb"><div class="cbh"><span>SVG Code</span><button class="cpb" onclick="cp('svg',this)">Copy</button></div><pre class="cc" id="svgOut"></pre></div>
<div class="cb"><div class="cbh"><span>CSS Code</span><button class="cpb" onclick="cp('css',this)">Copy</button></div><pre class="cc" id="cssOut"></pre></div>
</div>
</div>
<div class="ft">AI Divider Generator — Free SVG section dividers for web design</div>
<script>
const S={
wave:(w,h,fg,bg)=>`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 ${h}" preserveAspectRatio="none"><rect fill="${bg}" width="1200" height="${h}"/><path d="M0 ${h*.4}C200 ${h*.1} 400 ${h*.7} 600 ${h*.4}S1000 ${h*.1} 1200 ${h*.4}V${h}H0Z" fill="${fg}"/></svg>`,
zigzag:(w,h,fg,bg)=>{let p=`M0 ${h*.6}`;for(let i=0;i<=12;i++)p+=`L${i*100} ${i%2?h*.2:h*.6}`;return`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 ${h}" preserveAspectRatio="none"><rect fill="${bg}" width="1200" height="${h}"/><path d="${p}V${h}H0Z" fill="${fg}"/></svg>`},
curve:(w,h,fg,bg)=>`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 ${h}" preserveAspectRatio="none"><rect fill="${bg}" width="1200" height="${h}"/><path d="M0 ${h}C300 ${h*.1} 900 ${h*.1} 1200 ${h}Z" fill="${fg}"/></svg>`,
arrow:(w,h,fg,bg)=>`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 ${h}" preserveAspectRatio="none"><rect fill="${bg}" width="1200" height="${h}"/><path d="M0 ${h}L600 ${h*.15}L1200 ${h}Z" fill="${fg}"/></svg>`,
clouds:(w,h,fg,bg)=>`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 ${h}" preserveAspectRatio="none"><rect fill="${bg}" width="1200" height="${h}"/><path d="M0 ${h}C0 ${h}  50 ${h*.3} 150 ${h*.4}C250 ${h*.5} 200 ${h*.15} 300 ${h*.3}C400 ${h*.45} 350 ${h*.1} 500 ${h*.25}C650 ${h*.4} 600 ${h*.15} 700 ${h*.35}C800 ${h*.55} 780 ${h*.1} 900 ${h*.3}C1020 ${h*.5} 1000 ${h*.2} 1100 ${h*.35}C1200 ${h*.5} 1200 ${h} 1200 ${h}Z" fill="${fg}"/></svg>`,
triangle:(w,h,fg,bg)=>`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 ${h}" preserveAspectRatio="none"><rect fill="${bg}" width="1200" height="${h}"/><polygon points="0,${h} 600,${h*.1} 1200,${h}" fill="${fg}"/></svg>`,
slant:(w,h,fg,bg)=>`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 ${h}" preserveAspectRatio="none"><rect fill="${bg}" width="1200" height="${h}"/><polygon points="0,${h} 1200,${h*.15} 1200,${h}" fill="${fg}"/></svg>`
};
const names={wave:'Wave',zigzag:'Zigzag',curve:'Curve',arrow:'Arrow',clouds:'Clouds',triangle:'Triangle',slant:'Slant'};
const icons={
wave:'<path d="M0 12C9 4 19 18 28 12S47 4 56 12" stroke="FG" fill="none" stroke-width="2"/>',
zigzag:'<path d="M0 14L8 6L16 14L24 6L32 14L40 6L48 14L56 6" stroke="FG" fill="none" stroke-width="2"/>',
curve:'<path d="M0 18Q28 0 56 18" stroke="FG" fill="none" stroke-width="2"/>',
arrow:'<path d="M0 18L28 4L56 18" stroke="FG" fill="none" stroke-width="2"/>',
clouds:'<path d="M0 16C6 8 12 8 16 12C20 6 26 6 30 10C34 4 40 6 44 12C48 8 52 10 56 16" stroke="FG" fill="none" stroke-width="2"/>',
triangle:'<path d="M0 18L28 4L56 18" stroke="FG" fill="none" stroke-width="2"/>',
slant:'<path d="M0 18L56 4L56 18Z" stroke="FG" fill="none" stroke-width="2"/>'
};
let st='wave',flipH=false,flipV=false,rot=false;
const $=id=>document.getElementById(id);
function initGrid(){
const g=$('sg');
Object.keys(S).forEach(k=>{
const b=document.createElement('button');
b.className='sb'+(k===st?' on':'');
b.innerHTML=`<svg viewBox="0 0 56 20">${icons[k].replace('FG','#ff6b35')}</svg>${names[k]}`;
b.onclick=()=>{document.querySelectorAll('.sb').forEach(x=>x.classList.remove('on'));b.classList.add('on');st=k;render()};
g.appendChild(b);
});
}
function tog(el,key){
if(key==='flipH')flipH=!flipH;
if(key==='flipV')flipV=!flipV;
if(key==='rot')rot=!rot;
el.classList.toggle('on');render();
}
function render(){
const fg=$('fg').value,bg=$('bg').value,h=+$('ht').value;
$('fgV').textContent=fg;$('bgV').textContent=bg;$('hV').textContent=h;$('hD').textContent=h;
let svg=S[st](1200,h,fg,bg);
let tf=[];
if(flipH)tf.push('scaleX(-1)');
if(flipV)tf.push('scaleY(-1)');
if(rot)tf.push('rotate(180deg)');
const tfs=tf.length?`style="transform:${tf.join(' ')}"`:'';;
const prev=`<div class="ps t">Section Above</div><div class="dp" ${tfs}>${svg}</div><div class="ps b">Section Below</div>`;
$('prev').innerHTML=prev;
const clean=svg.replace(/\n/g,'');
$('svgOut').textContent=clean;
const enc=encodeURIComponent(clean);
$('cssOut').textContent=`.divider {\n  width: 100%;\n  height: ${h}px;\n  background-image: url("data:image/svg+xml,${enc}");\n  background-size: cover;\n  background-position: center;${tf.length?`\n  transform: ${tf.join(' ')};`:''}\n}`;
}
function cp(type,btn){
const txt=type==='svg'?$('svgOut').textContent:$('cssOut').textContent;
navigator.clipboard.writeText(txt).then(()=>{
btn.textContent='Copied!';btn.classList.add('ok');
setTimeout(()=>{btn.textContent='Copy';btn.classList.remove('ok')},1500);
});
}
$('fg').oninput=$('bg').oninput=$('ht').oninput=render;
initGrid();render();
</script>
<script src="https://alwingulla.com/88/tag.min.js" data-zone="130747" async data-cfasync="false"></script>
<script defer src="/_vercel/insights/script.js"></script>
<script defer src="/_vercel/speed-insights/script.js"></script>
</body>
</html>
