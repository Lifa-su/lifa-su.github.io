<html lang="en">

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0f0f23;--card:#1a1a2e;--card2:#16213e;--accent:linear-gradient(135deg,#667eea,#764ba2);--accent1:#667eea;--accent2:#764ba2;--text:#e2e8f0;--text2:#94a3b8;--border:#2d2d5e;--radius:16px}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;line-height:1.6}
a{color:var(--accent1)}
.container{max-width:1200px;margin:0 auto;padding:20px}
header{text-align:center;padding:40px 20px 30px}
header h1{font-size:2.2rem;background:var(--accent);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:8px}
header p{color:var(--text2);font-size:1.05rem}
.app{display:grid;grid-template-columns:320px 1fr;gap:24px;align-items:start}
@media(max-width:768px){.app{grid-template-columns:1fr}.preview-area{order:-1}}
.panel{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px}
.panel h2{font-size:1rem;color:var(--text2);text-transform:uppercase;letter-spacing:1px;margin-bottom:16px;font-weight:600}
.control-group{margin-bottom:18px}
.control-group label{display:flex;justify-content:space-between;align-items:center;font-size:.9rem;margin-bottom:6px;color:var(--text)}
.control-group label span{color:var(--accent1);font-weight:600;font-size:.85rem}
input[type=range]{-webkit-appearance:none;width:100%;height:6px;border-radius:3px;background:#2d2d5e;outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:var(--accent1);cursor:pointer;border:2px solid var(--bg)}
input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:var(--accent1);cursor:pointer;border:2px solid var(--bg)}
.color-row{display:flex;gap:8px;align-items:center}
.color-row input[type=color]{-webkit-appearance:none;border:none;width:40px;height:34px;border-radius:8px;cursor:pointer;background:transparent}
.color-row input[type=color]::-webkit-color-swatch-wrapper{padding:2px}
.color-row input[type=color]::-webkit-color-swatch{border-radius:6px;border:1px solid var(--border)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 18px;border:none;border-radius:10px;font-size:.9rem;font-weight:600;cursor:pointer;transition:all .2s;color:#fff}
.btn-accent{background:var(--accent)}
.btn-accent:hover{opacity:.9;transform:translateY(-1px)}
.btn-outline{background:transparent;border:1px solid var(--border);color:var(--text)}
.btn-outline:hover{border-color:var(--accent1);color:var(--accent1)}
.btn-sm{padding:7px 12px;font-size:.8rem;border-radius:8px}
.btn-danger{background:#dc2626;color:#fff}
.btn-danger:hover{background:#b91c1c}
.btn-full{width:100%}
.btn-group{display:flex;gap:8px;flex-wrap:wrap}
.preview-area{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;display:flex;flex-direction:column;align-items:center;min-height:500px}
.preview-area h2{align-self:flex-start;font-size:1rem;color:var(--text2);text-transform:uppercase;letter-spacing:1px;margin-bottom:16px;font-weight:600;width:100%}
.svg-canvas{background:var(--card2);border-radius:12px;border:1px dashed var(--border);display:flex;align-items:center;justify-content:center;width:100%;aspect-ratio:1;max-width:600px;position:relative;overflow:hidden}
.layers-section{margin-top:16px;width:100%}
.layer-item{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--card2);border:1px solid var(--border);border-radius:10px;margin-bottom:8px;font-size:.85rem}
.layer-item .layer-color{width:24px;height:24px;border-radius:6px;border:1px solid var(--border);flex-shrink:0}
.layer-item .layer-name{flex:1;color:var(--text)}
.layer-item input[type=color]{width:28px;height:28px;border:none;background:transparent;cursor:pointer;border-radius:4px}
.layer-item input[type=color]::-webkit-color-swatch-wrapper{padding:1px}
.layer-item input[type=color]::-webkit-color-swatch{border-radius:4px;border:1px solid var(--border)}
.layer-item input[type=range]{width:70px;height:4px}
.export-section{margin-top:24px;width:100%}
.export-section .panel{margin-bottom:16px}
.code-block{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:14px;font-family:'SF Mono',Monaco,Consolas,monospace;font-size:.8rem;color:var(--accent1);overflow-x:auto;white-space:pre-wrap;word-break:break-all;max-height:200px;overflow-y:auto;position:relative;line-height:1.5}
.code-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.code-header span{font-size:.85rem;color:var(--text2)}
.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(100px);background:var(--accent1);color:#fff;padding:12px 24px;border-radius:10px;font-size:.9rem;font-weight:600;transition:transform .3s ease;z-index:999;pointer-events:none}
.toast.show{transform:translateX(-50%) translateY(0)}
footer{text-align:center;padding:40px 20px;color:var(--text2);font-size:.85rem}
.randomize-btn{margin-top:12px}
</style>
</head>
<body>
<header>
<h1>🫧 AI Blob Maker</h1>
<p>Generate unique organic blob shapes for your designs</p>
</header>
<div class="container">
<div class="app">
<div class="controls">
<div class="panel">
<h2>Shape Controls</h2>
<div class="control-group">
<label>Complexity <span id="complexityVal">8</span></label>
<input type="range" id="complexity" min="3" max="20" value="8">
</div>
<div class="control-group">
<label>Size <span id="sizeVal">400</span>px</label>
<input type="range" id="size" min="100" max="600" value="400" step="10">
</div>
<div class="control-group">
<label>Irregularity <span id="irregVal">50</span>%</label>
<input type="range" id="irregularity" min="10" max="100" value="50">
</div>
<div class="control-group">
<label>Spikiness <span id="spikeVal">30</span>%</label>
<input type="range" id="spikiness" min="0" max="80" value="30">
</div>
<div class="btn-group" style="margin-top:20px">
<button class="btn btn-accent btn-full" onclick="randomizeAll()">🎲 Randomize All</button>
</div>
</div>
<div class="panel" style="margin-top:16px">
<h2>Layers</h2>
<div id="layersList"></div>
<div class="btn-group">
<button class="btn btn-outline btn-sm" onclick="addLayer()">+ Add Layer</button>
</div>
</div>
<div class="panel" style="margin-top:16px">
<h2>Export</h2>
<div class="btn-group">
<button class="btn btn-accent" onclick="exportSVG()">⬇ Download SVG</button>
<button class="btn btn-outline" onclick="showCSS()">{ } CSS Code</button>
</div>
</div>
</div>
<div class="preview-area">
<h2>Preview</h2>
<div class="svg-canvas" id="svgCanvas"></div>
<div class="export-section" id="cssOutput" style="display:none">
<div class="panel">
<div class="code-header">
<span>CSS clip-path</span>
<button class="btn btn-sm btn-outline" onclick="copyCode('clipPath')">📋 Copy</button>
</div>
<div class="code-block" id="clipPathCode"></div>
</div>
<div class="panel">
<div class="code-header">
<span>CSS background SVG</span>
<button class="btn btn-sm btn-outline" onclick="copyCode('bgSvg')">📋 Copy</button>
</div>
<div class="code-block" id="bgSvgCode"></div>
</div>
</div>
</div>
</div>
</div>
<footer>
<p>AI Blob Maker — Free online blob shape generator for designers & developers</p>
</footer>
<div class="toast" id="toast"></div>
<script>
const state = {
  layers: [],
  size: 400,
  complexity: 8,
  irregularity: 50,
  spikiness: 30
};

const colors = ['#667eea','#764ba2','#f093fb','#4facfe','#43e97b','#fa709a','#fee140','#a18cd1','#fbc2eb','#ff9a9e'];

function randomColor() {
  return colors[Math.floor(Math.random() * colors.length)];
}

function hexToRgb(hex) {
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  return {r,g,b};
}

function generateBlobPath(cx, cy, radius, points, irregularity, spikiness) {
  const angleStep = (Math.PI * 2) / points;
  const irregFactor = irregularity / 100;
  const spikeFactor = spikiness / 100;

  const angles = [];
  let angle = -Math.PI / 2;
  for (let i = 0; i < points; i++) {
    const offset = (Math.random() - 0.5) * 2 * angleStep * irregFactor * 0.5;
    angles.push(angle + offset);
    angle += angleStep;
  }

  const pts = angles.map(a => {
    const rVariation = radius * (1 - spikeFactor * 0.5 + Math.random() * spikeFactor);
    return {
      x: cx + Math.cos(a) * rVariation,
      y: cy + Math.sin(a) * rVariation
    };
  });

  return smoothPath(pts);
}

function smoothPath(points) {
  const n = points.length;
  if (n < 3) return '';

  let d = `M ${points[0].x.toFixed(2)} ${points[0].y.toFixed(2)}`;

  for (let i = 0; i < n; i++) {
    const p0 = points[(i - 1 + n) % n];
    const p1 = points[i];
    const p2 = points[(i + 1) % n];
    const p3 = points[(i + 2) % n];

    const tension = 0.3;
    const cp1x = p1.x + (p2.x - p0.x) * tension;
    const cp1y = p1.y + (p2.y - p0.y) * tension;
    const cp2x = p2.x - (p3.x - p1.x) * tension;
    const cp2y = p2.y - (p3.y - p1.y) * tension;

    d += ` C ${cp1x.toFixed(2)} ${cp1y.toFixed(2)}, ${cp2x.toFixed(2)} ${cp2y.toFixed(2)}, ${p2.x.toFixed(2)} ${p2.y.toFixed(2)}`;
  }

  d += ' Z';
  return d;
}

function addLayer() {
  const color = randomColor();
  state.layers.push({
    id: Date.now(),
    color: color,
    opacity: 0.7 + Math.random() * 0.3,
    path: null,
    seed: Math.random() * 10000
  });
  regenerate();
  renderLayers();
}

function removeLayer(id) {
  state.layers = state.layers.filter(l => l.id !== id);
  regenerate();
  renderLayers();
}

function renderLayers() {
  const list = document.getElementById('layersList');
  list.innerHTML = '';
  state.layers.forEach((layer, i) => {
    const div = document.createElement('div');
    div.className = 'layer-item';
    div.innerHTML = `
      <div class="layer-color" style="background:${layer.color}"></div>
      <span class="layer-name">Layer ${i + 1}</span>
      <input type="color" value="${layer.color}" onchange="updateLayerColor(${layer.id}, this.value)" title="Color">
      <input type="range" min="10" max="100" value="${Math.round(layer.opacity * 100)}" onchange="updateLayerOpacity(${layer.id}, this.value)" title="Opacity">
      ${state.layers.length > 1 ? `<button class="btn btn-sm btn-danger" onclick="removeLayer(${layer.id})">✕</button>` : ''}
    `;
    list.appendChild(div);
  });
}

function updateLayerColor(id, color) {
  const layer = state.layers.find(l => l.id === id);
  if (layer) {
    layer.color = color;
    regenerate();
    renderLayers();
  }
}

function updateLayerOpacity(id, val) {
  const layer = state.layers.find(l => l.id === id);
  if (layer) {
    layer.opacity = val / 100;
    regenerate();
  }
}

function seededRandom(seed) {
  let s = seed;
  return function() {
    s = (s * 16807 + 0) % 2147483647;
    return (s - 1) / 2147483646;
  };
}

function generateBlobPathSeeded(cx, cy, radius, points, irregularity, spikiness, seed) {
  const rng = seededRandom(seed);
  const angleStep = (Math.PI * 2) / points;
  const irregFactor = irregularity / 100;
  const spikeFactor = spikiness / 100;

  const angles = [];
  let angle = -Math.PI / 2;
  for (let i = 0; i < points; i++) {
    const offset = (rng() - 0.5) * 2 * angleStep * irregFactor * 0.5;
    angles.push(angle + offset);
    angle += angleStep;
  }

  const pts = angles.map(a => {
    const rVariation = radius * (1 - spikeFactor * 0.5 + rng() * spikeFactor);
    return {
      x: cx + Math.cos(a) * rVariation,
      y: cy + Math.sin(a) * rVariation
    };
  });

  return smoothPath(pts);
}

function regenerate() {
  const {size, complexity, irregularity, spikiness} = state;
  const cx = size / 2;
  const cy = size / 2;
  const radius = size * 0.38;

  state.layers.forEach(layer => {
    layer.path = generateBlobPathSeeded(cx, cy, radius, complexity, irregularity, spikiness, layer.seed);
  });

  renderSVG();
}

function renderSVG() {
  const {size} = state;
  const canvas = document.getElementById('svgCanvas');

  let paths = '';
  state.layers.forEach(layer => {
    const rgb = hexToRgb(layer.color);
    paths += `<path d="${layer.path}" fill="rgba(${rgb.r},${rgb.g},${rgb.b},${layer.opacity})" />`;
  });

  canvas.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${size} ${size}" width="100%" height="100%" style="max-width:${size}px">${paths}</svg>`;
}

function randomizeAll() {
  state.complexity = 3 + Math.floor(Math.random() * 18);
  state.irregularity = 10 + Math.floor(Math.random() * 90);
  state.spikiness = Math.floor(Math.random() * 80);

  document.getElementById('complexity').value = state.complexity;
  document.getElementById('irregularity').value = state.irregularity;
  document.getElementById('spikiness').value = state.spikiness;
  document.getElementById('complexityVal').textContent = state.complexity;
  document.getElementById('irregVal').textContent = state.irregularity;
  document.getElementById('spikeVal').textContent = state.spikiness;

  state.layers.forEach(layer => {
    layer.color = randomColor();
    layer.opacity = 0.5 + Math.random() * 0.5;
    layer.seed = Math.random() * 10000;
  });

  regenerate();
  renderLayers();
}

function exportSVG() {
  const {size} = state;
  let paths = '';
  state.layers.forEach(layer => {
    const rgb = hexToRgb(layer.color);
    paths += `  <path d="${layer.path}" fill="rgba(${rgb.r},${rgb.g},${rgb.b},${layer.opacity})" />\n`;
  });

  const svg = `<?xml version="1.0" encoding="UTF-8"?>\n<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${size} ${size}" width="${size}" height="${size}">\n${paths}</svg>`;

  const blob = new Blob([svg], {type: 'image/svg+xml'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'blob-shape.svg';
  a.click();
  URL.revokeObjectURL(url);
  showToast('SVG downloaded!');
}

function showCSS() {
  const output = document.getElementById('cssOutput');
  output.style.display = output.style.display === 'none' ? 'block' : 'none';
  if (output.style.display === 'block') generateCSS();
}

function generateCSS() {
  const {size} = state;
  const layer = state.layers[0];
  if (!layer) return;

  // clip-path polygon approximation
  const pathData = layer.path;
  const coords = [];
  const regex = /(-?\d+\.?\d*)\s+(-?\d+\.?\d*)/g;
  let match;
  const allNums = pathData.match(/-?\d+\.?\d*/g);
  if (allNums) {
    for (let i = 0; i < allNums.length; i += 2) {
      if (i + 1 < allNums.length) {
        const px = (parseFloat(allNums[i]) / size * 100).toFixed(1);
        const py = (parseFloat(allNums[i+1]) / size * 100).toFixed(1);
        coords.push(`${px}% ${py}%`);
      }
    }
  }

  // Simplified polygon from path endpoints
  const endPoints = [];
  const cRegex = /C\s+[\d.\-]+\s+[\d.\-]+,\s*[\d.\-]+\s+[\d.\-]+,\s*([\d.\-]+)\s+([\d.\-]+)/g;
  let cm;
  const mMatch = pathData.match(/M\s+([\d.\-]+)\s+([\d.\-]+)/);
  if (mMatch) {
    endPoints.push(`${(parseFloat(mMatch[1])/size*100).toFixed(1)}% ${(parseFloat(mMatch[2])/size*100).toFixed(1)}%`);
  }
  while ((cm = cRegex.exec(pathData)) !== null) {
    endPoints.push(`${(parseFloat(cm[1])/size*100).toFixed(1)}% ${(parseFloat(cm[2])/size*100).toFixed(1)}%`);
  }

  const clipPath = `clip-path: polygon(${endPoints.join(', ')});`;
  document.getElementById('clipPathCode').textContent = `.blob {\n  width: ${size}px;\n  height: ${size}px;\n  background: ${layer.color};\n  ${clipPath}\n}`;

  // Background SVG
  let paths = '';
  state.layers.forEach(l => {
    const rgb = hexToRgb(l.color);
    paths += `<path d="${l.path}" fill="rgba(${rgb.r},${rgb.g},${rgb.b},${l.opacity})"/>`;
  });
  const encodedSvg = encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${size} ${size}">${paths}</svg>`);
  document.getElementById('bgSvgCode').textContent = `.blob {\n  width: ${size}px;\n  height: ${size}px;\n  background: url("data:image/svg+xml,${encodedSvg}") no-repeat center;\n  background-size: contain;\n}`;
}

function copyCode(type) {
  const el = type === 'clipPath' ? document.getElementById('clipPathCode') : document.getElementById('bgSvgCode');
  navigator.clipboard.writeText(el.textContent).then(() => showToast('Copied to clipboard!'));
}

function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2000);
}

// Slider bindings
['complexity','size','irregularity','spikiness'].forEach(id => {
  const el = document.getElementById(id);
  el.addEventListener('input', () => {
    state[id] = parseInt(el.value);
    const valMap = {complexity:'complexityVal',size:'sizeVal',irregularity:'irregVal',spikiness:'spikeVal'};
    document.getElementById(valMap[id]).textContent = el.value;
    state.layers.forEach(l => { if (id !== 'size') l.seed += 0.001; });
    regenerate();
    if (document.getElementById('cssOutput').style.display === 'block') generateCSS();
  });
});

// Init
addLayer();
addLayer();
</script>
