<!DOCTYPE html>
<html lang="en">
<head>

    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS Aspect Ratio Generator</title>
<meta name="description" content="Generate CSS aspect-ratio code with live preview. Modern aspect-ratio and legacy padding-top hack.">
<link rel="canonical" href="https://lifa-su.com/ai-css-aspect-ratio/">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#1a1a2e;--surface:#16213e;--surface2:#0f3460;--accent:#e94560;--accent2:#533483;--text:#eee;--text2:#aab;--radius:12px}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;line-height:1.6}
.container{max-width:960px;margin:0 auto;padding:24px 16px}
header{text-align:center;padding:40px 0 32px}
header h1{font-size:clamp(1.6rem,4vw,2.4rem);font-weight:700;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
header p{color:var(--text2);margin-top:8px;font-size:.95rem}
.card{background:var(--surface);border-radius:var(--radius);padding:24px;margin-bottom:24px;border:1px solid rgba(255,255,255,.06)}
.card h2{font-size:1.1rem;margin-bottom:16px;color:var(--text)}
.presets{display:flex;flex-wrap:wrap;gap:10px}
.preset-btn{background:var(--surface2);color:var(--text);border:2px solid transparent;border-radius:8px;padding:10px 16px;cursor:pointer;font-size:.88rem;font-weight:500;transition:all .2s;white-space:nowrap}
.preset-btn:hover{border-color:var(--accent);background:rgba(233,69,96,.1)}
.preset-btn.active{border-color:var(--accent);background:rgba(233,69,96,.15);color:#fff}
.custom-input{display:flex;align-items:center;gap:12px;margin-top:16px;flex-wrap:wrap}
.input-group{display:flex;align-items:center;gap:8px}
.input-group label{font-size:.85rem;color:var(--text2);min-width:48px}
.input-group input{width:80px;padding:10px 12px;border-radius:8px;border:1px solid rgba(255,255,255,.12);background:var(--bg);color:var(--text);font-size:1rem;text-align:center;outline:none;transition:border-color .2s}
.input-group input:focus{border-color:var(--accent)}
.separator{font-size:1.4rem;color:var(--text2);font-weight:700}
.preview-area{display:flex;justify-content:center;align-items:center;min-height:280px;padding:20px}
.preview-box{background:linear-gradient(135deg,rgba(233,69,96,.12),rgba(83,52,131,.12));border:2px dashed var(--accent);border-radius:8px;display:flex;flex-direction:column;justify-content:center;align-items:center;transition:all .35s ease;max-width:100%;max-height:320px}
.preview-box .ratio-label{font-size:clamp(1.4rem,3vw,2rem);font-weight:700;color:var(--accent)}
.preview-box .ratio-detail{font-size:.85rem;color:var(--text2);margin-top:4px}
.preview-box .padding-info{font-size:.78rem;color:var(--accent2);margin-top:2px}
.copy-btn{background:var(--accent);color:#fff;border:none;border-radius:8px;padding:8px 18px;cursor:pointer;font-size:.85rem;font-weight:500;transition:all .2s;display:inline-flex;align-items:center;gap:6px}
.copy-btn:hover{opacity:.85;transform:translateY(-1px)}
.copy-btn.copied{background:#2ecc71}
.code-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
pre{background:var(--bg);border-radius:8px;padding:20px;overflow-x:auto;font-size:.85rem;line-height:1.7;border:1px solid rgba(255,255,255,.06);color:#c8d6e5}
.tabs{display:flex;gap:4px;margin-bottom:16px}
.tab-btn{background:transparent;color:var(--text2);border:none;border-bottom:2px solid transparent;padding:8px 16px;cursor:pointer;font-size:.85rem;font-weight:500;transition:all .2s}
.tab-btn.active{color:var(--accent);border-bottom-color:var(--accent)}
.tab-btn:hover{color:var(--text)}
.tab-content{display:none}
.tab-content.active{display:block}
footer{text-align:center;padding:32px 0 24px;color:var(--text2);font-size:.8rem}
@media(max-width:600px){
.container{padding:16px 12px}.card{padding:18px 14px}.preset-btn{padding:8px 12px;font-size:.82rem}
.custom-input{gap:8px}.input-group input{width:64px;padding:8px}pre{padding:14px;font-size:.78rem}.preview-area{min-height:200px;padding:12px}
}
</style>
</head>
<body>
<div class="container">
<header><h1>CSS Aspect Ratio Generator</h1>
<p>Pick a preset or enter custom values &#8212; get ready-to-use CSS instantly.</p></header>
<div class="card"><h2>&#x1F4D0; Aspect Ratio</h2>
<div class="presets" id="presets"></div>
<div class="custom-input">
<div class="input-group"><label for="inputW">Width</label><input type="number" id="inputW" min="1" max="9999" value="16"></div>
<span class="separator">:</span>
<div class="input-group"><label for="inputH">Height</label><input type="number" id="inputH" min="1" max="9999" value="9"></div>
</div></div>
<div class="card"><h2>&#x1F441;&#xFE0F; Live Preview</h2>
<div class="preview-area"><div class="preview-box" id="previewBox">
<div class="ratio-label" id="ratioLabel">16 : 9</div>
<div class="ratio-detail" id="ratioDetail">Widescreen</div>
<div class="padding-info" id="paddingInfo">padding-top: 56.25%</div>
</div></div></div>
<div class="card"><h2>&#x1F3A8; Generated CSS</h2>
<div class="tabs">
<button class="tab-btn active" data-tab="both">Both</button>
<button class="tab-btn" data-tab="modern">Modern Only</button>
<button class="tab-btn" data-tab="legacy">Legacy Only</button></div>
<div id="tab-both" class="tab-content active">
<div class="code-header"><span></span><button class="copy-btn" onclick="copyCode('both')">&#x1F4CB; Copy</button></div><pre id="code-both"></pre></div>
<div id="tab-modern" class="tab-content">
<div class="code-header"><span></span><button class="copy-btn" onclick="copyCode('modern')">&#x1F4CB; Copy</button></div><pre id="code-modern"></pre></div>
<div id="tab-legacy" class="tab-content">
<div class="code-header"><span></span><button class="copy-btn" onclick="copyCode('legacy')">&#x1F4CB; Copy</button></div><pre id="code-legacy"></pre></div>
</div>
<footer>&#169; 2026 CSS Aspect Ratio Generator</footer>
</div>
<script>
const PRESETS = [
  {w:1,h:1,label:'1:1',name:'Square'},
  {w:4,h:3,label:'4:3',name:'Standard'},
  {w:3,h:2,label:'3:2',name:'Classic Film'},
  {w:16,h:9,label:'16:9',name:'Widescreen'},
  {w:21,h:9,label:'21:9',name:'Ultrawide'},
  {w:9,h:16,label:'9:16',name:'Portrait / Story'},
  {w:3,h:4,label:'3:4',name:'Portrait Photo'},
  {w:2,h:3,label:'2:3',name:'Portrait Classic'}
];

const presetsEl = document.getElementById('presets');
const inputW = document.getElementById('inputW');
const inputH = document.getElementById('inputH');
const previewBox = document.getElementById('previewBox');
const ratioLabel = document.getElementById('ratioLabel');
const ratioDetail = document.getElementById('ratioDetail');
const paddingInfo = document.getElementById('paddingInfo');
const codeBoth = document.getElementById('code-both');
const codeModern = document.getElementById('code-modern');
const codeLegacy = document.getElementById('code-legacy');

let activePreset = null;

function gcd(a, b) { return b === 0 ? a : gcd(b, a % b); }

function getPresetName(w, h) {
  const p = PRESETS.find(p => p.w === w && p.h === h);
  return p ? p.name : 'Custom';
}

function update() {
  const w = Math.max(1, parseInt(inputW.value) || 1);
  const h = Math.max(1, parseInt(inputH.value) || 1);
  const g = gcd(w, h);
  const sw = w / g;
  const sh = h / g;
  const pct = ((h / w) * 100);
  const pctStr = pct % 1 === 0 ? pct.toFixed(0) : pct.toFixed(4).replace(/0+$/, '').replace(/\.$/, '');
  const name = getPresetName(w, h);

  ratioLabel.textContent = sw + ' : ' + sh;
  ratioDetail.textContent = name;
  paddingInfo.textContent = 'padding-top: ' + pctStr + '%';

  // Preview box sizing
  const maxW = 400, maxH = 300;
  let bw, bh;
  if (w / h > maxW / maxH) {
    bw = maxW; bh = maxW * (h / w);
  } else {
    bh = maxH; bw = maxH * (w / h);
  }
  previewBox.style.width = bw + 'px';
  previewBox.style.height = bh + 'px';

  // Highlight active preset
  document.querySelectorAll('.preset-btn').forEach(btn => {
    const bw2 = parseInt(btn.dataset.w);
    const bh2 = parseInt(btn.dataset.h);
    btn.classList.toggle('active', bw2 === w && bh2 === h);
  });

  generateCode(sw, sh, pctStr, h, w);
}

function generateCode(sw, sh, pctStr, origH, origW) {
  const modern = '/* Modern - aspect-ratio */\n.aspect-ratio-box {\n  aspect-ratio: ' + sw + ' / ' + sh + ';\n  width: 100%;\n}';
  const legacy = '/* Legacy - padding-top hack */\n.aspect-ratio-box {\n  position: relative;\n  width: 100%;\n  padding-top: ' + pctStr + '%; /* ' + origH + '/' + origW + ' * 100% */\n}\n.aspect-ratio-box > * {\n  position: absolute;\n  top: 0;\n  left: 0;\n  width: 100%;\n  height: 100%;\n}';

  codeBoth.textContent = modern + '\n\n' + legacy;
  codeModern.textContent = modern;
  codeLegacy.textContent = legacy;
}

function copyCode(tab) {
  const el = document.getElementById('code-' + tab);
  const text = el.textContent;
  navigator.clipboard.writeText(text).then(() => {
    const btn = el.parentElement.querySelector('.copy-btn');
    btn.innerHTML = '&#x2705; Copied!';
    btn.classList.add('copied');
    setTimeout(() => {
      btn.innerHTML = '&#x1F4CB; Copy';
      btn.classList.remove('copied');
    }, 2000);
  });
}

// Build preset buttons
PRESETS.forEach(p => {
  const btn = document.createElement('button');
  btn.className = 'preset-btn';
  btn.textContent = p.label + ' ' + p.name;
  btn.dataset.w = p.w;
  btn.dataset.h = p.h;
  btn.addEventListener('click', () => {
    inputW.value = p.w;
    inputH.value = p.h;
    update();
  });
  presetsEl.appendChild(btn);
});

// Tab switching
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
  });
});

inputW.addEventListener('input', update);
inputH.addEventListener('input', update);

// Init
update();
</script>
<script src="https://alwingulla.com/88/tag.min.js" data-zone="130747" async data-cfasync="false"></script>
<script defer src="/_vercel/insights/script.js"></script>
<script defer src="/_vercel/speed-insights/script.js"></script>
</body>
</html>
