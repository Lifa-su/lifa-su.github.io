<!DOCTYPE html>
<html lang="en">
<head>

    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Table Generator - Create, Edit & Export Tables Online</title>
<meta name="description" content="Free online table generator. Create, edit, sort and export tables as HTML, Markdown or CSV. Dark theme, modern design.">
<link rel="canonical" href="https://lifa-su.com/ai-table-generator/">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0f1117;--surface:#1a1d27;--surface2:#242836;--surface3:#2e3345;
  --border:#363b4e;--text:#e4e6f0;--text2:#9ca0b4;--accent:#6c5ce7;
  --accent2:#a29bfe;--danger:#ff6b6b;--success:#51cf66;--warning:#ffd43b;
  --radius:12px;--radius-sm:8px;
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;line-height:1.6}
a{color:var(--accent2)}

/* Header */
.header{background:linear-gradient(135deg,#1a1d27 0%,#242836 100%);border-bottom:1px solid var(--border);padding:20px 0}
.header-inner{max-width:1200px;margin:0 auto;padding:0 20px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}
.logo{display:flex;align-items:center;gap:10px;font-size:1.4rem;font-weight:700}
.logo-icon{width:36px;height:36px;background:linear-gradient(135deg,var(--accent),var(--accent2));border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;font-size:1.2rem}
.subtitle{color:var(--text2);font-size:.85rem;font-weight:400}

/* Main */
.main{max-width:1200px;margin:0 auto;padding:24px 20px}

/* Toolbar */
.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px;align-items:center}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border:1px solid var(--border);background:var(--surface2);color:var(--text);border-radius:var(--radius-sm);cursor:pointer;font-size:.85rem;transition:all .2s;white-space:nowrap}
.btn:hover{background:var(--surface3);border-color:var(--accent)}
.btn-accent{background:linear-gradient(135deg,var(--accent),#7c6cf0);border-color:transparent;color:#fff}
.btn-accent:hover{opacity:.9;border-color:transparent}
.btn-danger{border-color:var(--danger);color:var(--danger)}
.btn-danger:hover{background:rgba(255,107,107,.15)}
.btn-sm{padding:6px 10px;font-size:.8rem}
.separator{width:1px;height:28px;background:var(--border);margin:0 4px}

/* Style selector */
.style-group{display:flex;align-items:center;gap:8px;margin-left:auto}
.style-group label{font-size:.85rem;color:var(--text2)}
.style-select{padding:6px 12px;background:var(--surface2);border:1px solid var(--border);color:var(--text);border-radius:var(--radius-sm);font-size:.85rem;cursor:pointer}
.style-select:focus{outline:none;border-color:var(--accent)}

/* Table container */
.table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);margin-bottom:20px;box-shadow:0 4px 24px rgba(0,0,0,.3)}
table{width:100%;border-collapse:collapse;min-width:500px}
th,td{padding:10px 14px;text-align:left;border:1px solid var(--border);position:relative}
th{background:var(--surface2);font-weight:600;cursor:pointer;user-select:none;white-space:nowrap;transition:background .2s}
th:hover{background:var(--surface3)}
th .sort-icon{margin-left:6px;font-size:.75rem;opacity:.4}
th.sorted .sort-icon{opacity:1;color:var(--accent2)}
td{background:var(--surface)}
td[contenteditable]{outline:none}
td[contenteditable]:focus{box-shadow:inset 0 0 0 2px var(--accent);background:rgba(108,92,231,.08)}

/* Table styles */
table.striped tr:nth-child(even) td{background:var(--surface2)}
table.bordered th,table.bordered td{border:2px solid var(--border)}
table.clean th,table.clean td{border:none;border-bottom:1px solid var(--border)}
table.clean th{border-bottom:2px solid var(--accent)}

/* Row actions */
.row-actions{position:absolute;right:-36px;top:50%;transform:translateY(-50%);opacity:0;transition:opacity .2s}
tr:hover .row-actions{opacity:1}
.row-del{width:24px;height:24px;border:none;background:rgba(255,107,107,.2);color:var(--danger);border-radius:50%;cursor:pointer;font-size:.8rem;display:flex;align-items:center;justify-content:center;transition:background .2s}
.row-del:hover{background:rgba(255,107,107,.4)}

/* Column header delete */
.col-del{position:absolute;top:-28px;left:50%;transform:translateX(-50%);width:22px;height:22px;border:none;background:rgba(255,107,107,.2);color:var(--danger);border-radius:50%;cursor:pointer;font-size:.7rem;display:flex;align-items:center;justify-content:center;opacity:0;transition:all .2s}
th:hover .col-del{opacity:1}
.col-del:hover{background:rgba(255,107,107,.4)}

/* Export modal */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:100;align-items:center;justify-content:center;backdrop-filter:blur(4px)}
.modal-overlay.active{display:flex}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:24px;max-width:700px;width:90%;max-height:80vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.modal-header h3{font-size:1.1rem}
.modal-close{width:32px;height:32px;border:none;background:var(--surface2);color:var(--text);border-radius:50%;cursor:pointer;font-size:1rem;display:flex;align-items:center;justify-content:center}
.modal-close:hover{background:var(--surface3)}
.modal-tabs{display:flex;gap:4px;margin-bottom:16px}
.modal-tab{padding:8px 16px;border:none;background:var(--surface2);color:var(--text2);border-radius:var(--radius-sm);cursor:pointer;font-size:.85rem;transition:all .2s}
.modal-tab.active{background:var(--accent);color:#fff}
.modal-tab:hover:not(.active){background:var(--surface3)}
.export-output{flex:1;overflow:auto;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);padding:16px;font-family:'SF Mono',Monaco,Consolas,monospace;font-size:.85rem;white-space:pre-wrap;word-break:break-all;color:var(--text2);min-height:200px}
.copy-btn{margin-top:12px;align-self:flex-end}

/* Info bar */
.info-bar{display:flex;justify-content:space-between;align-items:center;color:var(--text2);font-size:.8rem;padding:8px 0;flex-wrap:wrap;gap:8px}

/* Footer */
.footer{text-align:center;padding:40px 20px 20px;color:var(--text2);font-size:.8rem}

/* Responsive */
@media(max-width:768px){
  .header-inner{flex-direction:column;text-align:center}
  .toolbar{justify-content:center}
  .style-group{margin-left:0;width:100%;justify-content:center}
  .separator{display:none}
  .btn{padding:8px 12px;font-size:.8rem}
  .table-wrap{margin:0 -10px;border-radius:var(--radius-sm)}
  th,td{padding:8px 10px;font-size:.85rem}
}
@media(max-width:480px){
  .main{padding:16px 10px}
  .btn{padding:6px 10px;font-size:.78rem}
}
</style>
</head>
<body>

<header class="header">
  <div class="header-inner">
    <div class="logo">
      <div class="logo-icon">⊞</div>
      <div>AI Table Generator <span class="subtitle">Create &amp; Export Tables</span></div>
    </div>
  </div>
</header>

<main class="main">
  <div class="toolbar">
    <button class="btn btn-accent" onclick="addRow()">＋ Row</button>
    <button class="btn btn-accent" onclick="addCol()">＋ Column</button>
    <div class="separator"></div>
    <button class="btn" onclick="clearTable()">🗑 Clear</button>
    <button class="btn" onclick="resetTable()">↺ Reset</button>
    <div class="separator"></div>
    <button class="btn btn-accent" onclick="openExport()">⤓ Export</button>
    <div class="style-group">
      <label for="tableStyle">Style:</label>
      <select id="tableStyle" class="style-select" onchange="applyStyle()">
        <option value="clean">Clean</option>
        <option value="striped">Striped</option>
        <option value="bordered">Bordered</option>
      </select>
    </div>
  </div>

  <div class="table-wrap">
    <table id="dataTable" class="clean">
      <thead><tr id="headerRow"></tr></thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>

  <div class="info-bar">
    <span id="tableInfo">0 rows × 0 columns</span>
    <span>Click column headers to sort · Click cells to edit</span>
  </div>
</main>

<!-- Export Modal -->
<div class="modal-overlay" id="exportModal">
  <div class="modal">
    <div class="modal-header">
      <h3>Export Table</h3>
      <button class="modal-close" onclick="closeExport()">✕</button>
    </div>
    <div class="modal-tabs">
      <button class="modal-tab active" data-fmt="html" onclick="switchTab(this)">HTML</button>
      <button class="modal-tab" data-fmt="markdown" onclick="switchTab(this)">Markdown</button>
      <button class="modal-tab" data-fmt="csv" onclick="switchTab(this)">CSV</button>
    </div>
    <div class="export-output" id="exportOutput"></div>
    <button class="btn btn-accent copy-btn" onclick="copyExport()">📋 Copy to Clipboard</button>
  </div>
</div>

<footer class="footer">
  <p>AI Table Generator &mdash; Free online tool to create, edit and export tables.</p>
</footer>

<script>
// State
let headers = ['Name', 'Category', 'Value', 'Status'];
let rows = [
  ['Example Item', 'Type A', '100', 'Active'],
  ['Another Item', 'Type B', '250', 'Pending'],
  ['Third Item', 'Type A', '75', 'Active'],
];
let sortCol = -1, sortAsc = true;
let currentExportFmt = 'html';

// Render
function render() {
  const headerRow = document.getElementById('headerRow');
  const tbody = document.getElementById('tableBody');
  headerRow.innerHTML = '';
  tbody.innerHTML = '';

  headers.forEach((h, ci) => {
    const th = document.createElement('th');
    th.innerHTML = `<button class="col-del" onclick="event.stopPropagation();delCol(${ci})" title="Delete column">✕</button>`;
    const span = document.createElement('span');
    span.textContent = h;
    th.appendChild(span);
    const sortIcon = document.createElement('span');
    sortIcon.className = 'sort-icon';
    if (sortCol === ci) {
      th.classList.add('sorted');
      sortIcon.textContent = sortAsc ? '▲' : '▼';
    } else {
      sortIcon.textContent = '⇅';
    }
    th.appendChild(sortIcon);
    th.onclick = () => sortByCol(ci);
    // Make header editable on double click
    th.ondblclick = (e) => {
      e.stopPropagation();
      const input = document.createElement('input');
      input.value = headers[ci];
      input.style.cssText = 'background:var(--bg);border:1px solid var(--accent);color:var(--text);padding:2px 6px;border-radius:4px;font-size:.85rem;width:100px;';
      input.onblur = () => { headers[ci] = input.value || 'Column'; render(); };
      input.onkeydown = (ev) => { if(ev.key==='Enter'){input.blur();} };
      span.replaceWith(input);
      input.focus();
      input.select();
    };
    headerRow.appendChild(th);
  });

  rows.forEach((row, ri) => {
    const tr = document.createElement('tr');
    row.forEach((cell, ci) => {
      const td = document.createElement('td');
      td.contentEditable = true;
      td.textContent = cell;
      td.onblur = () => { rows[ri][ci] = td.textContent; };
      tr.appendChild(td);
    });
    // Delete row button (inside last cell area)
    const lastTd = tr.lastElementChild;
    if (lastTd) {
      const delBtn = document.createElement('button');
      delBtn.className = 'row-del';
      delBtn.title = 'Delete row';
      delBtn.textContent = '✕';
      delBtn.style.cssText = 'position:absolute;right:4px;top:50%;transform:translateY(-50%);opacity:0;transition:opacity .2s;';
      delBtn.onclick = (e) => { e.stopPropagation(); delRow(ri); };
      lastTd.style.position = 'relative';
      lastTd.style.paddingRight = '32px';
      lastTd.appendChild(delBtn);
      tr.onmouseenter = () => delBtn.style.opacity = '1';
      tr.onmouseleave = () => delBtn.style.opacity = '0';
    }
    tbody.appendChild(tr);
  });

  document.getElementById('tableInfo').textContent = `${rows.length} rows × ${headers.length} columns`;
}

function addRow() {
  rows.push(headers.map(() => ''));
  render();
}

function addCol() {
  const name = 'Column ' + (headers.length + 1);
  headers.push(name);
  rows.forEach(r => r.push(''));
  render();
}

function delRow(i) {
  if (rows.length <= 1) return;
  rows.splice(i, 1);
  render();
}

function delCol(i) {
  if (headers.length <= 1) return;
  headers.splice(i, 1);
  rows.forEach(r => r.splice(i, 1));
  if (sortCol === i) { sortCol = -1; }
  else if (sortCol > i) { sortCol--; }
  render();
}

function clearTable() {
  rows = rows.map(r => r.map(() => ''));
  render();
}

function resetTable() {
  headers = ['Name', 'Category', 'Value', 'Status'];
  rows = [
    ['Example Item', 'Type A', '100', 'Active'],
    ['Another Item', 'Type B', '250', 'Pending'],
    ['Third Item', 'Type A', '75', 'Active'],
  ];
  sortCol = -1; sortAsc = true;
  render();
}

function sortByCol(ci) {
  if (sortCol === ci) { sortAsc = !sortAsc; }
  else { sortCol = ci; sortAsc = true; }
  rows.sort((a, b) => {
    let va = a[ci] || '', vb = b[ci] || '';
    const na = parseFloat(va), nb = parseFloat(vb);
    if (!isNaN(na) && !isNaN(nb)) return sortAsc ? na - nb : nb - na;
    return sortAsc ? va.localeCompare(vb) : vb.localeCompare(va);
  });
  render();
}

function applyStyle() {
  const table = document.getElementById('dataTable');
  table.className = document.getElementById('tableStyle').value;
}

// Export
function openExport() {
  document.getElementById('exportModal').classList.add('active');
  generateExport();
}
function closeExport() {
  document.getElementById('exportModal').classList.remove('active');
}
function switchTab(btn) {
  document.querySelectorAll('.modal-tab').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  currentExportFmt = btn.dataset.fmt;
  generateExport();
}

function generateExport() {
  const out = document.getElementById('exportOutput');
  // Sync cell contents from DOM
  syncFromDOM();
  if (currentExportFmt === 'html') out.textContent = genHTML();
  else if (currentExportFmt === 'markdown') out.textContent = genMarkdown();
  else out.textContent = genCSV();
}

function syncFromDOM() {
  const tds = document.querySelectorAll('#tableBody tr');
  tds.forEach((tr, ri) => {
    if (!rows[ri]) return;
    tr.querySelectorAll('td').forEach((td, ci) => {
      if (ci < headers.length) rows[ri][ci] = td.textContent.replace(/✕$/, '').trim();
    });
  });
}

function esc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function genHTML() {
  let h = '<table>\n  <thead>\n    <tr>\n';
  headers.forEach(c => { h += `      <th>${esc(c)}</th>\n`; });
  h += '    </tr>\n  </thead>\n  <tbody>\n';
  rows.forEach(r => {
    h += '    <tr>\n';
    r.forEach(c => { h += `      <td>${esc(c)}</td>\n`; });
    h += '    </tr>\n';
  });
  h += '  </tbody>\n</table>';
  return h;
}

function genMarkdown() {
  const pad = (s, w) => s + ' '.repeat(Math.max(0, w - s.length));
  const widths = headers.map((h, i) => Math.max(h.length, ...rows.map(r => (r[i]||'').length)));
  let md = '| ' + headers.map((h, i) => pad(h, widths[i])).join(' | ') + ' |\n';
  md += '| ' + widths.map(w => '-'.repeat(w)).join(' | ') + ' |\n';
  rows.forEach(r => {
    md += '| ' + r.map((c, i) => pad(c || '', widths[i])).join(' | ') + ' |\n';
  });
  return md;
}

function genCSV() {
  const csvEsc = s => { s = (s||'').replace(/"/g,'""'); return s.includes(',') || s.includes('"') || s.includes('\n') ? `"${s}"` : s; };
  let csv = headers.map(csvEsc).join(',') + '\n';
  rows.forEach(r => { csv += r.map(csvEsc).join(',') + '\n'; });
  return csv;
}

function copyExport() {
  const text = document.getElementById('exportOutput').textContent;
  navigator.clipboard.writeText(text).then(() => {
    const btn = document.querySelector('.copy-btn');
    btn.textContent = '✓ Copied!';
    setTimeout(() => { btn.textContent = '📋 Copy to Clipboard'; }, 2000);
  });
}

// Close modal on overlay click
document.getElementById('exportModal').addEventListener('click', function(e) {
  if (e.target === this) closeExport();
});

// Init
render();
</script>
<script src="https://alwingulla.com/88/tag.min.js" data-zone="130747" async data-cfasync="false"></script>
<script defer src="/_vercel/insights/script.js"></script>
<script defer src="/_vercel/speed-insights/script.js"></script>
</body>
</html>
