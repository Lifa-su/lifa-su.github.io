const quickNames = ["&amp;","&lt;","&gt;","&quot;","&copy;","&reg;","&trade;","&rarr;","&larr;","&uarr;","&darr;","&bull;","&hellip;","&mdash;","&ndash;","&times;","&divide;","&ne;","&le;","&ge;","&infin;","&euro;","&pound;","&yen;","&cent;","&deg;","&plusmn;","&frac12;","&radic;","&pi;"];
const quickEntities = quickNames.map(n => entities.find(e => e.name === n)).filter(Boolean);

const cats = [...new Set(entities.map(e => e.cat))];
let activeCat = "All";
let searchTerm = "";

function showToast(text) {
  const t = document.getElementById("toast");
  t.textContent = text;
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 1500);
}

async function copyText(text) {
  try {
    await navigator.clipboard.writeText(text);
    showToast("Copied: " + text);
  } catch {
    showToast("Copy failed");
  }
}

function renderCategories() {
  const c = document.getElementById("categories");
  let html = '<button class="cat-btn' + (activeCat === "All" ? " active" : "") + '" data-cat="All">All</button>';
  cats.forEach(cat => {
    const count = entities.filter(e => e.cat === cat).length;
    html += '<button class="cat-btn' + (activeCat === cat ? " active" : "") + '" data-cat="' + cat + '">' + cat + ' (' + count + ')</button>';
  });
  c.innerHTML = html;
  c.querySelectorAll(".cat-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      activeCat = btn.dataset.cat;
      renderCategories();
      renderEntities();
    });
  });
}

function renderQuickAccess() {
  const g = document.getElementById("quickGrid");
  g.innerHTML = quickEntities.map(e =>
    '<div class="quick-item" title="Click to copy ' + e.name + '">' +
    '<span class="char">' + e.char + '</span>' +
    '<span class="name">' + e.name + '</span>' +
    '</div>'
  ).join("");
  g.querySelectorAll(".quick-item").forEach((el, i) => {
    el.addEventListener("click", () => copyText(quickEntities[i].name));
  });
}

function renderEntities() {
  const grid = document.getElementById("entityGrid");
  const noRes = document.getElementById("noResults");
  const s = searchTerm.toLowerCase();
  let filtered = entities;
  if (activeCat !== "All") filtered = filtered.filter(e => e.cat === activeCat);
  if (s) filtered = filtered.filter(e =>
    e.char.toLowerCase().includes(s) ||
    e.name.toLowerCase().includes(s) ||
    e.desc.toLowerCase().includes(s) ||
    e.dec.toLowerCase().includes(s) ||
    e.hex.toLowerCase().includes(s)
  );
  document.getElementById("showCount").textContent = filtered.length;
  if (filtered.length === 0) {
    grid.innerHTML = "";
    noRes.style.display = "block";
    return;
  }
  noRes.style.display = "none";
  grid.innerHTML = filtered.map((e, i) =>
    '<div class="entity-card">' +
    '<div class="entity-char" data-copy="' + e.char.replace(/"/g, '&quot;') + '" title="Copy character">' + e.char + '</div>' +
    '<div class="entity-info">' +
    '<span class="entity-name" data-copy="' + e.name + '" title="Copy entity name">' + e.name + '</span>' +
    '<div class="entity-codes">' +
    '<span class="entity-code" data-copy="' + e.dec + '" title="Copy decimal">' + e.dec + '</span>' +
    '<span class="entity-code" data-copy="' + e.hex + '" title="Copy hex">' + e.hex + '</span>' +
    '</div>' +
    '<div class="entity-desc">' + e.desc + ' — ' + e.cat + '</div>' +
    '</div></div>'
  ).join("");
  grid.querySelectorAll("[data-copy]").forEach(el => {
    el.addEventListener("click", () => copyText(el.dataset.copy));
  });
}

document.getElementById("totalCount").textContent = entities.length;
document.getElementById("showCount").textContent = entities.length;
document.getElementById("searchInput").addEventListener("input", (ev) => {
  searchTerm = ev.target.value;
  renderEntities();
});
renderCategories();
renderQuickAccess();
renderEntities();
</script>
