<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--primary:#6366f1;--primary-dark:#4f46e5;--bg:#0f172a;--surface:#1e293b;--surface2:#334155;--text:#f1f5f9;--text2:#94a3b8;--border:#475569;--success:#22c55e;--warning:#f59e0b;--danger:#ef4444;--radius:12px}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;line-height:1.6}
.container{max-width:1200px;margin:0 auto;padding:20px}
header{text-align:center;padding:30px 0 20px}
header h1{font-size:2rem;background:linear-gradient(135deg,#818cf8,#c084fc,#f472b6);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
header p{color:var(--text2);margin-top:8px;font-size:0.95rem}
.api-bar{display:flex;gap:10px;margin-bottom:24px;align-items:center}
.api-bar input{flex:1;padding:10px 14px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);color:var(--text);font-size:0.9rem}
.api-bar input:focus{outline:none;border-color:var(--primary)}
.api-bar button{padding:10px 18px;background:var(--primary);color:#fff;border:none;border-radius:var(--radius);cursor:pointer;font-size:0.9rem;white-space:nowrap}
.api-bar button:hover{background:var(--primary-dark)}
.api-status{font-size:0.8rem;color:var(--text2);padding:0 4px}
.api-status.ok{color:var(--success)}
.input-section{background:var(--surface);border-radius:var(--radius);padding:24px;margin-bottom:24px}
.input-section h2{font-size:1.1rem;margin-bottom:16px;display:flex;align-items:center;gap:8px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.form-group{display:flex;flex-direction:column;gap:6px}
.form-group.full{grid-column:1/-1}
.form-group label{font-size:0.85rem;color:var(--text2);font-weight:500}
.form-group input,.form-group textarea,.form-group select{padding:10px 14px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:0.9rem;font-family:inherit}
.form-group input:focus,.form-group textarea:focus,.form-group select:focus{outline:none;border-color:var(--primary)}
.form-group textarea{resize:vertical;min-height:80px}
.platform-selector{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.platform-chip{padding:6px 14px;border-radius:20px;border:1px solid var(--border);background:transparent;color:var(--text2);cursor:pointer;font-size:0.85rem;transition:all .2s}
.platform-chip.active{background:var(--primary);border-color:var(--primary);color:#fff}
.platform-chip:hover{border-color:var(--primary)}
.btn-row{display:flex;gap:12px;margin-top:20px;flex-wrap:wrap}
.btn{padding:12px 24px;border:none;border-radius:var(--radius);cursor:pointer;font-size:0.95rem;font-weight:600;transition:all .2s;display:flex;align-items:center;gap:8px}
.btn-primary{background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 4px 15px rgba(99,102,241,.4)}
.btn-primary:disabled{opacity:.5;cursor:not-allowed;transform:none;box-shadow:none}
.btn-secondary{background:var(--surface2);color:var(--text)}
.btn-secondary:hover{background:var(--border)}
.tabs{display:flex;gap:4px;margin-bottom:20px;border-bottom:1px solid var(--border);padding-bottom:0;overflow-x:auto}
.tab{padding:10px 18px;background:transparent;border:none;color:var(--text2);cursor:pointer;font-size:0.9rem;border-bottom:2px solid transparent;transition:all .2s;white-space:nowrap}
.tab.active{color:var(--primary);border-bottom-color:var(--primary)}
.tab:hover{color:var(--text)}
.results-section{display:none}
.results-section.visible{display:block}
.platform-card{background:var(--surface);border-radius:var(--radius);padding:20px;margin-bottom:16px;border:1px solid transparent;transition:border-color .2s}
.platform-card:hover{border-color:var(--border)}
.card-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.card-header h3{font-size:1rem;display:flex;align-items:center;gap:8px}
.card-header .char-count{font-size:0.8rem;color:var(--text2)}
.card-content{white-space:pre-wrap;font-size:0.95rem;line-height:1.7;color:var(--text);margin-bottom:12px;background:var(--bg);padding:14px;border-radius:8px}
.card-tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.tag{padding:3px 10px;background:rgba(99,102,241,.15);color:#818cf8;border-radius:12px;font-size:0.8rem}
.card-actions{display:flex;gap:8px;flex-wrap:wrap}
.btn-sm{padding:6px 14px;border:none;border-radius:8px;cursor:pointer;font-size:0.8rem;transition:all .2s}
.btn-copy{background:var(--surface2);color:var(--text)}
.btn-copy:hover{background:var(--primary);color:#fff}
.btn-copy.copied{background:var(--success);color:#fff}
.ab-container{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.ab-label{text-align:center;padding:6px;font-weight:600;font-size:0.9rem;border-radius:8px 8px 0 0}
.ab-label.a{background:rgba(99,102,241,.2);color:#818cf8}
.ab-label.b{background:rgba(244,114,182,.2);color:#f472b6}
.calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.calendar-day{background:var(--surface);border-radius:var(--radius);padding:12px;min-height:120px}
.calendar-day .day-label{font-size:0.8rem;color:var(--text2);margin-bottom:8px;font-weight:600}
.calendar-day .day-content{font-size:0.8rem;line-height:1.5;color:var(--text)}
.calendar-day .day-platform{font-size:0.7rem;color:var(--primary);margin-top:6px}
.loading{display:none;text-align:center;padding:40px}
.loading.visible{display:block}
.spinner{width:40px;height:40px;border:3px solid var(--surface2);border-top-color:var(--primary);border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 16px}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;bottom:20px;right:20px;padding:12px 20px;background:var(--success);color:#fff;border-radius:var(--radius);font-size:0.9rem;transform:translateY(100px);opacity:0;transition:all .3s;z-index:999}
.toast.show{transform:translateY(0);opacity:1}
@media(max-width:768px){
.form-grid{grid-template-columns:1fr}
.ab-container{grid-template-columns:1fr}
.calendar-grid{grid-template-columns:repeat(2,1fr)}
.container{padding:12px}
header h1{font-size:1.5rem}
}
@media(max-width:480px){
.calendar-grid{grid-template-columns:1fr}
.api-bar{flex-direction:column}
}
/* Animations */
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
body{animation:fadeIn .3s ease-out}
.input-section{animation:slideUp .4s ease-out both}
header{animation:slideUp .35s ease-out}
.platform-card{animation:slideUp .3s ease-out both}
/* Pro Section */
.pro-section{background:linear-gradient(135deg,rgba(99,102,241,.08),rgba(192,132,252,.1));border:1px solid rgba(99,102,241,.25);border-radius:var(--radius);padding:28px;text-align:center;margin-top:24px;position:relative;overflow:hidden;animation:slideUp .5s ease-out both;animation-delay:.2s}
.pro-badge{position:absolute;top:12px;right:12px;background:linear-gradient(135deg,#f59e0b,#ef4444);color:#fff;padding:4px 14px;border-radius:20px;font-size:.75rem;font-weight:700;letter-spacing:.5px}
.pro-section h3{font-size:1.15rem;margin-bottom:14px;color:var(--text)}
.pro-features{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-bottom:18px}
.pro-feature{padding:8px 16px;background:rgba(99,102,241,.1);border:1px solid rgba(99,102,241,.15);border-radius:8px;font-size:.85rem;color:var(--text2)}
.btn-pro{display:inline-block;padding:12px 36px;background:linear-gradient(135deg,#6366f1,#c084fc);color:#fff;border-radius:var(--radius);font-weight:600;text-decoration:none;transition:all .3s;font-size:.95rem}
.btn-pro:hover{transform:translateY(-2px);box-shadow:0 6px 24px rgba(99,102,241,.4)}
</style>
</head>
<body>
<div class="container">
<header>
<h1>🚀 AI 社交媒体帖子生成器</h1>
<p>输入主题，一键生成多平台社交媒体内容</p>
</header>

<div class="api-bar">
<input type="password" id="apiKey" placeholder="输入 DeepSeek API Key（sk-...）">
<button onclick="saveApiKey()">保存</button>
<span class="api-status" id="apiStatus"></span>
</div>

<div class="input-section">
<h2>📝 内容设置</h2>
<div class="form-grid">
<div class="form-group">
<label>主题 / 产品名称</label>
<input type="text" id="topic" placeholder="例：新款智能手表发布">
</div>
<div class="form-group">
<label>语气风格</label>
<select id="tone">
<option value="professional">专业正式</option>
<option value="casual" selected>轻松活泼</option>
<option value="humorous">幽默搞笑</option>
<option value="inspirational">励志激励</option>
<option value="educational">知识科普</option>
</select>
</div>
<div class="form-group full">
<label>补充描述（可选）</label>
<textarea id="description" placeholder="产品特点、目标受众、关键卖点等..."></textarea>
</div>
<div class="form-group full">
<label>目标平台</label>
<div class="platform-selector" id="platformSelector">
<span class="platform-chip active" data-platform="twitter">🐦 Twitter/X</span>
<span class="platform-chip active" data-platform="linkedin">💼 LinkedIn</span>
<span class="platform-chip active" data-platform="instagram">📸 Instagram</span>
<span class="platform-chip active" data-platform="xiaohongshu">📕 小红书</span>
<span class="platform-chip active" data-platform="weibo">🌐 微博</span>
<span class="platform-chip active" data-platform="douyin">🎵 抖音文案</span>
</div>
</div>
</div>
<div class="btn-row">
<button class="btn btn-primary" id="generateBtn" onclick="generate('posts')">✨ 生成帖子</button>
<button class="btn btn-secondary" onclick="generate('calendar')">📅 生成一周日历</button>
<button class="btn btn-secondary" onclick="generate('ab')">🔀 A/B 版本对比</button>
</div>
</div>

<div class="loading" id="loading">
<div class="spinner"></div>
<p>AI 正在为你创作内容...</p>
</div>

<div class="results-section" id="results">
<div class="tabs" id="tabBar"></div>
<div id="tabContent"></div>
</div>
</div>

<div class="toast" id="toast"></div>

<script>
const PLATFORMS = {
  twitter: { name: 'Twitter/X', icon: '🐦', maxChars: 280 },
  linkedin: { name: 'LinkedIn', icon: '💼', maxChars: 3000 },
  instagram: { name: 'Instagram', icon: '📸', maxChars: 2200 },
  xiaohongshu: { name: '小红书', icon: '📕', maxChars: 1000 },
  weibo: { name: '微博', icon: '🌐', maxChars: 2000 },
  douyin: { name: '抖音文案', icon: '🎵', maxChars: 300 }
};

const TONE_MAP = {
  professional: '专业正式，适合商务场景',
  casual: '轻松活泼，亲切自然',
  humorous: '幽默搞笑，吸引眼球',
  inspirational: '励志激励，引发共鸣',
  educational: '知识科普，有深度有价值'
};

const DAYS = ['周一', '周二', '周三', '周四', '周五', '周六', '周日'];

let currentData = {};

// Init
(function init() {
  const saved = localStorage.getItem('deepseek_api_key');
  if (saved) {
    document.getElementById('apiKey').value = saved;
    updateApiStatus(true);
  }
  document.querySelectorAll('.platform-chip').forEach(chip => {
    chip.addEventListener('click', () => chip.classList.toggle('active'));
  });
})();

function saveApiKey() {
  const key = document.getElementById('apiKey').value.trim();
  if (key) {
    localStorage.setItem('deepseek_api_key', key);
    updateApiStatus(true);
    showToast('API Key 已保存');
  }
}

function updateApiStatus(ok) {
  const el = document.getElementById('apiStatus');
  el.textContent = ok ? '✓ 已配置' : '';
  el.className = 'api-status' + (ok ? ' ok' : '');
}

function getSelectedPlatforms() {
  return [...document.querySelectorAll('.platform-chip.active')].map(c => c.dataset.platform);
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

function copyText(text, btn) {
  navigator.clipboard.writeText(text).then(() => {
    btn.classList.add('copied');
    btn.textContent = '✓ 已复制';
    setTimeout(() => { btn.classList.remove('copied'); btn.textContent = '📋 复制'; }, 1500);
  });
}

async function callDeepSeek(prompt) {
  const key = localStorage.getItem('deepseek_api_key');
  if (!key) { showToast('请先输入 DeepSeek API Key'); throw new Error('No API key'); }

  const res = await fetch('https://api.deepseek.com/chat/completions', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${key}` },
    body: JSON.stringify({
      model: 'deepseek-chat',
      messages: [
        { role: 'system', content: '你是一个专业的社交媒体内容创作专家。你精通各平台的内容风格、字数限制和最佳实践。请始终返回有效的JSON格式。' },
        { role: 'user', content: prompt }
      ],
      temperature: 0.8,
      max_tokens: 4000
    })
  });

  if (!res.ok) {
    const err = await res.text();
    throw new Error(`API 错误: ${res.status} - ${err}`);
  }

  const data = await res.json();
  const content = data.choices[0].message.content;
  // Extract JSON from possible markdown code blocks
  const jsonMatch = content.match(/```(?:json)?\s*([\s\S]*?)```/) || [null, content];
  return JSON.parse(jsonMatch[1].trim());
}

async function generate(mode) {
  const topic = document.getElementById('topic').value.trim();
  if (!topic) { showToast('请输入主题'); return; }

  const platforms = getSelectedPlatforms();
  if (!platforms.length) { showToast('请至少选择一个平台'); return; }

  const tone = document.getElementById('tone').value;
  const desc = document.getElementById('description').value.trim();
  const btn = document.getElementById('generateBtn');

  btn.disabled = true;
  document.getElementById('loading').classList.add('visible');
  document.getElementById('results').classList.remove('visible');

  try {
    let prompt;
    const platformInfo = platforms.map(p =>
      `${PLATFORMS[p].name}（最多${PLATFORMS[p].maxChars}字符）`
    ).join('、');

    if (mode === 'posts') {
      prompt = `为以下主题生成社交媒体帖子：
主题：${topic}
${desc ? '补充描述：' + desc : ''}
语气风格：${TONE_MAP[tone]}
目标平台：${platformInfo}

要求：
1. 每个平台生成一条帖子，严格遵守字数限制
2. 根据平台特点调整风格（Twitter简短有力，LinkedIn专业深度，Instagram视觉描述，小红书种草风，微博话题互动，抖音口语化吸睛）
3. 智能插入合适的Emoji
4. 为每个平台推荐3-5个相关Hashtag
5. 返回JSON格式：
{
  "posts": {
    "平台key": {
      "content": "帖子正文（含emoji）",
      "hashtags": ["tag1", "tag2"],
      "charCount": 字数
    }
  }
}
平台key使用：${platforms.join(', ')}`;

      const result = await callDeepSeek(prompt);
      currentData = { mode: 'posts', data: result, platforms };
      renderPosts(result, platforms);

    } else if (mode === 'ab') {
      prompt = `为以下主题生成A/B两个版本的社交媒体帖子用于对比测试：
主题：${topic}
${desc ? '补充描述：' + desc : ''}
语气风格：${TONE_MAP[tone]}
目标平台：${platformInfo}

要求：
1. 版本A和版本B采用不同的切入角度或表达方式
2. 每个平台都要有A/B两个版本
3. 智能插入Emoji和Hashtag
4. 返回JSON格式：
{
  "versions": {
    "A": {
      "平台key": { "content": "内容", "hashtags": ["tag1"], "angle": "切入角度说明" }
    },
    "B": {
      "平台key": { "content": "内容", "hashtags": ["tag1"], "angle": "切入角度说明" }
    }
  }
}
平台key使用：${platforms.join(', ')}`;

      const result = await callDeepSeek(prompt);
      currentData = { mode: 'ab', data: result, platforms };
      renderAB(result, platforms);

    } else if (mode === 'calendar') {
      prompt = `为以下主题生成一周（7天）的社交媒体内容日历：
主题：${topic}
${desc ? '补充描述：' + desc : ''}
语气风格：${TONE_MAP[tone]}
可用平台：${platformInfo}

要求：
1. 每天安排1-2个平台发布内容
2. 内容有连贯性和节奏感，从预热到高潮
3. 合理分配平台，确保覆盖所有选中平台
4. 智能插入Emoji和Hashtag
5. 返回JSON格式：
{
  "calendar": [
    {
      "day": "周一",
      "theme": "当日主题",
      "posts": [
        { "platform": "平台key", "content": "内容", "hashtags": ["tag1"], "time": "建议发布时间" }
      ]
    }
  ]
}
平台key使用：${platforms.join(', ')}`;

      const result = await callDeepSeek(prompt);
      currentData = { mode: 'calendar', data: result, platforms };
      renderCalendar(result);
    }

    document.getElementById('results').classList.add('visible');
  } catch (e) {
    showToast('生成失败：' + e.message);
    console.error(e);
  } finally {
    btn.disabled = false;
    document.getElementById('loading').classList.remove('visible');
  }
}

function renderPosts(data, platforms) {
  const tabBar = document.getElementById('tabBar');
  const tabContent = document.getElementById('tabContent');
  tabBar.innerHTML = '';
  tabContent.innerHTML = '';

  // All tab
  tabBar.innerHTML = `<button class="tab active" data-tab="all">📋 全部</button>` +
    platforms.map(p => `<button class="tab" data-tab="${p}">${PLATFORMS[p].icon} ${PLATFORMS[p].name}</button>`).join('');

  tabBar.querySelectorAll('.tab').forEach(tab => {
    tab.addEventListener('click', () => {
      tabBar.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      const target = tab.dataset.tab;
      tabContent.querySelectorAll('.platform-card').forEach(card => {
        card.style.display = (target === 'all' || card.dataset.platform === target) ? 'block' : 'none';
      });
    });
  });

  platforms.forEach(p => {
    const post = data.posts[p];
    if (!post) return;
    const card = document.createElement('div');
    card.className = 'platform-card';
    card.dataset.platform = p;
    card.innerHTML = `
      <div class="card-header">
        <h3>${PLATFORMS[p].icon} ${PLATFORMS[p].name}</h3>
        <span class="char-count">${post.content.length} / ${PLATFORMS[p].maxChars} 字符</span>
      </div>
      <div class="card-content">${escHtml(post.content)}</div>
      <div class="card-tags">${(post.hashtags||[]).map(t => `<span class="tag">#${t}</span>`).join('')}</div>
      <div class="card-actions">
        <button class="btn-sm btn-copy" onclick="copyText(\`${escJs(post.content + '\n\n' + (post.hashtags||[]).map(t=>'#'+t).join(' '))}\`, this)">📋 复制</button>
      </div>`;
    tabContent.appendChild(card);
  });
}

function renderAB(data, platforms) {
  const tabBar = document.getElementById('tabBar');
  const tabContent = document.getElementById('tabContent');
  tabBar.innerHTML = platforms.map((p, i) =>
    `<button class="tab ${i===0?'active':''}" data-tab="${p}">${PLATFORMS[p].icon} ${PLATFORMS[p].name}</button>`
  ).join('');

  function showPlatform(platform) {
    const a = data.versions.A[platform];
    const b = data.versions.B[platform];
    if (!a || !b) { tabContent.innerHTML = '<p style="color:var(--text2);padding:20px">该平台无数据</p>'; return; }
    tabContent.innerHTML = `
      <div class="ab-container">
        <div>
          <div class="ab-label a">🅰️ 版本 A — ${escHtml(a.angle||'')}</div>
          <div class="platform-card" style="border-radius:0 0 var(--radius) var(--radius);margin:0">
            <div class="card-content">${escHtml(a.content)}</div>
            <div class="card-tags">${(a.hashtags||[]).map(t=>`<span class="tag">#${t}</span>`).join('')}</div>
            <div class="card-actions">
              <button class="btn-sm btn-copy" onclick="copyText(\`${escJs(a.content)}\`, this)">📋 复制A</button>
            </div>
          </div>
        </div>
        <div>
          <div class="ab-label b">🅱️ 版本 B — ${escHtml(b.angle||'')}</div>
          <div class="platform-card" style="border-radius:0 0 var(--radius) var(--radius);margin:0">
            <div class="card-content">${escHtml(b.content)}</div>
            <div class="card-tags">${(b.hashtags||[]).map(t=>`<span class="tag">#${t}</span>`).join('')}</div>
            <div class="card-actions">
              <button class="btn-sm btn-copy" onclick="copyText(\`${escJs(b.content)}\`, this)">📋 复制B</button>
            </div>
          </div>
        </div>
      </div>`;
  }

  tabBar.querySelectorAll('.tab').forEach(tab => {
    tab.addEventListener('click', () => {
      tabBar.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      showPlatform(tab.dataset.tab);
    });
  });

  if (platforms.length) showPlatform(platforms[0]);
}

function renderCalendar(data) {
  const tabBar = document.getElementById('tabBar');
  const tabContent = document.getElementById('tabContent');
  tabBar.innerHTML = '<button class="tab active">📅 一周内容日历</button>';

  let html = '<div class="calendar-grid">';
  (data.calendar || []).forEach(day => {
    html += `<div class="calendar-day">
      <div class="day-label">${escHtml(day.day)} · ${escHtml(day.theme||'')}</div>`;
    (day.posts || []).forEach(post => {
      const pInfo = PLATFORMS[post.platform] || { icon: '📝', name: post.platform };
      html += `<div class="day-content">${escHtml(post.content.substring(0, 100))}${post.content.length > 100 ? '...' : ''}</div>
        <div class="day-platform">${pInfo.icon} ${pInfo.name} · ${post.time||''}</div>
        <button class="btn-sm btn-copy" style="margin-top:4px;font-size:0.7rem" onclick="copyText(\`${escJs(post.content + '\n' + (post.hashtags||[]).map(t=>'#'+t).join(' '))}\`, this)">📋</button>`;
    });
    html += '</div>';
  });
  html += '</div>';
  tabContent.innerHTML = html;
}

function escHtml(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function escJs(s) { return String(s).replace(/\\/g,'\\\\').replace(/`/g,'\\`').replace(/\$/g,'\\$'); }
