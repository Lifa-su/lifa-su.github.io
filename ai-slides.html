<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0a0a0f;--surface:#111118;--card:#14141e;--border:#1e1e2e;--border-hover:#2e2e4e;--text:#e2e2e8;--muted:#8888a0;--accent:#6c5ce7;--accent2:#00cec9;--glow:rgba(108,92,231,0.15)}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);line-height:1.6}
a{color:var(--accent);text-decoration:none}
nav{position:sticky;top:0;z-index:100;height:56px;display:flex;align-items:center;padding:0 24px;background:rgba(10,10,15,.85);backdrop-filter:blur(12px);border-bottom:1px solid var(--border)}
.container{max-width:1000px;margin:0 auto;padding:0 20px}
.hero{text-align:center;padding:40px 20px 24px}
.hero h1{font-size:2.2rem;font-weight:700;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:8px}
.hero p{color:var(--muted);font-size:1rem;max-width:560px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:24px;margin-bottom:20px}
.card h2{font-size:1.1rem;margin-bottom:16px;display:flex;align-items:center;gap:8px}
select,input[type="text"],input[type="number"],textarea{width:100%;background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:10px 12px;font-family:inherit;font-size:14px;transition:border-color .2s}
select:focus,input:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--glow)}
textarea{resize:vertical;min-height:80px}
label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.form-group{margin-bottom:14px}
.btn{border:none;padding:10px 20px;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;transition:transform .15s,box-shadow .15s}
.btn-primary{background:var(--accent);color:#fff;width:100%}.btn-primary:hover{transform:translateY(-1px);box-shadow:0 4px 15px var(--glow)}
.btn-outline{background:transparent;color:var(--text);border:1px solid var(--border);padding:7px 14px;border-radius:6px;font-size:13px;cursor:pointer}
.btn-outline:hover{border-color:var(--accent);color:var(--accent)}
.themes{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px;margin-bottom:14px}
.theme{padding:12px 8px;border:2px solid var(--border);border-radius:10px;text-align:center;cursor:pointer;transition:all .2s;font-size:13px}
.theme:hover{border-color:var(--accent)}
.theme.active{border-color:var(--accent);background:var(--glow)}
.theme-dot{width:24px;height:24px;border-radius:50%;margin:0 auto 6px}
.slides-preview{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden;margin-bottom:16px}
.slide{padding:48px 40px;min-height:320px;display:none;position:relative}
.slide.active{display:flex;flex-direction:column;justify-content:center}
.slide h2{font-size:1.8rem;margin-bottom:16px;line-height:1.3}
.slide p,.slide li{font-size:1rem;line-height:1.8;color:rgba(255,255,255,.85)}
.slide ul{list-style:none;padding:0}.slide ul li{padding:6px 0;padding-left:20px;position:relative}
.slide ul li::before{content:"▸";position:absolute;left:0;color:var(--accent2)}
.slide-nav{display:flex;justify-content:center;align-items:center;gap:16px;padding:16px}
.slide-nav button{background:var(--surface);border:1px solid var(--border);color:var(--text);width:36px;height:36px;border-radius:8px;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;transition:all .2s}
.slide-nav button:hover{border-color:var(--accent);color:var(--accent)}
.slide-counter{font-size:13px;color:var(--muted);min-width:60px;text-align:center}
.slide-dots{display:flex;gap:6px}
.slide-dot{width:8px;height:8px;border-radius:50%;background:var(--border);cursor:pointer;transition:all .2s}
.slide-dot.active{background:var(--accent);transform:scale(1.3)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.fullscreen{position:fixed;top:0;left:0;width:100%;height:100%;z-index:9999;background:#000;border-radius:0;border:none}
.fullscreen .slide{min-height:100vh;padding:60px 80px}
.fullscreen .slide h2{font-size:3rem}
.fullscreen .slide p,.fullscreen .slide li{font-size:1.4rem}
.fullscreen .slide-nav{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.7);border-radius:12px;padding:8px 16px}
footer{text-align:center;padding:32px 20px;color:var(--muted);font-size:13px;border-top:1px solid var(--border);margin-top:32px}
@media(max-width:600px){.form-row{grid-template-columns:1fr}.hero h1{font-size:1.6rem}.slide{padding:24px 20px;min-height:240px}.slide h2{font-size:1.3rem}}
</style>
</head>
<body>
<nav><a href="index.html" style="color:var(--text);font-weight:600;font-size:15px">&larr; Lifa AI Tools</a></nav>
<div class="container">
<section class="hero">
<h1>AI Slides Generator</h1>
<p>Generate professional presentations instantly. Choose a theme, enter your content, and present in full-screen mode.</p>
</section>

<section class="card">
<h2>&#128221; Content</h2>
<div class="form-group">
<label for="topic">Presentation Topic</label>
<input type="text" id="topic" placeholder="e.g. Introduction to Machine Learning">
</div>
<div class="form-group">
<label for="slideContent">Slide Content (one slide per paragraph, use bullet points with -)</label>
<textarea id="slideContent" rows="8" placeholder="Welcome to My Presentation
This is the introduction slide.

Key Features
- Feature one with details
- Feature two with details
- Feature three with details

Conclusion
Thank you for watching!"></textarea>
</div>
<div class="form-row">
<div>
<label for="slideCount">Number of Slides</label>
<select id="slideCount">
<option value="auto">Auto-detect</option>
<option value="3">3 slides</option>
<option value="5">5 slides</option>
<option value="8">8 slides</option>
<option value="10">10 slides</option>
</select>
</div>
<div>
<label for="layout">Layout Style</label>
<select id="layout">
<option value="centered">Centered</option>
<option value="left">Left-aligned</option>
<option value="split">Split</option>
</select>
</div>
</div>
</section>

<section class="card">
<h2>&#127912; Theme</h2>
<div class="themes" id="themeGrid"></div>
</section>

<div style="margin-bottom:20px">
<button class="btn btn-primary" onclick="generateSlides()">&#9889; Generate Slides</button>
</div>

<section class="card" id="previewSection" style="display:none">
<h2>&#128444; Preview</h2>
<div class="toolbar">
<button class="btn-outline" onclick="toggleFullscreen()">&#9974; Fullscreen</button>
<button class="btn-outline" onclick="exportHTML()">&#128190; Export HTML</button>
<button class="btn-outline" onclick="printSlides()">&#128424; Print</button>
</div>
<div class="slides-preview" id="slidesPreview"></div>
<div class="slide-nav">
<button onclick="prevSlide()">&#9664;</button>
<div class="slide-dots" id="slideDots"></div>
<span class="slide-counter" id="slideCounter">1 / 1</span>
<button onclick="nextSlide()">&#9654;</button>
</div>
</section>
</div>

<footer>AI Slides Generator — Free online presentation tool | <a href="index.html">Lifa AI Tools</a></footer>

<script>
var THEMES=[
{name:'Midnight',bg:'linear-gradient(135deg,#0c0c1d,#1a1a3e)',text:'#e2e2e8',accent:'#6c5ce7',dot:'#6c5ce7'},
{name:'Ocean',bg:'linear-gradient(135deg,#0a192f,#112240)',text:'#ccd6f6',accent:'#64ffda',dot:'#64ffda'},
{name:'Sunset',bg:'linear-gradient(135deg,#1a0a2e,#2d1b4e)',text:'#f0e6ff',accent:'#f093fb',dot:'#f093fb'},
{name:'Forest',bg:'linear-gradient(135deg,#0a1a0a,#1a2e1a)',text:'#d4e8d4',accent:'#00b894',dot:'#00b894'},
{name:'Ember',bg:'linear-gradient(135deg,#1a0a0a,#2e1a1a)',text:'#f0d4d4',accent:'#ff6b6b',dot:'#ff6b6b'},
{name:'Arctic',bg:'linear-gradient(135deg,#0a1a2e,#1a2e4e)',text:'#d4e8f0',accent:'#74b9ff',dot:'#74b9ff'},
{name:'Minimal',bg:'#ffffff',text:'#333333',accent:'#6c5ce7',dot:'#6c5ce7'},
{name:'Dark',bg:'#0a0a0f',text:'#e2e2e8',accent:'#00cec9',dot:'#00cec9'}
];
var currentTheme=0,currentSlide=0,slides=[];

function renderThemes(){
var g=document.getElementById('themeGrid');g.innerHTML='';
THEMES.forEach(function(t,i){
var d=document.createElement('div');d.className='theme'+(i===currentTheme?' active':'');
d.innerHTML='<div class="theme-dot" style="background:'+t.dot+'"></div>'+t.name;
d.onclick=function(){currentTheme=i;renderThemes();if(slides.length)renderSlides()};
g.appendChild(d);
});
}

function parseContent(){
var topic=document.getElementById('topic').value.trim()||'Untitled Presentation';
var raw=document.getElementById('slideContent').value.trim();
if(!raw){return[{title:topic,bullets:['Add your content above to generate slides']}]}
var blocks=raw.split(/\n\s*\n/);
var parsed=[];
blocks.forEach(function(block){
var lines=block.trim().split('\n');
if(lines.length===0)return;
var title=lines[0].replace(/^#+\s*/,'');
var bullets=[];
for(var i=1;i<lines.length;i++){
var line=lines[i].trim();
if(line.startsWith('- ')||line.startsWith('* '))line=line.substring(2);
if(line)bullets.push(line);
}
parsed.push({title:title,bullets:bullets});
});
return parsed;
}

function generateSlides(){
slides=parseContent();
if(slides.length===0)return;
document.getElementById('previewSection').style.display='block';
currentSlide=0;
renderSlides();
document.getElementById('previewSection').scrollIntoView({behavior:'smooth'});
}

function renderSlides(){
var preview=document.getElementById('slidesPreview');
var theme=THEMES[currentTheme];
var layout=document.getElementById('layout').value;
preview.innerHTML='';
slides.forEach(function(s,i){
var div=document.createElement('div');
div.className='slide'+(i===0?' active':'');
div.style.background=theme.bg;div.style.color=theme.text;
if(layout==='left')div.style.alignItems='flex-start';
else if(layout==='centered')div.style.alignItems='center';
var html='<h2 style="color:'+theme.accent+'">'+s.title+'</h2>';
if(s.bullets.length>0){
if(s.bullets.length===1&&!s.bullets[0].startsWith('-')){
html+='<p>'+s.bullets[0]+'</p>';
}else{
html+='<ul>';
s.bullets.forEach(function(b){html+='<li style="color:'+theme.text+'">'+b+'</li>'});
html+='</ul>';
}
}
div.innerHTML=html;
preview.appendChild(div);
});
renderDots();
updateCounter();
}

function renderDots(){
var dots=document.getElementById('slideDots');dots.innerHTML='';
slides.forEach(function(_,i){
var d=document.createElement('div');d.className='slide-dot'+(i===currentSlide?' active':'');
d.onclick=function(){goToSlide(i)};dots.appendChild(d);
});
}

function goToSlide(n){
var all=document.querySelectorAll('.slide');
if(n<0||n>=all.length)return;
all[currentSlide].classList.remove('active');
currentSlide=n;
all[currentSlide].classList.add('active');
renderDots();updateCounter();
}

function prevSlide(){goToSlide(currentSlide-1)}
function nextSlide(){goToSlide(currentSlide+1)}
function updateCounter(){document.getElementById('slideCounter').textContent=(currentSlide+1)+' / '+slides.length}

function toggleFullscreen(){
var p=document.getElementById('slidesPreview');
if(p.classList.contains('fullscreen')){
p.classList.remove('fullscreen');
document.removeEventListener('keydown',fsKeyHandler);
}else{
p.classList.add('fullscreen');
document.addEventListener('keydown',fsKeyHandler);
}
}

function fsKeyHandler(e){
if(e.key==='Escape')toggleFullscreen();
else if(e.key==='ArrowRight'||e.key===' ')nextSlide();
else if(e.key==='ArrowLeft')prevSlide();
}

function exportHTML(){
var theme=THEMES[currentTheme];
var html='<!DOCTYPE html><html><head><meta charset="UTF-8"><title>'+
(document.getElementById('topic').value||'Presentation')+
'</title><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:system-ui,sans-serif}.slide{width:100vw;height:100vh;display:flex;flex-direction:column;justify-content:center;padding:60px 80px;page-break-after:always}h2{font-size:3rem;margin-bottom:24px}p,li{font-size:1.4rem;line-height:2}ul{list-style:none;padding:0}ul li::before{content:"▸ "}</style></head><body>';
slides.forEach(function(s){
html+='<div class="slide" style="background:'+theme.bg+';color:'+theme.text+'">';
html+='<h2 style="color:'+theme.accent+'">'+s.title+'</h2>';
if(s.bullets.length){html+='<ul>';s.bullets.forEach(function(b){html+='<li>'+b+'</li>'});html+='</ul>'}
html+='</div>';
});
html+='</body></html>';
var blob=new Blob([html],{type:'text/html'});
var a=document.createElement('a');a.href=URL.createObjectURL(blob);
a.download='presentation.html';a.click();
}

function printSlides(){window.print()}

document.addEventListener('keydown',function(e){
if(document.getElementById('slidesPreview').classList.contains('fullscreen'))return;
if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA')return;
if(e.key==='ArrowRight')nextSlide();
else if(e.key==='ArrowLeft')prevSlide();
});

renderThemes();
</script>
<script defer src="/_vercel/insights/script.js"></script>
<script defer src="/_vercel/speed-insights/script.js"></script>
</body>
</html>
