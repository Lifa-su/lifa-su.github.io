<!DOCTYPE html>
<html lang="en">
<head>

    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS Text Transform Demo | Interactive Preview Tool</title>
<meta name="description" content="Interactive CSS text-transform and font-variant demo. Preview uppercase, lowercase, capitalize, full-width with live code generation.">
<link rel="canonical" href="https://lifa-su.com/ai-css-text-transform/">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#1a1a2e;--surface:#16213e;--card:#0f3460;--accent:#e94560;--accent2:#533483;--text:#eee;--text-dim:#aab;--radius:10px;--shadow:0 4px 20px rgba(0,0,0,.3)}
body{font-family:"Segoe UI",system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;line-height:1.6}
a{color:var(--accent)}
.container{max-width:1100px;margin:0 auto;padding:20px}
header{text-align:center;padding:40px 20px 30px}
header h1{font-size:clamp(1.6rem,4vw,2.4rem);background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:8px}
header p{color:var(--text-dim);font-size:.95rem}
.input-section{background:var(--surface);border-radius:var(--radius);padding:24px;margin-bottom:28px;box-shadow:var(--shadow)}
.input-section label{display:block;font-weight:600;margin-bottom:8px;font-size:.9rem;color:var(--text-dim);text-transform:uppercase;letter-spacing:.5px}
textarea{width:100%;background:var(--bg);border:2px solid #2a2a4a;border-radius:8px;color:var(--text);padding:14px;font-size:1rem;resize:vertical;min-height:80px;transition:border-color .2s;font-family:inherit}
textarea:focus{outline:none;border-color:var(--accent)}
.presets{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.preset-btn{background:var(--card);border:1px solid #2a2a5a;color:var(--text);padding:6px 14px;border-radius:20px;cursor:pointer;font-size:.82rem;transition:all .2s}
.preset-btn:hover,.preset-btn.active{background:var(--accent);border-color:var(--accent);color:#fff}
.section-title{font-size:1.2rem;font-weight:700;margin:28px 0 16px;padding-left:12px;border-left:3px solid var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;margin-bottom:28px}
.card{background:var(--surface);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);transition:transform .2s}
.card:hover{transform:translateY(-2px)}
.card-head{background:var(--card);padding:12px 16px;display:flex;justify-content:space-between;align-items:center}
.card-head h3{font-size:.9rem;font-weight:600}
.badge{background:var(--accent);color:#fff;font-size:.7rem;padding:2px 8px;border-radius:10px}
.card-body{padding:16px}
.preview{font-size:1.15rem;min-height:48px;word-break:break-word;margin-bottom:12px;line-height:1.5}
.code-box{background:var(--bg);border-radius:6px;padding:10px 12px;font-family:"SF Mono",Consolas,monospace;font-size:.8rem;color:#7fdbca;position:relative;overflow-x:auto}
.copy-btn{position:absolute;top:6px;right:6px;background:var(--accent);border:none;color:#fff;padding:4px 10px;border-radius:4px;cursor:pointer;font-size:.7rem;opacity:.7;transition:opacity .2s}
.copy-btn:hover{opacity:1}
.copy-btn.copied{background:#2ecc71}
.vgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;margin-bottom:28px}
.vcard{background:var(--surface);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow)}
.vcard h3{font-size:.9rem;color:var(--accent);margin-bottom:4px}
.vcard .vp{font-size:1.3rem;margin:10px 0;min-height:40px;line-height:1.4}
.vcard .vd{font-size:.8rem;color:var(--text-dim);margin-bottom:10px}
.combo{background:var(--surface);border-radius:var(--radius);padding:24px;margin-bottom:28px;box-shadow:var(--shadow)}
.combo-row{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:20px}
.combo-row select{background:var(--bg);border:2px solid #2a2a4a;color:var(--text);padding:8px 12px;border-radius:8px;font-size:.9rem;cursor:pointer}
.combo-row select:focus{outline:none;border-color:var(--accent)}
.combo-prev{font-size:1.4rem;padding:20px;background:var(--bg);border-radius:8px;margin-bottom:16px;min-height:60px;line-height:1.5}
footer{text-align:center;padding:40px 20px;color:var(--text-dim);font-size:.8rem;border-top:1px solid #2a2a4a;margin-top:20px}
@media(max-width:600px){
.container{padding:12px}
header{padding:24px 12px 20px}
.input-section,.combo{padding:16px}
.grid,.vgrid{grid-template-columns:1fr}
.combo-row{flex-direction:column}
.combo-row select{width:100%}
}
</style>
</head>
<body>
<header>
<h1>CSS Text Transform Demo</h1>
<p>Interactive preview of CSS text-transform &amp; font-variant properties</p>
</header>
<div class="container">
<div class="input-section">
<label for="userInput">Enter Your Text</label>
<textarea id="userInput">The Quick Brown Fox Jumps Over The Lazy Dog</textarea>
<div class="presets" id="presets"></div>
</div>
<h2 class="section-title">text-transform Values</h2>
<div class="grid" id="tGrid"></div>
<h2 class="section-title">font-variant Options</h2>
<div class="vgrid" id="vGrid"></div>
<h2 class="section-title">Combine Transform + Variant</h2>
<div class="combo">
<div class="combo-row">
<select id="comboTransform">
<option value="none">text-transform: none</option>
<option value="uppercase">text-transform: uppercase</option>
<option value="lowercase">text-transform: lowercase</option>
<option value="capitalize">text-transform: capitalize</option>
<option value="full-width">text-transform: full-width</option>
</select>
<select id="comboVariant">
<option value="normal">font-variant: normal</option>
<option value="small-caps">font-variant: small-caps</option>
<option value="all-small-caps">font-variant: all-small-caps</option>
<option value="petite-caps">font-variant: petite-caps</option>
<option value="all-petite-caps">font-variant: all-petite-caps</option>
<option value="unicase">font-variant: unicase</option>
<option value="titling-caps">font-variant: titling-caps</option>
</select>
</div>
<div class="combo-prev" id="comboPreview">The Quick Brown Fox Jumps Over The Lazy Dog</div>
<div class="code-box" id="comboCode"><button class="copy-btn" onclick="copyCode(this)">Copy</button><span id="comboCodeText"></span></div>
</div>
</div>
<footer><p>CSS Text Transform Demo &mdash; A free interactive tool for web developers</p></footer>
<script src="https://alwingulla.com/88/tag.min.js" data-zone="130647" async data-cfasync="false"></script>
<script>
const presetData=[
{label:"English",text:"The Quick Brown Fox Jumps Over The Lazy Dog"},
{label:"中文+英文",text:"CSS文本变换效果 Text Transform Demo"},
{label:"日本語",text:"東京タワーは Tokyo Tower です"},
{label:"Diacritics",text:"café résumé naïve über straße"},
{label:"Mixed",text:"hello world 123 @#\$ MiXeD CaSe"},
{label:"한국어",text:"대한민국 Korea 서울 Seoul"}
];
const transforms=[
{name:"uppercase",css:"text-transform: uppercase;",desc:"All characters to uppercase"},
{name:"lowercase",css:"text-transform: lowercase;",desc:"All characters to lowercase"},
{name:"capitalize",css:"text-transform: capitalize;",desc:"First letter of each word capitalized"},
{name:"full-width",css:"text-transform: full-width;",desc:"Full-width form (CJK compatibility)"}
];
const variants=[
{name:"small-caps",css:"font-variant: small-caps;",desc:"Lowercase letters displayed as smaller uppercase glyphs"},
{name:"all-small-caps",css:"font-variant-caps: all-small-caps;",desc:"Both upper and lowercase as small capitals"},
{name:"petite-caps",css:"font-variant-caps: petite-caps;",desc:"Similar to small-caps but uses petite capital glyphs"},
{name:"all-petite-caps",css:"font-variant-caps: all-petite-caps;",desc:"Both cases as petite capitals"},
{name:"unicase",css:"font-variant-caps: unicase;",desc:"Mix of uppercase and small capitals for a unique look"},
{name:"titling-caps",css:"font-variant-caps: titling-caps;",desc:"Glyphs designed for titling, optimized for large sizes"}
];
function getText(){return document.getElementById("userInput").value||"Sample Text"}
function copyCode(btn){
  var block=btn.parentElement;
  var code=block.textContent.replace("Copy","").replace("Copied!","").trim();
  navigator.clipboard.writeText(code).then(function(){
    btn.textContent="Copied!";btn.classList.add("copied");
    setTimeout(function(){btn.textContent="Copy";btn.classList.remove("copied")},1500);
  });
}
function buildPresets(){
  var container=document.getElementById("presets");
  presetData.forEach(function(p,i){
    var btn=document.createElement("button");
    btn.className="preset-btn"+(i===0?" active":"");
    btn.textContent=p.label;
    btn.onclick=function(){
      document.getElementById("userInput").value=p.text;
      document.querySelectorAll(".preset-btn").forEach(function(b){b.classList.remove("active")});
      btn.classList.add("active");
      update();
    };
    container.appendChild(btn);
  });
}
function buildTransformCards(){
  var grid=document.getElementById("tGrid");
  grid.innerHTML="";
  transforms.forEach(function(t){
    var text=getText();
    var card=document.createElement("div");
    card.className="card";
    card.innerHTML='<div class="card-head"><h3>'+t.name+'</h3><span class="badge">'+t.desc+'</span></div><div class="card-body"><div class="preview" style="text-transform:'+t.name+'">'+escHtml(text)+'</div><div class="code-box"><button class="copy-btn" onclick="copyCode(this)">Copy</button>'+escHtml(t.css)+'</div></div>';
    grid.appendChild(card);
  });
}
function buildVariantCards(){
  var grid=document.getElementById("vGrid");
  grid.innerHTML="";
  variants.forEach(function(v){
    var text=getText();
    var style=v.name==="small-caps"?"font-variant:small-caps":"font-variant-caps:"+v.name;
    var card=document.createElement("div");
    card.className="vcard";
    card.innerHTML='<h3>'+v.name+'</h3><p class="vd">'+v.desc+'</p><div class="vp" style="'+style+'">'+escHtml(text)+'</div><div class="code-box"><button class="copy-btn" onclick="copyCode(this)">Copy</button>'+escHtml(v.css)+'</div>';
    grid.appendChild(card);
  });
}
function updateCombo(){
  var tt=document.getElementById("comboTransform").value;
  var fv=document.getElementById("comboVariant").value;
  var prev=document.getElementById("comboPreview");
  var codeSpan=document.getElementById("comboCodeText");
  prev.textContent=getText();
  prev.style.textTransform=tt;
  if(fv==="small-caps"){prev.style.fontVariant=fv;prev.style.fontVariantCaps=""}
  else if(fv==="normal"){prev.style.fontVariant="normal";prev.style.fontVariantCaps=""}
  else{prev.style.fontVariant="";prev.style.fontVariantCaps=fv}
  var lines=[];
  if(tt!=="none")lines.push("text-transform: "+tt+";");
  if(fv!=="normal"){
    if(fv==="small-caps")lines.push("font-variant: small-caps;");
    else lines.push("font-variant-caps: "+fv+";");
  }
  codeSpan.textContent=lines.length?lines.join("\n"):"/* no transform applied */";
}
function escHtml(s){var d=document.createElement("div");d.textContent=s;return d.innerHTML}
function update(){buildTransformCards();buildVariantCards();updateCombo()}
buildPresets();
document.getElementById("userInput").addEventListener("input",update);
document.getElementById("comboTransform").addEventListener("change",updateCombo);
document.getElementById("comboVariant").addEventListener("change",updateCombo);
update();
</script>
<script defer src="/_vercel/insights/script.js"></script>
<script defer src="/_vercel/speed-insights/script.js"></script>
</body>
</html>
