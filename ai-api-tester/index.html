</script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0b0b12;--surface:#12121e;--surface2:#1a1a2c;--surface3:#222238;--border:#2a2a42;--border2:#363652;--text:#e8e8f4;--text2:#9898b4;--text3:#686884;--accent:#7c5cfc;--accent2:#5c8cfc;--accent-glow:rgba(124,92,252,0.15);--success:#4cda8a;--warn:#fcb44c;--danger:#fc5c6c;--radius:12px;--radius-sm:8px}
::selection{background:var(--accent);color:#fff}
::-webkit-scrollbar{width:8px}::-webkit-scrollbar-track{background:var(--surface)}::-webkit-scrollbar-thumb{background:var(--border2);border-radius:4px}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column}
a{color:var(--accent);text-decoration:none;transition:color .2s}a:hover{color:var(--accent2)}
header{position:sticky;top:0;z-index:100;background:rgba(18,18,30,0.85);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--border);padding:14px 24px;display:flex;align-items:center;gap:12px}
header h1{font-size:20px;font-weight:700;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
header .subtitle{color:var(--text3);font-size:13px}
header .back-link{margin-left:auto;color:var(--text3);font-size:13px;display:flex;align-items:center;gap:6px;transition:color .2s}
header .back-link:hover{color:var(--accent)}
.container{flex:1;max-width:1100px;width:100%;margin:0 auto;padding:24px;display:flex;flex-direction:column;gap:16px}
.request-bar{display:flex;gap:8px;align-items:center}
.request-bar select{padding:10px 14px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text);font-size:14px;font-weight:700;cursor:pointer;min-width:110px}
.request-bar select option[value="GET"]{color:#4cda8a}
.request-bar select option[value="POST"]{color:#fcb44c}
.request-bar select option[value="PUT"]{color:#5c8cfc}
.request-bar select option[value="PATCH"]{color:#c084fc}
.request-bar select option[value="DELETE"]{color:#fc5c6c}
.request-bar input{flex:1;padding:10px 14px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text);font-size:14px;font-family:'SF Mono',Consolas,monospace}
.request-bar input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-glow)}
.btn-send{padding:10px 28px;border:none;border-radius:var(--radius-sm);font-size:14px;font-weight:700;cursor:pointer;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;transition:all .3s;white-space:nowrap}
.btn-send:hover{transform:translateY(-1px);box-shadow:0 6px 24px rgba(124,92,252,0.35)}
.btn-send:disabled{opacity:0.5;cursor:not-allowed;transform:none;box-shadow:none}
.tabs{display:flex;gap:0;border-bottom:1px solid var(--border)}
.tab{padding:10px 20px;font-size:13px;font-weight:600;color:var(--text3);cursor:pointer;border-bottom:2px solid transparent;transition:all .2s}
.tab:hover{color:var(--text2)}
.tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.tab .badge{background:var(--surface3);color:var(--text3);font-size:11px;padding:1px 6px;border-radius:8px;margin-left:6px}
.tab.active .badge{background:var(--accent-glow);color:var(--accent)}
.tab-content{display:none;background:var(--surface);border:1px solid var(--border);border-top:none;border-radius:0 0 var(--radius) var(--radius);min-height:200px}
.tab-content.active{display:block}
.kv-editor{padding:12px}
.kv-row{display:flex;gap:8px;margin-bottom:8px;align-items:center}
.kv-row input{flex:1;padding:8px 12px;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text);font-size:13px;font-family:'SF Mono',Consolas,monospace}
.kv-row input:focus{outline:none;border-color:var(--accent)}
.kv-row input::placeholder{color:var(--text3)}
.kv-row .btn-remove{width:28px;height:28px;border:1px solid var(--border);border-radius:var(--radius-sm);background:transparent;color:var(--danger);cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;transition:all .2s}
.kv-row .btn-remove:hover{background:rgba(252,92,108,0.1);border-color:var(--danger)}
.btn-add-row{padding:6px 14px;border:1px dashed var(--border2);border-radius:var(--radius-sm);background:transparent;color:var(--text3);font-size:12px;cursor:pointer;transition:all .2s;margin-top:4px}
.btn-add-row:hover{border-color:var(--accent);color:var(--accent)}
.body-editor textarea{width:100%;min-height:180px;padding:16px;background:var(--bg);border:none;color:var(--text);font-family:'SF Mono',Consolas,monospace;font-size:13px;line-height:1.6;resize:vertical;outline:none}
.response-section{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;flex:1;display:flex;flex-direction:column}
.response-bar{display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--surface2);border-bottom:1px solid var(--border);flex-wrap:wrap}
.response-bar .status{font-weight:700;font-size:14px;font-family:'SF Mono',Consolas,monospace}
.response-bar .status.s2xx{color:var(--success)}
.response-bar .status.s3xx{color:var(--accent2)}
.response-bar .status.s4xx{color:var(--warn)}
.response-bar .status.s5xx{color:var(--danger)}
.response-bar .meta{font-size:12px;color:var(--text3)}
.response-bar .spacer{flex:1}
.response-bar button{padding:5px 14px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface3);color:var(--text2);font-size:12px;cursor:pointer;transition:all .2s}
.response-bar button:hover{border-color:var(--accent);color:var(--accent)}
.response-tabs{display:flex;gap:0;border-bottom:1px solid var(--border)}
.response-body{flex:1;overflow:auto;padding:16px;font-family:'SF Mono',Consolas,monospace;font-size:13px;line-height:1.6;white-space:pre-wrap;word-break:break-all}
.response-body .json-key{color:var(--accent2)}
.response-body .json-string{color:var(--success)}
.response-body .json-number{color:var(--warn)}
.response-body .json-bool{color:var(--danger)}
.response-body .json-null{color:var(--text3)}
.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;min-height:250px;color:var(--text3);text-align:center;gap:8px}
.empty-state .icon{font-size:48px;margin-bottom:8px}
.history-panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px;margin-top:8px}
.history-panel h3{font-size:13px;color:var(--text3);margin-bottom:10px;text-transform:uppercase;letter-spacing:1px}
.history-list{display:flex;flex-wrap:wrap;gap:6px}
.history-item{padding:5px 10px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);font-size:12px;font-family:'SF Mono',Consolas,monospace;cursor:pointer;transition:all .2s;display:flex;align-items:center;gap:6px}
.history-item:hover{border-color:var(--accent);color:var(--accent)}
.history-item .method{font-weight:700;font-size:11px}
.history-item .method.GET{color:var(--success)}
.history-item .method.POST{color:var(--warn)}
.history-item .method.PUT{color:var(--accent2)}
.history-item .method.DELETE{color:var(--danger)}
footer{text-align:center;padding:20px;color:var(--text3);font-size:13px;border-top:1px solid var(--border);margin-top:auto}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--surface3);color:var(--text);padding:10px 24px;border-radius:var(--radius);font-size:14px;opacity:0;transition:all .3s;z-index:999;border:1px solid var(--border2)}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
@media(max-width:768px){
.container{padding:16px}
.request-bar{flex-wrap:wrap}
.request-bar select{min-width:90px}
.request-bar input{min-width:0}
.panels{grid-template-columns:1fr}
.kv-row{flex-wrap:wrap}
.kv-row input{min-width:120px}
header{padding:12px 16px}
header h1{font-size:17px}
}
</style>
</head>
<body>
<header>
<h1>🔌 API Tester</h1>
<span class="subtitle">Test REST APIs in your browser</span>
<a href="https://lifa-su.com/" class="back-link">← All Tools</a>
</header>

<div class="container">
<div class="request-bar">
<select id="method" aria-label="HTTP Method">
<option value="GET">GET</option>
<option value="POST">POST</option>
<option value="PUT">PUT</option>
<option value="PATCH">PATCH</option>
<option value="DELETE">DELETE</option>
<option value="HEAD">HEAD</option>
<option value="OPTIONS">OPTIONS</option>
</select>
<input type="text" id="url" placeholder="https://jsonplaceholder.typicode.com/posts/1" value="https://jsonplaceholder.typicode.com/posts/1" aria-label="Request URL">
<button class="btn-send" id="btnSend" onclick="sendRequest()">⚡ Send</button>
</div>

<div>
<div class="tabs">
<div class="tab active" onclick="switchReqTab(this,'params')">Params <span class="badge" id="paramCount">0</span></div>
<div class="tab" onclick="switchReqTab(this,'headers')">Headers <span class="badge" id="headerCount">1</span></div>
<div class="tab" onclick="switchReqTab(this,'body')">Body</div>
</div>
<div class="tab-content active" id="tab-params">
<div class="kv-editor" id="paramsEditor"></div>
<div style="padding:0 12px 12px"><button class="btn-add-row" onclick="addKVRow('paramsEditor');updateBadge('paramsEditor','paramCount')">+ Add Param</button></div>
</div>
<div class="tab-content" id="tab-headers">
<div class="kv-editor" id="headersEditor"></div>
<div style="padding:0 12px 12px"><button class="btn-add-row" onclick="addKVRow('headersEditor');updateBadge('headersEditor','headerCount')">+ Add Header</button></div>
</div>
<div class="tab-content" id="tab-body">
<div class="body-editor">
<textarea id="reqBody" placeholder='{"key": "value"}' aria-label="Request Body"></textarea>
</div>
</div>
</div>

<div class="response-section">
<div class="response-bar" id="responseBar">
<span class="status" id="resStatus"></span>
<span class="meta" id="resTime"></span>
<span class="meta" id="resSize"></span>
<span class="spacer"></span>
<button onclick="copyResponse()">📋 Copy</button>
</div>
<div class="response-tabs">
<div class="tab active" onclick="switchResTab(this,'resBody')">Body</div>
<div class="tab" onclick="switchResTab(this,'resHeaders')">Headers</div>
</div>
<div class="response-body" id="resBody">
<div class="empty-state">
<div class="icon">📡</div>
<div>Enter a URL and click Send to make a request</div>
</div>
</div>
<div class="response-body" id="resHeaders" style="display:none"></div>
</div>

<div class="history-panel">
<h3>📜 History</h3>
<div class="history-list" id="historyList">
<span style="color:var(--text3);font-size:12px">No requests yet</span>
</div>
</div>
</div>

<footer><a href="https://lifa-su.com/">← Back to Lifa AI Tools</a> · <a href="https://ko-fi.com/feidev" target="_blank">☕ Support on Ko-fi</a></footer>
<div id="toast" class="toast"></div>

<script>
const $=id=>document.getElementById(id);
let history=[];
let lastResponse='';

function addKVRow(editorId,key='',val=''){
const editor=$(editorId);
const row=document.createElement('div');
row.className='kv-row';
row.innerHTML=`<input type="text" placeholder="Key" value="${escHtml(key)}" aria-label="Key"><input type="text" placeholder="Value" value="${escHtml(val)}" aria-label="Value"><button class="btn-remove" onclick="this.parentElement.remove();updateBadge('${editorId}','${editorId==='paramsEditor'?'paramCount':'headerCount'}')" aria-label="Remove">×</button>`;
editor.appendChild(row);
}

function escHtml(s){return s.replace(/"/g,'&quot;').replace(/</g,'&lt;')}

function getKVPairs(editorId){
const rows=$(editorId).querySelectorAll('.kv-row');
const pairs=[];
rows.forEach(r=>{
const inputs=r.querySelectorAll('input');
const k=inputs[0].value.trim();
const v=inputs[1].value.trim();
if(k)pairs.push([k,v]);
});
return pairs;
}

function updateBadge(editorId,badgeId){
const count=getKVPairs(editorId).length;
$(badgeId).textContent=count;
}

function switchReqTab(el,tabId){
el.parentElement.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
el.classList.add('active');
document.querySelectorAll('.tab-content').forEach(c=>c.classList.remove('active'));
$('tab-'+tabId).classList.add('active');
}

function switchResTab(el,tabId){
el.parentElement.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
el.classList.add('active');
$('resBody').style.display='none';
$('resHeaders').style.display='none';
$(tabId).style.display='block';
}

function syntaxHighlight(json){
if(typeof json!=='string')json=JSON.stringify(json,null,2);
json=json.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
return json.replace(/("(\\u[a-zA-Z0-9]{4}|\\[^u]|[^\\"])*"(\s*:)?|\b(true|false|null)\b|-?\d+(?:\.\d*)?(?:[eE][+\-]?\d+)?)/g,function(match){
let cls='json-number';
if(/^"/.test(match)){cls=/:\s*$/.test(match)?'json-key':'json-string';}
else if(/true|false/.test(match)){cls='json-bool';}
else if(/null/.test(match)){cls='json-null';}
return '<span class="'+cls+'">'+match+'</span>';
});
}

async function sendRequest(){
const method=$('method').value;
const url=$('url').value.trim();
if(!url){showToast('Please enter a URL');return;}

const btn=$('btnSend');
btn.disabled=true;btn.textContent='⏳ Sending...';

const params=getKVPairs('paramsEditor');
const headers=getKVPairs('headersEditor');
const body=$('reqBody').value.trim();

let fullUrl=url;
if(params.length){
const sp=new URLSearchParams();
params.forEach(([k,v])=>sp.append(k,v));
fullUrl+=(url.includes('?')?'&':'?')+sp.toString();
}

const opts={method,headers:{}};
headers.forEach(([k,v])=>{opts.headers[k]=v;});
if(body&&!['GET','HEAD'].includes(method)){
opts.body=body;
if(!opts.headers['Content-Type'])opts.headers['Content-Type']='application/json';
}

const start=performance.now();
try{
const res=await fetch(fullUrl,opts);
const elapsed=Math.round(performance.now()-start);
const text=await res.text();
const size=new Blob([text]).size;

$('resStatus').textContent=`${res.status} ${res.statusText}`;
$('resStatus').className='status '+(res.status<300?'s2xx':res.status<400?'s3xx':res.status<500?'s4xx':'s5xx');
$('resTime').textContent=`${elapsed}ms`;
$('resSize').textContent=formatSize(size);

let formatted=text;
lastResponse=text;
try{
const json=JSON.parse(text);
formatted=syntaxHighlight(JSON.stringify(json,null,2));
lastResponse=JSON.stringify(json,null,2);
}catch(e){}
$('resBody').innerHTML=formatted;

let resHeadersHtml='';
res.headers.forEach((v,k)=>{resHeadersHtml+=`<span class="json-key">${k}</span>: ${v}\n`;});
$('resHeaders').innerHTML=resHeadersHtml||'No headers available';

addHistory(method,url,res.status);
}catch(e){
$('resStatus').textContent='Error';
$('resStatus').className='status s5xx';
$('resTime').textContent='';
$('resSize').textContent='';
$('resBody').innerHTML=`<span style="color:var(--danger)">${e.message}</span>\n\nNote: CORS restrictions may prevent requests to some APIs.\nTry a public API like jsonplaceholder.typicode.com`;
lastResponse=e.message;
}
btn.disabled=false;btn.textContent='⚡ Send';
}

function formatSize(bytes){
if(bytes<1024)return bytes+' B';
if(bytes<1048576)return(bytes/1024).toFixed(1)+' KB';
return(bytes/1048576).toFixed(1)+' MB';
}

function addHistory(method,url,status){
history.unshift({method,url,status,time:new Date()});
if(history.length>20)history.pop();
renderHistory();
}

function renderHistory(){
const list=$('historyList');
list.innerHTML=history.map((h,i)=>`<div class="history-item" onclick="loadHistory(${i})"><span class="method ${h.method}">${h.method}</span><span>${truncUrl(h.url)}</span></div>`).join('');
}

function truncUrl(url){
try{const u=new URL(url);return u.pathname.substring(0,30)+(u.pathname.length>30?'...':'');}catch(e){return url.substring(0,30);}
}

function loadHistory(i){
const h=history[i];
$('method').value=h.method;
$('url').value=h.url;
}

function copyResponse(){
if(!lastResponse){showToast('No response to copy');return;}
navigator.clipboard.writeText(lastResponse).then(()=>showToast('Copied!'));
}

function showToast(msg){
const t=$('toast');t.textContent=msg;t.classList.add('show');
setTimeout(()=>t.classList.remove('show'),2200);
}

// Init
addKVRow('headersEditor','Accept','application/json');
</script>
<script defer src="/_vercel/insights/script.js"></script>
<script defer src="/_vercel/speed-insights/script.js"></script>
</body>
</html>
