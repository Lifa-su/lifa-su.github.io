<style>
*{margin:0;padding:0;box-sizing:border-box}

<body>
<header>
<h1>⚖️ AI Legal Document Generator</h1>
<span class="subtitle">Privacy policies, terms & more</span>
<a href="https://lifa-su.com" class="back-link">← Back to Tools</a>
</header>
<div class="wrap">
<div class="left">
<div class="left-inner">
<div class="section-title">Document Type</div>
<div class="field">
<label for="docType">Select Document</label>
<select id="docType">
<option value="privacy">Privacy Policy</option>
<option value="terms">Terms of Service</option>
<option value="dmca">DMCA Policy</option>
<option value="cookie">Cookie Policy</option>
<option value="disclaimer">Disclaimer</option>
<option value="refund">Refund Policy</option>
</select>
</div>
<div class="section-title">Your Information</div>
<div class="field">

</div>
<div class="field">
<label for="websiteUrl">Website URL *</label>
<input type="url" id="websiteUrl" placeholder="https://example.com">
</div>
<div class="field">
<label for="contactEmail">Contact Email *</label>
<input type="email" id="contactEmail" placeholder="legal@example.com">
</div>
<div class="section-title">Options</div>
<div class="field">
<label for="country">Jurisdiction</label>
<select id="country">
<option value="us">United States</option>
<option value="eu">European Union (GDPR)</option>
<option value="uk">United Kingdom</option>
<option value="ca">Canada</option>
<option value="au">Australia</option>
<option value="global">Global / International</option>
</select>
</div>
<div class="field" id="dataField">
<label for="dataCollected">Data Collected (comma-separated)</label>
<input type="text" id="dataCollected" placeholder="name, email, IP address, cookies">
</div>
<div class="field">
<label for="effectiveDate">Effective Date</label>
<input type="text" id="effectiveDate" placeholder="Auto-filled with today">
</div>
<button class="btn-generate" onclick="generate()">⚡ Generate Document</button>
</div>
</div>
<div class="right">
<div class="bar">
<span style="font-size:13px;color:var(--text3)">Preview</span>
<div class="spacer"></div>
<button class="btn-copy" onclick="copyDoc()">📋 Copy</button>
<button class="btn-download" onclick="downloadDoc()">⬇ Download .txt</button>
</div>
<div id="preview" class="preview-area">
<div class="empty-state">
<div class="empty-icon">⚖️</div>
<h3>Generate a Legal Document</h3>
<p>Fill in your details and click Generate</p>
</div>
</div>
</div>
</div>
<div id="toast" class="toast"></div>
<footer>© 2025 <a href="https://lifa-su.com">Lifa AI Tools</a> — Free AI-powered tools for everyone</footer>
<script>
const $=id=>document.getElementById(id);
let docCache='';

document.addEventListener('DOMContentLoaded',()=>{
  const today=new Date().toISOString().split('T')[0];
  $('effectiveDate').value=today;
  $('companyName').value='Acme Inc.';
  $('websiteUrl').value='https://example.com';
  $('contactEmail').value='legal@example.com';
  $('dataCollected').value='name, email, IP address, cookies, usage data';
  generate();
});

function generate(){
  const type=$('docType').value;
  const company=$('companyName').value.trim()||'[Company Name]';
  const url=$('websiteUrl').value.trim()||'[Website URL]';
  const email=$('contactEmail').value.trim()||'[Contact Email]';
  const country=$('country').value;
  const data=$('dataCollected').value.trim()||'personal information';
  const date=$('effectiveDate').value||new Date().toISOString().split('T')[0];
  const jurisdiction={us:'United States',eu:'European Union',uk:'United Kingdom',ca:'Canada',au:'Australia',global:'International'}[country];

  let html='';
  if(type==='privacy') html=genPrivacy(company,url,email,jurisdiction,data,date);
  else if(type==='terms') html=genTerms(company,url,email,jurisdiction,date);
  else if(type==='dmca') html=genDMCA(company,url,email,date);
  else if(type==='cookie') html=genCookie(company,url,email,jurisdiction,date);
  else if(type==='disclaimer') html=genDisclaimer(company,url,email,date);
  else if(type==='refund') html=genRefund(company,url,email,date);

  $('preview').innerHTML=html;
  docCache=$('preview').innerText;
}

function genPrivacy(c,u,e,j,d,dt){
  const gdpr=j==='European Union'?`<h2>GDPR Rights (EU Users)</h2><p>If you are a resident of the European Economic Area (EEA), you have certain data protection rights under the General Data Protection Regulation (GDPR):</p><ul><li>The right to access your personal data</li><li>The right to rectification of inaccurate data</li><li>The right to erasure ("right to be forgotten")</li><li>The right to restrict processing</li><li>The right to data portability</li><li>The right to object to processing</li><li>The right to withdraw consent</li></ul><p>To exercise any of these rights, please contact us at <strong>${e}</strong>.</p>`:'';
  return `<h1>Privacy Policy for ${c}</h1><p><em>Effective Date: ${dt}</em></p><p>At ${c} ("we", "us", or "our"), accessible at <strong>${u}</strong>, we are committed to protecting your privacy. This Privacy Policy explains how we collect, use, disclose, and safeguard your information when you visit our website.</p><h2>Information We Collect</h2><p>We may collect the following types of information:</p><ul>${d.split(',').map(i=>'<li>'+i.trim()+'</li>').join('')}</ul><h2>How We Use Your Information</h2><p>We use the information we collect to:</p><ul><li>Provide, operate, and maintain our website</li><li>Improve, personalize, and expand our services</li><li>Understand and analyze how you use our website</li><li>Communicate with you for customer service and updates</li><li>Send you marketing and promotional communications (with your consent)</li><li>Detect and prevent fraud</li></ul><h2>Sharing Your Information</h2><p>We do not sell your personal information. We may share your information with:</p><ul><li>Service providers who assist in operating our website</li><li>Analytics partners to help us understand usage</li><li>Law enforcement when required by law</li></ul><h2>Cookies and Tracking</h2><p>We use cookies and similar tracking technologies to track activity on our website. You can instruct your browser to refuse all cookies or to indicate when a cookie is being sent.</p><h2>Data Security</h2><p>We implement appropriate technical and organizational security measures to protect your personal information. However, no method of transmission over the Internet is 100% secure.</p><h2>Data Retention</h2><p>We retain your personal information only for as long as necessary to fulfill the purposes outlined in this Privacy Policy, unless a longer retention period is required by law.</p>${gdpr}<h2>Children's Privacy</h2><p>Our website is not intended for children under 13. We do not knowingly collect personal information from children under 13.</p><h2>Changes to This Policy</h2><p>We may update this Privacy Policy from time to time. We will notify you of any changes by posting the new Privacy Policy on this page and updating the effective date.</p><h2>Contact Us</h2><p>If you have questions about this Privacy Policy, please contact us at:</p><ul><li>Email: <strong>${e}</strong></li><li>Website: <strong>${u}</strong></li></ul><p><em>Jurisdiction: ${j}</em></p>`;
}

function genTerms(c,u,e,j,dt){
  return `<h1>Terms of Service for ${c}</h1><p><em>Effective Date: ${dt}</em></p><p>Welcome to ${c}. By accessing or using our website at <strong>${u}</strong>, you agree to be bound by these Terms of Service.</p><h2>1. Acceptance of Terms</h2><p>By accessing and using this website, you accept and agree to be bound by these Terms of Service and our Privacy Policy. If you do not agree, please do not use our website.</p><h2>2. Use License</h2><p>Permission is granted to temporarily access the materials on ${c}'s website for personal, non-commercial use only. This license does not include:</p><ul><li>Modifying or copying the materials</li><li>Using the materials for commercial purposes</li><li>Attempting to reverse engineer any software</li><li>Removing any copyright or proprietary notations</li><li>Transferring the materials to another person</li></ul><h2>3. User Accounts</h2><p>If you create an account, you are responsible for maintaining the confidentiality of your account and password. You agree to accept responsibility for all activities that occur under your account.</p><h2>4. Prohibited Activities</h2><p>You agree not to:</p><ul><li>Use the service for any unlawful purpose</li><li>Harass, abuse, or harm another person</li><li>Interfere with or disrupt the service</li><li>Attempt to gain unauthorized access</li><li>Use automated systems to access the service</li></ul><h2>5. Intellectual Property</h2><p>The content, features, and functionality of this website are owned by ${c} and are protected by international copyright, trademark, and other intellectual property laws.</p><h2>6. Disclaimer</h2><p>The materials on ${c}'s website are provided on an "as is" basis. ${c} makes no warranties, expressed or implied, and hereby disclaims all warranties including, without limitation, implied warranties of merchantability and fitness for a particular purpose.</p><h2>7. Limitation of Liability</h2><p>In no event shall ${c} or its suppliers be liable for any damages arising out of the use or inability to use the materials on ${c}'s website.</p><h2>8. Termination</h2><p>We may terminate or suspend your access immediately, without prior notice, for any reason, including breach of these Terms.</p><h2>9. Governing Law</h2><p>These Terms shall be governed by the laws of ${j}, without regard to its conflict of law provisions.</p><h2>10. Changes to Terms</h2><p>We reserve the right to modify these terms at any time. We will notify users of any material changes by updating the effective date.</p><h2>Contact Us</h2><p>If you have questions about these Terms, contact us at: <strong>${e}</strong></p>`;
}

function genDMCA(c,u,e,dt){
  return `<h1>DMCA Policy for ${c}</h1><p><em>Effective Date: ${dt}</em></p><p>${c} respects the intellectual property rights of others and expects its users to do the same. In accordance with the Digital Millennium Copyright Act of 1998 ("DMCA"), we will respond to claims of copyright infringement committed using our website at <strong>${u}</strong>.</p><h2>Filing a DMCA Notice</h2><p>If you believe that content available on our website infringes your copyright, please send a written notification containing the following:</p><ul><li>A physical or electronic signature of the copyright owner or authorized agent</li><li>Identification of the copyrighted work claimed to have been infringed</li><li>Identification of the material that is claimed to be infringing, with enough detail to locate it</li><li>Your contact information (address, telephone number, and email)</li><li>A statement that you have a good faith belief that the use is not authorized</li><li>A statement, under penalty of perjury, that the information is accurate and you are authorized to act on behalf of the copyright owner</li></ul><h2>Counter-Notification</h2><p>If you believe your content was removed in error, you may file a counter-notification containing:</p><ul><li>Your physical or electronic signature</li><li>Identification of the material that was removed</li><li>A statement under penalty of perjury that you have a good faith belief the material was removed by mistake</li><li>Your name, address, telephone number, and consent to jurisdiction</li></ul><h2>Designated Agent</h2><p>Send all DMCA notices to:</p><ul><li>Email: <strong>${e}</strong></li><li>Website: <strong>${u}</strong></li></ul><h2>Repeat Infringers</h2><p>We will terminate the accounts of users who are repeat infringers of copyright.</p>`;
}

function genCookie(c,u,e,j,dt){
  return `<h1>Cookie Policy for ${c}</h1><p><em>Effective Date: ${dt}</em></p><p>This Cookie Policy explains how ${c} ("we", "us", or "our") uses cookies and similar technologies on <strong>${u}</strong>.</p><h2>What Are Cookies</h2><p>Cookies are small text files stored on your device when you visit a website. They help the website remember your preferences and improve your experience.</p><h2>Types of Cookies We Use</h2><h2>Essential Cookies</h2><p>These cookies are necessary for the website to function properly. They enable basic features like page navigation and access to secure areas.</p><h2>Analytics Cookies</h2><p>We use analytics cookies to understand how visitors interact with our website. This helps us improve our content and user experience.</p><h2>Functional Cookies</h2><p>These cookies allow the website to remember choices you make (such as language or region) and provide enhanced features.</p><h2>Marketing Cookies</h2><p>These cookies track your online activity to help advertisers deliver more relevant advertising. They may be set by third-party partners.</p><h2>Managing Cookies</h2><p>You can control and manage cookies in several ways:</p><ul><li>Browser settings: Most browsers allow you to refuse or delete cookies</li><li>Opt-out tools: Many advertising networks offer opt-out mechanisms</li><li>Our cookie banner: Use our cookie consent tool when you first visit</li></ul><p>Note: Disabling cookies may affect the functionality of our website.</p><h2>Third-Party Cookies</h2><p>Some cookies are placed by third-party services that appear on our pages, including:</p><ul><li>Google Analytics</li><li>Social media plugins</li><li>Advertising networks</li></ul><h2>Updates to This Policy</h2><p>We may update this Cookie Policy from time to time. Changes will be posted on this page with an updated effective date.</p><h2>Contact Us</h2><p>For questions about our use of cookies, contact us at: <strong>${e}</strong></p>`;
}

function genDisclaimer(c,u,e,dt){
  return `<h1>Disclaimer for ${c}</h1><p><em>Effective Date: ${dt}</em></p><p>The information provided by ${c} ("we", "us", or "our") on <strong>${u}</strong> is for general informational purposes only. All information on the site is provided in good faith; however, we make no representation or warranty of any kind regarding the accuracy, adequacy, validity, reliability, availability, or completeness of any information on the site.</p><h2>External Links Disclaimer</h2><p>The site may contain links to other websites or content belonging to third parties. Such external links are not investigated, monitored, or checked for accuracy, adequacy, validity, reliability, availability, or completeness by us.</p><h2>Professional Disclaimer</h2><p>The site cannot and does not contain legal, financial, medical, or other professional advice. The information is provided for general informational and educational purposes only and is not a substitute for professional advice.</p><h2>Errors and Omissions Disclaimer</h2><p>While we have made every attempt to ensure the information contained in this site is correct, ${c} is not responsible for any errors or omissions, or for the results obtained from the use of this information.</p><h2>Fair Use Disclaimer</h2><p>This site may contain copyrighted material the use of which has not always been specifically authorized by the copyright owner. We believe this constitutes "fair use" of any such copyrighted material as provided for in section 107 of the US Copyright Law.</p><h2>Views Expressed Disclaimer</h2><p>Any views or opinions represented on this site are personal and belong solely to the site owner and do not represent those of people, institutions, or organizations that the owner may be associated with.</p><h2>"Use at Your Own Risk" Disclaimer</h2><p>All information on this site is provided "as is", with no guarantee of completeness, accuracy, timeliness, or of the results obtained from the use of this information, and without warranty of any kind, express or implied.</p><h2>Contact Us</h2><p>If you have questions about this Disclaimer, contact us at: <strong>${e}</strong></p>`;
}

function genRefund(c,u,e,dt){
  return `<h1>Refund Policy for ${c}</h1><p><em>Effective Date: ${dt}</em></p><p>Thank you for shopping at ${c} (<strong>${u}</strong>). We want you to be completely satisfied with your purchase.</p><h2>Digital Products</h2><p>Due to the nature of digital products, all sales are generally final. However, we may offer refunds in the following circumstances:</p><ul><li>The product is significantly different from its description</li><li>The product is defective or non-functional</li><li>You were charged incorrectly</li></ul><h2>Refund Request Process</h2><p>To request a refund:</p><ul><li>Contact us at <strong>${e}</strong> within 14 days of purchase</li><li>Include your order number and reason for the refund</li><li>We will review your request within 5 business days</li></ul><h2>Approved Refunds</h2><p>If your refund is approved:</p><ul><li>The refund will be processed to your original payment method</li><li>Please allow 5-10 business days for the refund to appear</li><li>Access to the digital product will be revoked upon refund</li></ul><h2>Exceptions</h2><p>Refunds will not be granted if:</p><ul><li>More than 14 days have passed since purchase</li><li>The product has been substantially used or downloaded</li><li>The request is deemed fraudulent</li></ul><h2>Contact Us</h2><p>For refund inquiries, please contact: <strong>${e}</strong></p>`;
}

function copyDoc(){
  if(!docCache){showToast('Generate a document first!');return;}
  navigator.clipboard.writeText(docCache).then(()=>showToast('Copied to clipboard!'));
}

function downloadDoc(){
  if(!docCache){showToast('Generate a document first!');return;}
  const type=$('docType').value;
  const names={privacy:'privacy-policy',terms:'terms-of-service',dmca:'dmca-policy',cookie:'cookie-policy',disclaimer:'disclaimer',refund:'refund-policy'};
  const blob=new Blob([docCache],{type:'text/plain'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=(names[type]||'legal-document')+'.txt';
  a.click();
  URL.revokeObjectURL(a.href);
  showToast('Downloaded!');
}

function showToast(msg){
  const t=$('toast');
  t.textContent=msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2200);
}
</script>
