<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0f0f13;--surface:#1a1a24;--surface2:#24243a;--border:#2d2d44;--text:#e4e4ef;--text2:#9494b8;--accent:#7c5cfc;--accent2:#9d7fff;--success:#34d399;--radius:12px}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;line-height:1.6}
.container{max-width:960px;margin:0 auto;padding:24px 16px}
header{text-align:center;padding:40px 0 32px}
header h1{font-size:2rem;font-weight:700;background:linear-gradient(135deg,var(--accent),var(--accent2),var(--success));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
header p{color:var(--text2);margin-top:8px;font-size:0.95rem}
.controls{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:24px;margin-bottom:24px}
.control-row{display:flex;gap:16px;margin-bottom:16px;flex-wrap:wrap}
.control-row:last-child{margin-bottom:0}
.control-group{flex:1;min-width:180px}
.control-group label{display:block;font-size:0.8rem;color:var(--text2);margin-bottom:6px;text-transform:uppercase;letter-spacing:0.5px;font-weight:600}
select,input[type="number"]{width:100%;padding:10px 14px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:0.95rem;outline:none;transition:border-color .2s}
select:focus,input[type="number"]:focus{border-color:var(--accent)}
select option{background:var(--surface2)}
.btn-row{display:flex;gap:12px;margin-bottom:24px;flex-wrap:wrap}
.btn{padding:12px 28px;border:none;border-radius:8px;font-size:0.95rem;font-weight:600;cursor:pointer;transition:all .2s}
.btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;flex:1}
.btn-primary:hover{opacity:0.9;transform:translateY(-1px)}
.btn-copy{background:var(--surface2);color:var(--text);border:1px solid var(--border)}
.btn-copy:hover{border-color:var(--accent);color:var(--accent2)}
.btn-copy.copied{background:var(--success);color:#000;border-color:var(--success)}
.output-area{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:24px;min-height:200px;white-space:pre-wrap;word-wrap:break-word;font-size:0.95rem;line-height:1.8;color:var(--text2);position:relative}
.output-area:empty::before{content:'Your generated text will appear here...';color:#555}
.output-area code{font-family:'SF Mono',Monaco,Consolas,monospace;font-size:0.88rem;color:var(--accent2)}
.tag-options{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tag-btn{padding:6px 14px;background:var(--surface2);border:1px solid var(--border);border-radius:6px;color:var(--text2);font-size:0.82rem;cursor:pointer;font-family:'SF Mono',Monaco,Consolas,monospace;transition:all .2s}
.tag-btn:hover{border-color:var(--accent)}
.tag-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
footer{text-align:center;padding:32px 0;color:#555;font-size:0.8rem}
@media(max-width:600px){
  header h1{font-size:1.5rem}
  .control-row{flex-direction:column;gap:12px}
  .control-group{min-width:100%}
  .btn-row{flex-direction:column}
  .container{padding:16px 12px}
}
</style>
</head>

<div class="container">

  </header>

        <select id="style">

          <option value="pirate">Pirate</option>
          <option value="zombie">Zombie</option>
        </select>
      </div>
      <div class="control-group">
        <label>Unit</label>
        <select id="unit">
          <option value="paragraphs">Paragraphs</option>
          <option value="sentences">Sentences</option>
          <option value="words">Words</option>
        </select>
      </div>
      <div class="control-group">
        <label>Count</label>
        <input type="number" id="count" value="3" min="1" max="99">
      </div>
    </div>
    <div class="control-row">
      <div class="control-group">
        <label>HTML Wrap</label>
        <div class="tag-options">
          <button class="tag-btn active" data-tag="none">None</button>
          <button class="tag-btn" data-tag="p">&lt;p&gt;</button>
          <button class="tag-btn" data-tag="li">&lt;li&gt;</button>
          <button class="tag-btn" data-tag="div">&lt;div&gt;</button>
          <button class="tag-btn" data-tag="span">&lt;span&gt;</button>
          <button class="tag-btn" data-tag="blockquote">&lt;blockquote&gt;</button>
        </div>
      </div>
    </div>
  </div>
  <div class="btn-row">
    <button class="btn btn-primary" id="generateBtn">Generate Text</button>
    <button class="btn btn-copy" id="copyBtn">Copy to Clipboard</button>
  </div>
  <div class="output-area" id="output"></div>
  <footer>
    <p>AI Placeholder Text Generator &mdash; Free tool for designers &amp; developers</p>
  </footer>
</div>

// Word pools extracted from sentences for word-mode generation
const WORD_POOLS = {};
Object.keys(STYLES).forEach(key => {
  WORD_POOLS[key] = STYLES[key].join(' ').replace(/[.,!?;:'"()]/g, '').split(/\s+/).filter(w => w.length > 0);
});

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function pickRandom(arr, count) {
  const shuffled = shuffle(arr);
  const result = [];
  while (result.length < count) {
    result.push(...shuffled);
  }
  return result.slice(0, count);
}

function generateSentences(style, count) {
  return pickRandom(STYLES[style], count);
}

  const paragraphs = [];
  for (let i = 0; i < count; i++) {
    const sentenceCount = 4 + Math.floor(Math.random() * 4); // 4-7 sentences
    const sentences = pickRandom(STYLES[style], sentenceCount);
    paragraphs.push(sentences.join(' '));
  }
  return paragraphs;
}

function generateWords(style, count) {
  const pool = WORD_POOLS[style];
  const words = pickRandom(pool, count);
  return [words.join(' ')];
}

function wrapWithTag(text, tag) {
  if (tag === 'none') return text;
  return '<' + tag + '>' + text + '</' + tag + '>';
}

function generate() {
  const style = document.getElementById('style').value;
  const unit = document.getElementById('unit').value;
  const count = Math.max(1, Math.min(99, parseInt(document.getElementById('count').value) || 3));
  const tag = document.querySelector('.tag-btn.active').dataset.tag;

  let chunks;
  if (unit === 'paragraphs') {
    chunks = generateParagraphs(style, count);
  } else if (unit === 'sentences') {
    chunks = generateSentences(style, count);
  } else {
    chunks = generateWords(style, count);
  }

  const wrapped = chunks.map(c => wrapWithTag(c, tag));
  const separator = tag === 'none' ? '\n\n' : '\n';
  const output = wrapped.join(separator);

  document.getElementById('output').textContent = output;
  document.getElementById('copyBtn').classList.remove('copied');
  document.getElementById('copyBtn').textContent = 'Copy to Clipboard';
}

// Copy button
document.getElementById('copyBtn').addEventListener('click', function() {
  const text = document.getElementById('output').textContent;
  if (!text) return;
  navigator.clipboard.writeText(text).then(() => {
    this.classList.add('copied');
    this.textContent = 'Copied!';
    setTimeout(() => {
      this.classList.remove('copied');
      this.textContent = 'Copy to Clipboard';
    }, 2000);
  });
});

// Generate button
document.getElementById('generateBtn').addEventListener('click', generate);

// Tag buttons
document.querySelectorAll('.tag-btn').forEach(btn => {
  btn.addEventListener('click', function() {
    document.querySelectorAll('.tag-btn').forEach(b => b.classList.remove('active'));
    this.classList.add('active');
  });
});

// Generate on load
generate();
</script>
