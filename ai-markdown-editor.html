<head>
<meta charset="UTF-8">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css" id="hljs-theme">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0a0a0a;--surface:#1a1a1a;--surface2:#252525;--accent:#6366f1;--accent-hover:#818cf8;--text:#e4e4e7;--text-muted:#a1a1aa;--border:#2e2e2e;--editor-bg:#111111;--preview-bg:#1a1a1a;--toolbar-bg:#141414;--scrollbar:#333;--scrollbar-hover:#555}
[data-theme="light"]{--bg:#f5f5f5;--surface:#ffffff;--surface2:#f0f0f0;--accent:#6366f1;--accent-hover:#4f46e5;--text:#18181b;--text-muted:#71717a;--border:#e4e4e7;--editor-bg:#ffffff;--preview-bg:#ffffff;--toolbar-bg:#fafafa;--scrollbar:#ccc;--scrollbar-hover:#aaa}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);height:100vh;display:flex;flex-direction:column;overflow:hidden}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--scrollbar);border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:var(--scrollbar-hover)}
header{display:flex;align-items:center;justify-content:space-between;padding:8px 16px;background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0;z-index:100}
.logo{display:flex;align-items:center;gap:8px;font-size:16px;font-weight:700;color:var(--text)}
.logo span{color:var(--accent)}
.header-actions{display:flex;align-items:center;gap:6px}
.header-actions button,.template-select{background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:6px 12px;border-radius:6px;cursor:pointer;font-size:13px;transition:all .2s}
.header-actions button:hover,.template-select:hover{border-color:var(--accent);background:var(--accent);color:#fff}
.template-select{padding:6px 8px;max-width:150px}
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:2px;padding:6px 12px;background:var(--toolbar-bg);border-bottom:1px solid var(--border);flex-shrink:0}
.toolbar button{background:none;border:1px solid transparent;color:var(--text-muted);padding:5px 8px;border-radius:4px;cursor:pointer;font-size:13px;transition:all .15s;white-space:nowrap}
.toolbar button:hover{background:var(--surface2);color:var(--text);border-color:var(--border)}
.toolbar .sep{width:1px;height:20px;background:var(--border);margin:0 4px}
.main{display:flex;flex:1;overflow:hidden}
.editor-pane,.preview-pane{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.editor-pane{border-right:1px solid var(--border)}
.pane-header{padding:6px 12px;font-size:12px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px;background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0;display:flex;justify-content:space-between;align-items:center}
#editor{flex:1;width:100%;padding:16px;background:var(--editor-bg);color:var(--text);border:none;outline:none;resize:none;font-family:'JetBrains Mono','Fira Code','SF Mono','Cascadia Code',Consolas,monospace;font-size:14px;line-height:1.7;tab-size:2}
#preview{flex:1;padding:20px 24px;overflow-y:auto;background:var(--preview-bg)}
#preview h1{font-size:2em;margin:.67em 0;padding-bottom:.3em;border-bottom:1px solid var(--border)}
#preview h2{font-size:1.5em;margin:.75em 0;padding-bottom:.3em;border-bottom:1px solid var(--border)}
#preview h3{font-size:1.25em;margin:.83em 0}
#preview h4{font-size:1em;margin:1em 0}
#preview h5{font-size:.875em;margin:1em 0}
#preview h6{font-size:.85em;margin:1em 0;color:var(--text-muted)}
#preview p{margin:0 0 16px;line-height:1.7}
#preview a{color:var(--accent);text-decoration:none}
#preview a:hover{text-decoration:underline}
#preview code{background:var(--surface2);padding:2px 6px;border-radius:4px;font-family:'JetBrains Mono','Fira Code',monospace;font-size:.9em}
#preview pre{background:var(--surface2);padding:16px;border-radius:8px;overflow-x:auto;margin:0 0 16px}
#preview pre code{background:none;padding:0}
#preview blockquote{border-left:4px solid var(--accent);padding:8px 16px;margin:0 0 16px;color:var(--text-muted);background:var(--surface2);border-radius:0 8px 8px 0}
#preview img{max-width:100%;border-radius:8px}
#preview table{border-collapse:collapse;width:100%;margin:0 0 16px}
#preview th,#preview td{border:1px solid var(--border);padding:8px 12px;text-align:left}
#preview th{background:var(--surface2);font-weight:600}
#preview tr:nth-child(even){background:var(--surface2)}
#preview ul,#preview ol{margin:0 0 16px;padding-left:2em}
#preview li{margin:4px 0;line-height:1.6}
#preview input[type="checkbox"]{margin-right:6px;accent-color:var(--accent)}
#preview hr{border:none;border-top:2px solid var(--border);margin:24px 0}
#preview del{color:var(--text-muted);text-decoration:line-through}
.statusbar{display:flex;align-items:center;justify-content:space-between;padding:4px 16px;background:var(--surface);border-top:1px solid var(--border);font-size:12px;color:var(--text-muted);flex-shrink:0;gap:12px}
.statusbar .stats{display:flex;gap:16px}
.statusbar .exports{display:flex;gap:6px}
.statusbar button{background:none;border:none;color:var(--text-muted);cursor:pointer;font-size:12px;padding:2px 6px;border-radius:3px;transition:all .15s}
.statusbar button:hover{color:var(--accent);background:var(--surface2)}
.toast{position:fixed;bottom:60px;left:50%;transform:translateX(-50%);background:var(--accent);color:#fff;padding:8px 20px;border-radius:8px;font-size:13px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:1000}
.toast.show{opacity:1}
.fullscreen header,.fullscreen .toolbar,.fullscreen .statusbar,.fullscreen .preview-pane,.fullscreen .pane-header{display:none!important}
.fullscreen .editor-pane{border:none}
.fullscreen #editor{padding:40px;max-width:800px;margin:0 auto}
.heading-dropdown{position:relative;display:inline-block}
.heading-menu{display:none;position:absolute;top:100%;left:0;background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:4px;z-index:50;min-width:120px;box-shadow:0 4px 12px rgba(0,0,0,.3)}
.heading-menu.show{display:block}
.heading-menu button{display:block;width:100%;text-align:left;padding:6px 10px;border-radius:4px}
@media(max-width:768px){.main{flex-direction:column}.editor-pane{border-right:none;border-bottom:1px solid var(--border)}.editor-pane,.preview-pane{flex:1}.toolbar{gap:1px;padding:4px 8px}.toolbar button{padding:4px 6px;font-size:12px}.header-actions{gap:4px}}
</style>
</head>
<body>
<header>
<div class="logo">📝 <span>AI Markdown</span> Editor</div>
<div class="header-actions">
<select class="template-select" id="templateSelect" aria-label="Load template">
<option value="">📋 Templates</option>
<option value="blog">Blog Post</option>
<option value="readme">README</option>
<option value="meeting">Meeting Notes</option>
<option value="docs">Documentation</option>
</select>
<button onclick="toggleTheme()" id="themeBtn" title="Toggle theme">🌙 Dark</button>
<button onclick="toggleFullscreen()" id="fsBtn" title="Fullscreen mode">⛶ Fullscreen</button>
<a href="index.html" style="background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:6px 12px;border-radius:6px;text-decoration:none;font-size:13px;transition:all .2s">← Back</a>
</div>
</header>
<div class="toolbar" role="toolbar" aria-label="Formatting toolbar">
<div class="heading-dropdown">
<button onclick="toggleHeadingMenu()" title="Headings">H▾</button>
<div class="heading-menu" id="headingMenu">
<button onclick="insertHeading(1)">H1 Heading</button>
<button onclick="insertHeading(2)">H2 Heading</button>
<button onclick="insertHeading(3)">H3 Heading</button>
<button onclick="insertHeading(4)">H4 Heading</button>
<button onclick="insertHeading(5)">H5 Heading</button>
<button onclick="insertHeading(6)">H6 Heading</button>
</div>
</div>
<div class="sep"></div>
<button onclick="wrapText('**','**')" title="Bold (Ctrl+B)"><b>B</b></button>
<button onclick="wrapText('*','*')" title="Italic (Ctrl+I)"><i>I</i></button>
<button onclick="wrapText('~~','~~')" title="Strikethrough"><s>S</s></button>
<button onclick="wrapText('`','`')" title="Inline code">⟨⟩</button>
<div class="sep"></div>
<button onclick="insertLink()" title="Link">🔗 Link</button>
<button onclick="insertImage()" title="Image">🖼 Image</button>
<button onclick="insertCodeBlock()" title="Code block">{ } Code</button>
<div class="sep"></div>
<button onclick="insertList('ul')" title="Bullet list">• List</button>
<button onclick="insertList('ol')" title="Numbered list">1. List</button>
<button onclick="insertList('task')" title="Task list">☑ Task</button>
<div class="sep"></div>
<button onclick="insertTable()" title="Table">⊞ Table</button>
<button onclick="insertQuote()" title="Blockquote">❝ Quote</button>
<button onclick="insertHR()" title="Horizontal rule">― Line</button>
</div>
<div class="main" id="mainArea">
<div class="editor-pane">
<div class="pane-header"><span>MARKDOWN</span><span id="lineInfo">Ln 1, Col 1</span></div>
<textarea id="editor" placeholder="Start writing Markdown here..." spellcheck="false" aria-label="Markdown editor"></textarea>
</div>
<div class="preview-pane">
<div class="pane-header"><span>PREVIEW</span></div>
<div id="preview" role="document" aria-label="Markdown preview"></div>
</div>
</div>
<div class="statusbar">
<div class="stats">
<span id="wordCount">0 words</span>
<span id="charCount">0 chars</span>
<span id="lineCount">0 lines</span>
<span id="readTime">~0 min read</span>
</div>
<div class="exports">
<button onclick="copyMarkdown()" title="Copy Markdown">📋 Copy MD</button>
<button onclick="copyHTML()" title="Copy HTML">📄 Copy HTML</button>
<button onclick="downloadMD()" title="Download .md file">💾 Download .md</button>
</div>
</div>
<div class="toast" id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.1/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script>
const editor=document.getElementById('editor'),preview=document.getElementById('preview'),toast=document.getElementById('toast');

const templates={
blog:`# My Blog Post Title

marked.setOptions({
gfm:true,
breaks:true,
highlight:function(code,lang){
if(lang&&hljs.getLanguage(lang)){try{return hljs.highlight(code,{language:lang}).value}catch(e){}}
return hljs.highlightAuto(code).value;
}
});

function render(){
const md=editor.value;
preview.innerHTML=marked.parse(md);
updateStats(md);
saveToStorage(md);
}

function updateStats(text){
const words=text.trim()?text.trim().split(/\s+/).length:0;
const chars=text.length;
const lines=text.split('\n').length;
const readMin=Math.max(1,Math.ceil(words/200));
document.getElementById('wordCount').textContent=words+' words';
document.getElementById('charCount').textContent=chars+' chars';
document.getElementById('lineCount').textContent=lines+' lines';
document.getElementById('readTime').textContent='~'+readMin+' min read';
}

function updateCursorPos(){
const pos=editor.selectionStart;
const text=editor.value.substring(0,pos);
const line=text.split('\n').length;
const col=pos-text.lastIndexOf('\n');
document.getElementById('lineInfo').textContent='Ln '+line+', Col '+col;
}

editor.addEventListener('input',render);
editor.addEventListener('click',updateCursorPos);
editor.addEventListener('keyup',updateCursorPos);

editor.addEventListener('keydown',function(e){
if(e.key==='Tab'){
e.preventDefault();
const start=this.selectionStart,end=this.selectionEnd;
this.value=this.value.substring(0,start)+'  '+this.value.substring(end);
this.selectionStart=this.selectionEnd=start+2;
render();
}
if(e.ctrlKey||e.metaKey){
if(e.key==='b'){e.preventDefault();wrapText('**','**')}
if(e.key==='i'){e.preventDefault();wrapText('*','*')}
}
});

function wrapText(before,after){
const start=editor.selectionStart,end=editor.selectionEnd;
const selected=editor.value.substring(start,end)||'text';
editor.value=editor.value.substring(0,start)+before+selected+after+editor.value.substring(end);
editor.selectionStart=start+before.length;
editor.selectionEnd=start+before.length+selected.length;
editor.focus();
render();
}

function insertHeading(level){
const prefix='#'.repeat(level)+' ';
const start=editor.selectionStart;
const lineStart=editor.value.lastIndexOf('\n',start-1)+1;
editor.value=editor.value.substring(0,lineStart)+prefix+editor.value.substring(lineStart);
editor.selectionStart=editor.selectionEnd=lineStart+prefix.length;
editor.focus();
render();
toggleHeadingMenu();
}

function toggleHeadingMenu(){
document.getElementById('headingMenu').classList.toggle('show');
}

document.addEventListener('click',function(e){
if(!e.target.closest('.heading-dropdown')){
document.getElementById('headingMenu').classList.remove('show');
}
});

function insertLink(){
const start=editor.selectionStart,end=editor.selectionEnd;
const selected=editor.value.substring(start,end)||'link text';
const insert='['+selected+'](https://example.com)';
editor.value=editor.value.substring(0,start)+insert+editor.value.substring(end);
editor.selectionStart=start+1;
editor.selectionEnd=start+1+selected.length;
editor.focus();
render();
}

function insertImage(){
const insert='![alt text](https://example.com/image.png)';
const start=editor.selectionStart;
editor.value=editor.value.substring(0,start)+insert+editor.value.substring(editor.selectionEnd);
editor.selectionStart=start+2;
editor.selectionEnd=start+10;
editor.focus();
render();
}

function insertCodeBlock(){
const start=editor.selectionStart,end=editor.selectionEnd;
const selected=editor.value.substring(start,end)||'code here';
const insert='\n```\n'+selected+'\n```\n';
editor.value=editor.value.substring(0,start)+insert+editor.value.substring(end);
editor.focus();
render();
}

function insertList(type){
let items;
if(type==='ul') items='- Item 1\n- Item 2\n- Item 3';
else if(type==='ol') items='1. Item 1\n2. Item 2\n3. Item 3';
else items='- [ ] Task 1\n- [ ] Task 2\n- [x] Task 3 (done)';
const start=editor.selectionStart;
editor.value=editor.value.substring(0,start)+'\n'+items+'\n'+editor.value.substring(editor.selectionEnd);
editor.focus();
render();
}

function insertTable(){
const table='\n| Header 1 | Header 2 | Header 3 |\n|----------|----------|----------|\n| Cell 1   | Cell 2   | Cell 3   |\n| Cell 4   | Cell 5   | Cell 6   |\n';
const start=editor.selectionStart;
editor.value=editor.value.substring(0,start)+table+editor.value.substring(editor.selectionEnd);
editor.focus();
render();
}

function insertQuote(){
const start=editor.selectionStart,end=editor.selectionEnd;
const selected=editor.value.substring(start,end)||'Quote text here';
editor.value=editor.value.substring(0,start)+'\n> '+selected+'\n'+editor.value.substring(end);
editor.focus();
render();
}

function insertHR(){
const start=editor.selectionStart;
editor.value=editor.value.substring(0,start)+'\n\n---\n\n'+editor.value.substring(editor.selectionEnd);
editor.focus();
render();
}

function showToast(msg){
toast.textContent=msg;
toast.classList.add('show');
setTimeout(()=>toast.classList.remove('show'),2000);
}

function copyMarkdown(){
navigator.clipboard.writeText(editor.value).then(()=>showToast('Markdown copied!'));
}

function copyHTML(){
navigator.clipboard.writeText(preview.innerHTML).then(()=>showToast('HTML copied!'));
}

function downloadMD(){
const blob=new Blob([editor.value],{type:'text/markdown'});
const a=document.createElement('a');
a.href=URL.createObjectURL(blob);
a.download='document.md';
a.click();
URL.revokeObjectURL(a.href);
showToast('Downloaded!');
}

function toggleTheme(){
const html=document.documentElement;
const isDark=html.getAttribute('data-theme')==='dark';
html.setAttribute('data-theme',isDark?'light':'dark');
document.getElementById('themeBtn').textContent=isDark?'☀️ Light':'🌙 Dark';
const hljsLink=document.getElementById('hljs-theme');
hljsLink.href=isDark?'https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css':'https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css';
localStorage.setItem('md-editor-theme',isDark?'light':'dark');
render();
}

function toggleFullscreen(){
document.body.classList.toggle('fullscreen');
const isFs=document.body.classList.contains('fullscreen');
document.getElementById('fsBtn').textContent=isFs?'⊡ Exit FS':'⛶ Fullscreen';
}

function saveToStorage(md){
try{localStorage.setItem('md-editor-content',md)}catch(e){}
}

function loadFromStorage(){
try{
const saved=localStorage.getItem('md-editor-content');
if(saved){editor.value=saved;render();return}
}catch(e){}
editor.value='# Welcome to AI Markdown Editor\n\nStart writing your **Markdown** here and see the *live preview* on the right!\n\n## Features\n\n- ✅ Live preview\n- ✅ GFM support (tables, task lists, strikethrough)\n- ✅ Syntax highlighting\n- ✅ Auto-save\n- ✅ Templates\n- ✅ Export options\n\n## Try It Out\n\n```javascript\nconst greeting = "Hello, Markdown!";\nconsole.log(greeting);\n```\n\n> This editor supports **GitHub Flavored Markdown** with all the extras.\n\n| Feature | Status |\n|---------|--------|\n| Tables | ✅ |\n| Task Lists | ✅ |\n| Code Highlighting | ✅ |\n\n- [x] Write some Markdown\n- [ ] Export your document\n- [ ] Share with the world\n';
render();
}

document.getElementById('templateSelect').addEventListener('change',function(){
if(this.value&&templates[this.value]){
editor.value=templates[this.value];
render();
showToast('Template loaded!');
}
this.value='';
});

const savedTheme=localStorage.getItem('md-editor-theme');
if(savedTheme){
document.documentElement.setAttribute('data-theme',savedTheme);
document.getElementById('themeBtn').textContent=savedTheme==='dark'?'🌙 Dark':'☀️ Light';
if(savedTheme==='light'){
document.getElementById('hljs-theme').href='https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css';
}
}

loadFromStorage();

document.addEventListener('keydown',function(e){
if(e.key==='Escape'&&document.body.classList.contains('fullscreen')){
toggleFullscreen();
}
});
</script>
<script defer src="https://va.vercel-scripts.com/v1/script.debug.js"></script>
</body>
</html>
