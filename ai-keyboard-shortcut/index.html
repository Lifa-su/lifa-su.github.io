*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0f0f13;--surface:#1a1a24;--surface2:#22223a;--border:#2a2a45;--text:#e4e4ef;--text2:#9999b3;--accent:#6c5ce7;--accent2:#a29bfe;--green:#00cec9;--red:#ff6b6b;--orange:#fdcb6e;--radius:12px}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;line-height:1.6}
a{color:var(--accent2);text-decoration:none}
.container{max-width:1200px;margin:0 auto;padding:0 20px}
header{background:linear-gradient(135deg,#1a1a2e 0%,#16213e 50%,#0f3460 100%);padding:40px 0 30px;text-align:center;border-bottom:1px solid var(--border)}
header h1{font-size:2.2rem;background:linear-gradient(135deg,var(--accent2),var(--green));-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:8px}
header p{color:var(--text2);font-size:1rem}
.toolbar{background:var(--surface);border-bottom:1px solid var(--border);padding:16px 0;position:sticky;top:0;z-index:100;backdrop-filter:blur(10px)}
.toolbar-inner{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.search-box{flex:1;min-width:200px;position:relative}
.search-box input{width:100%;padding:10px 16px 10px 42px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);color:var(--text);font-size:.95rem;outline:none;transition:border-color .2s}
.search-box input:focus{border-color:var(--accent)}
.search-box svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--text2);width:18px;height:18px}
.platform-tabs{display:flex;gap:4px;background:var(--surface2);border-radius:var(--radius);padding:4px}
.platform-tabs button{padding:8px 18px;border:none;background:transparent;color:var(--text2);border-radius:8px;cursor:pointer;font-size:.9rem;font-weight:500;transition:all .2s}
.platform-tabs button.active{background:var(--accent);color:#fff}
.platform-tabs button:hover:not(.active){background:rgba(108,92,231,.2)}
.btn{padding:8px 18px;border:1px solid var(--border);background:var(--surface2);color:var(--text);border-radius:var(--radius);cursor:pointer;font-size:.9rem;transition:all .2s;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--accent);background:rgba(108,92,231,.15)}
.btn-accent{background:var(--accent);border-color:var(--accent);color:#fff}
.btn-accent:hover{background:#5b4bd5}
main{padding:30px 0 60px}
.app-nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:24px;padding-bottom:16px;border-bottom:1px solid var(--border)}
.app-nav button{padding:8px 16px;border:1px solid var(--border);background:var(--surface);color:var(--text2);border-radius:var(--radius);cursor:pointer;font-size:.85rem;font-weight:500;transition:all .2s;display:flex;align-items:center;gap:6px}
.app-nav button.active{border-color:var(--accent);background:rgba(108,92,231,.15);color:var(--accent2)}
.app-nav button:hover:not(.active){border-color:var(--accent);color:var(--text)}
.app-icon{font-size:1.1rem}
.category-section{margin-bottom:28px}
.category-title{color:var(--accent2);margin-bottom:12px;padding-left:4px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;font-size:.8rem}
.shortcuts-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:10px}
.shortcut-item{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:var(--surface);border:1px solid var(--border);border-radius:10px;transition:all .2s}
.shortcut-item:hover{border-color:var(--accent);transform:translateY(-1px);box-shadow:0 4px 12px rgba(108,92,231,.15)}
.shortcut-desc{font-size:.9rem;color:var(--text);flex:1;margin-right:16px}
.shortcut-keys{display:flex;gap:4px;align-items:center;flex-shrink:0;flex-wrap:wrap;justify-content:flex-end}
kbd{display:inline-flex;align-items:center;justify-content:center;min-width:32px;height:32px;padding:0 10px;background:linear-gradient(180deg,#2a2a45 0%,#1e1e35 100%);border:1px solid #3a3a55;border-bottom:3px solid #15152a;border-radius:7px;color:var(--text);font-size:.8rem;font-family:inherit;font-weight:500;box-shadow:0 2px 4px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.05);text-shadow:0 1px 2px rgba(0,0,0,.3);white-space:nowrap}
.key-plus{color:var(--text2);font-size:.75rem;margin:0 2px}
.no-results{text-align:center;padding:60px 20px;color:var(--text2)}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:200;align-items:center;justify-content:center;backdrop-filter:blur(4px)}
.modal-overlay.show{display:flex}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:28px;width:90%;max-width:480px;max-height:90vh;overflow-y:auto}
.modal h2{font-size:1.2rem;margin-bottom:20px;color:var(--accent2)}
.modal label{display:block;font-size:.85rem;color:var(--text2);margin-bottom:6px;margin-top:14px}
.modal label:first-of-type{margin-top:0}
.modal input,.modal select{width:100%;padding:10px 14px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:.9rem;outline:none}
.modal input:focus,.modal select:focus{border-color:var(--accent)}
.modal-actions{display:flex;gap:10px;margin-top:24px;justify-content:flex-end}
.custom-badge{background:var(--green);color:#000;font-size:.65rem;padding:2px 6px;border-radius:4px;font-weight:600;margin-left:8px}
.delete-btn{background:none;border:none;color:var(--red);cursor:pointer;font-size:.85rem;padding:4px 8px;opacity:0;transition:opacity .2s;border-radius:4px}
.shortcut-item:hover .delete-btn{opacity:1}
.delete-btn:hover{background:rgba(255,107,107,.15)}
.stats{display:flex;gap:20px;justify-content:center;margin-top:16px}
.stat{text-align:center}
.stat-num{font-size:1.5rem;font-weight:700;color:var(--accent2)}
.stat-label{font-size:.75rem;color:var(--text2)}
footer{text-align:center;padding:30px;color:var(--text2);font-size:.8rem;border-top:1px solid var(--border)}
@media(max-width:600px){header h1{font-size:1.5rem}.shortcuts-grid{grid-template-columns:1fr}.toolbar-inner{flex-direction:column}.platform-tabs{width:100%;justify-content:center}.search-box{width:100%}}
</style>
</head>

// State
let currentPlatform = 'mac';
let currentApp = 'vscode';
let searchQuery = '';

// Custom shortcuts from localStorage
function getCustomShortcuts() {
  try { return JSON.parse(localStorage.getItem('customShortcuts') || '[]'); } catch { return []; }
}
function saveCustomShortcuts(list) {
  localStorage.setItem('customShortcuts', JSON.stringify(list));
}

// Count total shortcuts
function countTotal() {
  let n = 0;
  for (const app in SHORTCUTS) for (const cat in SHORTCUTS[app]) n += SHORTCUTS[app][cat].length;
  n += getCustomShortcuts().length;
  document.getElementById('totalCount').textContent = n;
}

// Render app nav
function renderAppNav() {
  const nav = document.getElementById('appNav');
  nav.innerHTML = APPS.map(a =>
    `<button data-app="${a.id}" class="${a.id === currentApp ? 'active' : ''}" role="tab" aria-selected="${a.id === currentApp}"><span class="app-icon">${a.icon}</span>${a.name}</button>`
  ).join('');
  nav.querySelectorAll('button').forEach(btn => {
    btn.addEventListener('click', () => {
      currentApp = btn.dataset.app;
      renderAppNav();
      renderShortcuts();
    });
  });
}

// Render keyboard shortcut keys
function renderKeys(keys) {
  if (!keys || keys.length === 0 || (keys.length === 1 && keys[0] === '')) return '<span style="color:var(--text2);font-size:.8rem">N/A</span>';
  return keys.map((k, i) => `<kbd>${k}</kbd>${i < keys.length - 1 ? '<span class="key-plus">+</span>' : ''}`).join('');
}

// Render shortcuts
function renderShortcuts() {
  const container = document.getElementById('shortcutContent');
  const appData = SHORTCUTS[currentApp] || {};
  const custom = getCustomShortcuts().filter(c => c.app === currentApp);
  const q = searchQuery.toLowerCase().trim();
  let html = '';
  let hasResults = false;

  // Merge custom shortcuts into categories
  const allCategories = { ...appData };
  if (custom.length > 0) {
    custom.forEach(c => {
      const cat = c.category || 'Custom';
      if (!allCategories[cat]) allCategories[cat] = [];
      allCategories[cat] = [...(allCategories[cat] || []), { ...c, isCustom: true }];
    });
  }

  for (const category in allCategories) {
    const items = allCategories[category];
    const filtered = items.filter(s => {
      if (!q) return true;
      const keys = s[currentPlatform] || [];
      const keyStr = keys.join(' ').toLowerCase();
      return s.desc.toLowerCase().includes(q) || keyStr.includes(q);
    });
    if (filtered.length === 0) continue;
    hasResults = true;
    html += `<div class="category-section">`;
    html += `<div class="category-title">${category}</div>`;
    html += `<div class="shortcuts-grid">`;
    filtered.forEach((s, idx) => {
      const keys = s[currentPlatform] || s.keys || [];
      const isCustom = s.isCustom;
      html += `<div class="shortcut-item${isCustom ? ' custom-shortcut-item' : ''}">`;
      html += `<span class="shortcut-desc">${s.desc}${isCustom ? '<span class="custom-badge">CUSTOM</span>' : ''}</span>`;
      html += `<span class="shortcut-keys">${renderKeys(Array.isArray(keys) ? keys : keys.split('+'))}`;
      if (isCustom) {
        html += `<button class="delete-btn" onclick="deleteCustom('${s.id}')" title="Delete" aria-label="Delete custom shortcut">✕</button>`;
      }
      html += `</span></div>`;
    });
    html += `</div></div>`;
  }

  if (!hasResults) {
    html = `<div class="no-results"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg><p>No shortcuts found${q ? ' for "' + q + '"' : ''}</p></div>`;
  }
  container.innerHTML = html;
}

// Delete custom shortcut
function deleteCustom(id) {
  const list = getCustomShortcuts().filter(c => c.id !== id);
  saveCustomShortcuts(list);
  renderShortcuts();
  countTotal();
}

// Platform tabs
document.querySelectorAll('.platform-tabs button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.platform-tabs button').forEach(b => { b.classList.remove('active'); b.setAttribute('aria-selected', 'false'); });
    btn.classList.add('active');
    btn.setAttribute('aria-selected', 'true');
    currentPlatform = btn.dataset.platform;
    renderShortcuts();
  });
});

// Search
const searchInput = document.getElementById('searchInput');
let searchTimeout;
searchInput.addEventListener('input', () => {
  clearTimeout(searchTimeout);
  searchTimeout = setTimeout(() => {
    searchQuery = searchInput.value;
    renderShortcuts();
  }, 200);
});

// Modal
const modalOverlay = document.getElementById('modalOverlay');
const customAppSelect = document.getElementById('customApp');

// Populate app select
APPS.forEach(a => {
  const opt = document.createElement('option');
  opt.value = a.id;
  opt.textContent = a.icon + ' ' + a.name;
  customAppSelect.appendChild(opt);
});

document.getElementById('addCustomBtn').addEventListener('click', () => {
  customAppSelect.value = currentApp;
  document.getElementById('customDesc').value = '';
  document.getElementById('customKeys').value = '';
  modalOverlay.classList.add('show');
});

document.getElementById('cancelModal').addEventListener('click', () => {
  modalOverlay.classList.remove('show');
});

modalOverlay.addEventListener('click', (e) => {
  if (e.target === modalOverlay) modalOverlay.classList.remove('show');
});

document.getElementById('saveCustom').addEventListener('click', () => {
  const app = customAppSelect.value;
  const category = document.getElementById('customCategory').value;
  const desc = document.getElementById('customDesc').value.trim();
  const keysRaw = document.getElementById('customKeys').value.trim();
  if (!desc || !keysRaw) { alert('Please fill in description and keys.'); return; }
  const keys = keysRaw.split('+').map(k => k.trim()).filter(Boolean);
  const custom = {
    id: 'custom_' + Date.now(),
    app,
    category,
    desc,
    mac: keys,
    win: keys,
    linux: keys,
    isCustom: true
  };
  const list = getCustomShortcuts();
  list.push(custom);
  saveCustomShortcuts(list);
  modalOverlay.classList.remove('show');
  if (app === currentApp) renderShortcuts();
  countTotal();
});

// Keyboard shortcut: ? for help, Escape to close modal, / to focus search
document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.tagName === 'SELECT') return;
  if (e.key === '/' || e.key === '?') {
    e.preventDefault();
    searchInput.focus();
  }
  if (e.key === 'Escape') {
    modalOverlay.classList.remove('show');
  }
});

// Auto-detect platform
function detectPlatform() {
  const ua = navigator.userAgent.toLowerCase();
  if (ua.includes('mac')) return 'mac';
  if (ua.includes('win')) return 'win';
  if (ua.includes('linux')) return 'linux';
  return 'mac';
}

// Init
(function init() {
  const detected = detectPlatform();
  currentPlatform = detected;
  document.querySelectorAll('.platform-tabs button').forEach(b => {
    b.classList.remove('active');
    b.setAttribute('aria-selected', 'false');
    if (b.dataset.platform === detected) {
      b.classList.add('active');
      b.setAttribute('aria-selected', 'true');
    }
  });
  renderAppNav();
  renderShortcuts();
  countTotal();
})();
</script>
