<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LinkedIn Personality Quiz — What's Your Professional Superpower?</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f1117;color:#e0e0e0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center}
.container{max-width:680px;width:100%;padding:24px 20px 40px}
h1{text-align:center;font-size:1.8rem;margin:28px 0 8px;color:#fff}
.subtitle{text-align:center;color:#888;margin-bottom:28px;font-size:.95rem}
.progress-bar{width:100%;height:6px;background:#1e2030;border-radius:3px;overflow:hidden;margin-bottom:32px}
.progress-fill{height:100%;width:0%;background:linear-gradient(90deg,#6c63ff,#9b8aff);border-radius:3px;transition:width .4s ease}
.question-card{background:#181a24;border:1px solid #2a2d3a;border-radius:14px;padding:28px 24px;margin-bottom:20px;animation:fadeIn .35s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.q-number{color:#6c63ff;font-size:.8rem;font-weight:600;letter-spacing:1px;text-transform:uppercase;margin-bottom:10px}
.q-text{font-size:1.1rem;color:#fff;line-height:1.5;margin-bottom:20px}
.options{display:flex;flex-direction:column;gap:10px}
.option{background:#12141e;border:1.5px solid #2a2d3a;border-radius:10px;padding:14px 18px;cursor:pointer;transition:all .2s;font-size:.95rem;line-height:1.4;color:#ccc}
.option:hover{border-color:#6c63ff;background:#1a1c2e;color:#fff}
.option.selected{border-color:#6c63ff;background:#25234a;color:#fff}
.nav-row{display:flex;justify-content:space-between;margin-top:24px;gap:12px}
.btn{padding:12px 28px;border:none;border-radius:10px;font-size:.95rem;font-weight:600;cursor:pointer;transition:all .2s}
.btn-primary{background:#6c63ff;color:#fff}
.btn-primary:hover{background:#7d75ff;transform:translateY(-1px)}
.btn-primary:disabled{background:#3a3660;color:#666;cursor:not-allowed;transform:none}
.btn-secondary{background:transparent;border:1.5px solid #2a2d3a;color:#888}
.btn-secondary:hover{border-color:#6c63ff;color:#ccc}
.result-card{background:#181a24;border:1px solid #2a2d3a;border-radius:16px;padding:36px 28px;text-align:center;animation:fadeIn .5s ease}
.result-emoji{font-size:4rem;margin-bottom:12px}
.result-type{font-size:1.6rem;font-weight:700;color:#fff;margin-bottom:6px}
.result-label{color:#6c63ff;font-size:.9rem;font-weight:600;margin-bottom:20px}
.result-desc{color:#b0b0b0;line-height:1.7;font-size:.95rem;margin-bottom:28px;text-align:left}
.result-desc li{margin-bottom:8px;list-style:none;padding-left:20px;position:relative}
.result-desc li::before{content:'✦';position:absolute;left:0;color:#6c63ff}
.unlock-btn{display:inline-block;background:linear-gradient(135deg,#6c63ff,#9b8aff);color:#fff;padding:16px 36px;border-radius:12px;font-size:1rem;font-weight:700;text-decoration:none;transition:all .25s;box-shadow:0 4px 20px rgba(108,99,255,.3)}
.unlock-btn:hover{transform:translateY(-2px);box-shadow:0 6px 28px rgba(108,99,255,.45)}
.retake{display:inline-block;margin-top:18px;color:#666;font-size:.85rem;cursor:pointer;text-decoration:underline}
.retake:hover{color:#999}
.back-link{text-align:center;margin-top:32px}
.back-link a{color:#555;text-decoration:none;font-size:.85rem}
.back-link a:hover{color:#6c63ff}
.scores-bar{display:flex;gap:8px;margin:20px 0 24px;flex-wrap:wrap;justify-content:center}
.score-tag{font-size:.75rem;padding:5px 12px;border-radius:20px;background:#1e2030;color:#888}
.score-tag.top{background:#25234a;color:#6c63ff;font-weight:600}
.hidden{display:none}
</style>
</head>
<body>
<div class="container">
<h1>🔮 LinkedIn Personality Quiz</h1>
<p class="subtitle">10 quick questions to discover your professional superpower</p>

<div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>

<div id="quizArea"></div>
<div id="resultArea" class="hidden"></div>

<div class="back-link"><a href="/">← Back to Home</a></div>
</div>

<script>
const questions = [
  {
    q: "You just landed a new role. What's the first thing you do on LinkedIn?",
    a: ["Update my headline and message 20 people I should know", "Publish a deep-dive post about lessons from my last role", "Update my profile with measurable results from my previous job", "Share a post analyzing industry trends this move signals"]
  },
  {
    q: "Someone you admire posts a controversial take. You…",
    a: ["DM them to start a private conversation", "Write a well-researched counter-argument in the comments", "Share a case study that challenges their point with data", "Reframe the debate in a bigger strategic context"]
  },
  {
    q: "What does your ideal LinkedIn content calendar look like?",
    a: ["Shoutouts, introductions, and community highlights", "How-to guides, tutorials, and framework breakdowns", "Project showcases, before/after results, and milestones", "Thought leadership essays and future-of-industry predictions"]
  },
  {
    q: "You're at a virtual networking event. Where do you gravitate?",
    a: ["Moving through breakout rooms, connecting everyone together", "The Q&A session — ready to drop expert knowledge", "A 1-on-1 chat where you can share what you've built", "The panel discussion analyzing where the industry is headed"]
  },
  {
    q: "Your inbox is full of LinkedIn messages. Which type excites you most?",
    a: ["\"Hey, you should meet my colleague — you two would click!\"", "\"I loved your article, can you explain the methodology?\"", "\"Your portfolio is amazing — are you open for a project?\"", "\"I'd love your strategic input on our company direction\""]
  },
  {
    q: "What metric matters most on your LinkedIn dashboard?",
    a: ["Connection growth and network diversity", "Post saves and shares on educational content", "Profile views from recruiters and potential clients", "Comment quality and engagement from senior leaders"]
  },
  {
    q: "You have 30 minutes to improve your profile. You spend it on…",
    a: ["Writing personalized connection requests to key people", "Polishing your About section with credentials and expertise", "Adding quantified achievements to every experience entry", "Crafting a headline that signals your strategic vision"]
  },
  {
    q: "A recruiter reaches out with an opportunity. You respond by…",
    a: ["Asking who else is on the team — culture and people matter most", "Probing about the technical challenges and learning opportunities", "Asking about KPIs and what success looks like in hard numbers", "Asking about the company's long-term vision and market position"]
  },
  {
    q: "Which LinkedIn feature do you use the most?",
    a: ["Messaging and introductions", "LinkedIn Articles and newsletters", "Skills endorsements and recommendations section", "LinkedIn Live and event hosting for thought leadership"]
  },
  {
    q: "What's your dream LinkedIn headline?",
    a: ["\"Connecting people who change the world\"", "\"Teaching 50K+ professionals to master [skill]\"", "\"Built 3 products from 0→$1M ARR\"", "\"Shaping the future of [industry] through strategic insight\""]
  }
];

const types = {
  connector: { emoji: "🤝", name: "The Connector", traits: [
    "You thrive on relationships — your LinkedIn is a networking powerhouse.",
    "People trust you as the go-to person for warm introductions and community building.",
    "Your superpower is seeing the hidden link between two people who should know each other."
  ]},
  expert: { emoji: "🎓", name: "The Expert", traits: [
    "You lead with knowledge — your content positions you as an authority.",
    "People bookmark your posts and cite your insights in conversations.",
    "Your superpower is turning complex topics into actionable, teachable frameworks."
  ]},
  builder: { emoji: "🔨", name: "The Builder", traits: [
    "You let results speak — your profile showcases concrete achievements.",
    "People come to you when they need someone who delivers measurable outcomes.",
    "Your superpower is translating effort into undeniable proof of impact."
  ]},
  strategist: { emoji: "🧠", name: "The Strategist", traits: [
    "You think big picture — your insights shape industry conversations.",
    "People seek your perspective before making major business decisions.",
    "Your superpower is connecting dots others miss and seeing around corners."
  ]}
};

const typeKeys = ["connector","expert","builder","strategist"];
let answers = new Array(10).fill(-1);
let current = 0;

function render() {
  const area = document.getElementById("quizArea");
  const q = questions[current];
  document.getElementById("progressFill").style.width = ((current + (answers[current] >= 0 ? 1 : 0)) / 10 * 100) + "%";

  area.innerHTML = `
    <div class="question-card">
      <div class="q-number">Question ${current + 1} of 10</div>
      <div class="q-text">${q.q}</div>
      <div class="options">
        ${q.a.map((opt, i) => `<div class="option ${answers[current] === i ? 'selected' : ''}" onclick="select(${i})">${opt}</div>`).join("")}
      </div>
    </div>
    <div class="nav-row">
      <button class="btn btn-secondary" onclick="prev()" ${current === 0 ? 'style="visibility:hidden"' : ''}>← Back</button>
      ${current < 9
        ? `<button class="btn btn-primary" onclick="next()" ${answers[current] < 0 ? 'disabled' : ''}>Next →</button>`
        : `<button class="btn btn-primary" onclick="finish()" ${answers[current] < 0 ? 'disabled' : ''}>See My Results</button>`
      }
    </div>`;
}

function select(i) {
  answers[current] = i;
  render();
}

function next() { if (answers[current] >= 0 && current < 9) { current++; render(); } }
function prev() { if (current > 0) { current--; render(); } }

function finish() {
  if (answers.some(a => a < 0)) return;
  const scores = [0, 0, 0, 0];
  answers.forEach(a => scores[a]++);
  const max = Math.max(...scores);
  const winIdx = scores.indexOf(max);
  const winner = types[typeKeys[winIdx]];
  const labels = ["Connector","Expert","Builder","Strategist"];

  document.getElementById("quizArea").classList.add("hidden");
  document.getElementById("progressFill").style.width = "100%";

  const resultArea = document.getElementById("resultArea");
  resultArea.classList.remove("hidden");
  resultArea.innerHTML = `
    <div class="result-card">
      <div class="result-emoji">${winner.emoji}</div>
      <div class="result-type">${winner.name}</div>
      <div class="result-label">Your LinkedIn Superpower</div>
      <div class="scores-bar">
        ${scores.map((s, i) => `<span class="score-tag ${i === winIdx ? 'top' : ''}">${labels[i]}: ${s}</span>`).join("")}
      </div>
      <ul class="result-desc">
        ${winner.traits.map(t => `<li>${t}</li>`).join("")}
      </ul>
      <a href="https://ko-fi.com/feidev" target="_blank" class="unlock-btn">🔓 Unlock Full Report</a>
      <br>
      <span class="retake" onclick="retake()">↻ Retake Quiz</span>
    </div>`;
}

function retake() {
  answers = new Array(10).fill(-1);
  current = 0;
  document.getElementById("resultArea").classList.add("hidden");
  document.getElementById("quizArea").classList.remove("hidden");
  render();
}

render();
</script>
</body>
</html>
