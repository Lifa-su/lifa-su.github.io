<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Email Subject Line Generator | Lifa Tools</title>
  <meta name="description" content="Generate high-converting email subject lines instantly. Choose your email type, enter keywords, and get 20 subject lines across 5 styles.">
  <style>
    *{box-sizing:border-box;margin:0;padding:0;}
    body{background:#0f1117;color:#e2e8f0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh;padding:2rem 1rem;}
    .container{max-width:820px;margin:0 auto;}
    h1{font-size:2rem;font-weight:800;margin-bottom:.4rem;}
    .subtitle{color:#94a3b8;margin-bottom:2rem;}
    .card{background:#1a1d2e;border:1px solid #2d3748;border-radius:12px;padding:1.5rem;margin-bottom:1.5rem;}
    label{display:block;font-size:.85rem;color:#94a3b8;margin-bottom:.4rem;font-weight:500;}
    select,input,textarea{width:100%;background:#0f1117;border:1px solid #2d3748;border-radius:8px;color:#e2e8f0;padding:.7rem 1rem;font-size:.95rem;outline:none;transition:border-color .2s;}
    select:focus,input:focus,textarea:focus{border-color:#6c63ff;}
    textarea{resize:vertical;min-height:80px;}
    .grid2{display:grid;grid-template-columns:1fr 1fr;gap:1rem;}
    @media(max-width:600px){.grid2{grid-template-columns:1fr;}}
    .btn{display:inline-flex;align-items:center;gap:.5rem;background:#6c63ff;color:#fff;border:none;border-radius:8px;padding:.8rem 1.8rem;font-size:1rem;font-weight:600;cursor:pointer;transition:background .2s;}
    .btn:hover{background:#574fd6;}
    .btn-outline{background:transparent;border:1px solid #6c63ff;color:#6c63ff;}
    .btn-outline:hover{background:#6c63ff;color:#fff;}
    .btn-sm{padding:.4rem .9rem;font-size:.82rem;border-radius:6px;}
    .results{display:none;}
    .results.show{display:block;}
    .group-title{font-size:1rem;font-weight:700;color:#6c63ff;margin:1.5rem 0 .8rem;display:flex;align-items:center;gap:.5rem;}
    .subject-item{display:flex;align-items:center;justify-content:space-between;background:#0f1117;border:1px solid #2d3748;border-radius:8px;padding:.7rem 1rem;margin-bottom:.5rem;gap:1rem;}
    .subject-text{flex:1;font-size:.93rem;line-height:1.4;}
    .badge{font-size:.72rem;padding:.2rem .5rem;border-radius:12px;white-space:nowrap;font-weight:600;}
    .badge-high{background:#065f46;color:#6ee7b7;}
    .badge-med{background:#78350f;color:#fcd34d;}
    .badge-low{background:#1e3a5f;color:#93c5fd;}
    .copy-btn{background:#1a1d2e;border:1px solid #2d3748;color:#94a3b8;border-radius:6px;padding:.3rem .7rem;font-size:.78rem;cursor:pointer;white-space:nowrap;transition:all .2s;}
    .copy-btn:hover{border-color:#6c63ff;color:#6c63ff;}
    .copy-btn.copied{border-color:#10b981;color:#10b981;}
    .copy-all-wrap{margin-top:1.2rem;text-align:right;}
    .tip{background:#1e2130;border-left:3px solid #6c63ff;border-radius:0 6px 6px 0;padding:.8rem 1rem;font-size:.85rem;color:#94a3b8;margin-top:1rem;}
    nav{margin-bottom:1.5rem;}
    nav a{color:#94a3b8;text-decoration:none;font-size:.9rem;}
    nav a:hover{color:#6c63ff;}
  </style>
</head>
<body>
<div class="container">
  <nav><a href="/">← Lifa Tools</a></nav>
  <h1>✉️ Email Subject Line Generator</h1>
  <p class="subtitle">Generate 20 high-converting subject lines across 5 styles — instantly.</p>

  <div class="card">
    <div class="grid2">
      <div>
        <label>Email Type</label>
        <select id="emailType">
          <option value="marketing">Marketing / Promotional</option>
          <option value="jobsearch">Job Search / Application</option>
          <option value="followup">Sales Follow-Up</option>
          <option value="newsletter">Newsletter</option>
          <option value="cold">Cold Outreach</option>
          <option value="reengagement">Re-engagement</option>
          <option value="event">Event / Webinar Invite</option>
        </select>
      </div>
      <div>
        <label>Target Audience</label>
        <input type="text" id="audience" placeholder="e.g. SaaS founders, HR managers, developers">
      </div>
    </div>
    <div style="margin-top:1rem;">
      <label>Keywords / Topic (what's the email about?)</label>
      <textarea id="keywords" placeholder="e.g. AI productivity tools, 50% discount, free trial, job application for Senior Designer"></textarea>
    </div>
    <div style="margin-top:1rem;">
      <label>Sender Name / Brand (optional)</label>
      <input type="text" id="sender" placeholder="e.g. Lifa Tools, John Smith">
    </div>
    <div style="margin-top:1.2rem;">
      <button class="btn" onclick="generate()">⚡ Generate Subject Lines</button>
    </div>
  </div>

  <div class="results" id="results">
    <div id="output"></div>
    <div class="copy-all-wrap">
      <button class="btn btn-outline btn-sm" onclick="copyAll()">📋 Copy All Subject Lines</button>
    </div>
    <div class="tip">💡 <strong>Tip:</strong> A/B test at least 2 subject lines before settling on one. Even a 5% higher open rate compounds significantly across campaigns.</div>
  </div>
</div>

<script>
const templates = {
  curiosity: {
    label: '🎯 Curiosity',
    badge: 'High',
    badgeClass: 'badge-high',
    fn: (kw, aud, type, sender) => [
      `The ${kw} secret most ${aud} don't know`,
      `What nobody tells you about ${kw}`,
      `I wasn't supposed to share this about ${kw}`,
      `The unexpected truth about ${kw}`,
    ]
  },
  urgency: {
    label: '⏰ Urgency',
    badge: 'High',
    badgeClass: 'badge-high',
    fn: (kw, aud, type, sender) => [
      `Last chance: ${kw} — expires tonight`,
      `⚠️ Don't miss this: ${kw}`,
      `24 hours left for ${kw}`,
      `This ${kw} opportunity closes Friday`,
    ]
  },
  benefit: {
    label: '💰 Benefit-Driven',
    badge: 'Medium',
    badgeClass: 'badge-med',
    fn: (kw, aud, type, sender) => [
      `How ${aud || 'professionals'} are using ${kw} to get ahead`,
      `Get more done with ${kw} — here's how`,
      `The easiest way to ${kw}`,
      `Save hours every week with ${kw}`,
    ]
  },
  question: {
    label: '❓ Question',
    badge: 'Medium',
    badgeClass: 'badge-med',
    fn: (kw, aud, type, sender) => [
      `Are you making these ${kw} mistakes?`,
      `Ready to transform your ${kw}?`,
      `What if ${kw} was easier than you think?`,
      `Have you tried ${kw} yet?`,
    ]
  },
  number: {
    label: '🔢 Number / List',
    badge: 'Low',
    badgeClass: 'badge-low',
    fn: (kw, aud, type, sender) => [
      `5 ways to get more from ${kw}`,
      `3 ${kw} strategies that actually work in 2026`,
      `7 things ${aud || 'people'} wish they knew about ${kw}`,
      `10x your results with these ${kw} tips`,
    ]
  },
};

function clean(str) {
  return str.trim() || 'this';
}

function generate() {
  const kw = clean(document.getElementById('keywords').value) || 'your offer';
  const aud = clean(document.getElementById('audience').value);
  const type = document.getElementById('emailType').value;
  const sender = clean(document.getElementById('sender').value);

  let html = '';
  for (const [key, tmpl] of Object.entries(templates)) {
    const lines = tmpl.fn(kw, aud, type, sender);
    html += `<div class="group-title">${tmpl.label} <span class="badge ${tmpl.badgeClass}">${tmpl.badge} Open Rate</span></div>`;
    lines.forEach(line => {
      html += `<div class="subject-item">
        <span class="subject-text">${escHtml(line)}</span>
        <button class="copy-btn" onclick="copyLine(this,'${escAttr(line)}')">Copy</button>
      </div>`;
    });
  }
  document.getElementById('output').innerHTML = html;
  document.getElementById('results').classList.add('show');
  document.getElementById('results').scrollIntoView({behavior:'smooth', block:'start'});
}

function copyLine(btn, text) {
  navigator.clipboard.writeText(text).then(() => {
    btn.textContent = '✓ Copied';
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = 'Copy'; btn.classList.remove('copied'); }, 1800);
  });
}

function copyAll() {
  const items = document.querySelectorAll('.subject-text');
  const all = Array.from(items).map(el => el.textContent).join('\n');
  navigator.clipboard.writeText(all).then(() => {
    const btn = event.target;
    btn.textContent = '✓ Copied All!';
    setTimeout(() => { btn.textContent = '📋 Copy All Subject Lines'; }, 2000);
  });
}

function escHtml(str) {
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function escAttr(str) {
  return str.replace(/'/g,'\\\'').replace(/"/g,'&quot;');
}
</script>
</body>
</html>
