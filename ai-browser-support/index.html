<html lang="en">
<head>

    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Browser Support Checker - CSS & JS API Compatibility</title>
<meta name="description" content="Check browser compatibility for CSS properties and JavaScript APIs.">

<style>*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0f1117;--surface:#1a1d27;--surface2:#242836;--border:#2e3348;--text:#e4e6f0;--text2:#9498b0;--accent:#6c5ce7;--accent2:#a29bfe;--green:#00b894;--yellow:#fdcb6e;--red:#e17055;--radius:12px;--shadow:0 4px 24px rgba(0,0,0,.3)}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;line-height:1.6}
.container{max-width:900px;margin:0 auto;padding:20px}
header{text-align:center;padding:40px 0 30px}
header h1{font-size:2rem;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:8px}
header p{color:var(--text2);font-size:1rem}
.search-box{position:relative;margin:0 auto 30px;max-width:600px}
.search-box input{width:100%;padding:16px 20px 16px 48px;background:var(--surface);border:2px solid var(--border);border-radius:var(--radius);color:var(--text);font-size:1.1rem;outline:none;transition:border-color .2s}
.search-box input:focus{border-color:var(--accent)}
.search-box input::placeholder{color:var(--text2)}
.search-icon{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--text2);font-size:1.2rem;pointer-events:none}
.suggestions{position:absolute;top:100%;left:0;right:0;background:var(--surface);border:1px solid var(--border);border-radius:0 0 var(--radius) var(--radius);max-height:300px;overflow-y:auto;z-index:10;display:none}
.suggestions.show{display:block}
.suggestions div{padding:10px 20px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;transition:background .15s}
.suggestions div:hover,.suggestions div.active{background:var(--surface2)}
.suggestions .tag{font-size:.75rem;padding:2px 8px;border-radius:4px;background:var(--accent);color:#fff;opacity:.8}
.tag-js{background:var(--yellow)!important;color:#333!important}
.categories{display:flex;gap:8px;justify-content:center;margin-bottom:24px;flex-wrap:wrap}
.categories button{padding:8px 18px;border:1px solid var(--border);border-radius:20px;background:transparent;color:var(--text2);cursor:pointer;font-size:.9rem;transition:all .2s}
.categories button:hover,.categories button.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.result-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:24px;margin-bottom:20px;box-shadow:var(--shadow);animation:fadeIn .3s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.result-card h2{font-size:1.3rem;margin-bottom:4px;color:var(--accent2)}
.result-card .type-badge{display:inline-block;font-size:.75rem;padding:2px 10px;border-radius:4px;margin-bottom:12px}
.type-css{background:rgba(108,92,231,.2);color:var(--accent2)}
.type-js{background:rgba(253,203,110,.2);color:var(--yellow)}
.result-card .desc{color:var(--text2);margin-bottom:16px;font-size:.95rem}
.browser-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin-bottom:16px}
.browser-item{background:var(--surface2);border-radius:8px;padding:12px;text-align:center;transition:transform .15s}
.browser-item:hover{transform:translateY(-2px)}
.browser-item .b-name{font-size:.85rem;color:var(--text2);margin-bottom:6px}
.browser-item .b-status{font-size:1.4rem;margin-bottom:4px}
.browser-item .b-version{font-size:.75rem;color:var(--text2)}
.support-full{border-bottom:2px solid var(--green)}
.support-partial{border-bottom:2px solid var(--yellow)}
.support-none{border-bottom:2px solid var(--red)}
.polyfill-box{background:var(--surface2);border-radius:8px;padding:16px;margin-top:12px}
.polyfill-box h4{font-size:.9rem;color:var(--accent2);margin-bottom:8px}
.polyfill-box p{font-size:.85rem;color:var(--text2)}
.polyfill-box code{background:rgba(108,92,231,.15);padding:2px 6px;border-radius:4px;font-family:"SF Mono",Monaco,monospace;font-size:.85rem}
.stats{display:flex;gap:20px;justify-content:center;margin:30px 0;flex-wrap:wrap}
.stat{text-align:center}
.stat .num{font-size:1.8rem;font-weight:700;color:var(--accent2)}
.stat .label{font-size:.8rem;color:var(--text2)}
.empty-state{text-align:center;padding:60px 20px;color:var(--text2)}
.empty-state .icon{font-size:3rem;margin-bottom:16px}
.empty-state p{font-size:1.1rem}
.browse-all{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;margin-bottom:30px}
.browse-item{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:14px;cursor:pointer;transition:all .2s}
.browse-item:hover{border-color:var(--accent);transform:translateY(-2px)}
.browse-item .bi-name{font-weight:600;margin-bottom:4px}
.browse-item .bi-type{font-size:.75rem;color:var(--text2)}
.browse-item .bi-compat{margin-top:8px;font-size:1.1rem;letter-spacing:2px}
.legend{display:flex;gap:16px;justify-content:center;margin:16px 0;font-size:.85rem;color:var(--text2);flex-wrap:wrap}
.legend span{display:flex;align-items:center;gap:4px}
footer{text-align:center;padding:40px 0 20px;color:var(--text2);font-size:.8rem}
footer a{color:var(--accent2);text-decoration:none}
@media(max-width:600px){header h1{font-size:1.5rem}.browser-grid{grid-template-columns:repeat(3,1fr)}.container{padding:12px}.browse-all{grid-template-columns:1fr}}</style>
</head>
<body>
<div class="container">

<div id="results"></div>

</div>
</div>
<footer>
<p>Data based on caniuse.com &amp; MDN Web Docs. Last updated Feb 2025.</p>

or."}];
const statusIcon = {full:'✅',partial:'⚠️',none:'❌'};
const statusClass = {full:'support-full',partial:'support-partial',none:'support-none'};
let currentFilter = 'all';
let activeIdx = -1;

const searchEl = document.getElementById('search');
const suggestEl = document.getElementById('suggestions');
const resultsEl = document.getElementById('results');
const browseEl = document.getElementById('browse');
const emptyEl = document.getElementById('empty');
const statsEl = document.getElementById('stats');

// Stats
const cssCount = DB.filter(e=>e.t==='css').length;
const jsCount = DB.filter(e=>e.t==='js').length;
statsEl.innerHTML = `
  <div class="stat"><div class="num">${DB.length}</div><div class="label">Total Features</div></div>
  <div class="stat"><div class="num">${cssCount}</div><div class="label">CSS Properties</div></div>
  <div class="stat"><div class="num">${jsCount}</div><div class="label">JS APIs</div></div>
`;

// Category filter
document.getElementById('categories').addEventListener('click', e => {
  if (e.target.tagName !== 'BUTTON') return;
  document.querySelectorAll('.categories button').forEach(b => b.classList.remove('active'));
  e.target.classList.add('active');
  currentFilter = e.target.dataset.cat;
  if (searchEl.value.trim()) doSearch(searchEl.value);
  else showBrowse();
});

function getFiltered() {
  return currentFilter === 'all' ? DB : DB.filter(e => e.t === currentFilter);
}

function quickCompat(item) {
  const browsers = ['Chrome','Firefox','Safari','Edge','Opera','IE'];
  return browsers.map(b => {
    const s = item.b[b][0];
    return statusIcon[s];
  }).join('');
}

function renderCard(item) {
  const browsers = ['Chrome','Firefox','Safari','Edge','Opera','IE'];
  let grid = '';
  browsers.forEach(b => {
    const [s, v] = item.b[b];
    grid += `<div class="browser-item ${statusClass[s]}">
      <div class="b-name">${b}</div>
      <div class="b-status">${statusIcon[s]}</div>
      <div class="b-version">${v}</div>
    </div>`;
  });
  let polyfill = '';
  if (item.p) {
    polyfill = `<div class="polyfill-box">
      <h4>💡 Polyfill / Alternative</h4>
      <p>${item.p}</p>
    </div>`;
  }
  return `<div class="result-card">
    <h2>${item.n}</h2>
    <span class="type-badge type-${item.t}">${item.t === 'css' ? 'CSS' : 'JavaScript'}</span>
    <p class="desc">${item.d}</p>
    <div class="browser-grid">${grid}</div>
    ${polyfill}
  </div>`;
}

function showBrowse() {
  const items = getFiltered();
  let html = '<div class="browse-all">';
  items.forEach(item => {
    html += `<div class="browse-item" data-name="${item.n}">
      <div class="bi-name">${item.n}</div>
      <div class="bi-type">${item.t === 'css' ? 'CSS' : 'JavaScript'}</div>
      <div class="bi-compat">${quickCompat(item)}</div>
    </div>`;
  });
  html += '</div>';
  browseEl.innerHTML = html;
  resultsEl.innerHTML = '';
  emptyEl.style.display = 'none';
  // Click handler for browse items
  browseEl.querySelectorAll('.browse-item').forEach(el => {
    el.addEventListener('click', () => {
      const name = el.dataset.name;
      searchEl.value = name;
      doSearch(name);
    });
  });
}

function doSearch(query) {
  const q = query.toLowerCase().trim();
  if (!q) { showBrowse(); return; }
  const items = getFiltered().filter(e =>
    e.n.toLowerCase().includes(q) ||
    e.d.toLowerCase().includes(q)
  );
  browseEl.innerHTML = '';
  if (items.length === 0) {
    resultsEl.innerHTML = '';
    emptyEl.style.display = 'block';
    return;
  }
  emptyEl.style.display = 'none';
  resultsEl.innerHTML = items.map(renderCard).join('');
}

// Autocomplete suggestions
function showSuggestions(query) {
  const q = query.toLowerCase().trim();
  if (!q) { suggestEl.classList.remove('show'); return; }
  const matches = getFiltered().filter(e =>
    e.n.toLowerCase().includes(q) || e.d.toLowerCase().includes(q)
  ).slice(0, 8);
  if (matches.length === 0) { suggestEl.classList.remove('show'); return; }
  activeIdx = -1;
  suggestEl.innerHTML = matches.map((m, i) =>
    `<div role="option" data-idx="${i}" data-name="${m.n}">
      <span>${m.n}</span>
      <span class="tag ${m.t === 'js' ? 'tag-js' : ''}">${m.t === 'css' ? 'CSS' : 'JS'}</span>
    </div>`
  ).join('');
  suggestEl.classList.add('show');
  suggestEl.querySelectorAll('div').forEach(el => {
    el.addEventListener('click', () => {
      searchEl.value = el.dataset.name;
      suggestEl.classList.remove('show');
      doSearch(el.dataset.name);
    });
  });
}

searchEl.addEventListener('input', e => {
  showSuggestions(e.target.value);
  doSearch(e.target.value);
});

searchEl.addEventListener('keydown', e => {
  const items = suggestEl.querySelectorAll('div');
  if (e.key === 'ArrowDown') {
    e.preventDefault();
    activeIdx = Math.min(activeIdx + 1, items.length - 1);
    items.forEach((el, i) => el.classList.toggle('active', i === activeIdx));
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    activeIdx = Math.max(activeIdx - 1, 0);
    items.forEach((el, i) => el.classList.toggle('active', i === activeIdx));
  } else if (e.key === 'Enter') {
    e.preventDefault();
    if (activeIdx >= 0 && items[activeIdx]) {
      searchEl.value = items[activeIdx].dataset.name;
      suggestEl.classList.remove('show');
      doSearch(searchEl.value);
    }
  } else if (e.key === 'Escape') {
    suggestEl.classList.remove('show');
  }
});

document.addEventListener('click', e => {
  if (!e.target.closest('.search-box')) suggestEl.classList.remove('show');
});

// Initial browse view
showBrowse();
</script>
