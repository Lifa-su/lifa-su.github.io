<!DOCTYPE html>
<html lang="en">
<head>

    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS Gradient Text Generator - Create Beautiful Gradient Typography</title>
<meta name="description" content="Free online CSS gradient text generator. Create stunning gradient typography with linear, radial, and conic gradients. Copy CSS code instantly.">

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#1a1a2e;color:#eee;min-height:100vh;line-height:1.6}
header{text-align:center;padding:40px 20px 10px}
header h1{font-size:2.2rem;background:linear-gradient(135deg,#e94560,#533483,#0f3460);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
header p{color:#aaa;margin-top:6px}
.container{max-width:1200px;margin:0 auto;padding:20px}
.app{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:20px}
@media(max-width:768px){.app{grid-template-columns:1fr}.controls{max-height:none!important}}
.panel{background:#16213e;border-radius:12px;padding:24px;border:1px solid rgba(255,255,255,.06)}
.panel h2{font-size:1.1rem;margin-bottom:16px}
#preview-box{min-height:200px;display:flex;align-items:center;justify-content:center;padding:40px 20px;border-radius:12px;background:rgba(0,0,0,.3);border:1px dashed rgba(255,255,255,.1);word-break:break-word;text-align:center}
#gt{font-size:64px;font-weight:800;line-height:1.2;background-clip:text;-webkit-background-clip:text;-webkit-text-fill-color:transparent;transition:all .15s}
.code-box{position:relative;background:rgba(0,0,0,.4);border-radius:8px;padding:16px;font-family:Monaco,Consolas,monospace;font-size:13px;color:#7ec8e3;white-space:pre-wrap;word-break:break-all;max-height:200px;overflow-y:auto;line-height:1.7;margin-top:16px}
.cbtn{position:absolute;top:8px;right:8px;background:#e94560;color:#fff;border:none;padding:6px 14px;border-radius:6px;cursor:pointer;font-size:12px;font-weight:600}
.cbtn:hover{opacity:.85}.cbtn.ok{background:#27ae60}
.controls{display:flex;flex-direction:column;gap:14px;max-height:calc(100vh - 160px);overflow-y:auto;padding-right:4px}
.controls::-webkit-scrollbar{width:4px}
.controls::-webkit-scrollbar-thumb{background:#e94560;border-radius:4px}
.cg{background:rgba(0,0,0,.2);border-radius:8px;padding:14px;margin-bottom:10px}
.cg>label{display:block;font-size:.85rem;color:#aaa;margin-bottom:8px;font-weight:500}
.rg{display:flex;gap:8px;flex-wrap:wrap}
.rb{padding:8px 14px;border-radius:8px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);cursor:pointer;font-size:.85rem;color:#eee;display:inline-block}
.rb:hover{border-color:rgba(255,255,255,.2)}.rb.on{background:#e94560;border-color:#e94560;color:#fff}
input[type=text],input[type=number]{width:100%;padding:10px 14px;border-radius:8px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.05);color:#eee;font-size:.95rem;outline:none}
input[type=text]:focus,input[type=number]:focus{border-color:#e94560}
input[type=range]{width:100%;-webkit-appearance:none;height:6px;border-radius:3px;background:rgba(255,255,255,.1);outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:#e94560;cursor:pointer;border:2px solid #fff}
.cr{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.cr input[type=color]{width:44px;height:36px;border:none;border-radius:6px;cursor:pointer;background:none;padding:0}
.cr input[type=color]::-webkit-color-swatch-wrapper{padding:2px}
.cr input[type=color]::-webkit-color-swatch{border-radius:4px;border:1px solid rgba(255,255,255,.2)}
.cr input[type=number]{width:70px;flex:none}
.cr .rm{background:none;border:none;color:#e94560;cursor:pointer;font-size:1.2rem;padding:4px 8px}
.abtn{background:rgba(255,255,255,.05);border:1px dashed rgba(255,255,255,.15);color:#aaa;padding:8px;border-radius:8px;cursor:pointer;font-size:.85rem;width:100%;margin-top:4px}
.abtn:hover{border-color:#e94560;color:#e94560}
.pg{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px}
.ps{height:44px;border-radius:8px;cursor:pointer;border:2px solid transparent;position:relative;overflow:hidden;transition:all .2s}
.ps:hover{transform:scale(1.05);border-color:rgba(255,255,255,.3)}
.ps.on{border-color:#e94560;box-shadow:0 0 12px rgba(233,69,96,.3)}
.pn{position:absolute;bottom:0;left:0;right:0;background:rgba(0,0,0,.6);font-size:10px;text-align:center;padding:2px;color:#fff}
.ar{display:flex;align-items:center;gap:12px}
.av{min-width:50px;text-align:center;color:#e94560;font-weight:600}
footer{text-align:center;padding:40px 20px;color:#555;font-size:.85rem}
</style>
</head>
<body>
<header><h1>CSS Gradient Text Generator</h1><p>Create stunning gradient typography &#8212; preview in real time, copy CSS instantly</p></header>
<div class="container"><div class="app">
<div style="display:flex;flex-direction:column;gap:20px">
<div class="panel"><h2>&#128065; Preview</h2><div id="preview-box"><span id="gt">Gradient Text</span></div></div>
<div class="panel"><h2>&#128203; CSS Code</h2><div class="code-box"><button class="cbtn" id="cpb" onclick="copyCSS()">Copy</button><code id="cc"></code></div></div>
</div>
<div class="controls">
<div class="panel"><h2>&#9881;&#65039; Controls</h2>
<div class="cg"><label>Gradient Type</label><div class="rg" id="tg"><span class="rb on" onclick="setType('linear',this)">Linear</span><span class="rb" onclick="setType('radial',this)">Radial</span><span class="rb" onclick="setType('conic',this)">Conic</span></div></div>
<div class="cg" id="acg"><label>Angle</label><div class="ar"><input type="range" id="angle" min="0" max="360" value="135" oninput="update()"><span class="av" id="angv">135&#176;</span></div></div>
<div class="cg"><label>Text Content</label><input type="text" id="txt" value="Gradient Text" oninput="update()"></div>
<div class="cg"><label>Font Size</label><div class="ar"><input type="range" id="fs" min="16" max="150" value="64" oninput="update()"><span class="av" id="fsv">64px</span></div></div>
<div class="cg"><label>Color Stops</label><div id="colors"></div><button class="abtn" onclick="addColor()">+ Add Color</button></div>
</div>
<div class="panel"><h2>&#127912; Presets</h2><div class="pg" id="presets"></div></div>
</div>
</div></div>
<footer>CSS Gradient Text Generator &#8212; Free tool for developers and designers</footer>
<script>
var gtype='linear',angle=135,stops=[{c:'#e94560',p:0},{c:'#533483',p:50},{c:'#0f3460',p:100}];
var presets=[
{n:'Rainbow',s:[{c:'#ff0000',p:0},{c:'#ff8800',p:17},{c:'#ffff00',p:33},{c:'#00ff00',p:50},{c:'#0088ff',p:67},{c:'#8800ff',p:83},{c:'#ff00ff',p:100}]},
{n:'Sunset',s:[{c:'#ff512f',p:0},{c:'#f09819',p:50},{c:'#ff512f',p:100}]},
{n:'Ocean',s:[{c:'#2193b0',p:0},{c:'#6dd5ed',p:100}]},
{n:'Aurora',s:[{c:'#00c9ff',p:0},{c:'#92fe9d',p:50},{c:'#00c9ff',p:100}]},
{n:'Flamingo',s:[{c:'#ee9ca7',p:0},{c:'#ffdde1',p:100}]},
{n:'Neon',s:[{c:'#00f260',p:0},{c:'#0575e6',p:100}]},
{n:'Berry',s:[{c:'#8e2de2',p:0},{c:'#4a00e0',p:100}]},
{n:'Fire',s:[{c:'#f12711',p:0},{c:'#f5af19',p:100}]},
{n:'Mint',s:[{c:'#00b09b',p:0},{c:'#96c93d',p:100}]},
{n:'Lavender',s:[{c:'#c471f5',p:0},{c:'#fa71cd',p:100}]}
];
function gradStr(){var s=stops.map(function(x){return x.c+' '+x.p+'%'}).join(', ');if(gtype==='linear')return 'linear-gradient('+angle+'deg, '+s+')';if(gtype==='radial')return 'radial-gradient(circle, '+s+')';return 'conic-gradient(from '+angle+'deg, '+s+')';}
function update(){
var el=document.getElementById('gt'),txt=document.getElementById('txt').value||'Gradient Text';
el.textContent=txt;
var sz=document.getElementById('fs').value;
el.style.fontSize=sz+'px';
document.getElementById('fsv').textContent=sz+'px';
var a=document.getElementById('angle').value;angle=parseInt(a);
document.getElementById('angv').textContent=a+'\u00b0';
var g=gradStr();el.style.backgroundImage=g;
var css='background: '+g+';
-webkit-background-clip: text;
-webkit-text-fill-color: transparent;
background-clip: text;
font-size: '+sz+'px;
font-weight: 800;';
document.getElementById('cc').textContent=css;
document.getElementById('acg').style.display=(gtype==='radial')?'none':'';
}
function setType(t,el){gtype=t;var bs=document.querySelectorAll('#tg .rb');for(var i=0;i<bs.length;i++)bs[i].classList.remove('on');el.classList.add('on');update();}
function renderColors(){
var box=document.getElementById('colors');box.innerHTML='';
for(var i=0;i<stops.length;i++){(function(i){
var d=document.createElement('div');d.className='cr';
var ci=document.createElement('input');ci.type='color';ci.value=stops[i].c;ci.oninput=function(){stops[i].c=this.value;update();};
var pi=document.createElement('input');pi.type='number';pi.min=0;pi.max=100;pi.value=stops[i].p;pi.oninput=function(){stops[i].p=parseInt(this.value)||0;update();};
d.appendChild(ci);d.appendChild(pi);
if(stops.length>2){var rb=document.createElement('button');rb.className='rm';rb.textContent='\u00d7';rb.onclick=function(){stops.splice(i,1);renderColors();update();};d.appendChild(rb);}
box.appendChild(d);
})(i);}
}
function addColor(){if(stops.length>=6)return;var last=stops[stops.length-1];stops.push({c:'#ffffff',p:100});renderColors();update();}
function applyPreset(idx,el){
stops=presets[idx].s.map(function(x){return{c:x.c,p:x.p};});
var ps=document.querySelectorAll('.ps');for(var i=0;i<ps.length;i++)ps[i].classList.remove('on');el.classList.add('on');
renderColors();update();
}
function renderPresets(){
var box=document.getElementById('presets');
for(var i=0;i<presets.length;i++){(function(i){
var d=document.createElement('div');d.className='ps';
var g=presets[i].s.map(function(x){return x.c+' '+x.p+'%'}).join(', ');
d.style.background='linear-gradient(135deg, '+g+')';
d.onclick=function(){applyPreset(i,d);};
var n=document.createElement('div');n.className='pn';n.textContent=presets[i].n;d.appendChild(n);
box.appendChild(d);
})(i);}
}
function copyCSS(){
var t=document.getElementById('cc').textContent;
navigator.clipboard.writeText(t).then(function(){
var b=document.getElementById('cpb');b.textContent='Copied!';b.classList.add('ok');
setTimeout(function(){b.textContent='Copy';b.classList.remove('ok');},2000);
});
}
renderPresets();renderColors();update();
</script>
