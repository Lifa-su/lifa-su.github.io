<!DOCTYPE html>
<html lang="zh-CN">
<head>

    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="AI white noise generator for focus and relaxation. Play ambient sounds including white, pink, and brown noise. Customize frequency and volume for deep work.">
<link rel="canonical" href="https://lifa-su.com/ai-noise-generator/">
<title>AI Noise Generator - 白噪音生成器</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#111827;color:#e5e7eb;min-height:100vh;display:flex;flex-direction:column;align-items:center}
.header{text-align:center;padding:2rem 1rem 1rem}
.header h1{font-size:2rem;background:linear-gradient(135deg,#818cf8,#a78bfa,#c084fc);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:.3rem}
.header p{color:#9ca3af;font-size:.95rem}
.controls-bar{display:flex;align-items:center;justify-content:center;gap:1rem;padding:1rem;flex-wrap:wrap;max-width:900px;width:100%}
.play-btn{width:64px;height:64px;border-radius:50%;border:none;background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;font-size:1.5rem;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s;box-shadow:0 4px 15px rgba(99,102,241,.4)}
.play-btn:hover{transform:scale(1.08);box-shadow:0 6px 20px rgba(99,102,241,.6)}
.play-btn:active{transform:scale(.95)}
.timer-section{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap}
.timer-btn{padding:.4rem .8rem;border-radius:8px;border:1px solid #374151;background:#1f2937;color:#d1d5db;cursor:pointer;font-size:.85rem;transition:all .2s}
.timer-btn:hover,.timer-btn.active{border-color:#6366f1;color:#a5b4fc;background:#1e1b4b}
.timer-display{font-size:1.1rem;font-variant-numeric:tabular-nums;color:#a5b4fc;min-width:60px;text-align:center}
.custom-time{width:60px;padding:.4rem;border-radius:8px;border:1px solid #374151;background:#1f2937;color:#d1d5db;font-size:.85rem;text-align:center}
.custom-time:focus{outline:none;border-color:#6366f1}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:1rem;padding:1rem;max-width:1200px;width:100%;margin-bottom:2rem}
.card{background:#1f2937;border-radius:16px;padding:1.2rem;border:1px solid #374151;transition:all .3s;position:relative;overflow:hidden}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--accent1,#6366f1),var(--accent2,#8b5cf6));opacity:0;transition:opacity .3s}
.card.active::before{opacity:1}
.card.active{border-color:#4f46e5;box-shadow:0 0 20px rgba(99,102,241,.15)}
.card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:.8rem}
.card-info{display:flex;align-items:center;gap:.6rem}
.card-icon{font-size:1.8rem;width:44px;height:44px;display:flex;align-items:center;justify-content:center;background:#111827;border-radius:12px}
.card-name{font-size:1rem;font-weight:600;color:#f3f4f6}
.card-desc{font-size:.75rem;color:#6b7280;margin-top:2px}
.toggle{position:relative;width:44px;height:24px;cursor:pointer}
.toggle input{opacity:0;width:0;height:0}
.toggle .slider{position:absolute;inset:0;background:#374151;border-radius:12px;transition:.3s}
.toggle .slider::before{content:'';position:absolute;height:18px;width:18px;left:3px;bottom:3px;background:#9ca3af;border-radius:50%;transition:.3s}
.toggle input:checked+.slider{background:linear-gradient(135deg,#6366f1,#8b5cf6)}
.toggle input:checked+.slider::before{transform:translateX(20px);background:#fff}
.volume-row{display:flex;align-items:center;gap:.6rem}
.volume-row span{font-size:.75rem;color:#6b7280;min-width:30px;text-align:right}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:6px;border-radius:3px;background:#374151;outline:none;cursor:pointer}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:16px;height:16px;border-radius:50%;background:linear-gradient(135deg,#6366f1,#8b5cf6);cursor:pointer;box-shadow:0 2px 6px rgba(99,102,241,.4)}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:linear-gradient(135deg,#6366f1,#8b5cf6);cursor:pointer;border:none}
.footer{text-align:center;padding:1rem;color:#4b5563;font-size:.8rem;margin-top:auto}
@media(max-width:640px){.header h1{font-size:1.5rem}.grid{grid-template-columns:1fr;padding:.8rem}.controls-bar{gap:.6rem}}
</style>
</head>
<body>
<div class="header">
<h1>🎧 AI Noise Generator</h1>
<p>混合白噪音与自然音效，打造你的专注空间</p>
</div>
<div class="controls-bar">
<button class="play-btn" id="playBtn" onclick="toggleGlobal()" aria-label="播放/暂停">▶</button>
<div class="timer-section">
<button class="timer-btn" onclick="setTimer(25)">25m</button>
<button class="timer-btn" onclick="setTimer(50)">50m</button>
<button class="timer-btn" onclick="setTimer(90)">90m</button>
<input class="custom-time" type="number" min="1" max="999" placeholder="min" onchange="setTimer(+this.value)" aria-label="自定义分钟">
<div class="timer-display" id="timerDisplay">--:--</div>
<button class="timer-btn" id="timerCancelBtn" onclick="cancelTimer()" style="display:none">✕</button>
</div>
</div>
<div class="grid" id="grid"></div>
<div class="footer">AI Noise Generator © 2025</div>
<script src="monetize.js"></script>
<script>
var SOUNDS=[
{id:'white',name:'白噪音',desc:'White Noise',icon:'⚪'},
{id:'pink',name:'粉噪音',desc:'Pink Noise',icon:'🩷'},
{id:'brown',name:'棕噪音',desc:'Brown Noise',icon:'🟤'},
{id:'rain',name:'雨声',desc:'Rain',icon:'🌧️'},
{id:'ocean',name:'海浪',desc:'Ocean Waves',icon:'🌊'},
{id:'forest',name:'森林',desc:'Forest',icon:'🌲'},
{id:'cafe',name:'咖啡馆',desc:'Café',icon:'☕'}
];
var audioCtx=null,masterGain=null,isPlaying=false,sources={},timerInterval=null,timerRemaining=0;

function getCtx(){
  if(!audioCtx){audioCtx=new(window.AudioContext||window.webkitAudioContext)();masterGain=audioCtx.createGain();masterGain.connect(audioCtx.destination);}
  if(audioCtx.state==='suspended')audioCtx.resume();
  return audioCtx;
}

function makeNoiseBuf(type){
  var ctx=getCtx(),sr=ctx.sampleRate,len=sr*2,buf=ctx.createBuffer(1,len,sr),d=buf.getChannelData(0);
  if(type==='white'){for(var i=0;i<len;i++)d[i]=Math.random()*2-1;}
  else if(type==='pink'){
    var b0=0,b1=0,b2=0,b3=0,b4=0,b5=0,b6=0;
    for(var i=0;i<len;i++){
      var w=Math.random()*2-1;
      b0=0.99886*b0+w*0.0555179;b1=0.99332*b1+w*0.0750759;b2=0.969*b2+w*0.153852;
      b3=0.8665*b3+w*0.3104856;b4=0.55*b4+w*0.5329522;b5=-0.7616*b5-w*0.016898;
      d[i]=(b0+b1+b2+b3+b4+b5+b6+w*0.5362)*0.11;b6=w*0.115926;
    }
  }else if(type==='brown'){
    var last=0;
    for(var i=0;i<len;i++){var w=Math.random()*2-1;last=(last+0.02*w)/1.02;d[i]=last*3.5;}
  }
  return buf;
}

function stopSound(id){
  var s=sources[id];if(!s||!s.running)return;
  s.running=false;
  if(s.extra){
    if(s.extra.dripInterval)clearInterval(s.extra.dripInterval);
    if(s.extra.birdInterval)clearInterval(s.extra.birdInterval);
    if(s.extra.chatterInterval)clearInterval(s.extra.chatterInterval);
  }
  var srcs=Array.isArray(s.src)?s.src:(s.src?[s.src]:[]);
  srcs.forEach(function(x){try{x.stop();}catch(e){}});
  sources[id]={vol:s.vol,running:false};
  document.getElementById('card-'+id).classList.remove('active');
  document.getElementById('tog-'+id).checked=false;
}
function startNoise(id){
  var ctx=getCtx(),buf=makeNoiseBuf(id),src=ctx.createBufferSource(),gain=ctx.createGain();
  src.buffer=buf;src.loop=true;
  var vol=sources[id]?sources[id].vol:0.5;
  gain.gain.value=vol;
  src.connect(gain);gain.connect(masterGain);src.start();
  sources[id]={src:src,gain:gain,vol:vol,running:true};
}

function startRain(id){
  var ctx=getCtx(),vol=sources[id]?sources[id].vol:0.5;
  var nb=makeNoiseBuf('white'),ns=ctx.createBufferSource(),ng=ctx.createGain();
  ns.buffer=nb;ns.loop=true;ng.gain.value=vol*0.6;
  var bp=ctx.createBiquadFilter();bp.type='bandpass';bp.frequency.value=800;bp.Q.value=0.5;
  ns.connect(bp);bp.connect(ng);ng.connect(masterGain);ns.start();
  var nb2=makeNoiseBuf('white'),ns2=ctx.createBufferSource(),ng2=ctx.createGain();
  ns2.buffer=nb2;ns2.loop=true;ng2.gain.value=vol*0.3;
  var bp2=ctx.createBiquadFilter();bp2.type='bandpass';bp2.frequency.value=3000;bp2.Q.value=1;
  ns2.connect(bp2);bp2.connect(ng2);ng2.connect(masterGain);ns2.start();
  var dripInterval=setInterval(function(){
    if(!sources[id]||!sources[id].running)return;
    var o=ctx.createOscillator(),g=ctx.createGain();
    o.frequency.value=2000+Math.random()*3000;o.type='sine';
    g.gain.setValueAtTime(vol*0.15,ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.05+Math.random()*0.05);
    o.connect(g);g.connect(masterGain);o.start();o.stop(ctx.currentTime+0.1);
  },150);
  sources[id]={src:[ns,ns2],gain:[ng,ng2],vol:vol,extra:{dripInterval:dripInterval},running:true};
}

function startOcean(id){
  var ctx=getCtx(),vol=sources[id]?sources[id].vol:0.5;
  var nb=makeNoiseBuf('brown'),ns=ctx.createBufferSource(),ng=ctx.createGain();
  ns.buffer=nb;ns.loop=true;ng.gain.value=vol;
  var lp=ctx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=500;
  ns.connect(lp);lp.connect(ng);ng.connect(masterGain);ns.start();
  var lfo=ctx.createOscillator(),lfoG=ctx.createGain();
  lfo.type='sine';lfo.frequency.value=0.08;lfoG.gain.value=vol*0.4;
  lfo.connect(lfoG);lfoG.connect(ng.gain);lfo.start();
  var nb2=makeNoiseBuf('white'),ns2=ctx.createBufferSource(),ng2=ctx.createGain();
  ns2.buffer=nb2;ns2.loop=true;ng2.gain.value=vol*0.15;
  var hp=ctx.createBiquadFilter();hp.type='highpass';hp.frequency.value=3000;
  ns2.connect(hp);hp.connect(ng2);ng2.connect(masterGain);ns2.start();
  sources[id]={src:[ns,ns2,lfo],gain:[ng,ng2],vol:vol,running:true};
}

function startForest(id){
  var ctx=getCtx(),vol=sources[id]?sources[id].vol:0.5;
  var nb=makeNoiseBuf('pink'),ns=ctx.createBufferSource(),ng=ctx.createGain();
  ns.buffer=nb;ns.loop=true;ng.gain.value=vol*0.25;
  var lp=ctx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=400;
  ns.connect(lp);lp.connect(ng);ng.connect(masterGain);ns.start();
  var birdInterval=setInterval(function(){
    if(!sources[id]||!sources[id].running)return;
    var bf=1500+Math.random()*3000,o=ctx.createOscillator(),g=ctx.createGain();
    o.type='sine';o.frequency.setValueAtTime(bf,ctx.currentTime);
    o.frequency.exponentialRampToValueAtTime(bf*(0.8+Math.random()*0.6),ctx.currentTime+0.15);
    g.gain.setValueAtTime(vol*0.12,ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.2+Math.random()*0.15);
    o.connect(g);g.connect(masterGain);o.start();o.stop(ctx.currentTime+0.4);
  },800);
  sources[id]={src:[ns],gain:[ng],vol:vol,extra:{birdInterval:birdInterval},running:true};
}

function startCafe(id){
  var ctx=getCtx(),vol=sources[id]?sources[id].vol:0.5;
  var nb=makeNoiseBuf('pink'),ns=ctx.createBufferSource(),ng=ctx.createGain();
  ns.buffer=nb;ns.loop=true;ng.gain.value=vol*0.4;
  var lp=ctx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=1000;
  ns.connect(lp);lp.connect(ng);ng.connect(masterGain);ns.start();
  var chatterInterval=setInterval(function(){
    if(!sources[id]||!sources[id].running)return;
    var f=300+Math.random()*600,o=ctx.createOscillator(),g=ctx.createGain();
    o.type='sawtooth';o.frequency.value=f;
    var bpf=ctx.createBiquadFilter();bpf.type='bandpass';bpf.frequency.value=f;bpf.Q.value=2;
    g.gain.setValueAtTime(vol*0.06,ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.08+Math.random()*0.12);
    o.connect(bpf);bpf.connect(g);g.connect(masterGain);o.start();o.stop(ctx.currentTime+0.25);
  },100);
  sources[id]={src:[ns],gain:[ng],vol:vol,extra:{chatterInterval:chatterInterval},running:true};
}
function startSound(id){
  if(id==='white'||id==='pink'||id==='brown')startNoise(id);
  else if(id==='rain')startRain(id);
  else if(id==='ocean')startOcean(id);
  else if(id==='forest')startForest(id);
  else if(id==='cafe')startCafe(id);
  document.getElementById('card-'+id).classList.add('active');
  document.getElementById('tog-'+id).checked=true;
  if(!isPlaying){isPlaying=true;document.getElementById('playBtn').textContent='⏸';}
}

function toggleSound(id){
  var s=sources[id];
  if(s&&s.running)stopSound(id);
  else{getCtx();startSound(id);}
}

function setVolume(id,val){
  var v=val/100;
  if(!sources[id])sources[id]={vol:v,running:false};
  else sources[id].vol=v;
  if(sources[id].running){
    var gains=Array.isArray(sources[id].gain)?sources[id].gain:(sources[id].gain?[sources[id].gain]:[]);
    if(id==='white'||id==='pink'||id==='brown'){
      gains.forEach(function(g){g.gain.value=v;});
    }else{
      stopSound(id);startSound(id);
    }
  }
}

function toggleGlobal(){
  if(isPlaying){
    var any=false;
    SOUNDS.forEach(function(s){if(sources[s.id]&&sources[s.id].running)any=true;});
    if(any){
      SOUNDS.forEach(function(s){if(sources[s.id]&&sources[s.id].running)stopSound(s.id);});
    }
    isPlaying=false;
    document.getElementById('playBtn').textContent='▶';
  }else{
    getCtx();
    var started=false;
    SOUNDS.forEach(function(s){
      if(sources[s.id]&&sources[s.id].vol>0&&document.getElementById('tog-'+s.id).checked){
        startSound(s.id);started=true;
      }
    });
    if(!started){startSound('white');}
    isPlaying=true;
    document.getElementById('playBtn').textContent='⏸';
  }
}

function formatTime(sec){
  var m=Math.floor(sec/60),s=sec%60;
  return (m<10?'0':'')+m+':'+(s<10?'0':'')+s;
}

function setTimer(min){
  if(!min||min<=0)return;
  cancelTimer();
  timerRemaining=min*60;
  document.getElementById('timerDisplay').textContent=formatTime(timerRemaining);
  document.getElementById('timerCancelBtn').style.display='inline-block';
  document.querySelectorAll('.timer-btn').forEach(function(b){b.classList.remove('active');});
  var btns=document.querySelectorAll('.timer-btn');
  btns.forEach(function(b){if(b.textContent===min+'m')b.classList.add('active');});
  timerInterval=setInterval(function(){
    timerRemaining--;
    document.getElementById('timerDisplay').textContent=formatTime(timerRemaining);
    if(timerRemaining<=10&&timerRemaining>0){
      if(masterGain)masterGain.gain.value=timerRemaining/10;
    }
    if(timerRemaining<=0){
      cancelTimer();
      SOUNDS.forEach(function(s){stopSound(s.id);});
      isPlaying=false;
      document.getElementById('playBtn').textContent='▶';
      if(masterGain)masterGain.gain.value=1;
    }
  },1000);
}

function cancelTimer(){
  if(timerInterval){clearInterval(timerInterval);timerInterval=null;}
  timerRemaining=0;
  document.getElementById('timerDisplay').textContent='--:--';
  document.getElementById('timerCancelBtn').style.display='none';
  document.querySelectorAll('.timer-btn').forEach(function(b){b.classList.remove('active');});
  if(masterGain)masterGain.gain.value=1;
}

function buildUI(){
  var grid=document.getElementById('grid');
  SOUNDS.forEach(function(s){
    var card=document.createElement('div');
    card.className='card';card.id='card-'+s.id;
    card.innerHTML='<div class="card-header"><div class="card-info"><div class="card-icon">'+s.icon+'</div><div><div class="card-name">'+s.name+'</div><div class="card-desc">'+s.desc+'</div></div></div><label class="toggle"><input type="checkbox" id="tog-'+s.id+'" onchange="toggleSound(\''+s.id+'\')"><span class="slider"></span></label></div><div class="volume-row"><input type="range" min="0" max="100" value="50" oninput="setVolume(\''+s.id+'\',this.value);this.nextElementSibling.textContent=this.value+\'%\'"><span>50%</span></div>';
    grid.appendChild(card);
    sources[s.id]={vol:0.5,running:false};
  });
}
buildUI();
</script>
<script defer src="/_vercel/insights/script.js"></script>
<script defer src="/_vercel/speed-insights/script.js"></script>
</body>
</html>
